; Transaction-mode pooler in front of local Postgres. Mimics what Hyperdrive does
; (server connection returned to the pool at COMMIT/ROLLBACK).
[databases]
ebda_spike = host=127.0.0.1 port=5432 dbname=ebda_spike

[pgbouncer]
listen_addr = 127.0.0.1
listen_port = 6432
unix_socket_dir =
auth_type = scram-sha-256
auth_file = /tmp/ebda-pgbouncer/userlist.txt
pool_mode = transaction
; tiny pool => server connections are DEFINITELY reused across tenants
default_pool_size = 2
min_pool_size = 0
reserve_pool_size = 0
max_client_conn = 200
; no session state may survive between transactions
server_reset_query =
server_reset_query_always = 0
ignore_startup_parameters = extra_float_digits,options
logfile = /tmp/ebda-pgbouncer/pgbouncer.log
pidfile = /tmp/ebda-pgbouncer/pgbouncer.pid
admin_users = ebda_app
stats_users = ebda_app
log_connections = 0
log_disconnections = 0
