name: ZAP DAST freshness check

# Issue 2289: zap-baseline.yml's notify-failure alerts on a failed or cancelled
# scan only if that job itself is dispatched and gets a runner. A run cancelled
# while still queued, or one that never gets a runner, can end with no alert
# at all — a silent night that reads like a clean scan. A job inside the run
# cannot report the run not happening, so this check lives in its OWN run: once
# a day it asks the API whether any zap-baseline run on main CONCLUDED
# success/failure (a scan that actually ran) in the last 26h, and alerts when
# none did. Logic + tests: scripts/zap-freshness-check.mjs,
# tests/unit/zap-freshness-check.test.ts.
#
# Residual (stated, not hidden): this rides the same self-hosted runner as the
# scan (cloud minutes are billing-blocked — runner-health-check.yml header). If
# that runner is down, BOTH are silent; runner-down alerting is
# ci-runner-guard.sh on the Mac, outside both failure domains. What this adds is
# the case the runner is healthy but a zap run was cancelled/superseded or never
# scheduled — the case notify-failure cannot see.

on:
  schedule:
    - cron: '30 12 * * *' # 10.5h after the 02:00 UTC nightly: covers queue slack
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# Keyed on the event (as zap-baseline.yml is): a manual verification dispatch
# must never cancel the queued daily run — a cancelled watchdog is the very
# silence it exists to catch (PR 2333 audit).
concurrency:
  group: zap-freshness-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: A DAST scan ran in the last 26h
    runs-on: ${{ vars.USE_SELF_HOSTED != 'true' && 'ubuntu-latest' || fromJSON('["self-hosted","linux","wsl2"]') }}
    timeout-minutes: 5
    steps:
      # Pre-checkout guard (#1883): survives an OOM-kill/guest-restart on a
      # prior job that stranded a root-owned trufflehog-*/ dir `if: always()`
      # cannot cover, because nothing after the kill runs, checkout included.
      - name: Remove root-owned trufflehog scratch (pre-checkout guard, issue 1883)
        # Inline, not a local composite action: a `uses: ./.github/actions/...`
        # step cannot resolve before actions/checkout has put the repo on disk.
        shell: bash
        run: |
          shopt -s nullglob
          # Sparse-checkout leak (2026-09-30): a sparse job on this persistent
          # self-hosted workspace left core.sparseCheckout in .git/config, and
          # the next plain actions/checkout reused it, so orders' deploy got a
          # scripts-only tree ("npm ci: no package-lock.json"). Undo any
          # inherited sparse config BEFORE checkout, in every job.
          if [ -d .git ] && [ "$(git config --get core.sparseCheckout 2>/dev/null)" = "true" ]; then
            echo "::warning::workspace .git carries a sparse-checkout config from a prior job — disabling it before checkout"
            git sparse-checkout disable 2>/dev/null || true
            git config --unset-all core.sparseCheckout 2>/dev/null || true
            git config --unset-all core.sparseCheckoutCone 2>/dev/null || true
            rm -f .git/info/sparse-checkout
          fi
          leftovers=(trufflehog-*)
          if [ ${#leftovers[@]} -eq 0 ]; then
            exit 0
          fi
          echo "::warning::found stranded root-owned trufflehog scratch from a prior job (${leftovers[*]}) — removing before checkout"
          docker run --rm -v "$PWD":/workspace -w /workspace \
            alpine:3.20 sh -c 'rm -rf trufflehog-*' || {
            echo "::warning::trufflehog scratch cleanup failed — checkout may still hit EACCES; needs a root delete on this runner" >&2
            exit 0
          }
      # Full checkout, never sparse: a sparse config persists in the shared
      # self-hosted workspace and poisons the next job's checkout.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Check the last zap-baseline runs
        id: fresh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ZAP_TARGET: ${{ vars.ZAP_TARGET }}
        run: node scripts/zap-freshness-check.mjs

      # failure() is FALSE for a cancelled run (issue 2099's lesson), so a
      # cancelled check alerts too — as UNKNOWN, not as "no scan".
      - name: Telegram alert (no scan ran, or cannot tell)
        if: always() && (failure() || cancelled())
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          # fresh | stale | unknown, written by the script; empty when the
          # check step never ran (cancelled / earlier step failed).
          STATE: ${{ steps.fresh.outputs.state }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_ALERT_CHAT_ID" ]; then
            echo "::error::telegram secrets not configured — this staleness alert reached nobody"
            exit 1
          fi
          if [ "$STATE" = "stale" ]; then
            MSG=$(printf '⚠️ *ZAP baseline DAST: no scan in the last 26h* — %s\nNo zap-baseline run on main concluded success or failure. A cancelled or never-scheduled run is a night with NO scan, not a clean one. Details in the run log.\n[view run](https://github.com/%s/actions/runs/%s)' \
              "$REPO" "$REPO" "$RUN_ID")
          else
            MSG=$(printf '❓ *ZAP freshness check could not decide* — %s (state: %s)\nThe Actions API was unreadable or the check itself did not run (cancelled / setup failed). Whether a DAST scan ran is UNKNOWN — check the token/permissions and this run, not the scan.\n[view run](https://github.com/%s/actions/runs/%s)' \
              "$REPO" "${STATE:-not-run}" "$REPO" "$RUN_ID")
          fi
          curl -sS -m 15 -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_ALERT_CHAT_ID}" \
            -d parse_mode=Markdown \
            -d disable_web_page_preview=true \
            --data-urlencode text="$MSG" \
            >/dev/null
