name: Auto-fix watchdog

# Layer C of the 3-layer Force AI autonomous CI fix stack.
# Runs in the cloud every 17 min - independent of whether Ahmad's laptop
# is open or asleep. Detects CI failures across all 3 Force AI Suite repos
# that have been open >30 min WITHOUT an auto-fix PR opened against the SHA.
# Pings Telegram with an ESCALATION message: "human attention needed".
#
# Complements:
#   Layer A: in-session CronCreate (while Claude Code is open)
#   Layer B: macOS launchd (while Mac is awake, Claude Code closed OK)

on:
  schedule:
    - cron: '13 */2 * * *'
  workflow_dispatch:
    inputs:
      force_cloud:
        description: 'Run on cloud (ubuntu-latest) instead of self-hosted'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: auto-fix-watchdog-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  watchdog:
    name: Cross-repo CI failure escalator
    runs-on: ${{ inputs.force_cloud && 'ubuntu-latest' || fromJSON('["self-hosted","linux","wsl2"]') }}
    timeout-minutes: 5
    steps:
      - name: Check all 3 Force AI Suite repos for stale failures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROSS_REPO_TOKEN: ${{ secrets.ESCALATOR_PAT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
        run: |
          set -euo pipefail

          REPOS=(
            "ForceAI-KW/force-website-builder:ci.yml"
            "ForceAI-KW/whatsapp-broadcaster:pr-validation.yml"
            "ForceAI-KW/Force-Media-CRM:ci.yml"
          )

          if [ -n "${CROSS_REPO_TOKEN:-}" ]; then
            export GH_TOKEN="$CROSS_REPO_TOKEN"
          fi

          telegram() {
            if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_ALERT_CHAT_ID:-}" ]; then
              echo "telegram secrets not set - would have sent: $1"
              return 0
            fi
            curl -sS -m 10 -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_ALERT_CHAT_ID}" \
              -d parse_mode=Markdown \
              -d disable_web_page_preview=true \
              -d text="$1" >/dev/null || echo "telegram send failed"
          }

          ESCALATIONS=0
          for REPO_ENTRY in "${REPOS[@]}"; do
            REPO="${REPO_ENTRY%:*}"
            WORKFLOW="${REPO_ENTRY#*:}"

            # Filter to MAIN branch only. Staging is the integration branch
            # under the 2026-05-27 staging gate — failures there are
            # expected during stabilization and should NOT page Ahmad.
            # Open-feature-branch failures are PR-level, also not page-worthy.
            RUN_JSON=$(gh run list \
              --repo "$REPO" \
              --workflow="$WORKFLOW" \
              --branch=main \
              --status=failure \
              --limit=1 \
              --json databaseId,headSha,createdAt,displayTitle 2>/dev/null || echo "[]")

            RUN_ID=$(echo "$RUN_JSON" | jq -r '.[0].databaseId // empty')
            SHA=$(echo "$RUN_JSON" | jq -r '.[0].headSha // empty')
            CREATED=$(echo "$RUN_JSON" | jq -r '.[0].createdAt // empty')
            TITLE=$(echo "$RUN_JSON" | jq -r '.[0].displayTitle // empty')

            if [ -z "$RUN_ID" ]; then
              echo "$REPO: no failed runs on main"
              continue
            fi

            # SHA-currency check: if the failing SHA is no longer the HEAD
            # of main, it has been superseded by a later commit. Either the
            # later commit fixed it (so the alert is stale) or the later
            # commit is itself failing (which would surface as a fresher
            # failure on its own — we'll see it on the next watchdog tick).
            # Either way, don't escalate a SHA that's no longer current.
            MAIN_HEAD=$(gh api "repos/${REPO}/git/ref/heads/main" --jq '.object.sha' 2>/dev/null || echo "")
            if [ -n "$MAIN_HEAD" ] && [ "$SHA" != "$MAIN_HEAD" ]; then
              echo "$REPO: failing sha ${SHA:0:8} is no longer HEAD (HEAD is ${MAIN_HEAD:0:8}) - superseded, suppressing"
              continue
            fi

            RUN_EPOCH=$(date -d "$CREATED" "+%s" 2>/dev/null || echo "0")
            NOW_EPOCH=$(date "+%s")
            AGE_MIN=$(( (NOW_EPOCH - RUN_EPOCH) / 60 ))

            if [ "$AGE_MIN" -lt 30 ]; then
              echo "$REPO: failure $RUN_ID is fresh (${AGE_MIN}min) - Layer A/B handle it"
              continue
            fi

            if [ "$AGE_MIN" -gt 240 ]; then
              echo "$REPO: failure $RUN_ID is ancient (${AGE_MIN}min) - already known, suppressing"
              continue
            fi

            EXISTING_PR=$(gh pr list \
              --repo "$REPO" \
              --state=open \
              --head "auto-fix/${SHA:0:8}" \
              --json number 2>/dev/null \
              | jq -r '.[0].number // empty')

            if [ -n "$EXISTING_PR" ]; then
              echo "$REPO: auto-fix PR #$EXISTING_PR exists for ${SHA:0:8}"
              continue
            fi

            # Auto-fix layers A+B can be intentionally paused (state file
            # ~/.claude/auto-fix-paused on Ahmad's local machine, plus the
            # PRs in staging that disabled the cron triggers). When paused,
            # the watchdog still detects the failure but tones down the
            # message — Ahmad already knows main is red, no need to page
            # repeatedly with "auto-fix system can't help."
            #
            # Detection: look for a tag `auto-fix-paused` in the repo. Set
            # via `gh api -X POST repos/<repo>/git/refs --field ref='refs/tags/auto-fix-paused' --field sha='<any-sha>'`.
            # Clear with `gh api -X DELETE repos/<repo>/git/refs/tags/auto-fix-paused`.
            PAUSED_TAG=$(gh api "repos/${REPO}/git/refs/tags/auto-fix-paused" --jq '.ref // empty' 2>/dev/null || echo "")
            PREFIX="*Escalation*"
            SUFFIX="without auto-fix PR"
            if [ -n "$PAUSED_TAG" ]; then
              PREFIX="*FYI*"
              SUFFIX="(auto-fix is paused — no PR will be opened automatically)"
            fi

            # Pull commit metadata for context — the bare "CI fail" alert
            # earlier today wasn't enough info to decide whether to act.
            COMMIT_JSON=$(gh api "repos/${REPO}/commits/${SHA}" --jq '{message: .commit.message, author: .commit.author.name}' 2>/dev/null || echo '{}')
            COMMIT_TITLE=$(echo "$COMMIT_JSON" | jq -r '.message // ""' | head -n 1 | cut -c1-100)
            COMMIT_AUTHOR=$(echo "$COMMIT_JSON" | jq -r '.author // "unknown"')

            ESCALATIONS=$(( ESCALATIONS + 1 ))
            SHORT_SHA="${SHA:0:8}"
            MSG=$(printf '%s — `%s` main red for %dmin %s\n*branch:* `main`\n*sha:* `%s`\n*commit:* %s\n*author:* %s\n*workflow:* `%s`\n[view run](https://github.com/%s/actions/runs/%s)' \
              "$PREFIX" "$REPO" "$AGE_MIN" "$SUFFIX" "$SHORT_SHA" "$COMMIT_TITLE" "$COMMIT_AUTHOR" "$WORKFLOW" "$REPO" "$RUN_ID")
            telegram "$MSG"
            echo "$REPO: ESCALATED (${AGE_MIN}min stale, paused=$([ -n "$PAUSED_TAG" ] && echo yes || echo no))"
          done

          echo ""
          echo "watchdog summary: ${ESCALATIONS} escalations sent"
