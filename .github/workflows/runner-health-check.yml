name: Runner health check

# Every 15 minutes, query the GitHub Actions API for the self-hosted runner
# this repo depends on and fire a Telegram alert if it's offline.
#
# Runs on ubuntu-latest by design — if the self-hosted runner is down, a
# health check running on the same runner can't detect it.
#
# Cron + manual trigger so we can fire on demand to validate the alert path.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

# Need `administration: read` to call /actions/runners. contents:read for
# the implicit checkout that gh CLI may want. Nothing else.
permissions:
  contents: read
  administration: read

jobs:
  check:
    name: Ping windows-wsl-fwb on GitHub Actions runners API
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Resolve runner status + alert on offline / missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          # Repo + runner identity passed via env (defense-in-depth: never
          # interpolate ${{ github.* }} or user-controlled fields directly
          # into the run script body — see SECURITY.md → "no `${{ github.* }}`
          # interpolation inside `run:` blocks").
          GH_REPO: ${{ github.repository }}
          RUNNER_NAME: windows-wsl-fwb
        run: |
          set -euo pipefail

          # gh CLI is preinstalled on ubuntu-latest; uses GH_TOKEN from env.
          response=$(gh api "repos/${GH_REPO}/actions/runners" 2>&1) || {
            echo "::error::could not query /actions/runners — check that GITHUB_TOKEN has administration:read"
            echo "$response"
            exit 1
          }

          status=$(echo "$response" | jq -r --arg n "$RUNNER_NAME" \
            '(.runners[] | select(.name==$n) | .status) // "not-registered"')
          busy=$(echo "$response" | jq -r --arg n "$RUNNER_NAME" \
            '(.runners[] | select(.name==$n) | .busy) // "n/a"')

          echo "::notice::${GH_REPO} / windows-wsl-fwb → status=${status} busy=${busy}"

          if [ "$status" = "online" ]; then
            exit 0
          fi

          # Offline OR not-registered — alert.
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_ALERT_CHAT_ID:-}" ]; then
            echo "::error::runner status=${status} but TELEGRAM_BOT_TOKEN / TELEGRAM_ALERT_CHAT_ID secrets are not configured — cannot alert"
            exit 1
          fi

          text="🔴 [RUNNER OFFLINE] *${GH_REPO}* — runner \`windows-wsl-fwb\` reports *${status}*. The next CI run on this repo will be queued without a runner to pick it up. See https://github.com/${GH_REPO}/settings/actions/runners"

          curl -sS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_ALERT_CHAT_ID}" \
            -d parse_mode=Markdown \
            -d disable_web_page_preview=true \
            -d text="$text" \
            | jq -e '.ok == true' >/dev/null \
            && echo "alert delivered to telegram chat ${TELEGRAM_ALERT_CHAT_ID}" \
            || { echo "::error::telegram send failed"; exit 1; }

          # Make the workflow run itself fail-red so the repo's "Actions" tab
          # surfaces the outage as a status flag, not just a Telegram message.
          exit 1
