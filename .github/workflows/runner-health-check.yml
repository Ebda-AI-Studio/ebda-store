name: Runner health check

# ⚠️ THE SCHEDULE IS DISABLED. This workflow does NOT own runner-offline
# alerting any more — `~/.claude/scripts/ci-runner-guard.sh` does, on the Mac,
# under launchd (com.forceai.ci-runner-guard, every 30 min). Kept here as a
# manual `workflow_dispatch` fallback only.
#
# WHY (2026-07-21). Runner-offline detection needs a runner that is NOT the one
# being monitored. On this repo BOTH options are dead ends:
#
#   * self-hosted — a check that rides the runner it monitors cannot report that
#     runner being down. It also fails outright: the umbra guest has no `gh`.
#   * ubuntu-latest — GitHub Actions cloud minutes are billing-blocked for this
#     org. Signature: runner_name="", 0 steps, ~3s failure. Verified 2026-07-21;
#     no ubuntu-latest job has executed in recent history.
#
# So there is no correct answer INSIDE GitHub Actions, and a scheduled job here
# could only fail every 15 min while alerting nobody — the exact silent failure
# this file previously had. The check belongs outside both failure domains,
# which is the Mac: ci-runner-guard.sh probes the systemd unit directly, heals a
# dead service, hard-reboots a hung guest, and alerts on Telegram.
#
# Re-enable the schedule ONLY if cloud billing is restored (`runs-on:` must then
# stay ubuntu-latest, never USE_SELF_HOSTED) AND you have decided you want this
# duplicating the local guard.
#
# RUNNER HISTORY (keep current — a stale name here fails SILENTLY, reporting
# "not-registered", which is indistinguishable from a genuine outage):
#   2026-06-15  windows-wsl-fwb[-2] physically removed (WBS + CRM keep theirs)
#   2026-07     mac-orbstack-fwb replaced by the umbra guest fwb-ci5
#   2026-07-30  fwb-ci5 + fwb-ci2 DELETED; fwb-ci6 is the only guest
# No name is pinned any more — the check enumerates whatever is registered, so
# a guest rebuild no longer silently blinds it.
#
# REQUIRES a PAT: GITHUB_TOKEN CANNOT list self-hosted runners (`administration`
# is not a GITHUB_TOKEN scope). Mint a fine-grained PAT with **administration:
# read** on this repo and add it as the repo secret RUNNER_HEALTH_PAT, then
# `gh workflow enable runner-health-check.yml`.
on:
  # schedule: DISABLED 2026-07-21 — see the header. Owned by ci-runner-guard.sh
  # on the Mac. Do not re-enable without restoring cloud billing first; on
  # blocked billing this fails in ~3s every 15 min and alerts nobody.
  #   - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Ping self-hosted runners on the GitHub Actions API
    # PINNED to ubuntu-latest — do NOT route this through USE_SELF_HOSTED.
    # A 2026-07-15 "Umbra-only CI policy" change made this ride the self-hosted
    # runner during the billing lockout, which broke the invariant in the header:
    # a check whose job is to detect the self-hosted runner being offline cannot
    # run when that runner is offline. It also fails on the umbra guest, which
    # has no `gh` CLI. This job is a pure GitHub API call and must stay on
    # infrastructure independent of the thing it monitors.
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Resolve runner status + alert on offline / missing
        env:
          GH_TOKEN: ${{ secrets.RUNNER_HEALTH_PAT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          # Identity via env (never interpolate ${{ github.* }} into run: bodies).
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::RUNNER_HEALTH_PAT is not set. Mint a fine-grained PAT with administration:read on this repo and add it as the repo secret RUNNER_HEALTH_PAT (GITHUB_TOKEN cannot list self-hosted runners)."
            exit 1
          fi

          # `gh` must exist before we can blame anything else. The old message
          # asserted "PAT not scoped administration:read" for EVERY failure,
          # which sent a real diagnosis after a scope problem that did not exist
          # — the actual cause was `gh: command not found` on the self-hosted
          # guest. Report the observed failure, do not guess a cause.
          if ! command -v gh >/dev/null 2>&1; then
            echo "::error::gh CLI not found on this runner ($(uname -s)). This job must run on ubuntu-latest, which ships gh."
            exit 1
          fi

          response=$(gh api "repos/${GH_REPO}/actions/runners" --paginate 2>&1) || {
            echo "::error::could not query /actions/runners for ${GH_REPO}. Response below; if it is 403/404 check that RUNNER_HEALTH_PAT is scoped administration:read on this repo."
            echo "$response"
            exit 1
          }

          # Enumerate whatever is REGISTERED rather than pinning a name. The
          # pinned name rotted on every fleet move (windows-wsl-fwb[-2] removed
          # 2026-06-15, mac-orbstack-fwb -> umbra 2026-07, fwb-ci5 DELETED
          # 2026-07-30 leaving fwb-ci6), and a stale name never fails loudly:
          # the jq lookup yields "not-registered", which reads identically to a
          # genuine outage. The API already knows the truth — ask it.
          total=$(echo "$response" | jq '[.runners[]] | length')
          if [ "$total" -eq 0 ]; then
            # Enumeration alone cannot see this: zero registered runners looks
            # like "nothing is offline". Treat it as the outage it is.
            offline="no self-hosted runners registered at all"
            echo "::notice::${GH_REPO} → 0 runners registered"
          else
            offline=$(echo "$response" | jq -r \
              '[.runners[] | select(.status != "online") | "\(.name)=\(.status)"] | join(", ")')
            echo "$response" | jq -r \
              '.runners[] | "::notice::runner \(.name) → \(.status)"'
          fi

          [ -z "$offline" ] && exit 0

          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_ALERT_CHAT_ID:-}" ]; then
            echo "::error::runners offline (${offline}) but TELEGRAM_BOT_TOKEN / TELEGRAM_ALERT_CHAT_ID not configured — cannot alert"
            exit 1
          fi

          text="🔴 [RUNNER OFFLINE] *${GH_REPO}* — ${offline}. Queued CI on this repo will stall. https://github.com/${GH_REPO}/settings/actions/runners"

          curl -sS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_ALERT_CHAT_ID}" \
            -d parse_mode=Markdown \
            -d disable_web_page_preview=true \
            -d text="$text" \
            | jq -e '.ok == true' >/dev/null \
            && echo "alert delivered" \
            || { echo "::error::telegram send failed"; exit 1; }

          # Fail red so the Actions tab flags the outage too.
          exit 1
