name: Runner health check

# Every 15 min, query the GitHub Actions API for THIS repo's self-hosted runner
# (the Mac/OrbStack Linux runner) and fire a Telegram alert if it is offline.
# Runs on ubuntu-latest by design — a check on the self-hosted box can't detect
# that box being down.
#
# NOTE (2026-06-15): FWB's Windows/WSL2 runners (windows-wsl-fwb[-2]) were
# physically removed; FWB now runs solely on the Mac OrbStack Linux runner
# (mac-orbstack-fwb). WBS + CRM keep their Windows runners. This check therefore
# monitors only the single Mac runner — checking the dead Windows names was
# false-alerting offline every 15 min.
#
# REQUIRES a PAT: GITHUB_TOKEN CANNOT list self-hosted runners (`administration`
# is not a GITHUB_TOKEN scope). Mint a fine-grained PAT with **administration:
# read** on this repo and add it as the repo secret RUNNER_HEALTH_PAT, then
# `gh workflow enable runner-health-check.yml`.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Ping self-hosted runners on the GitHub Actions API
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Resolve runner status + alert on offline / missing
        env:
          GH_TOKEN: ${{ secrets.RUNNER_HEALTH_PAT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          # Identity via env (never interpolate ${{ github.* }} into run: bodies).
          GH_REPO: ${{ github.repository }}
          # FWB's sole self-hosted runner (Mac OrbStack Linux VM). The old
          # windows-wsl-fwb[-2] runners were removed 2026-06-15.
          RUNNER_NAME: mac-orbstack-fwb
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::RUNNER_HEALTH_PAT is not set. Mint a fine-grained PAT with administration:read on this repo and add it as the repo secret RUNNER_HEALTH_PAT (GITHUB_TOKEN cannot list self-hosted runners)."
            exit 1
          fi

          response=$(gh api "repos/${GH_REPO}/actions/runners" --paginate 2>&1) || {
            echo "::error::could not query /actions/runners — is RUNNER_HEALTH_PAT scoped administration:read on ${GH_REPO}?"
            echo "$response"
            exit 1
          }

          # FWB has a single self-hosted runner (the Mac OrbStack Linux VM).
          offline=""
          status=$(echo "$response" | jq -r --arg n "$RUNNER_NAME" \
            '(.runners[] | select(.name==$n) | .status) // "not-registered"')
          echo "::notice::${GH_REPO} / ${RUNNER_NAME} → ${status}"
          if [ "$status" != "online" ]; then
            offline="${RUNNER_NAME}=${status}"
          fi

          [ -z "$offline" ] && exit 0

          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_ALERT_CHAT_ID:-}" ]; then
            echo "::error::runners offline (${offline}) but TELEGRAM_BOT_TOKEN / TELEGRAM_ALERT_CHAT_ID not configured — cannot alert"
            exit 1
          fi

          text="🔴 [RUNNER OFFLINE] *${GH_REPO}* — ${offline}. Queued CI on this repo will stall. https://github.com/${GH_REPO}/settings/actions/runners"

          curl -sS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_ALERT_CHAT_ID}" \
            -d parse_mode=Markdown \
            -d disable_web_page_preview=true \
            -d text="$text" \
            | jq -e '.ok == true' >/dev/null \
            && echo "alert delivered" \
            || { echo "::error::telegram send failed"; exit 1; }

          # Fail red so the Actions tab flags the outage too.
          exit 1
