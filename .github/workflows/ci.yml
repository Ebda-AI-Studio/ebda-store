name: CI

on:
  push:
    # main-only (2026-06-13): the staging environment + branch were retired
    # (worktree→PR→CI→main is the only flow; staging drained Neon + Railway
    # 24/7 for zero use). develop was never active either.
    branches: [main]
    # .gitleaksignore / .gitleaks.toml REMOVED from this list 2026-09-02
    # (adversarial audit, P2): a docs-only-looking push that weakens the
    # secret-scanning config used to skip this ENTIRE workflow, including
    # the gitleaks job itself — a security-gate config change is a code
    # change, not a docs change.
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.vscode/**'
      - '.editorconfig'
  pull_request:
    # main-only (2026-06-13): staging/develop retired (see push trigger above).
    # NO paths-ignore here (2026-06-27): with it, a docs-only PR skipped the
    # WHOLE workflow, so the REQUIRED checks (Lint / Type Check / Security Audit)
    # never reported and branch protection blocked the PR forever. The workflow
    # now always runs; the heavy build + test jobs are gated on the `changes`
    # job below, so a docs-only PR runs only the 3 fast required jobs.
    branches: [main]
  workflow_dispatch:
    inputs:
      force_cloud:
        description: 'Run on cloud (ubuntu-latest) instead of self-hosted'
        type: boolean
        default: false

# CRITICAL: cancel superseded runs. Without this, multiple pushes to main
# in quick succession all run to completion, burning GitHub Actions minutes.
# Set 2026-05-25 after a session burned ~25 minutes on stale stuck runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

# Least-privilege default: the workflow GITHUB_TOKEN is read-only. No job here
# needs write (artifact upload uses the runner session token, not GITHUB_TOKEN).
# A job that ever needs write must override upward with its own `permissions:`.
permissions:
  contents: read

jobs:
  # Detects whether a PR touches any non-docs file. The heavy build + test jobs
  # gate on this (so docs-only PRs stay cheap), while the REQUIRED jobs
  # (Lint / Type Check / Security Audit — no `needs`) still run + report on
  # every PR so branch protection is always satisfied. (2026-06-27)
  changes:
    name: Detect code changes
    runs-on: ${{ (inputs.force_cloud || vars.USE_SELF_HOSTED != 'true') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","wsl2"]') }}
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      cf: ${{ steps.cf-filter.outputs.cf }}
    steps:
      # Pre-checkout guard (#1883): survives an OOM-kill/guest-restart on a
      # prior job that stranded a root-owned trufflehog-*/ dir `if: always()`
      # cannot cover, because nothing after the kill runs, checkout included.
      - name: Remove root-owned trufflehog scratch (pre-checkout guard, issue 1883)
        # Inline, not a local composite action: a `uses: ./.github/actions/...`
        # step cannot resolve before actions/checkout has put the repo on disk.
        shell: bash
        run: |
          shopt -s nullglob
          # Sparse-checkout leak (2026-09-30): a sparse job on this persistent
          # self-hosted workspace left core.sparseCheckout in .git/config, and
          # the next plain actions/checkout reused it, so orders' deploy got a
          # scripts-only tree ("npm ci: no package-lock.json"). Undo any
          # inherited sparse config BEFORE checkout, in every job.
          if [ -d .git ] && [ "$(git config --get core.sparseCheckout 2>/dev/null)" = "true" ]; then
            echo "::warning::workspace .git carries a sparse-checkout config from a prior job — disabling it before checkout"
            git sparse-checkout disable 2>/dev/null || true
            git config --unset-all core.sparseCheckout 2>/dev/null || true
            git config --unset-all core.sparseCheckoutCone 2>/dev/null || true
            rm -f .git/info/sparse-checkout
          fi
          leftovers=(trufflehog-*)
          if [ ${#leftovers[@]} -eq 0 ]; then
            exit 0
          fi
          echo "::warning::found stranded root-owned trufflehog scratch from a prior job (${leftovers[*]}) — removing before checkout"
          docker run --rm -v "$PWD":/workspace -w /workspace \
            alpine:3.20 sh -c 'rm -rf trufflehog-*' || {
            echo "::warning::trufflehog scratch cleanup failed — checkout may still hit EACCES; needs a root delete on this runner" >&2
            exit 0
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        name: Detect non-docs changes
        # .gitleaksignore / .gitleaks.toml REMOVED from the docs-only pattern
        # 2026-09-02 (adversarial audit, P2): a PR that only weakens the
        # secret-scanning allowlist used to read as docs-only here, which
        # skips Build/Unit/Integration/E2E/RLS-proof — while the gitleaks
        # job on that same PR runs WITH the weakened config, so the one gate
        # actually reviewing the change is the weakened one. A security-gate
        # config change is a code change.
        env:
          # GitHub-controlled SHA (not user text); bound via env per workflow-injection hygiene.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Push events have no PR base → run the full pipeline.
          if [ -z "$BASE_SHA" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE_SHA" HEAD \
              | grep -qvE '^(docs/|.*\.md$|\.github/ISSUE_TEMPLATE/|\.vscode/|\.editorconfig$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
      - id: cf-filter
        name: Detect changes that could move the Cloudflare Worker bundle
        # audit-followup #1632: the `build` job above only proves `next build`
        # succeeds — it never exercises the pinned `@opennextjs/cloudflare`
        # adapter that actually ships to production (`scripts/cf-build.sh`,
        # invoked only at deploy time by cf-deploy.yml). A `next`/adapter
        # version bump, or an edit to the adapter config itself, can move the
        # Worker bundle while `next build` stays green. Narrowly scoped to
        # the files that can affect that bundle so an unrelated PR doesn't pay
        # for 3 extra OpenNext builds.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # No PR base = a push to main or a manual run. cf-deploy.yml already
          # runs this exact adapter build on every main push, so repeating it
          # here would only add three more OpenNext builds to the busy
          # self-hosted runners.
          if [ -z "$BASE_SHA" ]; then
            echo "cf=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE_SHA" HEAD | grep -qE \
              '^(package-lock\.json|package\.json|scripts/cf-build\.sh|scripts/cf-setup-local\.sh|apps/(web|admin|orders)/(package\.json|wrangler\.jsonc|open-next\.config\.ts|next\.config\.js))$'; then
            echo "cf=true" >> "$GITHUB_OUTPUT"
          else
            echo "cf=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: Lint
    runs-on: ${{ (inputs.force_cloud || vars.USE_SELF_HOSTED != 'true') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","wsl2"]') }}
    # 20 (was 8, was 5). 8 was marginal and finally broke main on 2026-08-11
    # (run 31492893725, the #1072 merge): the job was killed at exactly 8m22s
    # with `Check formatting` only 47s in, which skipped Build, Unit,
    # Integration, E2E and the RLS proof — so main merged without ever being
    # fully validated. Measured on the umbra guest: install 268s + eslint 165s
    # left prettier no room, total need ~12-13m.
    #
    # It is NOT a constant cost, which is what made it flaky: the same job took
    # 4m19s on the PR run minutes earlier, because `Install dependencies` is
    # ~4.5m cold and much faster warm. Budget for the cold case.
    timeout-minutes: 20
    steps:
      # Pre-checkout guard (#1883): survives an OOM-kill/guest-restart on a
      # prior job that stranded a root-owned trufflehog-*/ dir `if: always()`
      # cannot cover, because nothing after the kill runs, checkout included.
      - name: Remove root-owned trufflehog scratch (pre-checkout guard, issue 1883)
        # Inline, not a local composite action: a `uses: ./.github/actions/...`
        # step cannot resolve before actions/checkout has put the repo on disk.
        shell: bash
        run: |
          shopt -s nullglob
          # Sparse-checkout leak (2026-09-30): a sparse job on this persistent
          # self-hosted workspace left core.sparseCheckout in .git/config, and
          # the next plain actions/checkout reused it, so orders' deploy got a
          # scripts-only tree ("npm ci: no package-lock.json"). Undo any
          # inherited sparse config BEFORE checkout, in every job.
          if [ -d .git ] && [ "$(git config --get core.sparseCheckout 2>/dev/null)" = "true" ]; then
            echo "::warning::workspace .git carries a sparse-checkout config from a prior job — disabling it before checkout"
            git sparse-checkout disable 2>/dev/null || true
            git config --unset-all core.sparseCheckout 2>/dev/null || true
            git config --unset-all core.sparseCheckoutCone 2>/dev/null || true
            rm -f .git/info/sparse-checkout
          fi
          leftovers=(trufflehog-*)
          if [ ${#leftovers[@]} -eq 0 ]; then
            exit 0
          fi
          echo "::warning::found stranded root-owned trufflehog scratch from a prior job (${leftovers[*]}) — removing before checkout"
          docker run --rm -v "$PWD":/workspace -w /workspace \
            alpine:3.20 sh -c 'rm -rf trufflehog-*' || {
            echo "::warning::trufflehog scratch cleanup failed — checkout may still hit EACCES; needs a root delete on this runner" >&2
            exit 0
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # No 'cache: npm' (removed 2026-07-05): actions/setup-node's built-in
          # npm cache restore hits GitHub's remote Actions Cache backend, and on
          # our self-hosted runners (now the umbra guest fwb-ci6-*) that
          # restore has been
          # intermittently stalling at 0% for 5-8+ minutes before timing out
          # ("Failed to restore: The operation cannot be completed in timeout"),
          # burning the whole job timeout and reporting Lint/Security Audit as a
          # cancelled (red) required check even though eslint/npm audit never ran.
          # Confirmed via job logs across ~40% of recent CI runs (2026-07-04/05).
          # The self-hosted runner's own $HOME persists between jobs on the same
          # machine, so npm's native ~/.npm package cache stays warm anyway —
          # dropping this wrapper removes the flaky network dependency with no
          # real cache-loss cost here.

      # Migration ordering (Ruling MIG-ORD-1): a PR may not add a migration
      # folder whose 14-digit timestamp sorts at or before main's newest, and
      # no two folders may share a timestamp (two prod-applied collisions are
      # grandfathered by exact folder set inside the script). Runs here because
      # Lint is a required job with no `needs`, so it reports on every PR,
      # docs-only included. On a PR the checkout is the merge commit, so the
      # tree already holds main's folders plus the PR's. After setup-node (the
      # self-hosted runner has no node on the run: PATH — exit 127 otherwise),
      # before `npm ci`. Fails CLOSED (exit 2) if origin/main cannot be read.
      - name: Migration ordering gate
        # The fetch lives INSIDE the script (--fetch), which only uses
        # --depth=1 when CI=true and GITHUB_ACTIONS=true. A bare
        # `git fetch --depth=1` here was copied/run by hand in the shared
        # developer repo and made every worktree shallow, twice (2026-09-30).
        #
        # Two arms (issue 2355). PR: compare against current main. PUSH to main:
        # compare against the PRE-push tip (`github.event.before`) — on a push,
        # origin/main IS the pushed commit, so the PR arm would compare nothing.
        # The push arm catches two PRs that each passed against the same old main
        # and then both merged: the second one's folder now sorts at/before the
        # first's, and main goes red instead of drifting silently.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            node scripts/check-migration-order.mjs --fetch --base "$BEFORE_SHA"
          else
            node scripts/check-migration-order.mjs --fetch --base origin/main
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint --if-present

      # Deterministic gate for the "an emptied admin field must clear" class:
      # `X || undefined` inside an apiPut/apiPatch body serializes to an
      # ABSENT key, and every write path here reads an absent key as "leave
      # the stored value alone" — so the save succeeds and the merchant's
      # clear is discarded (it shipped as a store's order-invoice address that
      # could not be removed). ESLint can't host it: the admin config's
      # `no-restricted-syntax` entries are deliberately `warn` for the ~143
      # known Tailwind-token violations, and flat config can't mix severities
      # within one rule — an `error` block here would silently downgrade or
      # promote those. AST-based (typescript, already a devDependency), not
      # grep, and it carries a documented `clear-gate-allow:` waiver form.
      - name: Clear-on-empty payload gate
        run: npm run check:clear-on-empty

      - name: Check formatting
        run: npm run format:check --if-present

  # Client trust-boundary guard (Builder Reality Audit Lens K): the frontend is a
  # display layer, not a trust layer. gitleaks/trufflehog scan the repo for committed
  # secrets; this scans what actually ships to the BROWSER (client source + built
  # bundle) for high-signal secret material + server-only env access. Pure bash —
  # no node/build — so it's fast and runs on every PR.
  client-secret-scan:
    name: Client secret scan
    runs-on: ${{ (inputs.force_cloud || vars.USE_SELF_HOSTED != 'true') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","wsl2"]') }}
    timeout-minutes: 3
    steps:
      # Pre-checkout guard (#1883): survives an OOM-kill/guest-restart on a
      # prior job that stranded a root-owned trufflehog-*/ dir `if: always()`
      # cannot cover, because nothing after the kill runs, checkout included.
      - name: Remove root-owned trufflehog scratch (pre-checkout guard, issue 1883)
        # Inline, not a local composite action: a `uses: ./.github/actions/...`
        # step cannot resolve before actions/checkout has put the repo on disk.
        shell: bash
        run: |
          shopt -s nullglob
          # Sparse-checkout leak (2026-09-30): a sparse job on this persistent
          # self-hosted workspace left core.sparseCheckout in .git/config, and
          # the next plain actions/checkout reused it, so orders' deploy got a
          # scripts-only tree ("npm ci: no package-lock.json"). Undo any
          # inherited sparse config BEFORE checkout, in every job.
          if [ -d .git ] && [ "$(git config --get core.sparseCheckout 2>/dev/null)" = "true" ]; then
            echo "::warning::workspace .git carries a sparse-checkout config from a prior job — disabling it before checkout"
            git sparse-checkout disable 2>/dev/null || true
            git config --unset-all core.sparseCheckout 2>/dev/null || true
            git config --unset-all core.sparseCheckoutCone 2>/dev/null || true
            rm -f .git/info/sparse-checkout
          fi
          leftovers=(trufflehog-*)
          if [ ${#leftovers[@]} -eq 0 ]; then
            exit 0
          fi
          echo "::warning::found stranded root-owned trufflehog scratch from a prior job (${leftovers[*]}) — removing before checkout"
          docker run --rm -v "$PWD":/workspace -w /workspace \
            alpine:3.20 sh -c 'rm -rf trufflehog-*' || {
            echo "::warning::trufflehog scratch cleanup failed — checkout may still hit EACCES; needs a root delete on this runner" >&2
            exit 0
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan client for secret leakage
        run: bash scripts/scan-bundle-secrets.sh
      # #1517: nothing verified that every `uses:` ref stays pinned to a
      # 40-hex SHA (the 2026-09 pin sweep, PR #1515) — the next workflow edit
      # could reintroduce a mutable tag with no reviewer able to tell from a
      # `@v4` line alone, in exactly the workflows holding
      # CLOUDFLARE_API_TOKEN/RAILWAY_TOKEN/AI_FIX_PAT. Pure bash, no install —
      # fits this job's fast, every-PR budget.
      - name: Verify every GitHub Action is pinned to a commit SHA
        run: bash scripts/check-action-pins.sh

  typecheck:
    name: Type Check
    runs-on: ${{ (inputs.force_cloud || vars.USE_SELF_HOSTED != 'true') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","wsl2"]') }}
    timeout-minutes: 30
    steps:
      # Pre-checkout guard (#1883): survives an OOM-kill/guest-restart on a
      # prior job that stranded a root-owned trufflehog-*/ dir `if: always()`
      # cannot cover, because nothing after the kill runs, checkout included.
      - name: Remove root-owned trufflehog scratch (pre-checkout guard, issue 1883)
        # Inline, not a local composite action: a `uses: ./.github/actions/...`
        # step cannot resolve before actions/checkout has put the repo on disk.
        shell: bash
        run: |
          shopt -s nullglob
          # Sparse-checkout leak (2026-09-30): a sparse job on this persistent
          # self-hosted workspace left core.sparseCheckout in .git/config, and
          # the next plain actions/checkout reused it, so orders' deploy got a
          # scripts-only tree ("npm ci: no package-lock.json"). Undo any
          # inherited sparse config BEFORE checkout, in every job.
          if [ -d .git ] && [ "$(git config --get core.sparseCheckout 2>/dev/null)" = "true" ]; then
            echo "::warning::workspace .git carries a sparse-checkout config from a prior job — disabling it before checkout"
            git sparse-checkout disable 2>/dev/null || true
            git config --unset-all core.sparseCheckout 2>/dev/null || true
            git config --unset-all core.sparseCheckoutCone 2>/dev/null || true
            rm -f .git/info/sparse-checkout
          fi
          leftovers=(trufflehog-*)
          if [ ${#leftovers[@]} -eq 0 ]; then
            exit 0
          fi
          echo "::warning::found stranded root-owned trufflehog scratch from a prior job (${leftovers[*]}) — removing before checkout"
          docker run --rm -v "$PWD":/workspace -w /workspace \
            alpine:3.20 sh -c 'rm -rf trufflehog-*' || {
            echo "::warning::trufflehog scratch cleanup failed — checkout may still hit EACCES; needs a root delete on this runner" >&2
            exit 0
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # No 'cache: npm' (removed 2026-07-05): the GH Actions cache restore
          # was intermittently stalling for minutes on our self-hosted runners
          # and eating job timeouts (cancelled Lint/Security Audit). See the
          # full explanation on the Lint job above (~line 93).

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Build database package
        run: npm run build -w packages/database

      - name: Type check API
        run: npx tsc --noEmit -p apps/api/tsconfig.json

      - name: Type check Admin
        run: npx tsc --noEmit -p apps/admin/tsconfig.json

      - name: Type check Web
        run: npx tsc --noEmit -p apps/web/tsconfig.json

      - name: Type check Orders PWA
        run: npx tsc --noEmit -p apps/orders/tsconfig.json

      - name: Type check shared packages
        run: npx tsc --noEmit -p packages/shared/tsconfig.json

  build:
    name: Build
    # Skip on docs-only PRs (the required Lint/Type Check/Security Audit still
    # run). On push events `changes.code` is 'true', so build always runs there.
    if: needs.changes.outputs.code == 'true'
    # build runs on self-hosted by default; force_cloud overrides to ubuntu-latest.
    # inputs.force_cloud is falsy (not set) for push/pull_request triggers — safe.
    runs-on: ${{ (inputs.force_cloud || vars.USE_SELF_HOSTED != 'true') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","wsl2"]') }}
    # 35 (was 15). Every timeout in this file is now budgeted for CONTENTION,
    # not for a job running alone. The umbra guest is 4 CPU / 4 GiB and a full
    # FWB run drives it to load ~15, so jobs take roughly 2.5-3x their
    # measured-alone duration. Build measured 7m46s alone and was killed at 20m
    # mid-`Build all packages` on main (run 31504612064), which skipped Unit,
    # Integration, E2E and the RLS proof — main went unvalidated twice in a row.
    #
    # Sizing rule if you touch these: take the alone-duration, multiply by 3,
    # then add headroom. Budgets sized against alone-durations fail
    # INTERMITTENTLY, which is the worst failure mode — it reads as a flaky test.
    #
    # This is a stopgap. The real fix is guest capacity (host is 10 cores/16 GB,
    # guest gets 4/4). Do NOT "add a second runner" — the guest is CPU-bound, so
    # another runner adds contention, not throughput.
    timeout-minutes: 35
    needs: [lint, typecheck, changes]
    steps:
      # Pre-checkout guard (#1883): survives an OOM-kill/guest-restart on a
      # prior job that stranded a root-owned trufflehog-*/ dir `if: always()`
      # cannot cover, because nothing after the kill runs, checkout included.
      - name: Remove root-owned trufflehog scratch (pre-checkout guard, issue 1883)
        # Inline, not a local composite action: a `uses: ./.github/actions/...`
        # step cannot resolve before actions/checkout has put the repo on disk.
        shell: bash
        run: |
          shopt -s nullglob
          # Sparse-checkout leak (2026-09-30): a sparse job on this persistent
          # self-hosted workspace left core.sparseCheckout in .git/config, and
          # the next plain actions/checkout reused it, so orders' deploy got a
          # scripts-only tree ("npm ci: no package-lock.json"). Undo any
          # inherited sparse config BEFORE checkout, in every job.
          if [ -d .git ] && [ "$(git config --get core.sparseCheckout 2>/dev/null)" = "true" ]; then
            echo "::warning::workspace .git carries a sparse-checkout config from a prior job — disabling it before checkout"
            git sparse-checkout disable 2>/dev/null || true
            git config --unset-all core.sparseCheckout 2>/dev/null || true
            git config --unset-all core.sparseCheckoutCone 2>/dev/null || true
            rm -f .git/info/sparse-checkout
          fi
          leftovers=(trufflehog-*)
          if [ ${#leftovers[@]} -eq 0 ]; then
            exit 0
          fi
          echo "::warning::found stranded root-owned trufflehog scratch from a prior job (${leftovers[*]}) — removing before checkout"
          docker run --rm -v "$PWD":/workspace -w /workspace \
            alpine:3.20 sh -c 'rm -rf trufflehog-*' || {
            echo "::warning::trufflehog scratch cleanup failed — checkout may still hit EACCES; needs a root delete on this runner" >&2
            exit 0
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # No 'cache: npm' (removed 2026-07-05): the GH Actions cache restore
          # was intermittently stalling for minutes on our self-hosted runners
          # and eating job timeouts (cancelled Lint/Security Audit). See the
          # full explanation on the Lint job above (~line 93).

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Build database package
        run: npm run build -w packages/database

      - name: Build all packages
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000

  # audit-followup #1632: `build` above only proves `next build` succeeds.
  # web/admin/orders actually ship as Cloudflare Workers through the pinned
  # `@opennextjs/cloudflare` adapter (`scripts/cf-build.sh`), which rewrites
  # Next's build output — exactly the surface a `next` or adapter version
  # bump moves. Before this job, that adapter build ran ONLY at deploy time
  # (cf-deploy.yml), so a green CI here proved nothing about the Worker
  # bundle a `next` minor bump actually ships. Gated on `changes.outputs.cf`
  # (package.json/lockfile/adapter-config changes only) so an unrelated PR
  # doesn't pay for 3 extra OpenNext builds.
  #
  # It builds the config that DEPLOYS, not the committed one (issues 2089/
  # 2152/2154): cf-deploy.yml runs scripts/cf-setup-local.sh first, which
  # overwrites apps/<app>/{open-next.config.ts,wrangler.jsonc} and, for web
  # with OPENNEXT_CACHE=true, adds the DO tag cache/queue + R2 incremental
  # cache and a generated cache-worker-entry.ts. This job runs the same
  # generator and the same assertion (scripts/assert-cf-cache-bindings.sh),
  # so an adapter bump that breaks the DO/tag-cache overrides fails HERE, not
  # at deploy on main. Keep the two in lockstep. Not reproduced: the
  # NEXT_PUBLIC_* .env.production.local write — this build inlines only
  # NEXT_PUBLIC_API_URL, which moves no adapter surface.
  #
  # Budget (issue 2155), by this file's own sizing rule (see `build`): the
  # deploy path gives ONE app's install + build + deploy 25 min on this
  # runner, so a leg gets 45; `max-parallel: 1` serializes the three legs so
  # three concurrent Next+OpenNext builds cannot OOM a 4 GiB guest that is
  # also running build/unit/integration/e2e. Never add this matrix to branch
  # protection's required checks: it is conditionally skipped (see the
  # paths-ignore trap at the top of this file).
  cf-build-check:
    name: Cloudflare Worker Build Check (${{ matrix.app }})
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.cf == 'true'
    runs-on: ${{ (inputs.force_cloud || vars.USE_SELF_HOSTED != 'true') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","wsl2"]') }}
    timeout-minutes: 45
    needs: [lint, typecheck, changes]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        app: [web, admin, orders]
    steps:
      # Pre-checkout guard (#1883): survives an OOM-kill/guest-restart on a
      # prior job that stranded a root-owned trufflehog-*/ dir `if: always()`
      # cannot cover, because nothing after the kill runs, checkout included.
      - name: Remove root-owned trufflehog scratch (pre-checkout guard, issue 1883)
        # Inline, not a local composite action: a `uses: ./.github/actions/...`
        # step cannot resolve before actions/checkout has put the repo on disk.
        shell: bash
        run: |
          shopt -s nullglob
          # Sparse-checkout leak (2026-09-30): a sparse job on this persistent
          # self-hosted workspace left core.sparseCheckout in .git/config, and
          # the next plain actions/checkout reused it, so orders' deploy got a
          # scripts-only tree ("npm ci: no package-lock.json"). Undo any
          # inherited sparse config BEFORE checkout, in every job.
          if [ -d .git ] && [ "$(git config --get core.sparseCheckout 2>/dev/null)" = "true" ]; then
            echo "::warning::workspace .git carries a sparse-checkout config from a prior job — disabling it before checkout"
            git sparse-checkout disable 2>/dev/null || true
            git config --unset-all core.sparseCheckout 2>/dev/null || true
            git config --unset-all core.sparseCheckoutCone 2>/dev/null || true
            rm -f .git/info/sparse-checkout
          fi
          leftovers=(trufflehog-*)
          if [ ${#leftovers[@]} -eq 0 ]; then
            exit 0
          fi
          echo "::warning::found stranded root-owned trufflehog scratch from a prior job (${leftovers[*]}) — removing before checkout"
          docker run --rm -v "$PWD":/workspace -w /workspace \
            alpine:3.20 sh -c 'rm -rf trufflehog-*' || {
            echo "::warning::trufflehog scratch cleanup failed — checkout may still hit EACCES; needs a root delete on this runner" >&2
            exit 0
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Must match cf-deploy.yml's NODE_VERSION: the deploy runs wrangler there,
          # and wrangler enforces its own Node floor at startup.
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Build database package
        run: npm run build -w packages/database

      - name: Build shared package
        run: npm run build -w packages/shared

      - name: Generate the ${{ matrix.app }} worker config (same generator as cf-deploy)
        env:
          OPENNEXT_CACHE: ${{ vars.OPENNEXT_CACHE }}
          # The pinned adapter + wrangler are already installed by `npm ci`.
          CF_SETUP_SKIP_DEPS: '1'
        run: bash scripts/cf-setup-local.sh ${{ matrix.app }}

      - name: Assert the generated config matches OPENNEXT_CACHE (same assertion as cf-deploy)
        env:
          OPENNEXT_CACHE: ${{ vars.OPENNEXT_CACHE }}
        run: bash scripts/assert-cf-cache-bindings.sh ${{ matrix.app }}

      - name: Build ${{ matrix.app }} for Cloudflare (OpenNext adapter)
        run: bash scripts/cf-build.sh ${{ matrix.app }}

      # The build above never starts wrangler, so it passed while every real
      # deploy died at `wrangler deploy` on the Node version (2026-10-03, run
      # 37113844110). A dry run starts the same binary with the same config on
      # the same Node, without uploading anything.
      - name: Dry-run the ${{ matrix.app }} deploy (wrangler starts on the deploy's Node)
        working-directory: apps/${{ matrix.app }}
        run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/wrangler-dry-${{ matrix.app }}"
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000

  test-unit:
    name: Unit Tests
    runs-on: ${{ (inputs.force_cloud || vars.USE_SELF_HOSTED != 'true') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","wsl2"]') }}
    # 15 (was 10): measured 6m51s on the umbra guest — 69% of the old budget,
    # the next-tightest job after Lint. It pays the same ~4.5m cold
    # `Install dependencies` that pushed Lint over, so raise it now rather than
    # wait for it to fail the same way.
    timeout-minutes: 30
    needs: [build]
    steps:
      # Pre-checkout guard (#1883): survives an OOM-kill/guest-restart on a
      # prior job that stranded a root-owned trufflehog-*/ dir `if: always()`
      # cannot cover, because nothing after the kill runs, checkout included.
      - name: Remove root-owned trufflehog scratch (pre-checkout guard, issue 1883)
        # Inline, not a local composite action: a `uses: ./.github/actions/...`
