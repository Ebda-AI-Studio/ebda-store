name: CI

on:
  push:
    # main-only (2026-06-13): the staging environment + branch were retired
    # (worktree→PR→CI→main is the only flow; staging drained Neon + Railway
    # 24/7 for zero use). develop was never active either.
    branches: [main]
    # .gitleaksignore / .gitleaks.toml REMOVED from this list 2026-09-02
    # (adversarial audit, P2): a docs-only-looking push that weakens the
    # secret-scanning config used to skip this ENTIRE workflow, including
    # the gitleaks job itself — a security-gate config change is a code
    # change, not a docs change.
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.vscode/**'
      - '.editorconfig'
  pull_request:
    # main-only (2026-06-13): staging/develop retired (see push trigger above).
    # NO paths-ignore here (2026-06-27): with it, a docs-only PR skipped the
    # WHOLE workflow, so the REQUIRED checks (Lint / Type Check / Security Audit)
    # never reported and branch protection blocked the PR forever. The workflow
    # now always runs; the heavy build + test jobs are gated on the `changes`
    # job below, so a docs-only PR runs only the 3 fast required jobs.
    branches: [main]
  workflow_dispatch:
    inputs:
      force_cloud:
        description: 'Run on cloud (ubuntu-latest) instead of self-hosted'
        type: boolean
        default: false

# CRITICAL: cancel superseded runs. Without this, multiple pushes to main
# in quick succession all run to completion, burning GitHub Actions minutes.
# Set 2026-05-25 after a session burned ~25 minutes on stale stuck runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

# Least-privilege default: the workflow GITHUB_TOKEN is read-only. No job here
# needs write (artifact upload uses the runner session token, not GITHUB_TOKEN).
# A job that ever needs write must override upward with its own `permissions:`.
permissions:
  contents: read

jobs:
  # Detects whether a PR touches any non-docs file. The heavy build + test jobs
  # gate on this (so docs-only PRs stay cheap), while the REQUIRED jobs
  # (Lint / Type Check / Security Audit — no `needs`) still run + report on
  # every PR so branch protection is always satisfied. (2026-06-27)
  changes:
    name: Detect code changes
    runs-on: ${{ (inputs.force_cloud || vars.USE_SELF_HOSTED != 'true') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","wsl2"]') }}
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: filter
        name: Detect non-docs changes
        # .gitleaksignore / .gitleaks.toml REMOVED from the docs-only pattern
        # 2026-09-02 (adversarial audit, P2): a PR that only weakens the
        # secret-scanning allowlist used to read as docs-only here, which
        # skips Build/Unit/Integration/E2E/RLS-proof — while the gitleaks
        # job on that same PR runs WITH the weakened config, so the one gate
        # actually reviewing the change is the weakened one. A security-gate
        # config change is a code change.
        env:
          # GitHub-controlled SHA (not user text); bound via env per workflow-injection hygiene.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Push events have no PR base → run the full pipeline.
          if [ -z "$BASE_SHA" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE_SHA" HEAD \
              | grep -qvE '^(docs/|.*\.md$|\.github/ISSUE_TEMPLATE/|\.vscode/|\.editorconfig$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: Lint
    runs-on: ${{ (inputs.force_cloud || vars.USE_SELF_HOSTED != 'true') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","wsl2"]') }}
    # 20 (was 8, was 5). 8 was marginal and finally broke main on 2026-08-11
    # (run 31492893725, the #1072 merge): the job was killed at exactly 8m22s
    # with `Check formatting` only 47s in, which skipped Build, Unit,
    # Integration, E2E and the RLS proof — so main merged without ever being
    # fully validated. Measured on the umbra guest: install 268s + eslint 165s
    # left prettier no room, total need ~12-13m.
    #
    # It is NOT a constant cost, which is what made it flaky: the same job took
    # 4m19s on the PR run minutes earlier, because `Install dependencies` is
    # ~4.5m cold and much faster warm. Budget for the cold case.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # No 'cache: npm' (removed 2026-07-05): actions/setup-node's built-in
          # npm cache restore hits GitHub's remote Actions Cache backend, and on
          # our self-hosted runners (now the umbra guest fwb-ci6-*) that
          # restore has been
          # intermittently stalling at 0% for 5-8+ minutes before timing out
          # ("Failed to restore: The operation cannot be completed in timeout"),
          # burning the whole job timeout and reporting Lint/Security Audit as a
          # cancelled (red) required check even though eslint/npm audit never ran.
          # Confirmed via job logs across ~40% of recent CI runs (2026-07-04/05).
          # The self-hosted runner's own $HOME persists between jobs on the same
          # machine, so npm's native ~/.npm package cache stays warm anyway —
          # dropping this wrapper removes the flaky network dependency with no
          # real cache-loss cost here.

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint --if-present

      # Deterministic gate for the "an emptied admin field must clear" class:
      # `X || undefined` inside an apiPut/apiPatch body serializes to an
      # ABSENT key, and every write path here reads an absent key as "leave
      # the stored value alone" — so the save succeeds and the merchant's
      # clear is discarded (it shipped as a store's order-invoice address that
      # could not be removed). ESLint can't host it: the admin config's
      # `no-restricted-syntax` entries are deliberately `warn` for the ~143
      # known Tailwind-token violations, and flat config can't mix severities
      # within one rule — an `error` block here would silently downgrade or
      # promote those. AST-based (typescript, already a devDependency), not
      # grep, and it carries a documented `clear-gate-allow:` waiver form.
      - name: Clear-on-empty payload gate
        run: npm run check:clear-on-empty

      - name: Check formatting
        run: npm run format:check --if-present

  # Client trust-boundary guard (Builder Reality Audit Lens K): the frontend is a
  # display layer, not a trust layer. gitleaks/trufflehog scan the repo for committed
  # secrets; this scans what actually ships to the BROWSER (client source + built
  # bundle) for high-signal secret material + server-only env access. Pure bash —
  # no node/build — so it's fast and runs on every PR.
  client-secret-scan:
    name: Client secret scan
    runs-on: ${{ (inputs.force_cloud || vars.USE_SELF_HOSTED != 'true') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","wsl2"]') }}
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Scan client for secret leakage
        run: bash scripts/scan-bundle-secrets.sh

  typecheck:
    name: Type Check
    runs-on: ${{ (inputs.force_cloud || vars.USE_SELF_HOSTED != 'true') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","wsl2"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # No 'cache: npm' (removed 2026-07-05): the GH Actions cache restore
          # was intermittently stalling for minutes on our self-hosted runners
          # and eating job timeouts (cancelled Lint/Security Audit). See the
          # full explanation on the Lint job above (~line 93).

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Build database package
        run: npm run build -w packages/database

      - name: Type check API
        run: npx tsc --noEmit -p apps/api/tsconfig.json

      - name: Type check Admin
        run: npx tsc --noEmit -p apps/admin/tsconfig.json

      - name: Type check Web
        run: npx tsc --noEmit -p apps/web/tsconfig.json

      - name: Type check Orders PWA
        run: npx tsc --noEmit -p apps/orders/tsconfig.json

      - name: Type check shared packages
        run: npx tsc --noEmit -p packages/shared/tsconfig.json

  build:
    name: Build
    # Skip on docs-only PRs (the required Lint/Type Check/Security Audit still
    # run). On push events `changes.code` is 'true', so build always runs there.
    if: needs.changes.outputs.code == 'true'
    # build runs on self-hosted by default; force_cloud overrides to ubuntu-latest.
    # inputs.force_cloud is falsy (not set) for push/pull_request triggers — safe.
    runs-on: ${{ (inputs.force_cloud || vars.USE_SELF_HOSTED != 'true') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","wsl2"]') }}
    # 35 (was 15). Every timeout in this file is now budgeted for CONTENTION,
    # not for a job running alone. The umbra guest is 4 CPU / 4 GiB and a full
    # FWB run drives it to load ~15, so jobs take roughly 2.5-3x their
    # measured-alone duration. Build measured 7m46s alone and was killed at 20m
    # mid-`Build all packages` on main (run 31504612064), which skipped Unit,
    # Integration, E2E and the RLS proof — main went unvalidated twice in a row.
    #
    # Sizing rule if you touch these: take the alone-duration, multiply by 3,
    # then add headroom. Budgets sized against alone-durations fail
    # INTERMITTENTLY, which is the worst failure mode — it reads as a flaky test.
    #
    # This is a stopgap. The real fix is guest capacity (host is 10 cores/16 GB,
    # guest gets 4/4). Do NOT "add a second runner" — the guest is CPU-bound, so
    # another runner adds contention, not throughput.
    timeout-minutes: 35
    needs: [lint, typecheck, changes]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # No 'cache: npm' (removed 2026-07-05): the GH Actions cache restore
          # was intermittently stalling for minutes on our self-hosted runners
          # and eating job timeouts (cancelled Lint/Security Audit). See the
          # full explanation on the Lint job above (~line 93).

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Build database package
        run: npm run build -w packages/database

      - name: Build all packages
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000

  test-unit:
    name: Unit Tests
    runs-on: ${{ (inputs.force_cloud || vars.USE_SELF_HOSTED != 'true') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","wsl2"]') }}
    # 15 (was 10): measured 6m51s on the umbra guest — 69% of the old budget,
    # the next-tightest job after Lint. It pays the same ~4.5m cold
    # `Install dependencies` that pushed Lint over, so raise it now rather than
    # wait for it to fail the same way.
    timeout-minutes: 30
    needs: [build]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # No 'cache: npm' (removed 2026-07-05): the GH Actions cache restore
          # was intermittently stalling for minutes on our self-hosted runners
          # and eating job timeouts (cancelled Lint/Security Audit). See the
          # full explanation on the Lint job above (~line 93).

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Build database package
        run: npm run build -w packages/database

      - name: Build shared package
        run: npm run build -w packages/shared

      - name: Run unit tests with coverage
        # Globs BEYOND tests/unit are load-bearing, not tidiness. vitest.config.ts
        # has a broad `include`, so a colocated `__tests__` file passes locally and
        # is silently never executed by CI unless its directory is named here.
        #
        # The integration job already added `apps/api/src` for exactly this reason
        # (see its comment). That left the OTHER colocated suites still orphaned:
        # packages/shared, packages/database, apps/web and apps/admin — 18 files /
        # 200 tests that had never run in CI, including the JSON-LD script-tag XSS
        # escaping regression, the money-transaction wrapper, plan baselines and
        # store-layout resolution. All are pure (no DB, no network), so they belong
        # in this job rather than integration.
        #
        # 2026-09-02: `apps/web/src/lib` narrowed the glob past the app's own test
        # tree and orphaned it again — 4 colocated web tests (checkout delivery
        # windows, company-host routing, llms.txt, ProductDetailBody) shipped
        # outside `src/lib` and silently never ran in CI. Widened to the whole
        # `apps/web` tree (still pure/no-DB — verified no prisma/DATABASE_URL
        # import in any apps/web test file); the `orphan-tests` job below now
        # fails the build on any future gap instead of relying on this comment.
        #
        # 2026-09-07: `apps/orders` added — the fulfilment app's colocated
        # `ItemsCard.test.ts` (bundle-box grouping) was the orphan-tests job's
        # first real catch: vitest collected it locally, no CI job glob ran it.
        # Pure grouping logic, no DOM/DB (the root config's `node` environment
        # is all it needs), so it belongs in this job like the other colocated
        # suites. Keep the `orphan-tests` covered-tests list below in sync.
        #
        # Adding a colocated test outside these paths = a test that does not run.
        # Prefer tests/unit; if you must colocate, add the directory here.
        run: npx vitest run tests/unit packages/shared/src packages/database/src apps/web apps/admin/src apps/orders --coverage --reporter=verbose --maxWorkers=2
        env:
          NODE_OPTIONS: --max-old-space-size=2048

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unit-test-coverage
          path: coverage/
          retention-days: 7

  orphan-tests:
    name: Orphan test coverage
    # P1-5 (2026-09-02): vitest.config.ts's root `include` is a broad glob, so
    # ANY colocated *.test.ts/*.spec.ts anywhere in the repo passes locally —
    # but only runs in CI if its directory is named in one of the job globs
    # below. This already recurred once: the Unit Tests job's own comment
    # documents a 2026-07-05 fix for 18 such orphans, and by 2026-09-02 four
    # MORE had shipped outside it (apps/web/src/app + apps/web root) and never
    # ran in CI. That fix only froze a list; it didn't stop the list from going
    # stale again. This job is the thing that stops it: it diffs the full test
    # universe vitest would collect (root config, same as `tests/smoke`'s own
    # exclusion) against the UNION of every directory/file the unit,
    # integration, RLS-proof and e2e jobs pass to `vitest run`, and fails on
    # any file present in the first set but not the second. A gate that cannot
    # fail must not report success — this one can, and does today if a colocated
    # test lands outside every job's glob again.
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ (inputs.force_cloud || vars.USE_SELF_HOSTED != 'true') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","wsl2"]') }}
    # 20, not 10 — npm ci alone measured ~268s cold on the self-hosted runner
    # (see the Lint job's 2026-08-11 budget post-mortem above), and this job
    # additionally builds 2 packages and runs 2 full vitest collections. A
    # 10-minute budget would cancel cold-cache runs with a timeout error —
    # the same false-signal class this job exists to eliminate (#1138).
    timeout-minutes: 20
    needs: [build, changes]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Build database package
        run: npm run build -w packages/database

      - name: Build shared package
        run: npm run build -w packages/shared

      - name: Diff vitest's full test universe against CI job coverage
        # KEEP THE PATH LIST BELOW IN SYNC with what test-unit / test-integration /
        # test-rls-force-app / test-e2e actually pass to `vitest run` (this is
        # intentionally a hand-copied list, not derived from the other jobs, so a
        # change to one without the other shows up as a visible diff in review).
        # --json=<file> (NOT bare --json, which vitest treats as an optional
        # positional VALUE and greedily swallows the next arg as the output path)
        # writes ONLY the JSON to that file, keeping it clean of the setup-file
        # console warnings vitest's collection phase prints to stdout.
        run: |
          set -euo pipefail

          npx vitest list --json=/tmp/all-tests.json

          npx vitest list \
            tests/unit packages/shared/src packages/database/src apps/web apps/admin/src apps/orders \
            tests/integration apps/api/src \
            tests/e2e \
            --json=/tmp/covered-tests.json

          node -e "
            const fs = require('fs');
            const all = new Set(JSON.parse(fs.readFileSync('/tmp/all-tests.json', 'utf8')).map(t => t.file));
            const covered = new Set(JSON.parse(fs.readFileSync('/tmp/covered-tests.json', 'utf8')).map(t => t.file));

            // A collection that came back (near-)empty is a BROKEN RUN, not a
            // repo full of orphans. Without this the job reports every file in
            // the tree as an orphan — 268 of them on one occasion, including
            // tests/unit files that are plainly inside the covered globs — and
            // that reads as a code regression rather than as \"the second
            // vitest list collected nothing\". Observed on one runner of the
            // self-hosted pair while the same commit collected 269/269 locally
            // and passed on the other runner.
            //
            // The covered set is a FILTERED subset of the same universe, so it
            // should be within a whisker of `all`. Anything below half means
            // the collection failed, and saying so is far more useful than
            // listing the whole repo.
            if (covered.size * 2 < all.size) {
              console.error('::error::covered-test collection returned ' + covered.size +
                ' file(s) against ' + all.size + ' discovered. The second vitest list failed to' +
                ' collect, so this is a BROKEN RUN, not an orphan-test regression.' +
                ' Re-run; if it persists, check the runner node_modules and disk state.');
              process.exit(1);
            }
            const orphans = [...all].filter(f => !covered.has(f)).sort();
            if (orphans.length > 0) {
              console.error('::error::' + orphans.length + ' orphan test file(s) — vitest collects these but no CI job glob covers them, so they never run in CI:');
              for (const f of orphans) console.error('  ' + f);
              console.error('');
              console.error('Fix: add the containing directory to the relevant job glob in ci.yml (test-unit/test-integration/test-e2e), AND to this job\'s covered-tests path list above.');
              process.exit(1);
            }
            console.log('No orphan test files (' + all.size + ' vitest-discovered files, all covered by a CI job glob).');
          "

  test-integration:
    name: Integration Tests
    runs-on: ${{ (inputs.force_cloud || vars.USE_SELF_HOSTED != 'true') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","wsl2"]') }}
    timeout-minutes: 35
    needs: [build]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: force_test
        ports:
          # Dynamic host port: Docker assigns a random available port so
          # parallel jobs on the same self-hosted runner never collide on 5432.
          - 5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s
      redis:
        image: redis:7-alpine
        ports:
          # Dynamic host port: same reasoning as postgres above.
          - 6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # No 'cache: npm' (removed 2026-07-05): the GH Actions cache restore
          # was intermittently stalling for minutes on our self-hosted runners
          # and eating job timeouts (cancelled Lint/Security Audit). See the
          # full explanation on the Lint job above (~line 93).

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Build database package
        run: npm run build -w packages/database

      - name: Build shared package
        run: npm run build -w packages/shared

      - name: Run database migrations
        run: npx prisma migrate deploy --schema=packages/database/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://test:test@localhost:${{ job.services.postgres.ports['5432'] }}/force_test
          DIRECT_URL: postgresql://test:test@localhost:${{ job.services.postgres.ports['5432'] }}/force_test

      - name: Seed test data
        run: npm run db:seed --if-present
        env:
          DATABASE_URL: postgresql://test:test@localhost:${{ job.services.postgres.ports['5432'] }}/force_test
          DIRECT_URL: postgresql://test:test@localhost:${{ job.services.postgres.ports['5432'] }}/force_test
          ADMIN_PASSWORD: test-admin-password-ci
          ADMIN_EMAIL: admin@forcemedia.com

      - name: Build API
        run: npm run build -w apps/api

      - name: Start API server
        # tests/integration hit a real HTTP server at localhost:4000.
        # Background-launch the built API and poll /health until it is
        # ready; tear it down in a later step regardless of test outcome.
        run: |
          node apps/api/dist/index.js > /tmp/api-server.log 2>&1 &
          echo $! > /tmp/api-server.pid
          for i in $(seq 1 90); do
            if curl -sf http://localhost:4000/health > /dev/null; then
              echo "API server is healthy after ${i} attempts"
              exit 0
            fi
            sleep 1
          done
          echo "API server failed to start within 90 seconds"
          cat /tmp/api-server.log
          exit 1
        env:
          PORT: '4000'
          DATABASE_URL: postgresql://test:test@localhost:${{ job.services.postgres.ports['5432'] }}/force_test
          DIRECT_URL: postgresql://test:test@localhost:${{ job.services.postgres.ports['5432'] }}/force_test
          REDIS_URL: redis://localhost:${{ job.services.redis.ports['6379'] }}
          JWT_SECRET: test-jwt-secret-for-ci-only-32chars
          ENCRYPTION_KEY: test-encryption-key-for-ci-32chars
          NODE_ENV: test
          INNGEST_DRY_RUN: 'true'

      - name: Run integration tests
        # Also run the colocated regression tests under apps/**/__tests__ — they
        # were never executed by CI before (the unit job globs only tests/unit),
        # so the regression tests for the MyFatoorah empty-email P0 + the Sentry
        # 4xx-gate were dead weight. They run HERE (not the unit job) because the
        # shared test setup connects to Postgres + Redis, which only this job has.
        #
        # --exclude rls-force-app.test.ts: this job's DATABASE_URL authenticates
        # as the `test` superuser (BYPASSRLS), so every cross-tenant assertion in
        # that file is a guaranteed false failure here — the file is designed to
        # run ONLY under the dedicated `test-rls-force-app` job below, whose
        # DATABASE_URL is a real `force_app` login and actually enforces RLS.
        # Introduced in #501 without this exclusion, which is why this job was
        # red on main from 2026-07-02 onward despite RLS force_app coverage
        # passing in its own job the whole time.
        run: npx vitest run tests/integration apps/api/src --exclude tests/integration/rls-force-app.test.ts --reporter=verbose
        env:
          # Integration tests run against the ephemeral postgres SERVICE CONTAINER
          # (localhost below), never a Neon branch. The old TEST_DATABASE_URL path
          # (pointed at the ep-spring-dew preview branch) is retired with staging —
          # the secret is no longer mapped here, so setup-e2e.ts falls through to
          # this container DATABASE_URL. Standard: CI never forks a Neon branch.
          DATABASE_URL: postgresql://test:test@localhost:${{ job.services.postgres.ports['5432'] }}/force_test
          DIRECT_URL: postgresql://test:test@localhost:${{ job.services.postgres.ports['5432'] }}/force_test
          REDIS_URL: redis://localhost:${{ job.services.redis.ports['6379'] }}
          JWT_SECRET: test-jwt-secret-for-ci-only-32chars
          ENCRYPTION_KEY: test-encryption-key-for-ci-32chars
          NODE_ENV: test
          # Suppress inngest.send() network calls — dev server is not running in CI.
          # The client.ts no-op path activates when this is 'true' OR NODE_ENV=test.
          INNGEST_DRY_RUN: 'true'
          # Match the value passed to the seed step above so the login test
          # can authenticate with the seeded super admin.
          ADMIN_PASSWORD: test-admin-password-ci
          ADMIN_EMAIL: admin@forcemedia.com

      - name: Stop API server
        if: always()
        run: |
          if [ -f /tmp/api-server.pid ]; then
            kill "$(cat /tmp/api-server.pid)" 2>/dev/null || true
          fi
          if [ -f /tmp/api-server.log ]; then
            echo '--- api server log tail ---'
            tail -100 /tmp/api-server.log
          fi

  # RLS cutover Phase 1c — THE GATE (docs/plans/2026-07-02-rls-cutover.md).
  # Every other job above connects to Postgres as the `test` superuser, which
  # BYPASSES row-level security entirely (like prod's current `neondb_owner`
  # BYPASSRLS role) — so it never actually exercises the `force_app` RLS
  # policies. This job's DATABASE_URL/DIRECT_URL authenticate as the REAL
  # `force_app` login role instead, the closest CI gets to production's
  # post-cutover connection. If a migration predicate is wrong or any table
  # is still deny-all for force_app, THIS job fails — not prod.
  test-rls-force-app:
    name: RLS force_app Cutover Proof
    runs-on: ${{ (inputs.force_cloud || vars.USE_SELF_HOSTED != 'true') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","wsl2"]') }}
    timeout-minutes: 25
    needs: [build]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: force_test
        ports:
          # Dynamic host port: Docker assigns a random available port so
          # parallel jobs on the same self-hosted runner never collide on 5432.
          - 5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # No 'cache: npm' (removed 2026-07-05): the GH Actions cache restore
          # was intermittently stalling for minutes on our self-hosted runners
          # and eating job timeouts (cancelled Lint/Security Audit). See the
          # full explanation on the Lint job above (~line 93).

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Build database package
        run: npm run build -w packages/database

      - name: Wait for PostgreSQL to be ready
        run: |
          for i in {1..30}; do
            if npx prisma db execute --url "postgresql://test:test@localhost:${{ job.services.postgres.ports['5432'] }}/force_test" --stdin <<< 'SELECT 1' 2>/dev/null; then
              echo "PostgreSQL is ready"
              break
            fi
            echo "Waiting for PostgreSQL... (attempt $i/30)"
            sleep 2
          done

      - name: Run database migrations (as the ephemeral Postgres superuser)
        # Migrations need DDL + role-creation privileges (CREATE ROLE, GRANT,
        # ALTER TABLE ... ENABLE/FORCE ROW LEVEL SECURITY) so they run as the
        # container superuser `test`. This idempotently creates the
        # `force_app` role + its DML grants (20260404000000_add_rls_policies)
        # and every RLS policy this PR + prior migrations add.
        run: npx prisma migrate deploy --schema=packages/database/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://test:test@localhost:${{ job.services.postgres.ports['5432'] }}/force_test
          DIRECT_URL: postgresql://test:test@localhost:${{ job.services.postgres.ports['5432'] }}/force_test

      - name: Grant force_app a CI-only login password + TRUNCATE
        # `force_app` is created LOGIN-but-no-password by the migration — prod
        # never needs a CI test password (Phase 3 sets the real prod
        # credential out of band, outside this repo). This step is the ONLY
        # place a force_app password ever exists, and it only lives inside
        # this disposable, per-job Postgres container.
        #
        # TRUNCATE is granted here — NOT in the migration; prod's force_app
        # has no TRUNCATE and doesn't need it — purely so the shared
        # tests/setup-e2e.ts global fixture reset (`TRUNCATE ... RESTART
        # IDENTITY CASCADE`, which runs for every file under tests/integration
        # regardless of which one vitest actually executes) doesn't 42501 now
        # that this job's DATABASE_URL is force_app end-to-end.
        run: |
          cat <<'SQL' | npx prisma db execute --url "postgresql://test:test@localhost:${{ job.services.postgres.ports['5432'] }}/force_test" --stdin
          ALTER ROLE force_app WITH PASSWORD 'ci-only-force-app-pw' LOGIN;
          GRANT TRUNCATE ON ALL TABLES IN SCHEMA public TO force_app;
          SQL

      - name: Run force_app cross-tenant RLS proof
        run: npx vitest run tests/integration/rls-force-app.test.ts --reporter=verbose
        env:
          # The whole point of this job: every prisma.* call in
          # rls-force-app.test.ts authenticates as force_app, not a superuser.
          DATABASE_URL: postgresql://force_app:ci-only-force-app-pw@localhost:${{ job.services.postgres.ports['5432'] }}/force_test
          DIRECT_URL: postgresql://force_app:ci-only-force-app-pw@localhost:${{ job.services.postgres.ports['5432'] }}/force_test
          NODE_ENV: test

  test-e2e:
    name: E2E Tests
    runs-on: ${{ (inputs.force_cloud || vars.USE_SELF_HOSTED != 'true') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","wsl2"]') }}
    timeout-minutes: 35
    needs: [build]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: force_test
        ports:
          # Dynamic host port: Docker assigns a random available port so
          # parallel jobs on the same self-hosted runner never collide on 5432.
          - 5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s
      redis:
        image: redis:7-alpine
        ports:
          # Dynamic host port: same reasoning as postgres above.
          - 6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # No 'cache: npm' (removed 2026-07-05): the GH Actions cache restore
          # was intermittently stalling for minutes on our self-hosted runners
          # and eating job timeouts (cancelled Lint/Security Audit). See the
          # full explanation on the Lint job above (~line 93).

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Build database package
        run: npm run build -w packages/database

      - name: Build shared package
        run: npm run build -w packages/shared

      - name: Run database migrations
        run: npx prisma migrate deploy --schema=packages/database/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://test:test@localhost:${{ job.services.postgres.ports['5432'] }}/force_test
          DIRECT_URL: postgresql://test:test@localhost:${{ job.services.postgres.ports['5432'] }}/force_test

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          DATABASE_URL: postgresql://test:test@localhost:${{ job.services.postgres.ports['5432'] }}/force_test
          DIRECT_URL: postgresql://test:test@localhost:${{ job.services.postgres.ports['5432'] }}/force_test
          REDIS_URL: redis://localhost:${{ job.services.redis.ports['6379'] }}
          JWT_SECRET: test-jwt-secret-for-ci-only-32chars
          ENCRYPTION_KEY: test-encryption-key-for-ci-32chars
          NODE_ENV: test
          # Suppress inngest.send() network calls — dev server is not running in CI.
          INNGEST_DRY_RUN: 'true'
          WEB_URL: http://localhost:3000
          ADMIN_URL: http://localhost:3001

      - name: Upload test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: e2e-test-results
          path: test-results/
          retention-days: 7

  security:
    name: Security Audit
    runs-on: ${{ (inputs.force_cloud || vars.USE_SELF_HOSTED != 'true') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","wsl2"]') }}
    # 7 (was 5), bumped 2026-07-05 alongside removing the flaky npm-cache
    # restore + pinning trufflehog off '@main' — small safety margin so a
    # cold npm ci + double audit + secret scan on a busy self-hosted runner
    # still fits comfortably now that the two known hangs are gone.
    timeout-minutes: 10 # 3 bounded audit attempts (~3.5 min worst case) + install headroom
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # No 'cache: npm' (removed 2026-07-05): the GH Actions cache restore
          # was intermittently stalling for minutes on our self-hosted runners
          # and eating job timeouts (cancelled Lint/Security Audit). See the
          # full explanation on the Lint job above (~line 93).

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        # Zero-vulns policy for PRODUCTION deps (gated at low — any vuln fails).
        # Dev-only deps: @lhci/cli@0.15.1 (latest) ships transitive
        # tmp@0.1.0 + uuid@8.3.2 + inquirer + qs whose CVEs are now tracked
        # in the advisory DB but cannot be resolved because npm nested overrides
        # do not propagate into workspace-hoisted dev dep trees (verified
        # 2026-05-25). All known HIGH/CRIT advisories are bounded to Lighthouse
        # CI tooling and never reach the production bundle. Both checks omit
        # dev deps — the first check (low) already covers all production deps at
        # every severity, making the second check dev-dep-free for symmetry.
        # Re-evaluate when @lhci/cli ships a refresh.
        run: |
          set -e
          # Zero-tolerance for production deps, with a NARROW documented
          # allowlist for advisories that have no upstream fix AND are
          # unreachable by npm overrides (workspace-hoisted). The allowlist and
          # its justification live in .github/scripts/audit-gate.mjs — it fails
          # on anything not explicitly waived, and the list must only shrink.
          node .github/scripts/audit-gate.mjs

      - name: Ensure jq (trufflehog needs it; self-hosted runner may lack it + can't sudo)
        run: |
          if command -v jq >/dev/null 2>&1; then
            echo "jq present: $(jq --version)"
          else
            echo "jq missing — installing a static binary to a runner-owned PATH dir (no sudo)"
            mkdir -p "$HOME/.local/bin"
            JQ_SHA=5942c9b0934e510ee61eb3e30273f1b3fe2590df93933a93d7c58b81d19c8ff5
            curl -fsSL -o "$HOME/.local/bin/jq" https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-linux-amd64
            echo "$JQ_SHA  $HOME/.local/bin/jq" | sha256sum -c - || { echo "::error::jq checksum mismatch — refusing to execute"; rm -f "$HOME/.local/bin/jq"; exit 1; }
            chmod +x "$HOME/.local/bin/jq"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            "$HOME/.local/bin/jq" --version
          fi

      - name: Check for secrets
        # Pinned to a release tag (not the floating '@main' branch ref) — fixed
        # 2026-07-05. '@main' can't be cached by the runner's action-download
        # cache (its resolved SHA changes on every trufflehog commit), so every
        # job re-downloaded the action tarball from codeload.github.com; on our
        # self-hosted runners that download was intermittently hitting the
        # actions/runner's 100s HttpClient timeout, retrying twice with backoff,
        # and burning this job's whole 5-minute timeout before npm audit or the
        # scan ever ran (surfaced as a cancelled/red "Security Audit" check on
        # ~40% of recent runs — not a real vulnerability or secret finding).
        # A pinned tag resolves to a stable SHA the runner caches after the
        # first successful download, and is also better supply-chain hygiene
        # than trusting an unpinned third-party branch. Bump deliberately.
        uses: trufflesecurity/trufflehog@00155c9dc586f34d189adc83d3ac2698c2ec551f # v3.95.8
        with:
          path: ./
          extra_args: --only-verified

      # trufflehog's action scans inside a Docker container running AS ROOT and
      # leaves `trufflehog-<pid>-<rand>/` (mode 700, root:root) in the workspace
      # when the scan is interrupted — an OOM kill, a cancelled run, a guest
      # restart. The runner user cannot remove it: deleting that tree means
      # recursing INTO a directory it is not permitted to read, and this runner
      # has no sudo (see the jq step above).
      #
      # The consequence is far worse than a stray directory. The NEXT job to
      # land on that runner dies in `actions/checkout` — which clears the
      # workspace before anything else — with
      #   EACCES: permission denied, scandir '.../trufflehog-20-...'
      # so it fails before a single real step runs, and it is STICKY: every
      # later job on that runner fails identically until someone with root
      # deletes it. On 2026-09-23 one leftover took out six runs at once and
      # survived a full re-run of all of them; the failures looked like six
      # unrelated red checks, not one directory.
      #
      # Clean it the way it was created — a root container bind-mounting the
      # workspace — since sudo is unavailable. `if: always()` because the
      # interrupted-scan case is exactly the one that strands the directory.
      - name: Remove root-owned trufflehog scratch (survives an interrupted scan)
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          leftovers=(trufflehog-*)
          if [ ${#leftovers[@]} -eq 0 ]; then
            echo "no trufflehog scratch left behind"
            exit 0
          fi
          echo "removing root-owned scratch: ${leftovers[*]}"
          docker run --rm -v "$PWD":/workspace -w /workspace \
            alpine:3.20 sh -c 'rm -rf trufflehog-*'
          remaining=(trufflehog-*)
          if [ ${#remaining[@]} -ne 0 ]; then
            echo "::error::trufflehog scratch survived cleanup (${remaining[*]}) — the next checkout on this runner will fail with EACCES"
            exit 1
          fi
          echo "workspace is clean"

  notify-failure:
    # Umbra-only CI policy (2026-07-15): GitHub-hosted runners are billing-
    # blocked permanently, so the old fail-open-on-cloud design can never fire.
    # This job now rides the self-hosted runner; the runner-is-dead case is
    # alerted by the local OS medic (:7717 runner-offline watch), not by CI.
    name: Notify on failure (main only)
    runs-on: ${{ vars.USE_SELF_HOSTED != 'true' && 'ubuntu-latest' || fromJSON('["self-hosted","linux","wsl2"]') }}
    timeout-minutes: 2
    needs:
      [lint, typecheck, security, build, test-unit, test-integration, test-rls-force-app, test-e2e]
    if: always() && failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Compose + send Telegram alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          LINT_RES: ${{ needs.lint.result }}
          TYPECHECK_RES: ${{ needs.typecheck.result }}
          SECURITY_RES: ${{ needs.security.result }}
          BUILD_RES: ${{ needs.build.result }}
          UNIT_RES: ${{ needs.test-unit.result }}
          INT_RES: ${{ needs.test-integration.result }}
          RLS_FORCE_APP_RES: ${{ needs.test-rls-force-app.result }}
          E2E_RES: ${{ needs.test-e2e.result }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_ALERT_CHAT_ID" ]; then
            echo "telegram secrets not configured — skipping alert"
            exit 0
          fi

          # Collect which jobs failed (vs which skipped vs passed) so Ahmad
          # can see what to look at without clicking through.
          FAILED_JOBS=""
          for entry in "lint:$LINT_RES" "typecheck:$TYPECHECK_RES" "security:$SECURITY_RES" "build:$BUILD_RES" "unit:$UNIT_RES" "integration:$INT_RES" "rls-force-app:$RLS_FORCE_APP_RES" "e2e:$E2E_RES"; do
            name="${entry%:*}"
            res="${entry#*:}"
            if [ "$res" = "failure" ]; then
              FAILED_JOBS="${FAILED_JOBS}${name}, "
            fi
          done
          FAILED_JOBS="${FAILED_JOBS%, }"
          [ -z "$FAILED_JOBS" ] && FAILED_JOBS="(none reported — check run)"

          # First line of the commit message only (Telegram truncates long bodies)
          TITLE=$(echo "$COMMIT_MSG" | head -n 1 | cut -c1-100)
          SHORT_SHA="${SHA:0:8}"

          # Markdown V1 escaping is minimal — wrap code segments in backticks
          # to neutralize most special chars, but use a plain header so
          # Telegram preserves layout when an underscore sneaks in.
          MSG=$(printf '🔴 *CI FAIL* — %s\n*branch:* `%s`\n*sha:* `%s`\n*commit:* %s\n*author:* %s\n*failed:* %s\n[view run](https://github.com/%s/actions/runs/%s)' \
            "$REPO" "$REF" "$SHORT_SHA" "$TITLE" "$COMMIT_AUTHOR" "$FAILED_JOBS" "$REPO" "$RUN_ID")

          curl -sS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_ALERT_CHAT_ID}" \
            -d parse_mode=Markdown \
            -d disable_web_page_preview=true \
            --data-urlencode text="$MSG" \
            >/dev/null
          echo "alert sent"
