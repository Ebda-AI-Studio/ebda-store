          # was intermittently stalling for minutes on our self-hosted runners
          # and eating job timeouts (cancelled Lint/Security Audit). See the
          # full explanation on the Lint job above (~line 93).

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Build database package
        run: npm run build -w packages/database

      - name: Build shared package
        # the proof now imports WalletService (erasure across stores), which
        # pulls @force/shared; without its dist the test cannot even load
        run: npm run build -w packages/shared

      - name: Wait for PostgreSQL to be ready
        run: |
          for i in {1..30}; do
            if npx prisma db execute --url "postgresql://test:test@localhost:${{ job.services.postgres.ports['5432'] }}/force_test" --stdin <<< 'SELECT 1' 2>/dev/null; then
              echo "PostgreSQL is ready"
              break
            fi
            echo "Waiting for PostgreSQL... (attempt $i/30)"
            sleep 2
          done

      - name: Run database migrations (as the ephemeral Postgres superuser)
        # Migrations need DDL + role-creation privileges (CREATE ROLE, GRANT,
        # ALTER TABLE ... ENABLE/FORCE ROW LEVEL SECURITY) so they run as the
        # container superuser `test`. This idempotently creates the
        # `force_app` role + its DML grants (20260404000000_add_rls_policies)
        # and every RLS policy this PR + prior migrations add.
        run: npx prisma migrate deploy --schema=packages/database/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://test:test@localhost:${{ job.services.postgres.ports['5432'] }}/force_test
          DIRECT_URL: postgresql://test:test@localhost:${{ job.services.postgres.ports['5432'] }}/force_test

      - name: Grant force_app a CI-only login password + TRUNCATE
        # `force_app` is created LOGIN-but-no-password by the migration — prod
        # never needs a CI test password (Phase 3 sets the real prod
        # credential out of band, outside this repo). This step is the ONLY
        # place a force_app password ever exists, and it only lives inside
        # this disposable, per-job Postgres container.
        #
        # TRUNCATE is granted here — NOT in the migration; prod's force_app
        # has no TRUNCATE and doesn't need it — purely so the shared
        # tests/setup-e2e.ts global fixture reset (`TRUNCATE ... RESTART
        # IDENTITY CASCADE`, which runs for every file under tests/integration
        # regardless of which one vitest actually executes) doesn't 42501 now
        # that this job's DATABASE_URL is force_app end-to-end.
        run: |
          cat <<'SQL' | npx prisma db execute --url "postgresql://test:test@localhost:${{ job.services.postgres.ports['5432'] }}/force_test" --stdin
          ALTER ROLE force_app WITH PASSWORD 'ci-only-force-app-pw' LOGIN;
          GRANT TRUNCATE ON ALL TABLES IN SCHEMA public TO force_app;
          SQL

      - name: Run force_app cross-tenant RLS proof
        # --retry=0, DELIBERATELY (issue 2101) — the one DB-backed tier that
        # does NOT opt into the integration/e2e `--retry=1`. This is a security
        # assertion against a local Postgres service container, not a
        # network-flaky HTTP suite: an RLS proof that passes only on its second
        # attempt is a real signal (an order-dependent GUC leak, a policy that
        # holds only on a warm connection), and a retry would turn it green.
        # Explicit so it cannot drift silently; pinned by
        # tests/unit/vitest-retry-by-tier.test.ts.
        run: npx vitest run tests/integration/rls-force-app.test.ts --reporter=verbose --retry=0
        env:
          # The whole point of this job: every prisma.* call in
          # rls-force-app.test.ts authenticates as force_app, not a superuser.
          DATABASE_URL: postgresql://force_app:ci-only-force-app-pw@localhost:${{ job.services.postgres.ports['5432'] }}/force_test
          DIRECT_URL: postgresql://force_app:ci-only-force-app-pw@localhost:${{ job.services.postgres.ports['5432'] }}/force_test
          NODE_ENV: test

  # RLS payload parity — the gate that would have caught the 2026-09-25
  # cutover rollback. The two jobs above prove force_app can run the code
  # paths without ERRORING; neither compares what comes BACK. A STRICT RLS
  # policy read with no tenant context does not error, it returns fewer rows
  # (store_faqs/store_howtos came back `[]` on every public store payload).
