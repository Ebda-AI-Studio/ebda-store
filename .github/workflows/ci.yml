          if [ ${#leftovers[@]} -eq 0 ]; then
            exit 0
          fi
          echo "::warning::found stranded root-owned trufflehog scratch from a prior job (${leftovers[*]}) — removing before checkout"
          docker run --rm -v "$PWD":/workspace -w /workspace \
            alpine:3.20 sh -c 'rm -rf trufflehog-*' || {
            echo "::warning::trufflehog scratch cleanup failed — checkout may still hit EACCES; needs a root delete on this runner" >&2
            exit 0
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # No 'cache: npm' (removed 2026-07-05): the GH Actions cache restore
          # was intermittently stalling for minutes on our self-hosted runners
          # and eating job timeouts (cancelled Lint/Security Audit). See the
          # full explanation on the Lint job above (~line 93).

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Build database package
        run: npm run build -w packages/database

      - name: Build shared package
        run: npm run build -w packages/shared

      - name: Run unit tests with coverage
        # Globs BEYOND tests/unit are load-bearing, not tidiness. vitest.config.ts
        # has a broad `include`, so a colocated `__tests__` file passes locally and
        # is silently never executed by CI unless its directory is named here.
        #
        # The integration job already added `apps/api/src` for exactly this reason
        # (see its comment). That left the OTHER colocated suites still orphaned:
        # packages/shared, packages/database, apps/web and apps/admin — 18 files /
        # 200 tests that had never run in CI, including the JSON-LD script-tag XSS
        # escaping regression, the money-transaction wrapper, plan baselines and
        # store-layout resolution. All are pure (no DB, no network), so they belong
        # in this job rather than integration.
        #
        # 2026-09-02: `apps/web/src/lib` narrowed the glob past the app's own test
        # tree and orphaned it again — 4 colocated web tests (checkout delivery
        # windows, company-host routing, llms.txt, ProductDetailBody) shipped
        # outside `src/lib` and silently never ran in CI. Widened to the whole
        # `apps/web` tree (still pure/no-DB — verified no prisma/DATABASE_URL
        # import in any apps/web test file); the `orphan-tests` job below now
        # fails the build on any future gap instead of relying on this comment.
        #
        # 2026-09-07: `apps/orders` added — the fulfilment app's colocated
        # `ItemsCard.test.ts` (bundle-box grouping) was the orphan-tests job's
        # first real catch: vitest collected it locally, no CI job glob ran it.
        # Pure grouping logic, no DOM/DB (the root config's `node` environment
        # is all it needs), so it belongs in this job like the other colocated
        # suites. Keep the `orphan-tests` covered-tests list below in sync.
        #
        # Adding a colocated test outside these paths = a test that does not run.
        # Prefer tests/unit; if you must colocate, add the directory here.
        #
        # --retry=0 (#1248): explicit, not just inherited from vitest.config.ts's
        # default, so a future config change can't silently re-mask
        # order-dependent state pollution on this required merge gate.
        run: npx vitest run tests/unit packages/shared/src packages/database/src apps/web apps/admin/src apps/orders --coverage --reporter=verbose --maxWorkers=2 --retry=0
        env:
          NODE_OPTIONS: --max-old-space-size=2048

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-test-coverage
          path: coverage/
          retention-days: 7

  orphan-tests:
    name: Orphan test coverage
    # P1-5 (2026-09-02): vitest.config.ts's root `include` is a broad glob, so
    # ANY colocated *.test.ts/*.spec.ts anywhere in the repo passes locally —
    # but only runs in CI if its directory is named in one of the job globs
    # below. This already recurred once: the Unit Tests job's own comment
    # documents a 2026-07-05 fix for 18 such orphans, and by 2026-09-02 four
    # MORE had shipped outside it (apps/web/src/app + apps/web root) and never
    # ran in CI. That fix only froze a list; it didn't stop the list from going
    # stale again. This job is the thing that stops it: it diffs the full test
    # universe vitest would collect (root config, same as `tests/smoke`'s own
    # exclusion) against the UNION of every directory/file the unit,
    # integration, RLS-proof and e2e jobs pass to `vitest run`, and fails on
    # any file present in the first set but not the second. A gate that cannot
    # fail must not report success — this one can, and does today if a colocated
    # test lands outside every job's glob again.
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ (inputs.force_cloud || vars.USE_SELF_HOSTED != 'true') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","wsl2"]') }}
    # 20, not 10 — npm ci alone measured ~268s cold on the self-hosted runner
    # (see the Lint job's 2026-08-11 budget post-mortem above), and this job
    # additionally builds 2 packages and runs 2 full vitest collections. A
    # 10-minute budget would cancel cold-cache runs with a timeout error —
    # the same false-signal class this job exists to eliminate (#1138).
    timeout-minutes: 20
    needs: [build, changes]
    steps:
      # Pre-checkout guard (#1883): survives an OOM-kill/guest-restart on a
      # prior job that stranded a root-owned trufflehog-*/ dir `if: always()`
      # cannot cover, because nothing after the kill runs, checkout included.
      - name: Remove root-owned trufflehog scratch (pre-checkout guard, issue 1883)
        # Inline, not a local composite action: a `uses: ./.github/actions/...`
        # step cannot resolve before actions/checkout has put the repo on disk.
        shell: bash
        run: |
          shopt -s nullglob
          # Sparse-checkout leak (2026-09-30): a sparse job on this persistent
          # self-hosted workspace left core.sparseCheckout in .git/config, and
          # the next plain actions/checkout reused it, so orders' deploy got a
          # scripts-only tree ("npm ci: no package-lock.json"). Undo any
          # inherited sparse config BEFORE checkout, in every job.
          if [ -d .git ] && [ "$(git config --get core.sparseCheckout 2>/dev/null)" = "true" ]; then
            echo "::warning::workspace .git carries a sparse-checkout config from a prior job — disabling it before checkout"
            git sparse-checkout disable 2>/dev/null || true
            git config --unset-all core.sparseCheckout 2>/dev/null || true
            git config --unset-all core.sparseCheckoutCone 2>/dev/null || true
            rm -f .git/info/sparse-checkout
          fi
          leftovers=(trufflehog-*)
          if [ ${#leftovers[@]} -eq 0 ]; then
            exit 0
          fi
          echo "::warning::found stranded root-owned trufflehog scratch from a prior job (${leftovers[*]}) — removing before checkout"
          docker run --rm -v "$PWD":/workspace -w /workspace \
            alpine:3.20 sh -c 'rm -rf trufflehog-*' || {
            echo "::warning::trufflehog scratch cleanup failed — checkout may still hit EACCES; needs a root delete on this runner" >&2
            exit 0
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Build database package
        run: npm run build -w packages/database

      - name: Build shared package
        run: npm run build -w packages/shared

      - name: Diff vitest's full test universe against CI job coverage
        # KEEP THE PATH LIST BELOW IN SYNC with what test-unit / test-integration /
        # test-rls-force-app / test-e2e actually pass to `vitest run` (this is
        # intentionally a hand-copied list, not derived from the other jobs, so a
        # change to one without the other shows up as a visible diff in review).
        # --json=<file> (NOT bare --json, which vitest treats as an optional
        # positional VALUE and greedily swallows the next arg as the output path)
        # writes ONLY the JSON to that file, keeping it clean of the setup-file
        # console warnings vitest's collection phase prints to stdout.
        run: |
          set -euo pipefail

          npx vitest list --json=/tmp/all-tests.json

          npx vitest list \
            tests/unit packages/shared/src packages/database/src apps/web apps/admin/src apps/orders \
            tests/integration apps/api/src \
            tests/e2e \
            --json=/tmp/covered-tests.json

          node -e "
            const fs = require('fs');
            const all = new Set(JSON.parse(fs.readFileSync('/tmp/all-tests.json', 'utf8')).map(t => t.file));
            const covered = new Set(JSON.parse(fs.readFileSync('/tmp/covered-tests.json', 'utf8')).map(t => t.file));

            // The FIRST collection (the whole-repo \`all\` set) can itself come
            // back (near-)empty — the same broken-collector failure mode as the
            // second one below, just on the other list. Without this floor, an
            // empty/near-empty \`all\` makes the covered-vs-all comparison below
            // false (0 < 0, or a tiny number under a tiny number) and every
            // check below falls through to \"No orphan test files\" — a green
            // pass having discovered almost nothing, on a repo with hundreds of
            // test files. The repo has ~395 vitest-discovered files today; 50
            // is a floor far below any plausible legitimate shrinkage and far
            // above a broken collector's near-zero.
            if (all.size < 50) {
              console.error('::error::the FIRST vitest list discovered only ' + all.size +
                ' file(s) repo-wide. That collector failed, so this is a BROKEN RUN, not an' +
                ' empty repo. Re-run; if it persists, check the runner node_modules and disk state.');
              process.exit(1);
            }

            // A collection that came back (near-)empty is a BROKEN RUN, not a
            // repo full of orphans. Without this the job reports every file in
            // the tree as an orphan — 268 of them on one occasion, including
            // tests/unit files that are plainly inside the covered globs — and
            // that reads as a code regression rather than as \"the second
            // vitest list collected nothing\". Observed on one runner of the
            // self-hosted pair while the same commit collected 269/269 locally
            // and passed on the other runner.
            //
            // The covered set is a FILTERED subset of the same universe, so it
            // should be within a whisker of `all`. Anything below half means
            // the collection failed, and saying so is far more useful than
            // listing the whole repo.
            if (covered.size * 2 < all.size) {
              console.error('::error::covered-test collection returned ' + covered.size +
                ' file(s) against ' + all.size + ' discovered. The second vitest list failed to' +
                ' collect, so this is a BROKEN RUN, not an orphan-test regression.' +
                ' Re-run; if it persists, check the runner node_modules and disk state.');
              process.exit(1);
            }
            const orphans = [...all].filter(f => !covered.has(f)).sort();
            if (orphans.length > 0) {
              console.error('::error::' + orphans.length + ' orphan test file(s) — vitest collects these but no CI job glob covers them, so they never run in CI:');
              for (const f of orphans) console.error('  ' + f);
              console.error('');
              console.error('Fix: add the containing directory to the relevant job glob in ci.yml (test-unit/test-integration/test-e2e), AND to this job\'s covered-tests path list above.');
              process.exit(1);
            }
            console.log('No orphan test files (' + all.size + ' vitest-discovered files, all covered by a CI job glob).');
          "

  test-integration:
    name: Integration Tests
    runs-on: ${{ (inputs.force_cloud || vars.USE_SELF_HOSTED != 'true') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","wsl2"]') }}
    timeout-minutes: 35
    needs: [build]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: force_test
        ports:
          # Dynamic host port: Docker assigns a random available port so
          # parallel jobs on the same self-hosted runner never collide on 5432.
          - 5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s
      redis:
        image: redis:7-alpine
        ports:
          # Dynamic host port: same reasoning as postgres above.
          - 6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      # Pre-checkout guard (#1883): survives an OOM-kill/guest-restart on a
      # prior job that stranded a root-owned trufflehog-*/ dir `if: always()`
      # cannot cover, because nothing after the kill runs, checkout included.
      - name: Remove root-owned trufflehog scratch (pre-checkout guard, issue 1883)
        # Inline, not a local composite action: a `uses: ./.github/actions/...`
        # step cannot resolve before actions/checkout has put the repo on disk.
        shell: bash
        run: |
          shopt -s nullglob
          # Sparse-checkout leak (2026-09-30): a sparse job on this persistent
          # self-hosted workspace left core.sparseCheckout in .git/config, and
          # the next plain actions/checkout reused it, so orders' deploy got a
          # scripts-only tree ("npm ci: no package-lock.json"). Undo any
          # inherited sparse config BEFORE checkout, in every job.
          if [ -d .git ] && [ "$(git config --get core.sparseCheckout 2>/dev/null)" = "true" ]; then
            echo "::warning::workspace .git carries a sparse-checkout config from a prior job — disabling it before checkout"
            git sparse-checkout disable 2>/dev/null || true
            git config --unset-all core.sparseCheckout 2>/dev/null || true
            git config --unset-all core.sparseCheckoutCone 2>/dev/null || true
            rm -f .git/info/sparse-checkout
          fi
          leftovers=(trufflehog-*)
          if [ ${#leftovers[@]} -eq 0 ]; then
            exit 0
          fi
          echo "::warning::found stranded root-owned trufflehog scratch from a prior job (${leftovers[*]}) — removing before checkout"
          docker run --rm -v "$PWD":/workspace -w /workspace \
            alpine:3.20 sh -c 'rm -rf trufflehog-*' || {
            echo "::warning::trufflehog scratch cleanup failed — checkout may still hit EACCES; needs a root delete on this runner" >&2
            exit 0
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # No 'cache: npm' (removed 2026-07-05): the GH Actions cache restore
          # was intermittently stalling for minutes on our self-hosted runners
          # and eating job timeouts (cancelled Lint/Security Audit). See the
          # full explanation on the Lint job above (~line 93).

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Build database package
        run: npm run build -w packages/database

      - name: Build shared package
        run: npm run build -w packages/shared

      - name: Run database migrations
        run: npx prisma migrate deploy --schema=packages/database/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://test:test@localhost:${{ job.services.postgres.ports['5432'] }}/force_test
          DIRECT_URL: postgresql://test:test@localhost:${{ job.services.postgres.ports['5432'] }}/force_test

      - name: Seed test data
        run: npm run db:seed --if-present
        env:
          DATABASE_URL: postgresql://test:test@localhost:${{ job.services.postgres.ports['5432'] }}/force_test
          DIRECT_URL: postgresql://test:test@localhost:${{ job.services.postgres.ports['5432'] }}/force_test
          ADMIN_PASSWORD: test-admin-password-ci
          ADMIN_EMAIL: admin@forcemedia.com

      - name: Build API
        run: npm run build -w apps/api

      - name: Give force_app a CI-only login for the API server
        # RLS phase 3 moves PRODUCTION's API onto the non-bypass `force_app`
        # role. Until now the whole integration suite drove an API logged in as
        # the `test` superuser (BYPASSRLS), so no flow was ever proven under
        # enforced RLS except the cross-tenant proof file. The API server below
        # now runs as force_app, exactly as production will — for the
        # SYNCHRONOUS HTTP request/response paths only (#1974). The sibling
        # "Start API server" step below sets INNGEST_DRY_RUN: 'true', which
        # no-ops every Inngest function, so async/cron writers under
        # force_app (order-auto-cancel-unpaid, payment-abandonment-sweep,
        # stock-reorder-scan, analytics-daily-rollup, audit-log-archive, and
        # the rest) remain entirely unexercised here — see
        # docs/plans/2026-07-02-rls-cutover.md's "Before a second attempt"
        # section for that gap and how it is currently covered (or not). The
        # test harness keeps the superuser URL for fixtures and cleanup.
        # This password only exists inside this disposable per-job container.
        run: |
          cat <<'SQL' | npx prisma db execute --url "postgresql://test:test@localhost:${{ job.services.postgres.ports['5432'] }}/force_test" --stdin
          ALTER ROLE force_app WITH PASSWORD 'ci-only-force-app-pw' LOGIN;
          SQL

      - name: Start API server
        # tests/integration hit a real HTTP server at localhost:4000.
        # Background-launch the built API and poll /health until it is
        # ready; tear it down in a later step regardless of test outcome.
        run: |
          node apps/api/dist/index.js > /tmp/api-server.log 2>&1 &
          echo $! > /tmp/api-server.pid
          for i in $(seq 1 90); do
            if curl -sf http://localhost:4000/health > /dev/null; then
              echo "API server is healthy after ${i} attempts"
              exit 0
            fi
            sleep 1
          done
          echo "API server failed to start within 90 seconds"
          cat /tmp/api-server.log
          exit 1
        env:
          PORT: '4000'
          DATABASE_URL: postgresql://force_app:ci-only-force-app-pw@localhost:${{ job.services.postgres.ports['5432'] }}/force_test
          DIRECT_URL: postgresql://test:test@localhost:${{ job.services.postgres.ports['5432'] }}/force_test
          REDIS_URL: redis://localhost:${{ job.services.redis.ports['6379'] }}
          JWT_SECRET: test-jwt-secret-for-ci-only-32chars
          ENCRYPTION_KEY: test-encryption-key-for-ci-32chars
          NODE_ENV: test
          INNGEST_DRY_RUN: 'true'

      - name: Assert the API connected as force_app, not a bypass role
        # /health is a liveness probe: it answers 200 identically as the `test`
        # superuser (BYPASSRLS) or as force_app, so a relapse of the API's
        # DATABASE_URL to a bypass role would leave every integration test
        # green while proving nothing under enforced RLS (#1940). The API logs
        # the role it actually connected as at boot (apps/api/src/index.ts,
        # BYPASSRLS guard); this step fails the job unless that line says
        # force_app without BYPASSRLS. Fails closed: a missing line (guard
        # query failed, or never ran) is a failure, not a pass.
        run: |
          for i in $(seq 1 30); do
            if grep -q 'DB role check: current_user=' /tmp/api-server.log; then break; fi
            sleep 1
          done
          grep 'DB role check: current_user=' /tmp/api-server.log || { echo "::error::API never logged its DB role"; tail -50 /tmp/api-server.log; exit 1; }
          if ! grep -q 'DB role check: current_user=force_app rolbypassrls=false' /tmp/api-server.log; then
            echo "::error::API is not connected as force_app without BYPASSRLS — integration results would not prove RLS"
            exit 1
          fi

      - name: Run integration tests
        # Also run the colocated regression tests under apps/**/__tests__ — they
        # were never executed by CI before (the unit job globs only tests/unit),
        # so the regression tests for the MyFatoorah empty-email P0 + the Sentry
        # 4xx-gate were dead weight. They run HERE (not the unit job) because the
        # shared test setup connects to Postgres + Redis, which only this job has.
        #
        # --exclude rls-force-app.test.ts: this job's DATABASE_URL authenticates
        # as the `test` superuser (BYPASSRLS), so every cross-tenant assertion in
        # that file is a guaranteed false failure here — the file is designed to
        # run ONLY under the dedicated `test-rls-force-app` job below, whose
        # DATABASE_URL is a real `force_app` login and actually enforces RLS.
        # Introduced in #501 without this exclusion, which is why this job was
        # red on main from 2026-07-02 onward despite RLS force_app coverage
        # passing in its own job the whole time.
        # --retry=1 (#1248): this tier makes real network/DB calls against the
        # service containers above, unlike the unit tier which is retry:0 by
        # default (vitest.config.ts) to stop retry masking state pollution.
        run: npx vitest run tests/integration apps/api/src --exclude tests/integration/rls-force-app.test.ts --reporter=verbose --retry=1
        env:
          # Integration tests run against the ephemeral postgres SERVICE CONTAINER
          # (localhost below), never a Neon branch. The old TEST_DATABASE_URL path
          # (pointed at the ep-spring-dew preview branch) is retired with staging —
          # the secret is no longer mapped here, so setup-e2e.ts falls through to
          # this container DATABASE_URL. Standard: CI never forks a Neon branch.
          DATABASE_URL: postgresql://test:test@localhost:${{ job.services.postgres.ports['5432'] }}/force_test
          DIRECT_URL: postgresql://test:test@localhost:${{ job.services.postgres.ports['5432'] }}/force_test
          REDIS_URL: redis://localhost:${{ job.services.redis.ports['6379'] }}
          JWT_SECRET: test-jwt-secret-for-ci-only-32chars
          ENCRYPTION_KEY: test-encryption-key-for-ci-32chars
          NODE_ENV: test
          # Suppress inngest.send() network calls — dev server is not running in CI.
          # The client.ts no-op path activates when this is 'true' OR NODE_ENV=test.
          INNGEST_DRY_RUN: 'true'
          # Match the value passed to the seed step above so the login test
          # can authenticate with the seeded super admin.
          ADMIN_PASSWORD: test-admin-password-ci
          ADMIN_EMAIL: admin@forcemedia.com

      - name: Stop API server
        if: always()
        run: |
          if [ -f /tmp/api-server.pid ]; then
            kill "$(cat /tmp/api-server.pid)" 2>/dev/null || true
          fi
          if [ -f /tmp/api-server.log ]; then
            echo '--- api server log tail ---'
            tail -100 /tmp/api-server.log
          fi

  # RLS cutover Phase 1c — THE GATE (docs/plans/2026-07-02-rls-cutover.md).
  # Every other job above connects to Postgres as the `test` superuser, which
  # BYPASSES row-level security entirely (like prod's current `neondb_owner`
  # BYPASSRLS role) — so it never actually exercises the `force_app` RLS
  # policies. This job's DATABASE_URL/DIRECT_URL authenticate as the REAL
  # `force_app` login role instead, the closest CI gets to production's
  # post-cutover connection. If a migration predicate is wrong or any table
  # is still deny-all for force_app, THIS job fails — not prod.
  test-rls-force-app:
    name: RLS force_app Cutover Proof
    runs-on: ${{ (inputs.force_cloud || vars.USE_SELF_HOSTED != 'true') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","wsl2"]') }}
    timeout-minutes: 25
    needs: [build]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: force_test
        ports:
          # Dynamic host port: Docker assigns a random available port so
          # parallel jobs on the same self-hosted runner never collide on 5432.
          - 5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s
    steps:
      # Pre-checkout guard (#1883): survives an OOM-kill/guest-restart on a
      # prior job that stranded a root-owned trufflehog-*/ dir `if: always()`
      # cannot cover, because nothing after the kill runs, checkout included.
      - name: Remove root-owned trufflehog scratch (pre-checkout guard, issue 1883)
        # Inline, not a local composite action: a `uses: ./.github/actions/...`
        # step cannot resolve before actions/checkout has put the repo on disk.
