name: CI

# LANES (Ruling CI-FULL-MAIN-1, 2026-11-10, supersedes the LEAN split of SP4 task 9 and, for schedules,
# Ruling CI-HOSTED-1). The Ebda-AI-Studio org is on GitHub Enterprise (50,000 Actions minutes/month), so
# merges stay fast but main always carries a recent FULL run. Budget arithmetic: docs/ebda/ci.md.
#
#   PR lane (pull_request): only lint, typecheck and unit tests for the
#     workspaces the PR changed (scripts/ci-affected.mjs decides), the repo
#     guards, the workerd boot smoke, and a `wrangler deploy --dry-run` when a
#     Worker's own config changed. gitleaks.yml and blast-radius.yml run beside it.
#   FULL lane (every push to main, the nightly cron and manual dispatch): build +
#     full lint/typecheck, full unit with coverage, orphan-test check, integration,
#     the whole workerd suite (apps/api/workers-test incl. route-sweep, and
#     workers-do), e2e, builder e2e, dependency/secret audit. A newer main push
#     cancels a superseded main run (only the newest main commit matters); PR runs
#     and the deploy workflows are never cancelled by it.
#   Mutation (stryker + defence mutations): the Sunday cron, or a manual dispatch
#     with its `mutation` input ticked. Never on a push.
#   Schedules run on hosted runners whether or not EBDA_RUNS_ON is set.
#   A failed FULL lane is loud: notify-failure sends the Telegram alert AND opens or
#     updates ONE GitHub issue labelled `ci-main-red`; the next green full run closes it.
#
# Every `runs-on` reads repo variable EBDA_RUNS_ON (the Umbra org runner when set,
# Ruling CI-UMBRA-1) and falls back to GitHub-hosted `ubuntu-latest` when unset.
# Delete the variable to go back to hosted runners. tests/unit/workflow-hosted-runners-only.test.ts
# allows only that exact form.
#
# setup-node's `cache: npm` restores/saves the GitHub Actions cache over the network.
# On the Umbra runners (one VM, one user) ~/.npm already persists locally, so that
# cache cost 1.5-2.5 min per job restore and a 10 min hanging post-step save. Every
# setup-node therefore uses `cache: ${{ (!contains(github.event.pull_request.labels.*.name, 'ci-umbra') && vars.EBDA_RUNS_ON == '') && 'npm' || '' }}`:
# npm cache on hosted runners only. setup-node v7 skips caching when `cache` is empty
# (src/main.ts `if (cache)`), and package.json has no packageManager field, so its
# auto-cache fallback does not apply.
on:
  push:
    # main-only: worktree -> PR -> CI -> main is the only flow.
    branches: [main]
    # .gitleaksignore / .gitleaks.toml are deliberately NOT listed (adversarial
    # audit, 2026-09-02): a security-gate config change is a code change.
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.vscode/**'
      - '.editorconfig'
  pull_request:
    # No paths-ignore here: with it a docs-only PR skipped the whole workflow,
    # so required checks never reported and branch protection blocked the PR.
    # The `changes` job gates the expensive jobs instead.
    branches: [main]
  schedule:
    # 01:17 UTC, off the :00 mark where scheduled runs queue (Ruling CI-FULL-MAIN-1). Mon-Sat = the nightly full
    # lane; Sunday = the full lane + mutation. Keep the Sunday string in sync with the mutation `if:` below.
    - cron: '17 1 * * 1-6'
    - cron: '17 1 * * 0'
  workflow_dispatch:
    inputs:
      mutation:
        description: 'Also run the mutation tests (stryker + defence mutations; slow)'
        type: boolean
        default: false

# Cancel superseded PR runs (a newer push supersedes the older sha). A main push gets a group PER MERGE SHA and is
# never cancelled (Ruling CI-MAIN-SHA-1): with one shared group + cancel-in-progress, a burst of merges cancelled every
# main full lane in turn (measured 2026-11-11: 4 consecutive main runs `cancelled`, none completed), so main was never
# proven green. A nightly or manual run gets a group of its own. Deploys live in other workflows (cf-*-deploy.yml).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || (github.event_name == 'push' && format('main-{0}', github.sha) || github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # wrangler >= 4.110 needs Node >= 22, and cf-deploy runs wrangler on 22.
  NODE_VERSION: '22'
  # npm on the Umbra runner (2026-10-25: `npm ci` sat 22 min with no output on a loaded guest, then the job was
  # cancelled): use the runner's local ~/.npm first, skip the post-install audit and funding round-trips (each is
  # a registry request that can stall), and bound a stalled fetch instead of waiting out the job.
  NPM_CONFIG_PREFER_OFFLINE: 'true'
  NPM_CONFIG_AUDIT: 'false'
  NPM_CONFIG_FUND: 'false'
  NPM_CONFIG_FETCH_TIMEOUT: '120000'
  NPM_CONFIG_FETCH_RETRIES: '3'

# Least-privilege default: the workflow GITHUB_TOKEN is read-only. No job here
# needs write. A job that ever needs write must override upward itself.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # PR lane
  # ---------------------------------------------------------------------------

  # Which workspaces does this PR touch (plus their dependents)? See
  # scripts/ci-affected.mjs for the rules: a change to packages/shared,
  # packages/database or any root config file means ALL workspaces; docs-only
  # changes mean none.
  changes:
    name: Detect affected workspaces
    if: github.event_name == 'pull_request'
    # ubuntu-latest became 26.04 (2026-11); Playwright 1.60 unsupported — Ruling CI-HOSTED-2
    runs-on: ${{ fromJSON(contains(github.event.pull_request.labels.*.name, 'ci-umbra') && '["self-hosted","umbra-ebda"]' || vars.EBDA_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 5
    outputs:
      code: ${{ steps.affected.outputs.code }}
      lint: ${{ steps.affected.outputs.lint }}
      typecheck: ${{ steps.affected.outputs.typecheck }}
      unit: ${{ steps.affected.outputs.unit }}
      status_tests: ${{ steps.affected.outputs.status_tests }}
      accounts_tests: ${{ steps.affected.outputs.accounts_tests }}
      workers: ${{ steps.affected.outputs.workers }}
      has_workers: ${{ steps.affected.outputs.has_workers }}
      build_apps: ${{ steps.affected.outputs.build_apps }}
      has_build_apps: ${{ steps.affected.outputs.has_build_apps }}
      integration: ${{ steps.affected.outputs.integration }}
      integration_paths: ${{ steps.affected.outputs.integration_paths }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Private TMPDIR per runner
        # Two runners on one VM share /tmp, and concurrent vitest runs collided on Vite's temp cache (ENOENT
        # /tmp/<random>/client/..., hundreds of files failing at startup with 0 assertion failures, #150 / #202).
        # The runner's own .env now sets TMPDIR per runner (umbra runner harden); this makes the job independent
        # of that: point TMPDIR at this runner's private RUNNER_TEMP (cleaned by the runner between jobs).
        run: |
          mkdir -p "$RUNNER_TEMP/tmp"
          echo "TMPDIR=$RUNNER_TEMP/tmp" >> "$GITHUB_ENV"
          echo "runner=$RUNNER_NAME TMPDIR=$RUNNER_TEMP/tmp"
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - id: affected
        name: Compute affected workspaces
        env:
          # GitHub-controlled SHA (not user text); bound via env per workflow-injection hygiene.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ci-affected.mjs --base "$BASE_SHA"

  # Always-on, cheap repo guards. Runs on every PR (docs-only included) and on
  # every main push, so it has no `needs` and no `if`.
  guards:
    name: Repo guards
    # Ruling CI-HOSTED-1: deliberately NO `if` here (the always-on PR check; tests/unit/ci-lean-structure and
    # merge-gate derive the required list from it). Residual: ~1.5 hosted min per scheduled run.
    runs-on: ${{ fromJSON(contains(github.event.pull_request.labels.*.name, 'ci-umbra') && '["self-hosted","umbra-ebda"]' || vars.EBDA_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Prettier-on-changed-files below diffs against the PR base.
          fetch-depth: 0
      - name: Private TMPDIR per runner
        # Two runners on one VM share /tmp, and concurrent vitest runs collided on Vite's temp cache (ENOENT
        # /tmp/<random>/client/..., hundreds of files failing at startup with 0 assertion failures, #150 / #202).
        # The runner's own .env now sets TMPDIR per runner (umbra runner harden); this makes the job independent
        # of that: point TMPDIR at this runner's private RUNNER_TEMP (cleaned by the runner between jobs).
        run: |
          mkdir -p "$RUNNER_TEMP/tmp"
          echo "TMPDIR=$RUNNER_TEMP/tmp" >> "$GITHUB_ENV"
          echo "runner=$RUNNER_NAME TMPDIR=$RUNNER_TEMP/tmp"
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ (!contains(github.event.pull_request.labels.*.name, 'ci-umbra') && vars.EBDA_RUNS_ON == '') && 'npm' || '' }}

      # Migration ordering (Ruling MIG-ORD-1): a PR may not add a migration
      # folder whose 14-digit timestamp sorts at or before main's newest, and
      # no two folders may share a timestamp. Runs before `npm ci`; fails CLOSED
      # (exit 2) if origin/main cannot be read.
      - name: Migration ordering gate
        # The fetch lives INSIDE the script (--fetch), which only uses
        # --depth=1 when CI=true and GITHUB_ACTIONS=true. A bare
        # `git fetch --depth=1` here made every worktree shallow, twice.
        #
        # Two arms (issue 2355). PR: compare against current main. PUSH to main:
        # compare against the PRE-push tip (`github.event.before`) — on a push,
        # origin/main IS the pushed commit, so the PR arm would compare nothing.
        # Scheduled and manual runs take the PR arm.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            node scripts/check-migration-order.mjs --fetch --base "$BEFORE_SHA"
          else
            node scripts/check-migration-order.mjs --fetch --base origin/main
          fi

      # Client trust-boundary guard: scans client source + any built bundle for
      # high-signal secret material. Pure bash, no build.
      - name: Scan client for secret leakage
        run: bash scripts/scan-bundle-secrets.sh

      # #1517: every `uses:` ref stays pinned to a 40-hex commit SHA.
      - name: Verify every GitHub Action is pinned to a commit SHA
        run: bash scripts/check-action-pins.sh

      # A push to main already passed these on its PR, so it stays lite (no
      # install): the migration arm above, the pin check and the secret scan.
      - name: Install dependencies
        if: github.event_name != 'push'
        uses: ./.github/actions/npm-ci

      # Ebda must not ship upstream-product branding; always cheap, always run.
      - name: No-inherited-branding test
        if: github.event_name != 'push'
        run: npx vitest run tests/unit/no-force-branding.test.ts --reporter=verbose --retry=0

      # Prettier on the files the PR changed (the main lane checks the whole
      # tree). `--diff-filter=d` skips deletions; prettier skips .prettierignore.
      - name: Check formatting (changed files)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --name-only --diff-filter=d "$BASE_SHA" HEAD \
            | grep -E '\.(ts|tsx|js|jsx|json|md)$' \
            | xargs -r npx prettier --check

  lint:
    name: Lint
    needs: [changes]
    if: needs.changes.outputs.lint != ''
    runs-on: ${{ fromJSON(contains(github.event.pull_request.labels.*.name, 'ci-umbra') && '["self-hosted","umbra-ebda"]' || vars.EBDA_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Private TMPDIR per runner
        # Two runners on one VM share /tmp, and concurrent vitest runs collided on Vite's temp cache (ENOENT
        # /tmp/<random>/client/..., hundreds of files failing at startup with 0 assertion failures, #150 / #202).
        # The runner's own .env now sets TMPDIR per runner (umbra runner harden); this makes the job independent
        # of that: point TMPDIR at this runner's private RUNNER_TEMP (cleaned by the runner between jobs).
        run: |
          mkdir -p "$RUNNER_TEMP/tmp"
          echo "TMPDIR=$RUNNER_TEMP/tmp" >> "$GITHUB_ENV"
          echo "runner=$RUNNER_NAME TMPDIR=$RUNNER_TEMP/tmp"
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ (!contains(github.event.pull_request.labels.*.name, 'ci-umbra') && vars.EBDA_RUNS_ON == '') && 'npm' || '' }}

      - name: Install dependencies
        uses: ./.github/actions/npm-ci

      # Only the affected workspaces: `-w apps/web -w packages/ui ...`.
      - name: Run ESLint (affected workspaces)
        env:
          LINT_WORKSPACES: ${{ needs.changes.outputs.lint }}
        run: npm run lint --if-present $LINT_WORKSPACES

      # Deterministic gate for the "an emptied admin field must clear" class
      # (`X || undefined` inside an apiPut/apiPatch body). AST-based and cheap.
      - name: Clear-on-empty payload gate
        run: npm run check:clear-on-empty

      # Hardcoded user-visible copy in apps/admin JSX must go through useT / next-intl
      # (Ruling ADM-I18N-GATE-1). AST-based and cheap; runs only when admin is in the affected set.
      - name: Admin i18n literal gate
        if: contains(needs.changes.outputs.lint, 'apps/admin')
        run: npm run check:admin-i18n

  typecheck:
    name: Type Check
    needs: [changes]
    if: needs.changes.outputs.typecheck != ''
    runs-on: ${{ fromJSON(contains(github.event.pull_request.labels.*.name, 'ci-umbra') && '["self-hosted","umbra-ebda"]' || vars.EBDA_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Private TMPDIR per runner
        # Two runners on one VM share /tmp, and concurrent vitest runs collided on Vite's temp cache (ENOENT
        # /tmp/<random>/client/..., hundreds of files failing at startup with 0 assertion failures, #150 / #202).
        # The runner's own .env now sets TMPDIR per runner (umbra runner harden); this makes the job independent
        # of that: point TMPDIR at this runner's private RUNNER_TEMP (cleaned by the runner between jobs).
        run: |
          mkdir -p "$RUNNER_TEMP/tmp"
          echo "TMPDIR=$RUNNER_TEMP/tmp" >> "$GITHUB_ENV"
          echo "runner=$RUNNER_NAME TMPDIR=$RUNNER_TEMP/tmp"
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ (!contains(github.event.pull_request.labels.*.name, 'ci-umbra') && vars.EBDA_RUNS_ON == '') && 'npm' || '' }}

      - name: Install dependencies
        uses: ./.github/actions/npm-ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Build database package
        run: npm run build -w packages/database

      # One tsc per affected workspace; keep going so a PR sees every failure.
      - name: Type check (affected workspaces)
        env:
          TSCONFIGS: ${{ needs.changes.outputs.typecheck }}
          # 4 GB, not the 2 GB default: a fold-sized affected set ran tsc out of heap on Umbra (#367).
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          status=0
          for p in $TSCONFIGS; do
            echo "::group::tsc --noEmit -p $p"
            npx tsc --noEmit -p "$p" || status=1
            echo "::endgroup::"
          done
          exit $status

  # Unit tests for the affected paths. tests/unit (the cross-app source and
  # workflow pins) runs whenever any code changed; app/package suites run when
  # their workspace (or a dependency) changed. No coverage here: the coverage
  # threshold is enforced by the main lane on the full suite.
  # Sharded (PREPUSH-4 / CI-SHARD-1): the affected unit suite was ONE 21-minute job, everything else in the PR lane
  # <= 3 min. `vitest --shard=i/N` splits by file; fail-fast is off so every shard reports. The roll-up job
  # `Unit Tests (affected)` below keeps the check name stable.
  unit:
    name: ${{ matrix.shard == 7 && 'Unit workerd extras' || format('Unit shard {0}/6', matrix.shard) }}
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7] # 7 = the workerd extras (no vitest shard), so they run in parallel with 1-6
    runs-on: ${{ fromJSON(contains(github.event.pull_request.labels.*.name, 'ci-umbra') && '["self-hosted","umbra-ebda"]' || vars.EBDA_RUNS_ON || '"ubuntu-24.04"') }}
    # 35, not 20: on a congested Umbra runner the SETUP (npm ci, builds, chromium) took 16.5 of the 20 minutes and
    # the job was CANCELLED while its 3.7 minutes of tests were still running (#253, #256: cancelled, not failed).
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Private TMPDIR per runner
        # Two runners on one VM share /tmp, and concurrent vitest runs collided on Vite's temp cache (ENOENT
        # /tmp/<random>/client/..., hundreds of files failing at startup with 0 assertion failures, #150 / #202).
        # The runner's own .env now sets TMPDIR per runner (umbra runner harden); this makes the job independent
        # of that: point TMPDIR at this runner's private RUNNER_TEMP (cleaned by the runner between jobs).
        run: |
          mkdir -p "$RUNNER_TEMP/tmp"
          echo "TMPDIR=$RUNNER_TEMP/tmp" >> "$GITHUB_ENV"
          echo "runner=$RUNNER_NAME TMPDIR=$RUNNER_TEMP/tmp"
      - name: Heavy-job host lock (Mac runner only; one heavy test job at a time, Ruling CI-MAC-RUNNER-1)
        run: bash scripts/ci/heavy-lock.sh acquire
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ (!contains(github.event.pull_request.labels.*.name, 'ci-umbra') && vars.EBDA_RUNS_ON == '') && 'npm' || '' }}

      - name: Install dependencies
        uses: ./.github/actions/npm-ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Build database package
        run: npm run build -w packages/database

      - name: Build shared package
        run: npm run build -w packages/shared

      - name: Install Chromium and its system dependencies
        # The unit suite measures chart layout in a real browser, including on Umbra.
        run: bash scripts/ci/install-chromium.sh

      - name: Run unit tests (affected paths)
        if: matrix.shard != 7
        env:
          UNIT_PATHS: ${{ needs.changes.outputs.unit }}
          NODE_OPTIONS: --max-old-space-size=4096
        run: npx vitest run $UNIT_PATHS --shard=${{ matrix.shard }}/6 --reporter=verbose --retry=0

      # The editor control matrix and the classic-builder parity ratchet (plan 2026-10-22-visual-editor,
      # Task 5): the committed docs/ebda/templates/editor-matrix.* must be current and every not-wired row
      # accepted in scripts/editor-audit/baseline.json. Cheap (a few seconds), so it always runs.
      - name: Editor matrix check
        if: matrix.shard == 7
        run: npm run editor:matrix:check

      # apps/status runs on workerd via @cloudflare/vitest-pool-workers, outside
      # the root vitest config.
      - name: Run status worker tests
        if: matrix.shard == 7 && needs.changes.outputs.status_tests == 'true'
        run: npm run test:status

      # apps/accounts (the shared identity service) runs on workerd with a local D1.
      - name: Run accounts worker tests
        if: matrix.shard == 7 && needs.changes.outputs.accounts_tests == 'true'
        run: npm run test:accounts
      # prisma-lite on a real Durable Object (workerd): the transaction runner contract. ~5 s.
      - name: Run prisma-lite Durable Object tests
        if: matrix.shard == 7
        run: npm run test:repo-workers
      - name: Release the heavy-job host lock
        if: always()
        run: bash scripts/ci/heavy-lock.sh release

  unit-gate:
    name: Unit Tests (affected)
    needs: [changes, unit]
    if: always() && github.event_name == 'pull_request'
    runs-on: ${{ fromJSON(contains(github.event.pull_request.labels.*.name, 'ci-umbra') && '["self-hosted","umbra-ebda"]' || vars.EBDA_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 2
    steps:
      - name: Require every unit shard to have passed
        env:
          CHANGES: ${{ needs.changes.result }}
          UNIT: ${{ needs.unit.result }}
        run: |
          echo "changes=$CHANGES unit=$UNIT"
          [ "$CHANGES" = "success" ] || { echo "::error::could not compute the affected paths ($CHANGES)"; exit 1; }
          case "$UNIT" in success|skipped) ;; *) echo "::error::a unit shard did not pass ($UNIT)"; exit 1 ;; esac

  # Visual builder editor E2E (Phase 2): the admin builder in a real Chromium,
  # Arabic (RTL) and English at 390 / 820 / 1280, against the in-memory API
  # (tests/builder-e2e/mock-api.mjs) and a contract fake of the storefront
  # canvas. No database, no network beyond localhost. Main lane (nightly /
  # dispatch, like test-e2e): PRs stay lint + typecheck + affected unit
  # (docs/ebda/ci.md budget); run it locally before a PR with
  # `npx playwright test -c playwright.builder.config.ts`.
  builder-e2e:
    name: Builder E2E (ar/en x 390/820/1280)
    needs: [build]
    runs-on: ${{ fromJSON(contains(github.event.pull_request.labels.*.name, 'ci-umbra') && '["self-hosted","umbra-ebda"]' || vars.EBDA_RUNS_ON || '"ubuntu-24.04"') }}
    # 35, not 25: the green run 42827770627 took 20m03s for 192 tests on one worker (hosted 2 vCPU), 80% of the old
    # cap; a slow runner would cancel a passing suite.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Private TMPDIR per runner
        # Two runners on one VM share /tmp, and concurrent vitest runs collided on Vite's temp cache (ENOENT
        # /tmp/<random>/client/..., hundreds of files failing at startup with 0 assertion failures, #150 / #202).
        # The runner's own .env now sets TMPDIR per runner (umbra runner harden); this makes the job independent
        # of that: point TMPDIR at this runner's private RUNNER_TEMP (cleaned by the runner between jobs).
        run: |
          mkdir -p "$RUNNER_TEMP/tmp"
          echo "TMPDIR=$RUNNER_TEMP/tmp" >> "$GITHUB_ENV"
          echo "runner=$RUNNER_NAME TMPDIR=$RUNNER_TEMP/tmp"
      - name: Heavy-job host lock (Mac runner only; one heavy test job at a time, Ruling CI-MAC-RUNNER-1)
        run: bash scripts/ci/heavy-lock.sh acquire
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ (!contains(github.event.pull_request.labels.*.name, 'ci-umbra') && vars.EBDA_RUNS_ON == '') && 'npm' || '' }}
      - name: Install dependencies
        uses: ./.github/actions/npm-ci
      - name: Generate Prisma Client
        run: npm run db:generate
      - name: Build database package
        run: npm run build -w packages/database
      - name: Build shared package
        run: npm run build -w packages/shared
      - name: Install Chromium
        run: bash scripts/ci/install-chromium.sh
      - name: Run builder E2E
        run: npx playwright test -c playwright.builder.config.ts
        env:
          CI: 'true'
      - name: Release the heavy-job host lock
        if: always()
        run: bash scripts/ci/heavy-lock.sh release

  # `wrangler deploy --dry-run` for each changed Worker app, on the Node the
  # deploy uses (a plain build never starts wrangler, so it passed while real
  # deploys died on the Node floor, 2026-10-03). `changes` only lists apps that
  # HAVE a wrangler config, so an app without one (apps/api today) is skipped.
  # web/admin/orders ship through the pinned OpenNext adapter: this runs the
  # same generator + assertion as cf-deploy.yml (issues 2089/2152/2154) so an
  # adapter or `next` bump that breaks the DO/tag-cache overrides fails here.
  worker-dry-run:
    name: Worker dry-run (${{ matrix.app }})
    needs: [changes]
    # PR: only the Workers the PR touched. Full lane (main push, nightly, dispatch; `changes` is skipped there, hence
    # always()): marketing, so its page-weight budget is proven on main too. It broke unseen on main on 2026-11-10
    # because no main run measured it (Ruling MKT-LEGAL-HTML-BUDGET-2); the other Workers build in their deploy workflows.
    if: always() && !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.has_workers == 'true')
    runs-on: ${{ fromJSON(contains(github.event.pull_request.labels.*.name, 'ci-umbra') && '["self-hosted","umbra-ebda"]' || vars.EBDA_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(github.event_name == 'pull_request' && needs.changes.outputs.workers || '["marketing"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Private TMPDIR per runner
        # Two runners on one VM share /tmp, and concurrent vitest runs collided on Vite's temp cache (ENOENT
        # /tmp/<random>/client/..., hundreds of files failing at startup with 0 assertion failures, #150 / #202).
        # The runner's own .env now sets TMPDIR per runner (umbra runner harden); this makes the job independent
        # of that: point TMPDIR at this runner's private RUNNER_TEMP (cleaned by the runner between jobs).
        run: |
          mkdir -p "$RUNNER_TEMP/tmp"
          echo "TMPDIR=$RUNNER_TEMP/tmp" >> "$GITHUB_ENV"
          echo "runner=$RUNNER_NAME TMPDIR=$RUNNER_TEMP/tmp"
      - name: Heavy-job host lock (Mac runner only; one heavy test job at a time, Ruling CI-MAC-RUNNER-1)
        run: bash scripts/ci/heavy-lock.sh acquire
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ (!contains(github.event.pull_request.labels.*.name, 'ci-umbra') && vars.EBDA_RUNS_ON == '') && 'npm' || '' }}

      - name: Install dependencies
        uses: ./.github/actions/npm-ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Build database package
        run: npm run build -w packages/database

      - name: Build shared package
        run: npm run build -w packages/shared

      - name: Generate the ${{ matrix.app }} worker config (same generator as cf-deploy)
        if: contains(fromJSON('["web","admin","orders"]'), matrix.app)
        env:
          # CI dry-runs exercise cache bindings without provisioning resources.
          OPENNEXT_CACHE: 'true'
          # The pinned adapter + wrangler are already installed by `npm ci`.
          CF_SETUP_SKIP_DEPS: '1'
        run: bash scripts/cf-setup-local.sh ${{ matrix.app }}

      - name: Assert the generated config matches OPENNEXT_CACHE (same assertion as cf-deploy)
        if: contains(fromJSON('["web","admin","orders"]'), matrix.app)
        env:
          # CI dry-runs exercise cache bindings without provisioning resources.
          OPENNEXT_CACHE: 'true'
        run: bash scripts/assert-cf-cache-bindings.sh ${{ matrix.app }}

      - name: Build ${{ matrix.app }} for Cloudflare (OpenNext adapter)
        if: contains(fromJSON('["web","admin","orders"]'), matrix.app)
        run: bash scripts/cf-build.sh ${{ matrix.app }}

      # marketing (static export) and api build with their own script; status's
      # build script IS its dry-run, so it needs no second one.
      - name: Build ${{ matrix.app }}
        if: contains(fromJSON('["marketing","api","status","accounts"]'), matrix.app)
        run: npm run build -w apps/${{ matrix.app }}
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
          # 4 GB, not the 2 GB default: the integrated api tsc ran out of heap on Umbra (#367).
          NODE_OPTIONS: --max-old-space-size=4096

      # Marketing performance budget (marketing-levelup P2): up-front JS/CSS/HTML weight per page, no browser, fails the PR.
      - name: Marketing page-weight budget
        if: matrix.app == 'marketing'
        run: node scripts/ci/marketing-perf-budget.mjs --record "$RUNNER_TEMP/marketing-perf-budget.json"

      # Mobile LCP < 2.5 s (Lighthouse mobile, simulated throttling, median of 3). Needs Chromium, so it installs the one
      # Playwright already caches on the runner; a stalled install or run is bounded by the step timeout.
      - name: Marketing mobile LCP budget
        if: matrix.app == 'marketing'
        timeout-minutes: 12
        run: |
          bash scripts/ci/install-chromium.sh
          node scripts/ci/marketing-perf-budget.mjs --lcp

      - name: Dry-run the ${{ matrix.app }} deploy (wrangler starts on the deploy's Node)
        if: matrix.app != 'status' && matrix.app != 'accounts'
        working-directory: apps/${{ matrix.app }}
        run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/wrangler-dry-${{ matrix.app }}"
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000

      # Request-time boot check (Ruling DEP-OPENNEXT-PREVIEW-1). `next build` + `wrangler deploy --dry-run`
      # never execute a request: #256 (next 16.4.3) passed both, then 500'd on every request on
      # web/admin/orders (adapter threw Unexpected loadManifest(.../preview-props.json)). Boots the
      # built worker in local workerd and requests the deploy workflows' probe paths.
      - name: Boot the built ${{ matrix.app }} Worker and request the deploy probe paths
        if: contains(fromJSON('["web","admin","orders"]'), matrix.app)
        timeout-minutes: 5
        run: node scripts/ci/next-worker-smoke.mjs ${{ matrix.app }}

      # Startup CPU + bundle size budget (scripts/ci/worker-startup-budget.json). Cloudflare error
      # 10021 ("Script startup exceeded CPU time limit") failed one API deploy after the B2B merge;
      # this fails the PR that pushes the Worker toward it instead of the deploy. No database.
      - name: API Worker startup budget (startup CPU and bundle size)
        if: matrix.app == 'api'
        timeout-minutes: 10
        # PRs: compare with main's bundle profiled in this same job (a starved shared runner slows both
        # alike; the absolute 140 ms ceiling flaked at 189 ms on one). main/nightly: absolute ceiling.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node scripts/ci/worker-startup-budget.mjs --runs 5 --baseline-ref origin/main --record "$RUNNER_TEMP/worker-startup-budget.json"
          else
            node scripts/ci/worker-startup-budget.mjs --runs 5 --record "$RUNNER_TEMP/worker-startup-budget.json"
          fi
      - name: Upload the startup measurement
        if: matrix.app == 'api' && always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: worker-startup-budget
          path: ${{ runner.temp }}/worker-startup-budget.json
          if-no-files-found: ignore
      - name: Release the heavy-job host lock
        if: always()
        run: bash scripts/ci/heavy-lock.sh release

  # OPS-2: the PRODUCTION build of every app whose dependency graph includes a changed workspace, with the same commands the
  # cf-<app>-deploy.yml workflows run. #248 merged green and broke the storefront build because no PR check built the apps.
  app-build:
    name: App build (${{ matrix.app }})
    needs: [changes]
    if: needs.changes.outputs.has_build_apps == 'true'
    runs-on: ${{ fromJSON(contains(github.event.pull_request.labels.*.name, 'ci-umbra') && '["self-hosted","umbra-ebda"]' || vars.EBDA_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # One Next/OpenNext production build at a time: each is ~2 GB resident and ~13 MB/s of I/O, and two at once on the 5 GiB
      # guest repeated the 2026-10-26 swap storm. app-build is HEAVY-lane by design: its job id is not in the guest's
      # light-jobs.conf, so it takes one of the 2 heavy slots (tests/unit/ci-lean-structure.test.ts pins both).
      # On hosted runners (EBDA_RUNS_ON unset) every build has its own VM, so they run in parallel (CI-SHARD-1);
      # the one-at-a-time limit applies only to the shared Umbra guest.
      max-parallel: ${{ (vars.EBDA_RUNS_ON == '' && !contains(github.event.pull_request.labels.*.name, 'ci-umbra')) && 6 || 1 }}
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.build_apps) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Private TMPDIR per runner
        run: |
          mkdir -p "$RUNNER_TEMP/tmp"
          echo "TMPDIR=$RUNNER_TEMP/tmp" >> "$GITHUB_ENV"
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ (!contains(github.event.pull_request.labels.*.name, 'ci-umbra') && vars.EBDA_RUNS_ON == '') && 'npm' || '' }}
      - name: Install dependencies
        uses: ./.github/actions/npm-ci
      - name: Generate Prisma Client
        run: npm run db:generate
      - name: Build database + shared packages
        run: |
          npm run build -w packages/database
          npm run build -w packages/shared
      - name: Generate the ${{ matrix.app }} worker config (same generator as cf-deploy)
        if: contains(fromJSON('["web","admin","orders"]'), matrix.app)
        env:
          OPENNEXT_CACHE: 'true'
          CF_SETUP_SKIP_DEPS: '1'
        run: bash scripts/cf-setup-local.sh ${{ matrix.app }}
      - name: Build ${{ matrix.app }} for Cloudflare (OpenNext) - the deploy's build command
        if: contains(fromJSON('["web","admin","orders"]'), matrix.app)
        env:
          NEXT_PUBLIC_API_URL: https://api.ebda.app/api/v1
        run: bash scripts/cf-build.sh ${{ matrix.app }}
      - name: Build ${{ matrix.app }} (static site) - the deploy's build command
        if: contains(fromJSON('["marketing","docs","help"]'), matrix.app)
        run: npm run build -w apps/${{ matrix.app }}

  # The ONE required check for the app builds: runs on every PR, passes when no app needed building, fails when any app
  # build failed or was cancelled. (A matrix job that is legitimately skipped cannot itself be a required check.)
  app-builds:
    name: App builds (affected)
    needs: [changes, app-build]
    if: always() && github.event_name == 'pull_request'
    runs-on: ${{ fromJSON(contains(github.event.pull_request.labels.*.name, 'ci-umbra') && '["self-hosted","umbra-ebda"]' || vars.EBDA_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 2
    steps:
      - name: Require every affected app build to have passed
        env:
          CHANGES: ${{ needs.changes.result }}
          BUILDS: ${{ needs.app-build.result }}
        run: |
          echo "changes=$CHANGES app-build=$BUILDS"
          [ "$CHANGES" = "success" ] || { echo "::error::could not compute the affected apps ($CHANGES)"; exit 1; }
          case "$BUILDS" in success|skipped) ;; *) echo "::error::an affected app build did not pass ($BUILDS)"; exit 1 ;; esac

  # Boot the API Worker in workerd (Ruling DEPLOY-SAFETY-1). Node unit/integration tests cannot
  # see code that throws only on Workers (2026-10-08: `Prisma.dmmf` -> error 1101 on every request
  # for ~4 minutes with every Node test green). The Worker built from the real wrangler config (always on
  # a PR: a shared package or root config can break the Worker as easily as apps/api) boots against a local D1
  # (no Postgres, N-17), then /health + the store-directory reads must not 5xx.
  api-workerd-smoke:
    name: API Worker boots on workerd
    # No `if`: a required PR check (scripts/ci/merge-gate-required.mjs) AND part of the full lane, where it runs the
    # WHOLE workers-test suite (route-sweep included) instead of the PR slice below.
    runs-on: ${{ fromJSON(contains(github.event.pull_request.labels.*.name, 'ci-umbra') && '["self-hosted","umbra-ebda"]' || vars.EBDA_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Private TMPDIR per runner
        # Two runners on one VM share /tmp, and concurrent vitest runs collided on Vite's temp cache (ENOENT
        # /tmp/<random>/client/..., hundreds of files failing at startup with 0 assertion failures, #150 / #202).
        # The runner's own .env now sets TMPDIR per runner (umbra runner harden); this makes the job independent
        # of that: point TMPDIR at this runner's private RUNNER_TEMP (cleaned by the runner between jobs).
        run: |
          mkdir -p "$RUNNER_TEMP/tmp"
          echo "TMPDIR=$RUNNER_TEMP/tmp" >> "$GITHUB_ENV"
          echo "runner=$RUNNER_NAME TMPDIR=$RUNNER_TEMP/tmp"
      - name: Heavy-job host lock (Mac runner only; one heavy test job at a time, Ruling CI-MAC-RUNNER-1)
        run: bash scripts/ci/heavy-lock.sh acquire
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ (!contains(github.event.pull_request.labels.*.name, 'ci-umbra') && vars.EBDA_RUNS_ON == '') && 'npm' || '' }}
      - uses: ./.github/actions/npm-ci
      - run: npm run db:generate
      - run: npm run build -w packages/shared
      - run: npm run build -w packages/database
      - name: Boot the Worker on workerd (no Postgres, N-17)
        run: bash scripts/ci/workerd-smoke.sh
      # Search Task 11 review M8: embed() inside workerd with SEARCH_SEMANTIC_ENABLED=true and a fake
      # `AI` binding (AbortSignal.any, the binding call shape, error mapping). The smoke above strips
      # the binding, so nothing else runs this path on workerd before production does. No database.
      # + the NEON-ZERO money path (PR 455, review I-1): checkout, signed gateway webhooks, refunds and payouts of a store on its
      # Durable Object with Postgres absent; a regression to a Prisma call or an unrouted reference fails the PR here.
      # + the DO storefront with every listing branch of /public/products (P1 2026-11-09: sort=on_sale reached Postgres) and the
      # weekly answer-engine scan of an AI-eligible DO store under production's marker set (no ai-usage marker).
      # + PERF-LATENCY (Ruling PERF-LAT-1): remote calls and serial round trips per hot path stay under their ceilings.
      # + LAUNCH-RL-MISS (Rulings LAUNCH-RL-MISS-1/2): successful storefront calls never spend the store-miss budget (sequential and
      # parallel, one IP), 21 misses are still refused, successful sign-ins leave the IP-wide failure budget untouched.
      # + MERCHANT-JOURNEY (Rulings NZ-JOURNEY-1/2, UPLOAD-DO-1): a new DO-store merchant signs in, onboards, creates a product
      # and uploads its photo + 3D model with no step reaching the removed Postgres.
      - name: Embedding provider + tenant isolation + money path + latency budgets on workerd (fake AI binding, no Postgres)
        timeout-minutes: 20
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            # PR lane: discovered, not listed (scripts/ci/workers-test-lane.mjs = every workers-test file minus
            # workers-test/full-lane-only.txt), so adding a test never edits this line.
            npm run cf:test -w apps/api -- $(node scripts/ci/workers-test-lane.mjs)
          else
            # full lane: every workers-test file, route-sweep.test.ts included
            npm run cf:test -w apps/api
          fi
      - name: Release the heavy-job host lock
        if: always()
        run: bash scripts/ci/heavy-lock.sh release

  # G11 (Ruling INFRA-CF-1): the DB-less integration lane. The real StoreDO (SQLite), D1 and R2 bindings run on
  # LOCAL workerd (Miniflare via @cloudflare/vitest-pool-workers), no Postgres and no built bundle, so it
  # starts in seconds. Covers the backup sweep (DO + D1 -> R2) and the PDPL erasure/export surfaces. Only when
  # a Worker is affected. No remote Actions cache on the self-hosted runner (see the header of this file).
  workerd-integration:
    name: Integration on local workerd (DO + D1 + R2)
    needs: [changes]
    # PR: only when a Worker changed. Full lane: always (`changes` is skipped there, hence always()).
    if: always() && !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.has_workers == 'true')
    runs-on: ${{ fromJSON(contains(github.event.pull_request.labels.*.name, 'ci-umbra') && '["self-hosted","umbra-ebda"]' || vars.EBDA_RUNS_ON || '"ubuntu-24.04"') }}
    # 30, not 15: the job timeout also covers the Umbra throttle-slot wait (775s on #322, tests then took 6s).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Private TMPDIR per runner
        # Two runners on one VM share /tmp, and concurrent vitest runs collided on Vite's temp cache (ENOENT
        # /tmp/<random>/client/..., hundreds of files failing at startup with 0 assertion failures, #150 / #202).
        # The runner's own .env now sets TMPDIR per runner (umbra runner harden); this makes the job independent
        # of that: point TMPDIR at this runner's private RUNNER_TEMP (cleaned by the runner between jobs).
        run: |
          mkdir -p "$RUNNER_TEMP/tmp"
          echo "TMPDIR=$RUNNER_TEMP/tmp" >> "$GITHUB_ENV"
          echo "runner=$RUNNER_NAME TMPDIR=$RUNNER_TEMP/tmp"
      - name: Heavy-job host lock (Mac runner only; one heavy test job at a time, Ruling CI-MAC-RUNNER-1)
        run: bash scripts/ci/heavy-lock.sh acquire
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ (!contains(github.event.pull_request.labels.*.name, 'ci-umbra') && vars.EBDA_RUNS_ON == '') && 'npm' || '' }}
      - uses: ./.github/actions/npm-ci
      - name: Generate Prisma client
        # The rpc codec reads Prisma.Decimal; without a generated client the stub has no Decimal.
        run: npm run db:generate
      - name: StoreDO / D1 / R2 integration tests
        run: npm run cf:test:do -w apps/api
      - name: Release the heavy-job host lock
        if: always()
        run: bash scripts/ci/heavy-lock.sh release

  # ---------------------------------------------------------------------------
  # FULL lane. Never on a pull request.
  #   FULL     = every push to main, every cron, a manual dispatch
  #   MUTATION = the Sunday cron, or a manual dispatch with `mutation` ticked
  # ---------------------------------------------------------------------------

  build:
    name: Build
    # FULL lane: every push to main, every cron, manual dispatch (Ruling CI-FULL-MAIN-1; supersedes CI-HOSTED-1's
    # scheduled no-op: schedules run on hosted runners when EBDA_RUNS_ON is unset).
    if: github.event_name != 'pull_request'
    runs-on: ${{ fromJSON(contains(github.event.pull_request.labels.*.name, 'ci-umbra') && '["self-hosted","umbra-ebda"]' || vars.EBDA_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 25
    env:
      # 4 GB, not the 2 GB default: the all-workspace `npm run typecheck` died of heap exhaustion (exit 134,
      # Mark-Compact at 2,040 MB) on hosted ubuntu-24.04 in run 42818774650, the same class as the PR
      # typecheck's #367 fix; the Next builds below need it too (every cf-*-deploy.yml sets the same).
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Private TMPDIR per runner
        # Two runners on one VM share /tmp, and concurrent vitest runs collided on Vite's temp cache (ENOENT
        # /tmp/<random>/client/..., hundreds of files failing at startup with 0 assertion failures, #150 / #202).
        # The runner's own .env now sets TMPDIR per runner (umbra runner harden); this makes the job independent
        # of that: point TMPDIR at this runner's private RUNNER_TEMP (cleaned by the runner between jobs).
        run: |
          mkdir -p "$RUNNER_TEMP/tmp"
          echo "TMPDIR=$RUNNER_TEMP/tmp" >> "$GITHUB_ENV"
          echo "runner=$RUNNER_NAME TMPDIR=$RUNNER_TEMP/tmp"
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ (!contains(github.event.pull_request.labels.*.name, 'ci-umbra') && vars.EBDA_RUNS_ON == '') && 'npm' || '' }}

      - name: Install dependencies
        uses: ./.github/actions/npm-ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Build database package
        run: npm run build -w packages/database

      # The PR lane lints/typechecks only what changed; the full lane checks
      # everything once, in the same job as the build so `npm ci` runs once.
      - name: Run ESLint
        run: npm run lint --if-present

      - name: Clear-on-empty payload gate
        run: npm run check:clear-on-empty

      - name: Check formatting
        run: npm run format:check --if-present

      - name: Type check (all workspaces)
        run: npm run typecheck

      - name: Build all packages
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000

  # CI-SHARD-1: the full unit suite is sharded 6 ways (hosted 2 vCPU ran it 17-28 min as one job). Each shard writes a
  # vitest blob report with coverage; `test-unit` below merges them and enforces the coverage threshold once.
  test-unit-shard:
    name: ${{ matrix.shard == 7 && 'Unit workerd extras' || format('Unit shard {0}/6', matrix.shard) }}
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7] # 7 = the workerd extras (no vitest shard), so they run in parallel with 1-6
    runs-on: ${{ fromJSON(contains(github.event.pull_request.labels.*.name, 'ci-umbra') && '["self-hosted","umbra-ebda"]' || vars.EBDA_RUNS_ON || '"ubuntu-24.04"') }}
    # 50, not 20: on hosted ubuntu-24.04 (2 vCPU) the coverage step alone took 16m47s in run 42820243819 and the
    # job was cancelled at 20:00 inside the accounts worker tests, with every assertion so far green; green runs then
    # took 20m05s (42827770627) and 28m39s (42829048643) for the same suite, so the cap keeps ~20 min of headroom.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Private TMPDIR per runner
        # Two runners on one VM share /tmp, and concurrent vitest runs collided on Vite's temp cache (ENOENT
        # /tmp/<random>/client/..., hundreds of files failing at startup with 0 assertion failures, #150 / #202).
        # The runner's own .env now sets TMPDIR per runner (umbra runner harden); this makes the job independent
        # of that: point TMPDIR at this runner's private RUNNER_TEMP (cleaned by the runner between jobs).
        run: |
          mkdir -p "$RUNNER_TEMP/tmp"
          echo "TMPDIR=$RUNNER_TEMP/tmp" >> "$GITHUB_ENV"
          echo "runner=$RUNNER_NAME TMPDIR=$RUNNER_TEMP/tmp"
      - name: Heavy-job host lock (Mac runner only; one heavy test job at a time, Ruling CI-MAC-RUNNER-1)
        run: bash scripts/ci/heavy-lock.sh acquire
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ (!contains(github.event.pull_request.labels.*.name, 'ci-umbra') && vars.EBDA_RUNS_ON == '') && 'npm' || '' }}

      - name: Install dependencies
        uses: ./.github/actions/npm-ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Build database package
        run: npm run build -w packages/database

      - name: Build shared package
        run: npm run build -w packages/shared

      - name: Install Chromium and its system dependencies
        # The unit suite measures chart layout in a real browser, including on Umbra.
        run: bash scripts/ci/install-chromium.sh

      - name: Run unit tests with coverage
        if: matrix.shard != 7
        # Globs BEYOND tests/unit are load-bearing, not tidiness. vitest.config.ts
        # has a broad `include`, so a colocated `__tests__` file passes locally and
        # is silently never executed by CI unless its directory is named here.
        #
        # The integration job already added `apps/api/src` for exactly this reason
        # (see its comment). That left the OTHER colocated suites still orphaned:
        # packages/shared, packages/database, apps/web and apps/admin — 18 files /
        # 200 tests that had never run in CI, including the JSON-LD script-tag XSS
        # escaping regression, the money-transaction wrapper, plan baselines and
        # store-layout resolution. All are pure (no DB, no network), so they belong
        # in this job rather than integration.
        #
        # 2026-09-02: `apps/web/src/lib` narrowed the glob past the app's own test
        # tree and orphaned it again — 4 colocated web tests (checkout delivery
        # windows, company-host routing, llms.txt, ProductDetailBody) shipped
        # outside `src/lib` and silently never ran in CI. Widened to the whole
        # `apps/web` tree (still pure/no-DB — verified no prisma/DATABASE_URL
        # import in any apps/web test file); the `orphan-tests` job below now
        # fails the build on any future gap instead of relying on this comment.
        #
        # 2026-09-07: `apps/orders` added — the fulfilment app's colocated
        # `ItemsCard.test.ts` (bundle-box grouping) was the orphan-tests job's
        # first real catch: vitest collected it locally, no CI job glob ran it.
        # Pure grouping logic, no DOM/DB (the root config's `node` environment
        # is all it needs), so it belongs in this job like the other colocated
        # suites. Keep the `orphan-tests` covered-tests list below in sync.
        #
        # Adding a colocated test outside these paths = a test that does not run.
        # Prefer tests/unit; if you must colocate, add the directory here.
        #
        # --retry=0 (#1248): explicit, not just inherited from vitest.config.ts's
        # default, so a future config change can't silently re-mask
        # order-dependent state pollution on this required merge gate.
        run: npx vitest run tests/unit packages/shared/src packages/database/src packages/ui/src packages/cf-schema packages/cf-migrate packages/repo apps/web apps/admin/src apps/orders --shard=${{ matrix.shard }}/6 --coverage --reporter=blob --reporter=verbose --maxWorkers=2 --retry=0
        env:
          NODE_OPTIONS: --max-old-space-size=2048

      # apps/status and apps/accounts run on workerd, outside the root vitest config.
      - name: Run status worker tests
        if: matrix.shard == 7
        run: npm run test:status

      - name: Run accounts worker tests
        if: matrix.shard == 7
        run: npm run test:accounts
      - name: Run prisma-lite Durable Object tests
        if: matrix.shard == 7
        run: npm run test:repo-workers

      - name: Upload shard blob report
        if: always() && matrix.shard != 7
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-blob-${{ matrix.shard }}
          path: .vitest-reports/
          include-hidden-files: true
          retention-days: 1
      - name: Release the heavy-job host lock
        if: always()
        run: bash scripts/ci/heavy-lock.sh release

  test-unit:
    name: Unit Tests
    needs: [test-unit-shard]
    if: always() && github.event_name != 'pull_request'
    runs-on: ${{ fromJSON(contains(github.event.pull_request.labels.*.name, 'ci-umbra') && '["self-hosted","umbra-ebda"]' || vars.EBDA_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require every shard to have passed
        env:
          SHARDS: ${{ needs.test-unit-shard.result }}
        run: |
          echo "shards=$SHARDS"
          [ "$SHARDS" = "success" ] || { echo "::error::a unit shard did not pass ($SHARDS)"; exit 1; }
      - name: Private TMPDIR per runner
        run: |
          mkdir -p "$RUNNER_TEMP/tmp"
          echo "TMPDIR=$RUNNER_TEMP/tmp" >> "$GITHUB_ENV"
          echo "runner=$RUNNER_NAME TMPDIR=$RUNNER_TEMP/tmp"
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ (!contains(github.event.pull_request.labels.*.name, 'ci-umbra') && vars.EBDA_RUNS_ON == '') && 'npm' || '' }}
      - name: Install dependencies
        uses: ./.github/actions/npm-ci
      - name: Download shard reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: unit-blob-*
          path: .vitest-reports
          merge-multiple: true
      - name: Merge reports and enforce the coverage threshold
        run: npx vitest run --merge-reports --coverage --reporter=default
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-coverage
          path: coverage/
          retention-days: 7

  orphan-tests:
    name: Orphan test coverage
    # P1-5 (2026-09-02): vitest.config.ts's root `include` is a broad glob, so
    # ANY colocated *.test.ts/*.spec.ts anywhere in the repo passes locally —
    # but only runs in CI if its directory is named in one of the job globs
    # below. This already recurred once: the Unit Tests job's own comment
    # documents a 2026-07-05 fix for 18 such orphans, and by 2026-09-02 four
    # MORE had shipped outside it (apps/web/src/app + apps/web root) and never
    # ran in CI. That fix only froze a list; it didn't stop the list from going
    # stale again. This job is the thing that stops it: it diffs the full test
    # universe vitest would collect (root config, same as `tests/smoke`'s own
    # exclusion) against the UNION of every directory/file the unit,
    # integration, RLS-proof and e2e jobs pass to `vitest run`, and fails on
    # any file present in the first set but not the second. A gate that cannot
    # fail must not report success — this one can, and does today if a colocated
    # test lands outside every job's glob again.
    runs-on: ${{ fromJSON(contains(github.event.pull_request.labels.*.name, 'ci-umbra') && '["self-hosted","umbra-ebda"]' || vars.EBDA_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 15
    needs: [build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Private TMPDIR per runner
        # Two runners on one VM share /tmp, and concurrent vitest runs collided on Vite's temp cache (ENOENT
        # /tmp/<random>/client/..., hundreds of files failing at startup with 0 assertion failures, #150 / #202).
        # The runner's own .env now sets TMPDIR per runner (umbra runner harden); this makes the job independent
        # of that: point TMPDIR at this runner's private RUNNER_TEMP (cleaned by the runner between jobs).
        run: |
          mkdir -p "$RUNNER_TEMP/tmp"
          echo "TMPDIR=$RUNNER_TEMP/tmp" >> "$GITHUB_ENV"
          echo "runner=$RUNNER_NAME TMPDIR=$RUNNER_TEMP/tmp"
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ (!contains(github.event.pull_request.labels.*.name, 'ci-umbra') && vars.EBDA_RUNS_ON == '') && 'npm' || '' }}

      - name: Install dependencies
        uses: ./.github/actions/npm-ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Build database package
        run: npm run build -w packages/database

      - name: Build shared package
        run: npm run build -w packages/shared

      - name: Diff vitest's full test universe against CI job coverage
        # KEEP THE PATH LIST BELOW IN SYNC with what test-unit / test-integration /
        # test-e2e actually pass to `vitest run` (this is
        # intentionally a hand-copied list, not derived from the other jobs, so a
        # change to one without the other shows up as a visible diff in review).
        # --json=<file> (NOT bare --json, which vitest treats as an optional
        # positional VALUE and greedily swallows the next arg as the output path)
        # writes ONLY the JSON to that file, keeping it clean of the setup-file
        # console warnings vitest's collection phase prints to stdout.
        # --filesOnly (2026-11-10, run 42820243819): without it `vitest list` IMPORTS every test file to collect its
        # tests, which ran past this job's 15 min on hosted ubuntu-24.04 (2,165 files) and the job was cancelled.
        # --filesOnly lists the files the include globs match without importing them (under a second), a SUPERSET of
        # the collected set (measured locally: 2,165 vs 1,980, nothing collected that it misses), so it is stricter.
        # packages/cf-schema, packages/cf-migrate and packages/repo: test-unit runs them; this list had drifted
        # without them (73 false orphans).
        run: |
          set -euo pipefail

          npx vitest list --filesOnly --json="$RUNNER_TEMP"/all-tests.json

          npx vitest list --filesOnly \
            tests/unit packages/shared/src packages/database/src packages/ui/src packages/cf-schema packages/cf-migrate packages/repo apps/web apps/admin/src apps/orders \
            tests/integration apps/api/src \
            tests/e2e \
            --json="$RUNNER_TEMP"/covered-tests.json

          node -e "
            const fs = require('fs');
            const all = new Set(JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/all-tests.json', 'utf8')).map(t => t.file));
            const covered = new Set(JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/covered-tests.json', 'utf8')).map(t => t.file));

            // The FIRST collection (the whole-repo \`all\` set) can itself come
            // back (near-)empty — the same broken-collector failure mode as the
            // second one below, just on the other list. Without this floor, an
            // empty/near-empty \`all\` makes the covered-vs-all comparison below
            // false (0 < 0, or a tiny number under a tiny number) and every
            // check below falls through to \"No orphan test files\" — a green
            // pass having discovered almost nothing, on a repo with hundreds of
            // test files. The repo has ~395 vitest-discovered files today; 50
            // is a floor far below any plausible legitimate shrinkage and far
            // above a broken collector's near-zero.
            if (all.size < 50) {
              console.error('::error::the FIRST vitest list discovered only ' + all.size +
                ' file(s) repo-wide. That collector failed, so this is a BROKEN RUN, not an' +
                ' empty repo. Re-run; if it persists, check the runner node_modules and disk state.');
              process.exit(1);
            }

            // A collection that came back (near-)empty is a BROKEN RUN, not a
            // repo full of orphans. Without this the job reports every file in
            // the tree as an orphan — 268 of them on one occasion, including
            // tests/unit files that are plainly inside the covered globs — and
            // that reads as a code regression rather than as \"the second
            // vitest list collected nothing\". Observed on one runner while the same
            // commit collected 269/269 locally and passed on another.
            //
            // The covered set is a FILTERED subset of the same universe, so it
            // should be within a whisker of `all`. Anything below half means
            // the collection failed, and saying so is far more useful than
            // listing the whole repo.
            if (covered.size * 2 < all.size) {
              console.error('::error::covered-test collection returned ' + covered.size +
                ' file(s) against ' + all.size + ' discovered. The second vitest list failed to' +
                ' collect, so this is a BROKEN RUN, not an orphan-test regression.' +
                ' Re-run; if it persists, check the runner node_modules and disk state.');
              process.exit(1);
            }
            const orphans = [...all].filter(f => !covered.has(f)).sort();
            if (orphans.length > 0) {
              console.error('::error::' + orphans.length + ' orphan test file(s) — vitest collects these but no CI job glob covers them, so they never run in CI:');
              for (const f of orphans) console.error('  ' + f);
              console.error('');
              console.error('Fix: add the containing directory to the relevant job glob in ci.yml (test-unit/test-integration/test-e2e), AND to this job\'s covered-tests path list above.');
              process.exit(1);
            }
            console.log('No orphan test files (' + all.size + ' vitest-discovered files, all covered by a CI job glob).');
          "

  test-integration:
    name: Integration Tests
    # Two lanes (2026-10-25, #227 merged four edited integration test files that never ran): the FULL/nightly lane runs
    # the whole tier after `build`; a pull request runs it ONLY when scripts/ci-affected.mjs says an integration test
    # or a service one imports changed (`changes.outputs.integration`), and then just those files.
    if: >-
      always() && !cancelled() && (
        (github.event_name != 'pull_request' && needs.build.result == 'success') ||
        (github.event_name == 'pull_request' && needs.changes.outputs.integration == 'true'))
    runs-on: ${{ fromJSON(contains(github.event.pull_request.labels.*.name, 'ci-umbra') && '["self-hosted","umbra-ebda"]' || vars.EBDA_RUNS_ON || '"ubuntu-24.04"') }}
    # 40, not 25: the full suite (305 files + serial lane) reached its last lane and was cancelled at 25:01 on a
    # hosted runner (run 42046806700, PR 437); a wide PR runs every integration file.
    timeout-minutes: 40
    needs: [build, changes]
    services:
      postgres:
        image: ${{ !contains(vars.EBDA_RUNS_ON, 'ebda-mac') && 'pgvector/pgvector:0.8.0-pg17' || '' }}
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: force_test
        ports:
          - 5432
        options: >-
          --tmpfs /var/lib/postgresql/data:rw,size=1500m
          --health-cmd "pg_isready -U test -d force_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s
      redis:
        image: ${{ !contains(vars.EBDA_RUNS_ON, 'ebda-mac') && 'redis:7-alpine' || '' }}
        ports:
          # Dynamic host port: same reasoning as postgres above.
          - 6379
        options: >-
          --tmpfs /data:rw,size=256m
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Private TMPDIR per runner
        # Two runners on one VM share /tmp, and concurrent vitest runs collided on Vite's temp cache (ENOENT
        # /tmp/<random>/client/..., hundreds of files failing at startup with 0 assertion failures, #150 / #202).
        # The runner's own .env now sets TMPDIR per runner (umbra runner harden); this makes the job independent
        # of that: point TMPDIR at this runner's private RUNNER_TEMP (cleaned by the runner between jobs).
        run: |
          mkdir -p "$RUNNER_TEMP/tmp"
          echo "TMPDIR=$RUNNER_TEMP/tmp" >> "$GITHUB_ENV"
          echo "runner=$RUNNER_NAME TMPDIR=$RUNNER_TEMP/tmp"
      - name: Heavy-job host lock (Mac runner only; one heavy test job at a time, Ruling CI-MAC-RUNNER-1)
        run: bash scripts/ci/heavy-lock.sh acquire
      - name: Test database + Redis (service containers on Linux; a per-job database on the Mac)
        env:
          CI_PG_PORT: ${{ job.services.postgres.ports['5432'] }}
          CI_REDIS_PORT: ${{ job.services.redis.ports['6379'] }}
        run: bash scripts/ci/ci-services.sh up
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ (!contains(github.event.pull_request.labels.*.name, 'ci-umbra') && vars.EBDA_RUNS_ON == '') && 'npm' || '' }}

      - name: Install dependencies
        uses: ./.github/actions/npm-ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Build database package
        run: npm run build -w packages/database

      - name: Build shared package
        run: npm run build -w packages/shared

      - name: Run database migrations
        run: npx prisma migrate deploy --schema=packages/database/prisma/schema.prisma
        env:
          DATABASE_URL: ${{ env.CI_PG_URL }}
          DIRECT_URL: ${{ env.CI_PG_URL }}

      - name: Seed test data
        run: npm run db:seed --if-present
        env:
          DATABASE_URL: ${{ env.CI_PG_URL }}
          DIRECT_URL: ${{ env.CI_PG_URL }}
          ADMIN_PASSWORD: test-admin-password-ci
          ADMIN_EMAIL: admin@ebda.app

      - name: Build API
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build -w apps/api

      - name: Check the host's ebda_app can log in (Mac runner; the shared role is never altered, Ruling CI-MAC-ROLE-1)
        if: runner.os == 'macOS'
        run: bash scripts/ci/ci-services.sh app-login

      - name: Give ebda_app a CI-only login for the API server
        if: runner.os == 'Linux'
        # Production's API runs as the non-bypass `ebda_app` role (created NOLOGIN
        # by migration 20261004000000_ebda_strict_rls; ops gives it a login and a
        # password per environment). The whole integration suite drives an API logged
        # in as `ebda_app`, so every flow is proven under STRICT RLS (no contextless
        # allowance, no bypass setting). The API server below runs as ebda_app,
        # exactly as production does — for the
        # SYNCHRONOUS HTTP request/response paths only (#1974). The sibling
        # "Start API server" step below runs in Node, where no background job is started (the
        # Worker bindings are absent), so async/cron writers under
        # ebda_app (order-auto-cancel-unpaid, payment-abandonment-sweep,
        # stock-reorder-scan, analytics-daily-rollup, audit-log-archive, and
        # the rest) remain entirely unexercised here — see
        # docs/plans/2026-07-02-rls-cutover.md's "Before a second attempt"
        # section for that gap and how it is currently covered (or not). The
        # test harness keeps the superuser URL for fixtures and cleanup.
        # This password only exists inside this disposable per-job container.
        run: |
          cat <<'SQL' | npx prisma db execute --url "${{ env.CI_PG_URL }}" --stdin
          ALTER ROLE ebda_app WITH PASSWORD 'ci-only-app-pw' LOGIN;
          SQL

      - name: Throw-away identity key for the integration tier
        # Merchants, staff and super admins sign in at the identity service, not the Store (Rulings ID-1/ID-2), so the tests
        # mint the ES256 token it would issue (tests/helpers/identity-session.ts) and the API server verifies it with the
        # matching public key (apps/api/src/lib/test-identity.ts: NODE_ENV=test + this variable, nothing else installs it).
        # A fresh P-256 key per job; it exists only inside this disposable runner environment.
        run: |
          node -e "const {generateKeyPairSync}=require('crypto');const k=generateKeyPairSync('ec',{namedCurve:'P-256'}).privateKey.export({format:'jwk'});k.kid='ci-'+Date.now();k.alg='ES256';console.log('EBDA_TEST_IDENTITY_JWK='+JSON.stringify(k))" >> "$GITHUB_ENV"

      - name: Start API server
        # tests/integration hit a real HTTP server at localhost:4000.
        # Background-launch the built API and poll /health until it is
        # ready; tear it down in a later step regardless of test outcome.
        run: |
          node apps/api/dist/index.js > "$RUNNER_TEMP"/api-server.log 2>&1 &
          echo $! > "$RUNNER_TEMP"/api-server.pid
          for i in $(seq 1 90); do
            if curl -sf http://localhost:4000/health > /dev/null; then
              echo "API server is healthy after ${i} attempts"
              exit 0
            fi
            sleep 1
          done
          echo "API server failed to start within 90 seconds"
          cat "$RUNNER_TEMP"/api-server.log
          exit 1
        env:
          PORT: '4000'
          DATABASE_URL: ${{ env.CI_PG_APP_URL }}
          DIRECT_URL: ${{ env.CI_PG_URL }}
          REDIS_URL: ${{ env.CI_REDIS_URL }}
          JWT_SECRET: test-jwt-secret-for-ci-only-32chars
          ENCRYPTION_KEY: test-encryption-key-for-ci-32chars
          NODE_ENV: test
          # self-serve-onboarding-live picks InstaPay as the trial's payment method (go-live gate, EBDA-FUNNEL-5).
          EBDA_INSTAPAY_HANDLE: ebda@instapay

      - name: Assert the API connected as ebda_app, not a bypass role
        # /health is a liveness probe: it answers 200 identically as the `test`
        # superuser (BYPASSRLS) or as ebda_app, so a relapse of the API's
        # DATABASE_URL to a bypass role would leave every integration test
        # green while proving nothing under enforced RLS (#1940). The API logs
        # the role it actually connected as at boot (apps/api/src/lib/
        # database-role-guard.ts, awaited before listen); this step fails the
        # job unless that line says ebda_app without BYPASSRLS or SUPERUSER.
        # Fails closed: a missing line (guard query failed, or never ran) is a
        # failure, not a pass.
        run: |
          for i in $(seq 1 30); do
            if grep -q 'DB role check: current_user=' "$RUNNER_TEMP"/api-server.log; then break; fi
            sleep 1
          done
          grep 'DB role check: current_user=' "$RUNNER_TEMP"/api-server.log || { echo "::error::API never logged its DB role"; tail -50 "$RUNNER_TEMP"/api-server.log; exit 1; }
          if ! grep -q 'DB role check: current_user=ebda_app rolbypassrls=false rolsuper=false' "$RUNNER_TEMP"/api-server.log; then
            echo "::error::API is not connected as ebda_app without BYPASSRLS/SUPERUSER — integration results would not prove RLS"
            exit 1
          fi

      - name: Run integration tests
        # Also run the colocated regression tests under apps/**/__tests__ — they
        # were never executed by CI before (the unit job globs only tests/unit),
        # so the regression tests for the gateway empty-email P0 + the Sentry
        # 4xx-gate were dead weight. They run HERE (not the unit job) because the
        # shared test setup connects to Postgres + Redis, which only this job has.
        #
        # --retry=1 (#1248): this tier makes real network/DB calls against the
        # service containers above, unlike the unit tier which is retry:0 by
        # default (vitest.config.ts) to stop retry masking state pollution.
        #
        # Two passes (Ruling ITEST-13). Planner / index tests (files importing tests/helpers/app-role-planner, plus the idle-transaction counters,
        # listed by scripts/ci/planner-lane.sh) assert on the planner's choice, which flips when other files write
        # to the same big tables in parallel, so they run SERIALLY after the parallel pass, on a quiet database.
        run: |
          set -euo pipefail
          targets="tests/integration apps/api/src"
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$INTEGRATION_PATHS" ] && [ "$INTEGRATION_PATHS" != "all" ]; then
            targets="$INTEGRATION_PATHS"   # only the integration tests the planner selected for this PR
          fi
          echo "integration targets: $targets"
          PLANNER_EXCLUDES="$(bash scripts/ci/planner-lane.sh excludes)"
          # --passWithNoTests: a narrowed PR run can select ONLY planner-lane files (payment-outage-isolation), which
          # PLANNER_EXCLUDES removes from this parallel pass; they run in the serial pass below, so an empty parallel
          # pass is correct, not a failure (it died with "No test files found" on #565).
          npx vitest run $targets $PLANNER_EXCLUDES --passWithNoTests --reporter=verbose --retry=1
          # serial planner pass: the whole lane on a full run, only the selected planner files on a narrowed PR run
          lane="$(bash scripts/ci/planner-lane.sh list)"
          if [ "$targets" != "tests/integration apps/api/src" ]; then
            lane="$(for f in $lane; do for t in $targets; do case "$f" in "$t"*) echo "$f";; esac; done; done)"
          fi
          if [ -n "$lane" ]; then npx vitest run $lane --no-file-parallelism --reporter=verbose --retry=1; fi
        env:
          EVENT_NAME: ${{ github.event_name }}
          INTEGRATION_PATHS: ${{ needs.changes.outputs.integration_paths }}
          # Integration tests run against the ephemeral postgres SERVICE CONTAINER
          # (localhost below), never a Neon branch. The old TEST_DATABASE_URL path
          # (pointed at the ep-spring-dew preview branch) is retired with staging —
          # the secret is no longer mapped here, so setup-e2e.ts falls through to
          # this container DATABASE_URL. Standard: CI never forks a Neon branch.
          DATABASE_URL: ${{ env.CI_PG_URL }}
          DIRECT_URL: ${{ env.CI_PG_URL }}
          REDIS_URL: ${{ env.CI_REDIS_URL }}
          JWT_SECRET: test-jwt-secret-for-ci-only-32chars
          ENCRYPTION_KEY: test-encryption-key-for-ci-32chars
          NODE_ENV: test
          # Match the value passed to the seed step above so the login test
          # can authenticate with the seeded super admin.
          ADMIN_PASSWORD: test-admin-password-ci
          ADMIN_EMAIL: admin@ebda.app

      - name: Stop API server
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP"/api-server.pid ]; then
            kill "$(cat "$RUNNER_TEMP"/api-server.pid)" 2>/dev/null || true
          fi
          if [ -f "$RUNNER_TEMP"/api-server.log ]; then
            echo '--- api server log tail ---'
            tail -100 "$RUNNER_TEMP"/api-server.log
          fi
      - name: Drop the per-job test database (Mac runner)
        if: always()
        run: bash scripts/ci/ci-services.sh down
      - name: Release the heavy-job host lock
        if: always()
        run: bash scripts/ci/heavy-lock.sh release

  test-e2e:
    name: E2E Tests
    runs-on: ${{ fromJSON(contains(github.event.pull_request.labels.*.name, 'ci-umbra') && '["self-hosted","umbra-ebda"]' || vars.EBDA_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 25
    needs: [build]
    services:
      postgres:
        image: ${{ !contains(vars.EBDA_RUNS_ON, 'ebda-mac') && 'pgvector/pgvector:0.8.0-pg17' || '' }}
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: force_test
        ports:
          - 5432
        options: >-
          --tmpfs /var/lib/postgresql/data:rw,size=1500m
          --health-cmd "pg_isready -U test -d force_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s
      redis:
        image: ${{ !contains(vars.EBDA_RUNS_ON, 'ebda-mac') && 'redis:7-alpine' || '' }}
        ports:
          # Dynamic host port: same reasoning as postgres above.
          - 6379
        options: >-
          --tmpfs /data:rw,size=256m
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Private TMPDIR per runner
        # Two runners on one VM share /tmp, and concurrent vitest runs collided on Vite's temp cache (ENOENT
        # /tmp/<random>/client/..., hundreds of files failing at startup with 0 assertion failures, #150 / #202).
        # The runner's own .env now sets TMPDIR per runner (umbra runner harden); this makes the job independent
        # of that: point TMPDIR at this runner's private RUNNER_TEMP (cleaned by the runner between jobs).
        run: |
          mkdir -p "$RUNNER_TEMP/tmp"
          echo "TMPDIR=$RUNNER_TEMP/tmp" >> "$GITHUB_ENV"
          echo "runner=$RUNNER_NAME TMPDIR=$RUNNER_TEMP/tmp"
      - name: Heavy-job host lock (Mac runner only; one heavy test job at a time, Ruling CI-MAC-RUNNER-1)
        run: bash scripts/ci/heavy-lock.sh acquire
      - name: Test database + Redis (service containers on Linux; a per-job database on the Mac)
        env:
          CI_PG_PORT: ${{ job.services.postgres.ports['5432'] }}
          CI_REDIS_PORT: ${{ job.services.redis.ports['6379'] }}
        run: bash scripts/ci/ci-services.sh up
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ (!contains(github.event.pull_request.labels.*.name, 'ci-umbra') && vars.EBDA_RUNS_ON == '') && 'npm' || '' }}

      - name: Install dependencies
        uses: ./.github/actions/npm-ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Build database package
        run: npm run build -w packages/database

      - name: Build shared package
        run: npm run build -w packages/shared

      - name: Run database migrations
        run: npx prisma migrate deploy --schema=packages/database/prisma/schema.prisma
        env:
          DATABASE_URL: ${{ env.CI_PG_URL }}
          DIRECT_URL: ${{ env.CI_PG_URL }}

      - name: Run E2E tests
        # --retry=1 (#1248): same reasoning as the integration job — this
        # tier hits a real HTTP server + Postgres + Redis, unlike the
        # retry:0-by-default unit tier.
        run: npm run test:e2e -- --retry=1
        env:
          DATABASE_URL: ${{ env.CI_PG_URL }}
          DIRECT_URL: ${{ env.CI_PG_URL }}
          REDIS_URL: ${{ env.CI_REDIS_URL }}
          JWT_SECRET: test-jwt-secret-for-ci-only-32chars
          ENCRYPTION_KEY: test-encryption-key-for-ci-32chars
          NODE_ENV: test
          WEB_URL: http://localhost:3000
          ADMIN_URL: http://localhost:3001

      - name: Upload test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-test-results
          path: test-results/
          retention-days: 7
      - name: Drop the per-job test database (Mac runner)
        if: always()
        run: bash scripts/ci/ci-services.sh down
      - name: Release the heavy-job host lock
        if: always()
        run: bash scripts/ci/heavy-lock.sh release

  security:
    name: Security Audit
    # FULL lane: every push to main, every cron, manual dispatch (Ruling CI-FULL-MAIN-1; supersedes CI-HOSTED-1's
    # scheduled no-op: schedules run on hosted runners when EBDA_RUNS_ON is unset).
    if: github.event_name != 'pull_request'
    runs-on: ${{ fromJSON(contains(github.event.pull_request.labels.*.name, 'ci-umbra') && '["self-hosted","umbra-ebda"]' || vars.EBDA_RUNS_ON || '"ubuntu-24.04"') }}
    # 18: the budget is the SUM of the worst cases, not the audit alone — 3
    # bounded audit attempts (~5.8 min, #1520) + a COLD `npm ci` + checkout and
    # trufflehog. tests/unit/audit-report-verdict.test.ts asserts this sum.
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Private TMPDIR per runner
        # Two runners on one VM share /tmp, and concurrent vitest runs collided on Vite's temp cache (ENOENT
        # /tmp/<random>/client/..., hundreds of files failing at startup with 0 assertion failures, #150 / #202).
        # The runner's own .env now sets TMPDIR per runner (umbra runner harden); this makes the job independent
        # of that: point TMPDIR at this runner's private RUNNER_TEMP (cleaned by the runner between jobs).
        run: |
          mkdir -p "$RUNNER_TEMP/tmp"
          echo "TMPDIR=$RUNNER_TEMP/tmp" >> "$GITHUB_ENV"
          echo "runner=$RUNNER_NAME TMPDIR=$RUNNER_TEMP/tmp"
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ (!contains(github.event.pull_request.labels.*.name, 'ci-umbra') && vars.EBDA_RUNS_ON == '') && 'npm' || '' }}

      - name: Install dependencies
        uses: ./.github/actions/npm-ci

      - name: Run npm audit
        # Zero-vulns policy for PRODUCTION deps (gated at low — any vuln fails).
        # Development-only residual: eight high findings currently derive from
        # braces, which has no patched upstream release. Lighthouse overrides
        # remove its previous extract-zip dependency; see the exact baseline
        # and exception in docs/ebda/dependency-security-baseline.md.
        # This gate still checks production dependencies at every severity.
        run: |
          set -e
          # Zero-tolerance for production deps, with a NARROW documented
          # allowlist for advisories that have no upstream fix AND are
          # unreachable by npm overrides (workspace-hoisted). The allowlist and
          # its justification live in .github/scripts/audit-gate.mjs — it fails
          # on anything not explicitly waived, and the list must only shrink.
          node .github/scripts/audit-gate.mjs

      - name: Check for secrets
        uses: trufflesecurity/trufflehog@ea68ca03c865c5f324e86e849ced20ed3cf9dbbb # v3.99.8
        with:
          path: ./
          extra_args: --only-verified

  # Mutation tests: weekly (Sunday) or manual only (far too slow for a push or
  # a nightly).
  #   - Stryker over the mutate list in stryker.conf.json (unit tier).
  #   - The defence mutation record, unit tier: removes each mandatory security
  #     defence in turn and proves its guarding test then FAILS. The
  #     integration tier needs Postgres and is run by hand with --tier=all.
  mutation:
    name: Mutation tests
    # Sunday cron or a manual dispatch with `mutation` ticked; never on a push (Ruling CI-FULL-MAIN-1).
    if: (github.event_name == 'schedule' && github.event.schedule == '17 1 * * 0') || (github.event_name == 'workflow_dispatch' && inputs.mutation)
    runs-on: ${{ fromJSON(contains(github.event.pull_request.labels.*.name, 'ci-umbra') && '["self-hosted","umbra-ebda"]' || vars.EBDA_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Private TMPDIR per runner
        # Two runners on one VM share /tmp, and concurrent vitest runs collided on Vite's temp cache (ENOENT
        # /tmp/<random>/client/..., hundreds of files failing at startup with 0 assertion failures, #150 / #202).
        # The runner's own .env now sets TMPDIR per runner (umbra runner harden); this makes the job independent
        # of that: point TMPDIR at this runner's private RUNNER_TEMP (cleaned by the runner between jobs).
        run: |
          mkdir -p "$RUNNER_TEMP/tmp"
          echo "TMPDIR=$RUNNER_TEMP/tmp" >> "$GITHUB_ENV"
          echo "runner=$RUNNER_NAME TMPDIR=$RUNNER_TEMP/tmp"
      - name: Heavy-job host lock (Mac runner only; one heavy test job at a time, Ruling CI-MAC-RUNNER-1)
        run: bash scripts/ci/heavy-lock.sh acquire
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ (!contains(github.event.pull_request.labels.*.name, 'ci-umbra') && vars.EBDA_RUNS_ON == '') && 'npm' || '' }}

      - name: Install dependencies
        uses: ./.github/actions/npm-ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Build database + shared packages
        run: |
          npm run build -w packages/database
          npm run build -w packages/shared

      - name: Stryker mutation run
        run: npx stryker run

      - name: Defence mutation record (unit tier)
        run: node scripts/defence-mutation-record.mjs --tier=unit

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report
          path: reports/
          if-no-files-found: ignore
          retention-days: 7
      - name: Release the heavy-job host lock
        if: always()
        run: bash scripts/ci/heavy-lock.sh release

  notify-failure:
    name: Notify on failure (main and nightly)
    runs-on: ${{ fromJSON(contains(github.event.pull_request.labels.*.name, 'ci-umbra') && '["self-hosted","umbra-ebda"]' || vars.EBDA_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 3
    needs:
      [
        guards,
        build,
        security,
        test-unit,
        test-unit-shard,
        orphan-tests,
        test-integration,
        test-e2e,
        builder-e2e,
        api-workerd-smoke,
        workerd-integration,
        worker-dry-run,
        mutation,
      ]
    # Ruling CI-FULL-MAIN-1: a red full lane is LOUD. Runs after every non-PR run that was not cancelled (a superseded
    # main push is cancelled, not red): on a failure it pages Telegram and, on main, opens or updates ONE issue
    # labelled `ci-main-red`; a green full run on main closes that issue.
    if: always() && !cancelled() && github.event_name != 'pull_request'
    permissions:
      contents: read
      issues: write
    steps:
      - name: Compose + send Telegram alert
        # A job that hits its timeout reports `cancelled` while the run itself is not cancelled (run 42820243819:
        # three timed-out jobs, notify still ran), so a timeout is red too; a superseded run never gets here.
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          GUARDS_RES: ${{ needs.guards.result }}
          BUILD_RES: ${{ needs.build.result }}
          SECURITY_RES: ${{ needs.security.result }}
          UNIT_RES: ${{ needs.test-unit.result }}
          ORPHAN_RES: ${{ needs.orphan-tests.result }}
          INT_RES: ${{ needs.test-integration.result }}
          E2E_RES: ${{ needs.test-e2e.result }}
          BUILDER_E2E_RES: ${{ needs.builder-e2e.result }}
          WORKERD_RES: ${{ needs.api-workerd-smoke.result }}
          WORKERD_DO_RES: ${{ needs.workerd-integration.result }}
          DRYRUN_RES: ${{ needs.worker-dry-run.result }}
          MUTATION_RES: ${{ needs.mutation.result }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_ALERT_CHAT_ID" ]; then
            echo "telegram secrets not configured — skipping alert"
            exit 0
          fi

          # Collect which jobs failed (vs which skipped vs passed) so Ahmad
          # can see what to look at without clicking through.
          FAILED_JOBS=""
          for entry in "guards:$GUARDS_RES" "build:$BUILD_RES" "security:$SECURITY_RES" "unit:$UNIT_RES" "orphan-tests:$ORPHAN_RES" "integration:$INT_RES" "e2e:$E2E_RES" "builder-e2e:$BUILDER_E2E_RES" "workerd:$WORKERD_RES" "workerd-do:$WORKERD_DO_RES" "worker-dry-run:$DRYRUN_RES" "mutation:$MUTATION_RES"; do
            name="${entry%:*}"
            res="${entry#*:}"
            if [ "$res" = "failure" ]; then
              FAILED_JOBS="${FAILED_JOBS}${name}, "
            elif [ "$res" = "cancelled" ]; then
              FAILED_JOBS="${FAILED_JOBS}${name} (timed out), "
            fi
          done
          FAILED_JOBS="${FAILED_JOBS%, }"
          [ -z "$FAILED_JOBS" ] && FAILED_JOBS="(none reported — check run)"

          # First line of the commit message only (Telegram truncates long bodies).
          # Scheduled/manual runs carry no head_commit.
          TITLE=$(echo "${COMMIT_MSG:-($EVENT run)}" | head -n 1 | cut -c1-100)
          SHORT_SHA="${SHA:0:8}"

          # Markdown V1 escaping is minimal — wrap code segments in backticks
          # to neutralize most special chars, but use a plain header so
          # Telegram preserves layout when an underscore sneaks in.
          MSG=$(printf '🔴 *CI FAIL* (%s) — %s\n*branch:* `%s`\n*sha:* `%s`\n*commit:* %s\n*author:* %s\n*failed:* %s\n[view run](https://github.com/%s/actions/runs/%s)' \
            "$EVENT" "$REPO" "$REF" "$SHORT_SHA" "$TITLE" "${COMMIT_AUTHOR:-n/a}" "$FAILED_JOBS" "$REPO" "$RUN_ID")

          curl -sS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_ALERT_CHAT_ID}" \
            -d parse_mode=Markdown \
            -d disable_web_page_preview=true \
            --data-urlencode text="$MSG" \
            >/dev/null
          echo "alert sent"
      - name: Open or update the ci-main-red issue
        if: (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
        run: |
          gh label create ci-main-red --color B60205 --description "the full CI lane is red on main" 2>/dev/null || true
          body="Full lane FAILED on main ($EVENT, \`${SHA:0:9}\`): $RUN_URL"
          num=$(gh issue list --label ci-main-red --state open --json number --jq '.[0].number // empty')
          if [ -n "$num" ]; then
            gh issue comment "$num" --body "$body"
          else
            gh issue create --label ci-main-red --title "CI full lane is red on main" \
              --body "$body

          Opened by ci.yml notify-failure (Ruling CI-FULL-MAIN-1). Closed automatically by the next green full run on main."
          fi
      - name: Close the ci-main-red issue on a green full run
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && github.ref == 'refs/heads/main' && needs.build.result == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for num in $(gh issue list --label ci-main-red --state open --json number --jq '.[].number'); do
            gh issue close "$num" --comment "Full lane green on main again: $RUN_URL"
          done
