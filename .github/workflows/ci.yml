name: CI

on:
  push:
    # main-only (2026-06-13): the staging environment + branch were retired
    # (worktree→PR→CI→main is the only flow; staging drained Neon + Railway
    # 24/7 for zero use). develop was never active either.
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.gitleaksignore'
      - '.gitleaks.toml'
      - '.github/ISSUE_TEMPLATE/**'
      - '.vscode/**'
      - '.editorconfig'
  pull_request:
    # main-only (2026-06-13): staging/develop retired (see push trigger above).
    # NO paths-ignore here (2026-06-27): with it, a docs-only PR skipped the
    # WHOLE workflow, so the REQUIRED checks (Lint / Type Check / Security Audit)
    # never reported and branch protection blocked the PR forever. The workflow
    # now always runs; the heavy build + test jobs are gated on the `changes`
    # job below, so a docs-only PR runs only the 3 fast required jobs.
    branches: [main]
  workflow_dispatch:
    inputs:
      force_cloud:
        description: 'Run on cloud (ubuntu-latest) instead of self-hosted'
        type: boolean
        default: false

# CRITICAL: cancel superseded runs. Without this, multiple pushes to main
# in quick succession all run to completion, burning GitHub Actions minutes.
# Set 2026-05-25 after a session burned ~25 minutes on stale stuck runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

# Least-privilege default: the workflow GITHUB_TOKEN is read-only. No job here
# needs write (artifact upload uses the runner session token, not GITHUB_TOKEN).
# A job that ever needs write must override upward with its own `permissions:`.
permissions:
  contents: read

jobs:
  # Detects whether a PR touches any non-docs file. The heavy build + test jobs
  # gate on this (so docs-only PRs stay cheap), while the REQUIRED jobs
  # (Lint / Type Check / Security Audit — no `needs`) still run + report on
  # every PR so branch protection is always satisfied. (2026-06-27)
  changes:
    name: Detect code changes
    runs-on: ${{ (inputs.force_cloud || vars.USE_SELF_HOSTED != 'true') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","wsl2"]') }}
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        name: Detect non-docs changes
        env:
          # GitHub-controlled SHA (not user text); bound via env per workflow-injection hygiene.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Push events have no PR base → run the full pipeline.
          if [ -z "$BASE_SHA" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE_SHA" HEAD \
              | grep -qvE '^(docs/|.*\.md$|\.gitleaksignore$|\.gitleaks\.toml$|\.github/ISSUE_TEMPLATE/|\.vscode/|\.editorconfig$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: Lint
    runs-on: ${{ (inputs.force_cloud || vars.USE_SELF_HOSTED != 'true') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","wsl2"]') }}
    # 8 (was 5): eslint+prettier across the monorepo exceeds 5m when the 2
    # self-hosted runners are saturated by concurrent PRs (timed out 2026-06-10).
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint --if-present

      - name: Check formatting
        run: npm run format:check --if-present

  typecheck:
    name: Type Check
    runs-on: ${{ (inputs.force_cloud || vars.USE_SELF_HOSTED != 'true') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","wsl2"]') }}
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Build database package
        run: npm run build -w packages/database

      - name: Type check API
        run: npx tsc --noEmit -p apps/api/tsconfig.json

      - name: Type check Admin
        run: npx tsc --noEmit -p apps/admin/tsconfig.json

      - name: Type check Web
        run: npx tsc --noEmit -p apps/web/tsconfig.json

      - name: Type check Orders PWA
        run: npx tsc --noEmit -p apps/orders/tsconfig.json

      - name: Type check shared packages
        run: npx tsc --noEmit -p packages/shared/tsconfig.json

  build:
    name: Build
    # Skip on docs-only PRs (the required Lint/Type Check/Security Audit still
    # run). On push events `changes.code` is 'true', so build always runs there.
    if: needs.changes.outputs.code == 'true'
    # build runs on self-hosted by default; force_cloud overrides to ubuntu-latest.
    # inputs.force_cloud is falsy (not set) for push/pull_request triggers — safe.
    runs-on: ${{ (inputs.force_cloud || vars.USE_SELF_HOSTED != 'true') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","wsl2"]') }}
    timeout-minutes: 15
    needs: [lint, typecheck, changes]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Build database package
        run: npm run build -w packages/database

      - name: Build all packages
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000

  test-unit:
    name: Unit Tests
    runs-on: ${{ (inputs.force_cloud || vars.USE_SELF_HOSTED != 'true') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","wsl2"]') }}
    timeout-minutes: 10
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Build database package
        run: npm run build -w packages/database

      - name: Build shared package
        run: npm run build -w packages/shared

      - name: Run unit tests with coverage
        run: npx vitest run tests/unit --coverage --reporter=verbose

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-coverage
          path: coverage/
          retention-days: 7

  test-integration:
    name: Integration Tests
    runs-on: ${{ (inputs.force_cloud || vars.USE_SELF_HOSTED != 'true') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","wsl2"]') }}
    timeout-minutes: 15
    needs: [build]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: force_test
        ports:
          # Dynamic host port: Docker assigns a random available port so
          # parallel jobs on the same self-hosted runner never collide on 5432.
          - 5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s
      redis:
        image: redis:7-alpine
        ports:
          # Dynamic host port: same reasoning as postgres above.
          - 6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Build database package
        run: npm run build -w packages/database

      - name: Build shared package
        run: npm run build -w packages/shared

      - name: Run database migrations
        run: npx prisma migrate deploy --schema=packages/database/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://test:test@localhost:${{ job.services.postgres.ports['5432'] }}/force_test
          DIRECT_URL: postgresql://test:test@localhost:${{ job.services.postgres.ports['5432'] }}/force_test

      - name: Seed test data
        run: npm run db:seed --if-present
        env:
          DATABASE_URL: postgresql://test:test@localhost:${{ job.services.postgres.ports['5432'] }}/force_test
          DIRECT_URL: postgresql://test:test@localhost:${{ job.services.postgres.ports['5432'] }}/force_test
          ADMIN_PASSWORD: test-admin-password-ci
          ADMIN_EMAIL: admin@forcemedia.com

      - name: Build API
        run: npm run build -w apps/api

      - name: Start API server
        # tests/integration hit a real HTTP server at localhost:4000.
        # Background-launch the built API and poll /health until it is
        # ready; tear it down in a later step regardless of test outcome.
        run: |
          node apps/api/dist/index.js > /tmp/api-server.log 2>&1 &
          echo $! > /tmp/api-server.pid
          for i in $(seq 1 90); do
            if curl -sf http://localhost:4000/health > /dev/null; then
              echo "API server is healthy after ${i} attempts"
              exit 0
            fi
            sleep 1
          done
          echo "API server failed to start within 90 seconds"
          cat /tmp/api-server.log
          exit 1
        env:
          PORT: '4000'
          DATABASE_URL: postgresql://test:test@localhost:${{ job.services.postgres.ports['5432'] }}/force_test
          DIRECT_URL: postgresql://test:test@localhost:${{ job.services.postgres.ports['5432'] }}/force_test
          REDIS_URL: redis://localhost:${{ job.services.redis.ports['6379'] }}
          JWT_SECRET: test-jwt-secret-for-ci-only-32chars
          ENCRYPTION_KEY: test-encryption-key-for-ci-32chars
          NODE_ENV: test
          INNGEST_DRY_RUN: 'true'

      - name: Run integration tests
        # Also run the colocated regression tests under apps/**/__tests__ — they
        # were never executed by CI before (the unit job globs only tests/unit),
        # so the regression tests for the MyFatoorah empty-email P0 + the Sentry
        # 4xx-gate were dead weight. They run HERE (not the unit job) because the
        # shared test setup connects to Postgres + Redis, which only this job has.
        run: npx vitest run tests/integration apps/api/src --reporter=verbose
        env:
          # Integration tests run against the ephemeral postgres SERVICE CONTAINER
          # (localhost below), never a Neon branch. The old TEST_DATABASE_URL path
          # (pointed at the ep-spring-dew preview branch) is retired with staging —
          # the secret is no longer mapped here, so setup-e2e.ts falls through to
          # this container DATABASE_URL. Standard: CI never forks a Neon branch.
          DATABASE_URL: postgresql://test:test@localhost:${{ job.services.postgres.ports['5432'] }}/force_test
          DIRECT_URL: postgresql://test:test@localhost:${{ job.services.postgres.ports['5432'] }}/force_test
          REDIS_URL: redis://localhost:${{ job.services.redis.ports['6379'] }}
          JWT_SECRET: test-jwt-secret-for-ci-only-32chars
          ENCRYPTION_KEY: test-encryption-key-for-ci-32chars
          NODE_ENV: test
          # Suppress inngest.send() network calls — dev server is not running in CI.
          # The client.ts no-op path activates when this is 'true' OR NODE_ENV=test.
          INNGEST_DRY_RUN: 'true'
          # Match the value passed to the seed step above so the login test
          # can authenticate with the seeded super admin.
          ADMIN_PASSWORD: test-admin-password-ci
          ADMIN_EMAIL: admin@forcemedia.com

      - name: Stop API server
        if: always()
        run: |
          if [ -f /tmp/api-server.pid ]; then
            kill "$(cat /tmp/api-server.pid)" 2>/dev/null || true
          fi
          if [ -f /tmp/api-server.log ]; then
            echo '--- api server log tail ---'
            tail -100 /tmp/api-server.log
          fi

  # RLS cutover Phase 1c — THE GATE (docs/plans/2026-07-02-rls-cutover.md).
  # Every other job above connects to Postgres as the `test` superuser, which
  # BYPASSES row-level security entirely (like prod's current `neondb_owner`
  # BYPASSRLS role) — so it never actually exercises the `force_app` RLS
  # policies. This job's DATABASE_URL/DIRECT_URL authenticate as the REAL
  # `force_app` login role instead, the closest CI gets to production's
  # post-cutover connection. If a migration predicate is wrong or any table
  # is still deny-all for force_app, THIS job fails — not prod.
  test-rls-force-app:
    name: RLS force_app Cutover Proof
    runs-on: ${{ (inputs.force_cloud || vars.USE_SELF_HOSTED != 'true') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","wsl2"]') }}
    timeout-minutes: 10
    needs: [build]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: force_test
        ports:
          # Dynamic host port: Docker assigns a random available port so
          # parallel jobs on the same self-hosted runner never collide on 5432.
          - 5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Build database package
        run: npm run build -w packages/database

      - name: Run database migrations (as the ephemeral Postgres superuser)
        # Migrations need DDL + role-creation privileges (CREATE ROLE, GRANT,
        # ALTER TABLE ... ENABLE/FORCE ROW LEVEL SECURITY) so they run as the
        # container superuser `test`. This idempotently creates the
        # `force_app` role + its DML grants (20260404000000_add_rls_policies)
        # and every RLS policy this PR + prior migrations add.
        run: npx prisma migrate deploy --schema=packages/database/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://test:test@localhost:${{ job.services.postgres.ports['5432'] }}/force_test
          DIRECT_URL: postgresql://test:test@localhost:${{ job.services.postgres.ports['5432'] }}/force_test

      - name: Grant force_app a CI-only login password + TRUNCATE
        # `force_app` is created LOGIN-but-no-password by the migration — prod
        # never needs a CI test password (Phase 3 sets the real prod
        # credential out of band, outside this repo). This step is the ONLY
        # place a force_app password ever exists, and it only lives inside
        # this disposable, per-job Postgres container.
        #
        # TRUNCATE is granted here — NOT in the migration; prod's force_app
        # has no TRUNCATE and doesn't need it — purely so the shared
        # tests/setup-e2e.ts global fixture reset (`TRUNCATE ... RESTART
        # IDENTITY CASCADE`, which runs for every file under tests/integration
        # regardless of which one vitest actually executes) doesn't 42501 now
        # that this job's DATABASE_URL is force_app end-to-end.
        run: |
          cat <<'SQL' | npx prisma db execute --url "postgresql://test:test@localhost:${{ job.services.postgres.ports['5432'] }}/force_test" --stdin
          ALTER ROLE force_app WITH PASSWORD 'ci-only-force-app-pw' LOGIN;
          GRANT TRUNCATE ON ALL TABLES IN SCHEMA public TO force_app;
          SQL

      - name: Run force_app cross-tenant RLS proof
        run: npx vitest run tests/integration/rls-force-app.test.ts --reporter=verbose
        env:
          # The whole point of this job: every prisma.* call in
          # rls-force-app.test.ts authenticates as force_app, not a superuser.
          DATABASE_URL: postgresql://force_app:ci-only-force-app-pw@localhost:${{ job.services.postgres.ports['5432'] }}/force_test
          DIRECT_URL: postgresql://force_app:ci-only-force-app-pw@localhost:${{ job.services.postgres.ports['5432'] }}/force_test
          NODE_ENV: test

  test-e2e:
    name: E2E Tests
    runs-on: ${{ (inputs.force_cloud || vars.USE_SELF_HOSTED != 'true') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","wsl2"]') }}
    timeout-minutes: 20
    needs: [build]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: force_test
        ports:
          # Dynamic host port: Docker assigns a random available port so
          # parallel jobs on the same self-hosted runner never collide on 5432.
          - 5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s
      redis:
        image: redis:7-alpine
        ports:
          # Dynamic host port: same reasoning as postgres above.
          - 6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Build database package
        run: npm run build -w packages/database

      - name: Build shared package
        run: npm run build -w packages/shared

      - name: Run database migrations
        run: npx prisma migrate deploy --schema=packages/database/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://test:test@localhost:${{ job.services.postgres.ports['5432'] }}/force_test
          DIRECT_URL: postgresql://test:test@localhost:${{ job.services.postgres.ports['5432'] }}/force_test

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          DATABASE_URL: postgresql://test:test@localhost:${{ job.services.postgres.ports['5432'] }}/force_test
          DIRECT_URL: postgresql://test:test@localhost:${{ job.services.postgres.ports['5432'] }}/force_test
          REDIS_URL: redis://localhost:${{ job.services.redis.ports['6379'] }}
          JWT_SECRET: test-jwt-secret-for-ci-only-32chars
          ENCRYPTION_KEY: test-encryption-key-for-ci-32chars
          NODE_ENV: test
          # Suppress inngest.send() network calls — dev server is not running in CI.
          INNGEST_DRY_RUN: 'true'
          WEB_URL: http://localhost:3000
          ADMIN_URL: http://localhost:3001

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-results
          path: test-results/
          retention-days: 7

  security:
    name: Security Audit
    runs-on: ${{ (inputs.force_cloud || vars.USE_SELF_HOSTED != 'true') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","wsl2"]') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        # Zero-vulns policy for PRODUCTION deps (gated at low — any vuln fails).
        # Dev-only deps: @lhci/cli@0.15.1 (latest) ships transitive
        # tmp@0.1.0 + uuid@8.3.2 + inquirer + qs whose CVEs are now tracked
        # in the advisory DB but cannot be resolved because npm nested overrides
        # do not propagate into workspace-hoisted dev dep trees (verified
        # 2026-05-25). All known HIGH/CRIT advisories are bounded to Lighthouse
        # CI tooling and never reach the production bundle. Both checks omit
        # dev deps — the first check (low) already covers all production deps at
        # every severity, making the second check dev-dep-free for symmetry.
        # Re-evaluate when @lhci/cli ships a refresh.
        run: |
          set -e
          echo "::group::production deps (zero tolerance at low)"
          npm audit --audit-level=low --omit=dev
          echo "::endgroup::"
          echo "::group::production deps (zero tolerance at high — omit dev)"
          npm audit --audit-level=high --omit=dev
          echo "::endgroup::"

      - name: Ensure jq (trufflehog needs it; self-hosted runner may lack it + can't sudo)
        run: |
          if command -v jq >/dev/null 2>&1; then
            echo "jq present: $(jq --version)"
          else
            echo "jq missing — installing a static binary to a runner-owned PATH dir (no sudo)"
            mkdir -p "$HOME/.local/bin"
            JQ_SHA=5942c9b0934e510ee61eb3e30273f1b3fe2590df93933a93d7c58b81d19c8ff5
            curl -fsSL -o "$HOME/.local/bin/jq" https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-linux-amd64
            echo "$JQ_SHA  $HOME/.local/bin/jq" | sha256sum -c - || { echo "::error::jq checksum mismatch — refusing to execute"; rm -f "$HOME/.local/bin/jq"; exit 1; }
            chmod +x "$HOME/.local/bin/jq"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            "$HOME/.local/bin/jq" --version
          fi

      - name: Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified

  notify-failure:
    # FAIL-OPEN EXCEPTION: notify-failure intentionally stays on ubuntu-latest.
    # Its sole purpose is to alert when OTHER jobs fail — including when the
    # self-hosted runner is offline. Putting it on self-hosted would mean no
    # alert when the runner dies, defeating the entire purpose.
    name: Notify on failure (main only)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs:
      [
        lint,
        typecheck,
        security,
        build,
        test-unit,
        test-integration,
        test-rls-force-app,
        test-e2e,
      ]
    if: always() && failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Compose + send Telegram alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          LINT_RES: ${{ needs.lint.result }}
          TYPECHECK_RES: ${{ needs.typecheck.result }}
          SECURITY_RES: ${{ needs.security.result }}
          BUILD_RES: ${{ needs.build.result }}
          UNIT_RES: ${{ needs.test-unit.result }}
          INT_RES: ${{ needs.test-integration.result }}
          RLS_FORCE_APP_RES: ${{ needs.test-rls-force-app.result }}
          E2E_RES: ${{ needs.test-e2e.result }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_ALERT_CHAT_ID" ]; then
            echo "telegram secrets not configured — skipping alert"
            exit 0
          fi

          # Collect which jobs failed (vs which skipped vs passed) so Ahmad
          # can see what to look at without clicking through.
          FAILED_JOBS=""
          for entry in "lint:$LINT_RES" "typecheck:$TYPECHECK_RES" "security:$SECURITY_RES" "build:$BUILD_RES" "unit:$UNIT_RES" "integration:$INT_RES" "rls-force-app:$RLS_FORCE_APP_RES" "e2e:$E2E_RES"; do
            name="${entry%:*}"
            res="${entry#*:}"
            if [ "$res" = "failure" ]; then
              FAILED_JOBS="${FAILED_JOBS}${name}, "
            fi
          done
          FAILED_JOBS="${FAILED_JOBS%, }"
          [ -z "$FAILED_JOBS" ] && FAILED_JOBS="(none reported — check run)"

          # First line of the commit message only (Telegram truncates long bodies)
          TITLE=$(echo "$COMMIT_MSG" | head -n 1 | cut -c1-100)
          SHORT_SHA="${SHA:0:8}"

          # Markdown V1 escaping is minimal — wrap code segments in backticks
          # to neutralize most special chars, but use a plain header so
          # Telegram preserves layout when an underscore sneaks in.
          MSG=$(printf '🔴 *CI FAIL* — %s\n*branch:* `%s`\n*sha:* `%s`\n*commit:* %s\n*author:* %s\n*failed:* %s\n[view run](https://github.com/%s/actions/runs/%s)' \
            "$REPO" "$REF" "$SHORT_SHA" "$TITLE" "$COMMIT_AUTHOR" "$FAILED_JOBS" "$REPO" "$RUN_ID")

          curl -sS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_ALERT_CHAT_ID}" \
            -d parse_mode=Markdown \
            -d disable_web_page_preview=true \
            --data-urlencode text="$MSG" \
            >/dev/null
          echo "alert sent"
