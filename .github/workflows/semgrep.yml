name: Semgrep

# Weekly + manual, NOT on pull requests or pushes (lean CI, SP4 task 9). The
# scan installs semgrep from PyPI and walks the whole tree, ~3-4 billed
# minutes; paid on every PR and every main push it would eat ~400 of the
# 2,000 monthly minutes. The PR lane keeps gitleaks and the unit/lint/
# typecheck gates; this SAST scan sweeps main every Sunday (right after ci.yml's
# full lane) and on demand. See docs/ebda/ci.md.
on:
  schedule:
    - cron: '47 1 * * 0'
  workflow_dispatch:

concurrency:
  # A group of its own per run (see ci.yml / gitleaks.yml: GitHub keeps only one
  # pending run per group, and a shared group would cancel a queued scan).
  group: semgrep-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep SAST
    # ubuntu-latest became 26.04 (2026-11); Playwright 1.60 unsupported — Ruling CI-HOSTED-2
    runs-on: ${{ fromJSON(vars.EBDA_RUNS_ON_LIGHT || vars.EBDA_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Semgrep scan (block on ERROR severity)
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/semgrep-venv"
          "$RUNNER_TEMP/semgrep-venv/bin/pip" install --quiet --upgrade semgrep
          "$RUNNER_TEMP/semgrep-venv/bin/semgrep" scan \
            --config p/default \
            --config p/owasp-top-ten \
            --config p/javascript \
            --config p/typescript \
            --config p/secrets \
            --error --severity ERROR
