name: stage5-guard

# Identity stage 5 (contract phase) may merge only after the soak gate passed AND Ahmad approved. Every PR runs this job (so the
# check is always present and green for ordinary PRs); only the stage-5 branch is actually enforced. See scripts/ci/stage5-guard.mjs.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: stage5-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Stage 5 soak guard
    runs-on: ${{ fromJSON(vars.EBDA_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Enforce the soak gate and Ahmad's go on the stage-5 branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: node scripts/ci/stage5-guard.mjs --head-ref "$HEAD_REF"
