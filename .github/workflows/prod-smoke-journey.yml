name: prod-smoke-journey
# Pre-launch program (docs/testing/prelaunch-program.md): the read-only shopper journey (home, search, PDP, cart,
# checkout form; Arabic + English; 390 px + 1440 px) against PRODUCTION every 3 hours. It never places an order
# (PRELAUNCH_WRITE is never set here). Output: prod-smoke-result.json (artifact) + a non-zero exit on any failure,
# which the alert path reads. GitHub-hosted runners on purpose: it must not depend on the self-hosted fleet.
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      stores:
        description: 'space-separated store slugs (<slug>.ebda.app)'
        required: false
        default: 'ameliaaurum storedemo'

permissions:
  contents: read

concurrency:
  group: prod-smoke-journey
  cancel-in-progress: false

jobs:
  journey:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install Playwright only (no workspace install)
        run: |
          v=$(node -p "require('./package.json').devDependencies['@playwright/test']")
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i --no-audit --no-fund "@playwright/test@${v}"
          npx playwright install --with-deps chromium
          # Resolve @playwright/test from the repo root without installing the whole workspace.
          ln -s /tmp/pw/node_modules "$GITHUB_WORKSPACE/node_modules"
      - name: Run journeys
        env:
          STORES: ${{ inputs.stores || 'ameliaaurum storedemo' }}
        run: |
          set +e
          rc=0
          mkdir -p prelaunch-results
          for s in $STORES; do
            case "$s" in *[!a-z0-9-]*) echo "::error::bad slug $s"; exit 1;; esac
            PRELAUNCH_STORE_SLUG="$s" PRELAUNCH_JSON="prelaunch-results/$s.json" \
              /tmp/pw/node_modules/.bin/playwright test -c playwright.prelaunch.config.ts shopper-journey
            PRELAUNCH_STORE_SLUG="$s" node scripts/qa/prelaunch-summary.mjs "prelaunch-results/$s.json" "prelaunch-results/$s.result.json" || rc=1
          done
          node -e "const fs=require('fs');const r=fs.readdirSync('prelaunch-results').filter(f=>f.endsWith('.result.json')).map(f=>JSON.parse(fs.readFileSync('prelaunch-results/'+f)));fs.writeFileSync('prod-smoke-result.json',JSON.stringify({ok:r.length>0&&r.every(x=>x.ok),runs:r},null,2))"
          echo "rc=$rc" >> "$GITHUB_ENV"
      - name: Job summary
        if: always()
        run: |
          { echo '### prod smoke journey'; echo '```json'; cat prod-smoke-result.json 2>/dev/null | head -c 6000; echo; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: prod-smoke-result
          path: |
            prod-smoke-result.json
            prelaunch-results/
          if-no-files-found: warn
      - name: Fail on any failed journey
        if: always()
        run: '[ "${rc:-1}" = "0" ]'
