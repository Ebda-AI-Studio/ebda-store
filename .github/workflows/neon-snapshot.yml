name: Neon snapshot

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_cloud:
        description: 'Run on cloud (ubuntu-latest) instead of self-hosted'
        type: boolean
        default: false
    # Skip snapshots for commits that touch ONLY docs / plans / specs / config
    # files. The snapshot is a rollback-safety artifact for schema/code changes;
    # plan-doc commits don't need it. Cuts ~30% of snapshots without losing
    # rollback coverage. Added 2026-05-27 after burst pushes flooded Neon
    # branch quota during the wa native catalog bot build.
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.gitleaksignore'
      - '.gitleaks.toml'
      - '.github/workflows/auto-fix-watchdog.yml'
      - '.github/workflows/lighthouse-nightly.yml'
      - '.github/workflows/load-test-nightly.yml'
      - '.github/ISSUE_TEMPLATE/**'
      - '.vscode/**'
      - '.editorconfig'

permissions:
  contents: read

jobs:
  snapshot:
    name: Create Neon branch from production
    runs-on: ${{ (inputs.force_cloud || vars.USE_SELF_HOSTED != 'true') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","wsl2"]') }}
    steps:
      - name: Create branch + prune old snapshots
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${NEON_API_KEY:-}" ] || [ -z "${NEON_PROJECT_ID:-}" ]; then
            echo "::warning::NEON_API_KEY or NEON_PROJECT_ID not set; skipping snapshot."
            exit 0
          fi
          SHORT_SHA="${GIT_SHA:0:8}"
          BRANCH_NAME="prod-${SHORT_SHA}"
          API="https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}"
          curl -fsSL -X POST "${API}/branches" \
            -H "Authorization: Bearer ${NEON_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"branch\":{\"name\":\"${BRANCH_NAME}\"}}" \
            | jq -r '.branch | "Created: " + .name + " (" + .id + ")"'
          BRANCHES_JSON=$(curl -fsSL "${API}/branches" -H "Authorization: Bearer ${NEON_API_KEY}")
          # Retention raised from 9 → 30 (2026-05-28): Neon Pro tier gives 5000 branches/project,
          # so the free-tier cap is no longer the constraint. 30 ≈ ~3-4 days of rollback coverage
          # at FWB push cadence.
          OLD_IDS=$(echo "$BRANCHES_JSON" | jq -r '.branches | map(select(.name | startswith("prod-"))) | sort_by(.created_at) | reverse | .[30:] | .[].id')
          for branch_id in $OLD_IDS; do
            curl -fsSL -X DELETE "${API}/branches/${branch_id}" \
              -H "Authorization: Bearer ${NEON_API_KEY}" || echo "::warning::Failed to delete ${branch_id}"
            echo "Pruned: ${branch_id}"
          done
