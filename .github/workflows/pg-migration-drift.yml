name: Postgres migration drift
# Ruling MIGRATION-DRIFT-1. Read-only: two SELECTs against production Postgres. Daily, on the self-hosted runner only
# (a scheduled run on a hosted runner is skipped: hosted minutes are budgeted, Ruling CI-HOSTED-1); workflow_dispatch runs
# anywhere. A failed run alerts through the same notify job the deploy workflows use.
on:
  schedule:
    - cron: '47 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pg-migration-drift
  cancel-in-progress: false
jobs:
  drift:
    if: github.event_name != 'schedule' || vars.EBDA_RUNS_ON != ''
    runs-on: ${{ fromJSON(vars.EBDA_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Compare the migrations on disk with production
        env:
          PGURL: ${{ secrets.EBDA_MIGRATE_DATABASE_URL }}
        run: node scripts/ci/pg-migration-drift.mjs
  notify-failure:
    name: Notify on drift
    needs: [drift]
    if: always() && needs.drift.result == 'failure'
    runs-on: ${{ fromJSON(vars.EBDA_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 2
    steps:
      - name: Send Telegram alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "${TELEGRAM_BOT_TOKEN:-}" ] && [ -n "${TELEGRAM_ALERT_CHAT_ID:-}" ] || { echo "no telegram secrets - skip"; exit 0; }
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_ALERT_CHAT_ID}" \
            --data-urlencode text="PG MIGRATION DRIFT: migrations on disk are missing from production Postgres. ${RUN_URL}" >/dev/null || true
