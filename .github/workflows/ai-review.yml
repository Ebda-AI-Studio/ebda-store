name: AI Review

on:
  pull_request:
    branches: [main]

concurrency:
  group: ai-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  ai-review:
    name: Claude PR review
    # Skip the remediation bot's own PRs — the remediation GATE's review-score IS the review,
    # so re-running AI Review here would double-review bot fixes (branches: remediate/*).
    #
    # Also skip Dependabot's PRs (issue 2254). .github/dependabot.yml opens a
    # weekly github-actions bump, and a Dependabot-triggered run gets the
    # Dependabot secret store (no CLAUDE_CODE_OAUTH_TOKEN) and a read-only
    # GITHUB_TOKEN — so the review could never authenticate, and every bump
    # would be a weekly red tick nobody can act on. Keyed on the PR AUTHOR,
    # not github.actor, so a human re-running the job does not change it. A
    # skipped job reports as success for branch protection. What still reviews
    # an action bump: the SHA-pin check in ci.yml and a human merge.
    if: ${{ !startsWith(github.head_ref, 'remediate/') && github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ${{ (inputs.force_cloud || vars.USE_SELF_HOSTED != 'true') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","wsl2"]') }}
    timeout-minutes: 20
    steps:
      # Pre-checkout guard (#1883): survives an OOM-kill/guest-restart on a
      # prior job that stranded a root-owned trufflehog-*/ dir `if: always()`
      # cannot cover, because nothing after the kill runs, checkout included.
      - name: Remove root-owned trufflehog scratch (pre-checkout guard, issue 1883)
        # Inline, not a local composite action: a `uses: ./.github/actions/...`
        # step cannot resolve before actions/checkout has put the repo on disk.
        shell: bash
        run: |
          shopt -s nullglob
          # Sparse-checkout leak (2026-09-30): a sparse job on this persistent
          # self-hosted workspace left core.sparseCheckout in .git/config, and
          # the next plain actions/checkout reused it, so orders' deploy got a
          # scripts-only tree ("npm ci: no package-lock.json"). Undo any
          # inherited sparse config BEFORE checkout, in every job.
          if [ -d .git ] && [ "$(git config --get core.sparseCheckout 2>/dev/null)" = "true" ]; then
            echo "::warning::workspace .git carries a sparse-checkout config from a prior job — disabling it before checkout"
            git sparse-checkout disable 2>/dev/null || true
            git config --unset-all core.sparseCheckout 2>/dev/null || true
            git config --unset-all core.sparseCheckoutCone 2>/dev/null || true
            rm -f .git/info/sparse-checkout
          fi
          leftovers=(trufflehog-*)
          if [ ${#leftovers[@]} -eq 0 ]; then
            exit 0
          fi
          echo "::warning::found stranded root-owned trufflehog scratch from a prior job (${leftovers[*]}) — removing before checkout"
          docker run --rm -v "$PWD":/workspace -w /workspace \
            alpine:3.20 sh -c 'rm -rf trufflehog-*' || {
            echo "::warning::trufflehog scratch cleanup failed — checkout may still hit EACCES; needs a root delete on this runner" >&2
            exit 0
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          # Checkout uses the default GITHUB_TOKEN so a missing/expired AI_FIX_PAT
          # can NEVER block the review. The auto-fix step pushes with the PAT
          # explicitly (that push re-triggers CI + a fresh review).
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Detect prior auto-fix on HEAD (loop guard)
        id: head
        run: |
          if git log -1 --pretty=%s | grep -q '\[ai-fix\]'; then
            echo "is_ai_fix=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_ai_fix=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build review input (instructions + diff)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          {
            cat .github/ai-review/prompt.md
            echo
            echo "PR unified diff follows. Review per the contract above and respond with ONLY the JSON object."
            echo
            git diff "$BASE_SHA...$HEAD_SHA" -- . \
              ':(exclude)**/package-lock.json' ':(exclude)**/*.lock' \
              ':(exclude)**/dist/**' ':(exclude)**/.next/**' ':(exclude)**/*.snap' \
              | python3 -c "import sys; d=sys.stdin.buffer.read(200000); i=d.rfind(b'\n'); sys.stdout.buffer.write(d if i<0 else d[:i+1])"
          } > /tmp/review-input.md
      # REVIEWER ROTATION (lens 26, standard/skill-hygiene.md).
      #
      # The review runs on Fable 5 while the code and the auto-fix below run on
      # Opus 5. The reel's claim is that the shortcuts which create a defect are
      # the ones that miss it in review — one model grading its own output
      # measures convention adherence, not correctness. Live evidence: PR #1099
      # was authored by Claude and passed by this workflow on the same model;
      # both defects found afterwards (an unrun prettier gate, a revived
      # TRUNCATE that broke two integration suites) were the author's.
      #
      # Two things this buys, and one it does not:
      #   + Capability asymmetry in the right direction — Fable 5 is the more
      #     capable model, so the reviewer is strictly stronger than the author.
      #   + Different failure profile from a different training run.
      #   − It does NOT fully decorrelate: same vendor means shared training
      #     lineage, RLHF methodology and tokenizer, so correlated blind spots
      #     remain. A second vendor would decorrelate further. This is the
      #     Claude-only approximation, chosen deliberately.
      #
      # The larger lever is already in place and worth not breaking: the
      # reviewer receives ONLY the prompt contract + the unified diff. It never
      # sees the PR body or the author's rationale, so it cannot inherit the
      # framing that produced the defect. Do not add PR body to the input.
      #
      # The durable answer is neither model: every defect this catches should
      # become a deterministic gate (lint rule, type, test), because those
      # share no blind spots with any model. The SSRF lint rule added in #1111
      # is that pattern.
      - name: Run Claude review (subscription OAuth)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "CLAUDE_CODE_OAUTH_TOKEN not set — skipping AI review (set the secret to enable)."
            printf '%s' '{"result":"{\"summary\":\"AI review skipped: CLAUDE_CODE_OAUTH_TOKEN not configured.\",\"findings\":[]}"}' > /tmp/claude-out.json
            exit 0
          fi
          # Self-hosted runners share one global node_modules. Two jobs running
          # `npm install -g @anthropic-ai/claude-code` at once race on the same
          # dir and one dies with `ENOTEMPTY: rename ... .claude-code-XXedge`
          # (exit 217) — the flake that blocked merges all of 2026-06-10. Serialize
          # the install behind a flock and skip it when claude is already present.
          (
            flock 200
            command -v claude >/dev/null 2>&1 || npm install -g @anthropic-ai/claude-code
          ) 200>/tmp/.force-claude-code-install.lock
          # Opus, not Fable (Ahmad's call, 2026-09-03). This gives up the
          # reviewer/author model rotation — the author and auto-fix also run on
          # Opus — so the reviewer no longer provides an independent second
          # model, only a second pass with a different prompt and no access to
          # the PR body. The scoped audit remains the gate that actually catches
          # things; see CLAUDE.md's reviewer-rotation note for what this trades.
          #
          # stderr is merged into the log: stdout is redirected to a file, so
          # under `set -e` a non-zero exit killed the step before the `cat` and
          # the CLI's own error never appeared anywhere. Four PRs failed this
          # check identically on 2026-09-02 with no diagnosable reason.
          set +e
          claude -p --output-format json \
            --model claude-opus-5 \
            --allowedTools "Read,Grep,Glob" \
            < /tmp/review-input.md > /tmp/claude-out.json 2>/tmp/claude-err.txt
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::claude review CLI exited $rc"
            sed -n '1,40p' /tmp/claude-err.txt
            exit "$rc"
          fi
          cat /tmp/claude-out.json
      - name: Parse, comment, decide
        id: review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CLAUDE_OUTPUT: /tmp/claude-out.json
          AI_FIX_ENABLED: ${{ secrets.AI_FIX_PAT != '' }}
          HEAD_IS_AI_FIX: ${{ steps.head.outputs.is_ai_fix }}
        run: node .github/ai-review/review.mjs
      - name: AI auto-fix critical findings (push re-triggers review)
        if: steps.review.outputs.should_fix == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          AI_FIX_PAT: ${{ secrets.AI_FIX_PAT }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          GH_REPO: ${{ github.repository }}
        run: |
          git config user.name "force-ai-reviewer"
          git config user.email "ahmed0montaser@gmail.com"
          FINDINGS="$(cat /tmp/ai-fix-findings.json)"
          claude -p "You are fixing ONLY these critical findings from a pull-request review. Make the minimal, correct change in the named files. Do NOT refactor or touch unrelated code. Do NOT weaken or delete tests to hide the issue. Findings JSON:
          $FINDINGS" \
            --allowedTools "Read,Grep,Glob,Edit,Write" \
            --model claude-opus-5 \
            --output-format json > /tmp/fix-out.json || true
          if [ -z "$(git status --porcelain)" ]; then
            echo "Auto-fix produced no changes — leaving the PR red for human review."
            exit 1
          fi

          # Pushing anything under .github/workflows/ needs the token's
          # `workflows` permission. AI_FIX_PAT did not have it, and ONE
          # workflow-file edit failed the whole push, losing every other fix in
          # the same commit — measured on PR #1720 (2026-09-11), which reported
          # only "Process completed with exit code 1".
          #
          # This does NOT pre-emptively drop workflow files. It ATTEMPTS the
          # real push and only falls back if GitHub actually refuses, because
          # the permission is a property of the token — invisible from in here,
          # and changeable without touching this file. Reverting on the
          # assumption that it is missing would permanently stop the auto-fix
          # repairing a workflow the day the scope is granted.
          # TRACKED modifications only (#1768): `git status --porcelain` codes
          # a tracked change as ` M` and a brand-new file as `??` identically
          # once piped through `awk '{print $2}'`, so this used to collect
          # both. A NEW workflow file is never staged (see NEW_FILES below),
          # so including it here made two false claims — "will attempt to
          # push" it below, and later the fallback undo step further down
          # (below the push attempt) failed immediately with "pathspec did
          # not match any file(s) known to git" for a path that was never
          # staged, aborting that step atomically under this step's `set -e`
          # and losing the already-staged non-workflow fix with it (measured:
          # PR #1720 lost every fix in the commit this way). Restrict to
          # tracked codes so only paths that get staged below appear here.
          # `grep` exits 1 when nothing matches, and this step's shell runs
          # under GitHub Actions' default `set -e` — with no workflow changes
          # at all (the common case), an unguarded `grep -v` here would abort
          # the whole auto-fix before it staged anything. `|| true` only
          # affects the grep's exit code, not $WF_CHANGED/$WF_NEW's content.
          WF_CHANGED="$(git status --porcelain -- '.github/workflows/**' | { grep -v '^??' || true; } | awk '{print $2}')"
          WF_NEW="$(git status --porcelain -- '.github/workflows/**' | { grep '^??' || true; } | awk '{print $2}')"
          if [ -n "$WF_CHANGED" ]; then
            echo "Auto-fix edited workflow file(s); will attempt to push them:"
            echo "$WF_CHANGED" | sed 's/^/  /'
          fi
          if [ -n "$WF_NEW" ]; then
            echo "::warning::Auto-fix created new workflow file(s), which are never auto-staged/pushed (the same 'workflows' permission gap as an edit — see below):"
            echo "$WF_NEW" | sed 's/^/::warning::  /'
          fi

          # `git add -u` (tracked edits) + a DENYLIST-bounded new-file sweep.
          #
          # History: the new-file pathspec once named exactly six roots (apps
          # packages tests docs scripts .zap), so a fix creating
          # .github/ai-review/*.mjs, .husky/** or a new root config was
          # silently neither staged nor logged (#1758). It became "everything
          # untracked minus workflows" — which is `git add -A` by another name:
          # this step runs `claude -p` with Write, so a plan/notes file the
          # agent drops at the repo root got committed to the contributor's PR
          # as "[ai-fix]" (issue 2102).
          #
          # Now: everything `--exclude-standard` does not ignore (.gitignore
          # already bounds .env*, .claude/, *.log, tmp/), MINUS new workflow
          # files (WF_NEW above warns about those) and MINUS the scratch shapes
          # a code fix never legitimately creates: a new root-level *.md (docs
          # live under docs/), and *.orig / *.rej / *.bak / *.tmp merge and
          # editor leftovers anywhere. Residual hazard, stated plainly: any
          # OTHER stray file the agent writes outside those shapes is still
          # staged — the log below lists every new file, so it is reviewable in
          # the job output and in the pushed commit.
          #
          # NUL-delimited (-z / xargs -0): a new path containing a space used
          # to word-split, abort this step under `set -e` and lose the staged
          # fix with it (the #1768 failure class).
          git add -u
          NEW_FILES_PATHSPEC=(. ':(exclude).github/workflows/**' ':(exclude,glob)*.md' ':(exclude,glob)**/*.orig' ':(exclude,glob)**/*.rej' ':(exclude,glob)**/*.bak' ':(exclude,glob)**/*.tmp')
          NEW_FILES="$(git ls-files --others --exclude-standard -- "${NEW_FILES_PATHSPEC[@]}")"
          if [ -n "$NEW_FILES" ]; then
            echo "Auto-fix created new file(s):"
            echo "$NEW_FILES" | sed 's/^/  /'
            git ls-files -z --others --exclude-standard -- "${NEW_FILES_PATHSPEC[@]}" | xargs -0 -r git add --
          fi

          if git diff --cached --quiet; then
            echo "Auto-fix touched only files it cannot push. Leaving the PR red for human review."
            exit 1
          fi

          git commit -m "fix: address AI-review critical findings [ai-fix]"

          REMOTE="https://x-access-token:${AI_FIX_PAT}@github.com/${GH_REPO}.git"
          if git push "$REMOTE" "HEAD:${PR_HEAD_REF}" 2>/tmp/push-err; then
            cat /tmp/push-err
            echo "Auto-fix pushed; a fresh review run will validate it."
            exit 0
          fi

          cat /tmp/push-err
          # Only ONE rejection is recoverable here: missing the workflows
          # scope on the token. Anything else (protected branch, auth failure,
          # non-fast-forward) is a real failure and must stay red rather than
          # be retried into a partial push that hides it.
          #
          # GitHub words this rejection differently depending on the token
          # type (#1769): a GitHub App / fine-grained PAT is refused "without
          # `workflows` permission" (plural), a classic PAT/OAuth App is
          # refused "without `workflow` scope" (singular) — matching only the
          # first left a classic-PAT AI_FIX_PAT treated as an unrecoverable
          # failure instead of the same recoverable case.
          if ! grep -qE "without \`workflows?\` (permission|scope)" /tmp/push-err; then
            echo "::error::Auto-fix push rejected for a reason other than the workflows permission — see above."
            exit 1
          fi

          echo "::warning::AI_FIX_PAT cannot push .github/workflows/** (missing the 'workflows' permission/scope)."
          echo "::warning::Retrying WITHOUT the workflow changes so the rest of the fix is not lost."
          if [ -z "$WF_CHANGED" ]; then
            echo "::error::Push was refused for workflow permissions but no workflow file changed — nothing to drop."
            exit 1
          fi

          # Undo the commit, restore the workflow files, re-commit the rest.
          git reset --soft HEAD~1
          echo "$WF_CHANGED" | xargs -r git restore --staged --worktree --
          if git diff --cached --quiet; then
            echo "::error::The fix touched ONLY workflow files, which cannot be pushed. Leaving the PR red for a human."
            echo "::error::Grant the 'workflows' permission to AI_FIX_PAT to let the bot fix these itself."
            exit 1
          fi
          git commit -m "fix: address AI-review critical findings [ai-fix]"
          git push "$REMOTE" "HEAD:${PR_HEAD_REF}"
          echo "::warning::Pushed the non-workflow portion. These files still need a human:"
          echo "$WF_CHANGED" | sed 's/^/::warning::  /'
          exit 1
