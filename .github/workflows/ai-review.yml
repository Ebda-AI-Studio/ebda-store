name: AI Review

on:
  pull_request:
    branches: [main]

concurrency:
  group: ai-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  ai-review:
    name: Claude PR review
    # Skip the remediation bot's own PRs — the remediation GATE's review-score IS the review,
    # so re-running AI Review here would double-review bot fixes (branches: remediate/*).
    if: ${{ !startsWith(github.head_ref, 'remediate/') }}
    runs-on: ${{ (inputs.force_cloud || vars.USE_SELF_HOSTED != 'true') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","wsl2"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          # Checkout uses the default GITHUB_TOKEN so a missing/expired AI_FIX_PAT
          # can NEVER block the review. The auto-fix step pushes with the PAT
          # explicitly (that push re-triggers CI + a fresh review).
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Detect prior auto-fix on HEAD (loop guard)
        id: head
        run: |
          if git log -1 --pretty=%s | grep -q '\[ai-fix\]'; then
            echo "is_ai_fix=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_ai_fix=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build review input (instructions + diff)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          {
            cat .github/ai-review/prompt.md
            echo
            echo "PR unified diff follows. Review per the contract above and respond with ONLY the JSON object."
            echo
            git diff "$BASE_SHA...$HEAD_SHA" -- . \
              ':(exclude)**/package-lock.json' ':(exclude)**/*.lock' \
              ':(exclude)**/dist/**' ':(exclude)**/.next/**' ':(exclude)**/*.snap' \
              | python3 -c "import sys; d=sys.stdin.buffer.read(200000); i=d.rfind(b'\n'); sys.stdout.buffer.write(d if i<0 else d[:i+1])"
          } > /tmp/review-input.md
      # REVIEWER ROTATION (lens 26, standard/skill-hygiene.md).
      #
      # The review runs on Fable 5 while the code and the auto-fix below run on
      # Opus 5. The reel's claim is that the shortcuts which create a defect are
      # the ones that miss it in review — one model grading its own output
      # measures convention adherence, not correctness. Live evidence: PR #1099
      # was authored by Claude and passed by this workflow on the same model;
      # both defects found afterwards (an unrun prettier gate, a revived
      # TRUNCATE that broke two integration suites) were the author's.
      #
      # Two things this buys, and one it does not:
      #   + Capability asymmetry in the right direction — Fable 5 is the more
      #     capable model, so the reviewer is strictly stronger than the author.
      #   + Different failure profile from a different training run.
      #   − It does NOT fully decorrelate: same vendor means shared training
      #     lineage, RLHF methodology and tokenizer, so correlated blind spots
      #     remain. A second vendor would decorrelate further. This is the
      #     Claude-only approximation, chosen deliberately.
      #
      # The larger lever is already in place and worth not breaking: the
      # reviewer receives ONLY the prompt contract + the unified diff. It never
      # sees the PR body or the author's rationale, so it cannot inherit the
      # framing that produced the defect. Do not add PR body to the input.
      #
      # The durable answer is neither model: every defect this catches should
      # become a deterministic gate (lint rule, type, test), because those
      # share no blind spots with any model. The SSRF lint rule added in #1111
      # is that pattern.
      - name: Run Claude review (subscription OAuth)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "CLAUDE_CODE_OAUTH_TOKEN not set — skipping AI review (set the secret to enable)."
            printf '%s' '{"result":"{\"summary\":\"AI review skipped: CLAUDE_CODE_OAUTH_TOKEN not configured.\",\"findings\":[]}"}' > /tmp/claude-out.json
            exit 0
          fi
          # Self-hosted runners share one global node_modules. Two jobs running
          # `npm install -g @anthropic-ai/claude-code` at once race on the same
          # dir and one dies with `ENOTEMPTY: rename ... .claude-code-XXedge`
          # (exit 217) — the flake that blocked merges all of 2026-06-10. Serialize
          # the install behind a flock and skip it when claude is already present.
          (
            flock 200
            command -v claude >/dev/null 2>&1 || npm install -g @anthropic-ai/claude-code
          ) 200>/tmp/.force-claude-code-install.lock
          claude -p --output-format json \
            --model claude-fable-5 \
            --allowedTools "Read,Grep,Glob" \
            < /tmp/review-input.md > /tmp/claude-out.json
          cat /tmp/claude-out.json
      - name: Parse, comment, decide
        id: review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CLAUDE_OUTPUT: /tmp/claude-out.json
          AI_FIX_ENABLED: ${{ secrets.AI_FIX_PAT != '' }}
          HEAD_IS_AI_FIX: ${{ steps.head.outputs.is_ai_fix }}
        run: node .github/ai-review/review.mjs
      - name: AI auto-fix critical findings (push re-triggers review)
        if: steps.review.outputs.should_fix == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          AI_FIX_PAT: ${{ secrets.AI_FIX_PAT }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          GH_REPO: ${{ github.repository }}
        run: |
          git config user.name "force-ai-reviewer"
          git config user.email "ahmed0montaser@gmail.com"
          FINDINGS="$(cat /tmp/ai-fix-findings.json)"
          claude -p "You are fixing ONLY these critical findings from a pull-request review. Make the minimal, correct change in the named files. Do NOT refactor or touch unrelated code. Do NOT weaken or delete tests to hide the issue. Findings JSON:
          $FINDINGS" \
            --allowedTools "Read,Grep,Glob,Edit,Write" \
            --model claude-opus-5 \
            --output-format json > /tmp/fix-out.json || true
          if [ -z "$(git status --porcelain)" ]; then
            echo "Auto-fix produced no changes — leaving the PR red for human review."
            exit 1
          fi
          git add -A
          git commit -m "fix: address AI-review critical findings [ai-fix]"
          git push "https://x-access-token:${AI_FIX_PAT}@github.com/${GH_REPO}.git" "HEAD:${PR_HEAD_REF}"
          echo "Auto-fix pushed; a fresh review run will validate it."
