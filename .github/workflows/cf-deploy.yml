name: Deploy to Cloudflare

# Auto-deploys the three Next apps (web / admin / orders) to Cloudflare Workers
# via OpenNext on every push to main. A per-app path filter (detect job) means a
# change to one app only rebuilds that app; a change to packages/** or the CF
# tooling rebuilds all three. The filter diffs against the LAST SUCCESSFUL run on
# main (not HEAD~1), so a run cancelled by the concurrency group below never
# strands its changes; if that lookup fails it deploys all three. Manual
# workflow_dispatch deploys all three.
#
# Runs on the SELF-HOSTED runner by default (vars.USE_SELF_HOSTED == 'true') so it
# costs ZERO GitHub Actions minutes; falls back to ubuntu-latest when offline or
# dispatched with force_cloud.
#
#   web    → store.force-ai.co + every merchant Custom Hostname (SaaS */* fallback)
#   admin  → admin.force-ai.co   (Vercel app.forcemediakw.com stays live until cutover)
#   orders → orders.force-ai.co  (Vercel orders.forcemediakw.com stays live until cutover)
#
# REQUIRED repo SECRETS: CLOUDFLARE_API_TOKEN (Workers Scripts:Edit + Account
# Settings:Read + Zone Workers-Routes/DNS/SSL:Edit on force-ai.co),
# CLOUDFLARE_ACCOUNT_ID. (TELEGRAM_* already set for ci.yml.)
# REQUIRED repo VARIABLES (public NEXT_PUBLIC_*, build-time inlined) — see
# docs/migration/cloudflare-ci-deploy.md for the full list + setup.

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'apps/admin/**'
      - 'apps/orders/**'
      - 'packages/**'
      - 'scripts/cf-build.sh'
      - 'scripts/cf-setup-local.sh'
      - '.github/workflows/cf-deploy.yml'
      # A lockfile-only dependency/security fix (npm audit remediation, a
      # transitive bump) changes what actually ships without touching any
      # app or package source — previously invisible to this trigger, so
      # main could sit deployed on a vulnerable dependency indefinitely.
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
    inputs:
      force_cloud:
        description: 'Run on cloud (ubuntu-latest) instead of self-hosted'
        type: boolean
        default: false

# Cancel a superseded deploy if a newer push lands while one is mid-flight.
# Safe ONLY because detect diffs from the last successful run, not HEAD~1: the
# newer run picks up the cancelled run's changes.
concurrency:
  group: cf-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  # wrangler >= 4.110 refuses to start below Node 22 ("Wrangler requires at least
  # Node.js v22.0.0") — the 4.116.0 pin from #2459 failed all three deploys on 20.
  # ci.yml's cf-build-check runs `wrangler deploy --dry-run` on this same version.
  NODE_VERSION: '22'

permissions:
  contents: read

jobs:
  # Decide which apps to (re)deploy.
  #
  # DIFF BASE = the head sha of the LAST SUCCESSFUL cf-deploy run on main, NOT
  # HEAD~1. The concurrency group below cancels a superseded run, so when two
  # merges land back-to-back the first run is cancelled and the second used to
  # diff only its OWN commit — the first merge's app changes were never
  # deployed (2026-09-30: #2218's admin changes, run dc47b3c5, cancelled by
  # #1983's run 8f7ff845, which diffed only itself). Diffing from the last
  # success covers every commit that has not yet been deployed, however many
  # runs were cancelled, failed or never triggered in between.
  #
  # Why ONE sha is enough (no per-app "last deployed" record): a run concludes
  # `success` only if every deploy job it did not skip succeeded. A deploy job
  # is skipped only when nothing that app builds from changed between that
  # run's base and its head. So by induction, after a successful run at sha S
  # EVERY app's live build equals its build at S — redeployed or not. A failed
  # or cancelled run is not `success`, so the next run diffs from the older
  # success and redeploys whatever that run failed to ship (over-deploy, never
  # under-deploy).
  #
  # The one thing the induction CANNOT see (issue 2241): a change made OUTSIDE
  # this workflow — `npx wrangler rollback` / `wrangler versions deploy` from a
  # laptop. Run history still says "every app is at S", so the rolled-back app
  # stays on its old version until a later commit happens to touch its paths.
  # After an out-of-band rollback, redeploy with `gh workflow run cf-deploy.yml`
  # (dispatch deploys all three) once main is fixed — docs/ROLLBACK.md path A.
  #
  # FAIL SAFE = DEPLOY. Lookup error, no prior success, an unknown / pruned sha,
  # or a base that is not an ancestor of HEAD (history rewrite) → deploy all
  # three. Re-running the run that is already the last success (base == HEAD)
  # also deploys all three: a re-run is an explicit "ship this again".
  # The one deliberate no-op: HEAD is a STRICT ancestor of the last success —
  # e.g. someone re-runs an old, cancelled run after a newer run already
  # shipped. Everything in HEAD is live already, and deploying it would roll
  # production back. To redeploy main, dispatch the workflow instead.
  #
  # workflow_dispatch always deploys all three.
  detect:
    name: Detect changed apps
    # Self-hosted (same as the deploy jobs). GitHub HOSTED ubuntu-latest runners
    # were failing this job before any step ran ("about to start on hosted
    # runner" → failure, no logs), which skipped all three deploys. The
    # self-hosted runner is healthy (it builds + deploys the workers), so run
    # detect there too — no hosted-runner dependency anywhere in this workflow.
    runs-on: ${{ (inputs.force_cloud || vars.USE_SELF_HOSTED != 'true') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","wsl2"]') }}
    timeout-minutes: 5
    # actions: read — to list this workflow's previous runs (the diff base).
    # Job-level permissions REPLACE the workflow-level block, so contents: read
    # is restated for the checkout.
    permissions:
      contents: read
      actions: read
    outputs:
      web: ${{ steps.f.outputs.web }}
      admin: ${{ steps.f.outputs.admin }}
      orders: ${{ steps.f.outputs.orders }}
    steps:
      # Pre-checkout guard (#1883): survives an OOM-kill/guest-restart on a
      # prior job that stranded a root-owned trufflehog-*/ dir `if: always()`
      # cannot cover, because nothing after the kill runs, checkout included.
      - name: Remove root-owned trufflehog scratch (pre-checkout guard, issue 1883)
        # Inline, not a local composite action: a `uses: ./.github/actions/...`
        # step cannot resolve before actions/checkout has put the repo on disk.
        shell: bash
        run: |
          shopt -s nullglob
          # Sparse-checkout leak (2026-09-30): a sparse job on this persistent
          # self-hosted workspace left core.sparseCheckout in .git/config, and
          # the next plain actions/checkout reused it, so orders' deploy got a
          # scripts-only tree ("npm ci: no package-lock.json"). Undo any
          # inherited sparse config BEFORE checkout, in every job.
          if [ -d .git ] && [ "$(git config --get core.sparseCheckout 2>/dev/null)" = "true" ]; then
            echo "::warning::workspace .git carries a sparse-checkout config from a prior job — disabling it before checkout"
            git sparse-checkout disable 2>/dev/null || true
            git config --unset-all core.sparseCheckout 2>/dev/null || true
            git config --unset-all core.sparseCheckoutCone 2>/dev/null || true
            rm -f .git/info/sparse-checkout
          fi
          leftovers=(trufflehog-*)
          if [ ${#leftovers[@]} -eq 0 ]; then
            exit 0
          fi
          echo "::warning::found stranded root-owned trufflehog scratch from a prior job (${leftovers[*]}) — removing before checkout"
          docker run --rm -v "$PWD":/workspace -w /workspace \
            alpine:3.20 sh -c 'rm -rf trufflehog-*' || {
            echo "::warning::trufflehog scratch cleanup failed — checkout may still hit EACCES; needs a root delete on this runner" >&2
            exit 0
          }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history: the diff base is the last SUCCESSFUL deploy, which can
          # be any number of commits behind HEAD.
          fetch-depth: 0
      # Native git diff — no external action. (The previous dorny/paths-filter
      # step failed on push.) A change under packages/** or the CF tooling marks
      # all three apps.
      - id: f
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          deploy_all() {
            printf 'web=true\nadmin=true\norders=true\n' >> "$GITHUB_OUTPUT"
            echo "→ deploying all three: $1"
            # The step summary, not just the log (issue 2240): a persistent
            # fallback here over-deploys every app on every push with a green
            # tick, so its reason has to be visible without opening the job.
            echo "cf-deploy detect: deploying ALL three — $1" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          }
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            deploy_all "workflow_dispatch"
            exit 0
          fi

          # The last SUCCESSFUL run of this workflow on main, via the REST API
          # with curl (issue 2240) — NOT the gh CLI. gh was an unasserted
          # dependency of this self-hosted job (the umbra guest has shipped
          # without it before — runner-health-check.yml), and its absence took
          # the fail-safe branch below on EVERY push: all three apps rebuilt
          # and redeployed forever behind a green tick. curl is already a hard
          # dependency of every job here; the JSON is read with grep/sed
          # because this job has no setup-node. The current run is
          # in_progress, so it can never be its own base.
          api="${GITHUB_API_URL:-https://api.github.com}/repos/$GITHUB_REPOSITORY/actions/workflows/cf-deploy.yml/runs?branch=main&status=success&per_page=1"
          if ! resp="$(curl -sSf -m 20 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$api")"; then
            echo "::warning::could not look up the last successful cf-deploy run — deploying all three (fail safe)"
            deploy_all "last-success lookup failed"
            exit 0
          fi
          # Only workflow_runs[] carry `head_sha` (head_commit uses `id`), and
          # per_page=1 returns at most one run. The here-string feeds grep the
          # whole body, so nothing downstream closes the pipe early.
          base="$(grep -o '"head_sha"[[:space:]]*:[[:space:]]*"[0-9a-f]\{40\}"' <<<"$resp" | sed -n '1s/.*"\([0-9a-f]\{40\}\)"$/\1/p' || true)"
          echo "cf-deploy detect: diff base ${base:-<none>} (last successful cf-deploy on main)" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          head="$(git rev-parse HEAD)"
          if ! [[ "$base" =~ ^[0-9a-f]{40}$ ]]; then
            deploy_all "no previous successful run on main (got '${base}')"
            exit 0
          fi
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "::warning::last successful deploy sha $base is not in this checkout — deploying all three (fail safe)"
            deploy_all "base $base unreachable"
            exit 0
          fi
          if [ "$base" = "$head" ]; then
            deploy_all "re-run of the commit that last deployed successfully"
            exit 0
          fi
          if git merge-base --is-ancestor "$head" "$base"; then
            echo "::warning::$head is already contained in the last successful deploy ($base) — deploying it would roll production back. Nothing to do; dispatch the workflow to redeploy main."
            printf 'web=false\nadmin=false\norders=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git merge-base --is-ancestor "$base" "$head"; then
            echo "::warning::last successful deploy $base is not an ancestor of $head (history rewritten?) — deploying all three (fail safe)"
            deploy_all "base $base not an ancestor of HEAD"
            exit 0
          fi

          if ! changed="$(git diff --name-only "$base" "$head")"; then
            deploy_all "git diff $base..$head failed"
            exit 0
          fi
          echo "Diff base: $base (last successful cf-deploy on main)"
          echo "Changed files since then:"; echo "$changed"
          # Here-strings, not `echo | grep -q`: under pipefail, grep -q exiting
          # on the first match SIGPIPEs a large echo and the pipeline reports
          # "no match" — a multi-commit diff would silently skip an app.
          shared=false
          if grep -qE '^(packages/|scripts/cf-(build|setup-local)\.sh$|\.github/workflows/cf-deploy\.yml$|package\.json$|package-lock\.json$)' <<<"$changed"; then
            shared=true
          fi
          for app in web admin orders; do
            if [ "$shared" = "true" ] || grep -qE "^apps/$app/" <<<"$changed"; then
              echo "$app=true" >> "$GITHUB_OUTPUT"; echo "  → $app: deploy"
            else
              echo "$app=false" >> "$GITHUB_OUTPUT"; echo "  → $app: skip"
            fi
          done

  deploy-web:
    name: Deploy storefront (web)
    needs: detect
    if: needs.detect.outputs.web == 'true'
    runs-on: ${{ (inputs.force_cloud || vars.USE_SELF_HOSTED != 'true') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","wsl2"]') }}
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # Pre-checkout guard (#1883): survives an OOM-kill/guest-restart on a
      # prior job that stranded a root-owned trufflehog-*/ dir `if: always()`
      # cannot cover, because nothing after the kill runs, checkout included.
      - name: Remove root-owned trufflehog scratch (pre-checkout guard, issue 1883)
        # Inline, not a local composite action: a `uses: ./.github/actions/...`
        # step cannot resolve before actions/checkout has put the repo on disk.
        shell: bash
        run: |
          shopt -s nullglob
          # Sparse-checkout leak (2026-09-30): a sparse job on this persistent
          # self-hosted workspace left core.sparseCheckout in .git/config, and
          # the next plain actions/checkout reused it, so orders' deploy got a
          # scripts-only tree ("npm ci: no package-lock.json"). Undo any
          # inherited sparse config BEFORE checkout, in every job.
          if [ -d .git ] && [ "$(git config --get core.sparseCheckout 2>/dev/null)" = "true" ]; then
            echo "::warning::workspace .git carries a sparse-checkout config from a prior job — disabling it before checkout"
            git sparse-checkout disable 2>/dev/null || true
            git config --unset-all core.sparseCheckout 2>/dev/null || true
            git config --unset-all core.sparseCheckoutCone 2>/dev/null || true
            rm -f .git/info/sparse-checkout
          fi
          leftovers=(trufflehog-*)
          if [ ${#leftovers[@]} -eq 0 ]; then
            exit 0
          fi
          echo "::warning::found stranded root-owned trufflehog scratch from a prior job (${leftovers[*]}) — removing before checkout"
          docker run --rm -v "$PWD":/workspace -w /workspace \
            alpine:3.20 sh -c 'rm -rf trufflehog-*' || {
            echo "::warning::trufflehog scratch cleanup failed — checkout may still hit EACCES; needs a root delete on this runner" >&2
            exit 0
          }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Preflight — require Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID repo secrets are not set — see docs/migration/cloudflare-ci-deploy.md"
            exit 1
          fi
      - name: Install dependencies
        run: npm ci
      - name: Build workspace packages (database → shared → ui)
        run: npm run build -w @force/database -w @force/shared -w @force/ui
      - name: Setup Cloudflare build tooling (web)
        env:
          # Unset (default) → empty OpenNext config = current behaviour.
          # Set repo variable OPENNEXT_CACHE=true to emit the R2 + sharded-DO
          # revalidateTag cache (theme saves apply in ~1s instead of ~15s).
          # Verify on a preview deploy before enabling — see
          # docs/migration/cf-opennext-hardening-plan.md.
          OPENNEXT_CACHE: ${{ vars.OPENNEXT_CACHE }}
          # Build from the committed, audited lockfile: `npm ci` already installed
          # the pinned adapter + wrangler. Without this the setup script runs
          # `npm i -D` and re-resolves package-lock.json mid-deploy.
          CF_SETUP_SKIP_DEPS: '1'
        run: bash scripts/cf-setup-local.sh web
      - name: Assert setup did not mutate package.json / package-lock.json
        run: git diff --exit-code -- package.json package-lock.json apps/web/package.json
      - name: Assert the generated worker config matches OPENNEXT_CACHE
        env:
          OPENNEXT_CACHE: ${{ vars.OPENNEXT_CACHE }}
        # cf-setup-local.sh REWRITES open-next.config.ts and wrangler.jsonc on
        # every deploy, and its no-cache branch silently drops the tag cache —
        # revalidateTag then no-ops while the pipeline stays green. The
        # assertion is ONE script shared with ci.yml's cf-build-check (issues
        # 2089/2152/2154). Mode-aware (#1300): 'false' is the documented
        # escape hatch and passes; since issue 2240 an UNSET or mistyped
        # OPENNEXT_CACHE fails here instead of deploying the no-op silently.
        run: bash scripts/assert-cf-cache-bindings.sh web
      - name: Write storefront public env (.env.production.local)
        # NEXT_PUBLIC_* are BUILD-TIME inlined; public values → repo variables,
        # with prod defaults so a missing var still builds.
        env:
          V_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          V_APP_NAME: ${{ vars.NEXT_PUBLIC_APP_NAME }}
          V_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          V_ONESIGNAL: ${{ vars.NEXT_PUBLIC_ONESIGNAL_APP_ID }}
          V_POSTHOG_HOST: ${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}
          V_POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
          V_SENTRY_DSN_WEB: ${{ vars.NEXT_PUBLIC_SENTRY_DSN_WEB }}
          V_VAPID_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
        run: |
          cat > apps/web/.env.production.local <<EOF
          NEXT_PUBLIC_API_URL=${V_API_URL:-https://api.force-ai.co/api/v1}
          NEXT_PUBLIC_APP_NAME=${V_APP_NAME:-Force Store}
          NEXT_PUBLIC_SITE_URL=${V_SITE_URL:-https://store.force-ai.co}
          NEXT_PUBLIC_ONESIGNAL_APP_ID=${V_ONESIGNAL}
          NEXT_PUBLIC_POSTHOG_HOST=${V_POSTHOG_HOST:-https://us.i.posthog.com}
          NEXT_PUBLIC_POSTHOG_KEY=${V_POSTHOG_KEY}
          NEXT_PUBLIC_SENTRY_DSN_WEB=${V_SENTRY_DSN_WEB}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY=${V_VAPID_PUBLIC_KEY}
          EOF
          echo "wrote apps/web/.env.production.local"
      - name: Build for Cloudflare (OpenNext)
        # Source maps: withSentryConfig (apps/web/next.config.js) uploads the
        # browser + server maps for release = GITHUB_SHA during `next build`,
        # then deletes them so they are never served. Without the token it
        # skips with a warning, and a failed upload only warns (errorHandler):
        # this step can never fail the deploy because of Sentry.
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT_WEB || 'force-web' }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "::warning::SENTRY_AUTH_TOKEN secret is not set: web source maps will NOT be uploaded and Sentry stack traces stay minified. See docs/ENVIRONMENT.md (Sentry build-time config)."
          elif [ -z "$SENTRY_PROJECT" ] || { [ -z "$SENTRY_ORG" ] && [ "${SENTRY_AUTH_TOKEN#sntrys_}" = "$SENTRY_AUTH_TOKEN" ]; }; then
            echo "::warning::SENTRY_AUTH_TOKEN is set but SENTRY_ORG / SENTRY_PROJECT is missing: the web upload will fail and be skipped. See docs/ENVIRONMENT.md."
          else
            echo "Sentry source map upload enabled: org=${SENTRY_ORG:-<from token>} project=$SENTRY_PROJECT release=$GITHUB_SHA"
          fi
          bash scripts/cf-build.sh web
      - name: Ensure R2 cache bucket
        # Only when the OpenNext cache is enabled. Idempotent — ignores the
        # "already exists" error so reruns are safe.
        if: vars.OPENNEXT_CACHE == 'true'
        working-directory: apps/web
        run: npx wrangler r2 bucket create force-web-opennext-cache || true
      - name: Deploy worker
        working-directory: apps/web
        # SSR/RSC Sentry (@sentry/cloudflare, see sentry-worker-entry.ts) reads
        # its DSN from the Worker's runtime `env`, not build-time NEXT_PUBLIC_*
        # inlining — `--var` sets it as a plain (non-secret; the DSN is already
        # public in the client bundle) runtime var. Reuses the SAME repo
        # variable as client Sentry, so no new secret to provision. Omitted
        # entirely when unset → sentry-worker-entry.ts no-ops cleanly.
        #
        # SENTRY_RELEASE: @sentry/cloudflare reads `env.SENTRY_RELEASE` as the
        # event release, so Worker (SSR/RSC) events carry the SAME commit SHA
        # the client bundle reports and the source-map upload is keyed on.
        env:
          SENTRY_DSN_WEB: ${{ vars.NEXT_PUBLIC_SENTRY_DSN_WEB }}
        run: |
          if [ -n "$SENTRY_DSN_WEB" ]; then
            npx wrangler deploy --var "SENTRY_DSN:${SENTRY_DSN_WEB}" --var "SENTRY_RELEASE:${GITHUB_SHA}"
          else
            npx wrangler deploy
          fi

  deploy-admin:
    name: Deploy admin
    needs: detect
    if: needs.detect.outputs.admin == 'true'
    runs-on: ${{ (inputs.force_cloud || vars.USE_SELF_HOSTED != 'true') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","wsl2"]') }}
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # Pre-checkout guard (#1883): survives an OOM-kill/guest-restart on a
      # prior job that stranded a root-owned trufflehog-*/ dir `if: always()`
      # cannot cover, because nothing after the kill runs, checkout included.
      - name: Remove root-owned trufflehog scratch (pre-checkout guard, issue 1883)
        # Inline, not a local composite action: a `uses: ./.github/actions/...`
        # step cannot resolve before actions/checkout has put the repo on disk.
        shell: bash
        run: |
          shopt -s nullglob
          # Sparse-checkout leak (2026-09-30): a sparse job on this persistent
          # self-hosted workspace left core.sparseCheckout in .git/config, and
          # the next plain actions/checkout reused it, so orders' deploy got a
          # scripts-only tree ("npm ci: no package-lock.json"). Undo any
          # inherited sparse config BEFORE checkout, in every job.
          if [ -d .git ] && [ "$(git config --get core.sparseCheckout 2>/dev/null)" = "true" ]; then
            echo "::warning::workspace .git carries a sparse-checkout config from a prior job — disabling it before checkout"
            git sparse-checkout disable 2>/dev/null || true
            git config --unset-all core.sparseCheckout 2>/dev/null || true
            git config --unset-all core.sparseCheckoutCone 2>/dev/null || true
            rm -f .git/info/sparse-checkout
          fi
          leftovers=(trufflehog-*)
          if [ ${#leftovers[@]} -eq 0 ]; then
            exit 0
          fi
          echo "::warning::found stranded root-owned trufflehog scratch from a prior job (${leftovers[*]}) — removing before checkout"
          docker run --rm -v "$PWD":/workspace -w /workspace \
            alpine:3.20 sh -c 'rm -rf trufflehog-*' || {
            echo "::warning::trufflehog scratch cleanup failed — checkout may still hit EACCES; needs a root delete on this runner" >&2
            exit 0
          }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Preflight — require Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID repo secrets are not set — see docs/migration/cloudflare-ci-deploy.md"
            exit 1
          fi
      - name: Install dependencies
        run: npm ci
      - name: Build workspace packages (database → shared → ui)
        run: npm run build -w @force/database -w @force/shared -w @force/ui
      - name: Setup Cloudflare build tooling (admin)
        env:
          # Lockfile-only (see the web setup step): no deploy-time re-resolution.
          CF_SETUP_SKIP_DEPS: '1'
        run: bash scripts/cf-setup-local.sh admin
      - name: Assert setup did not mutate package.json / package-lock.json
        run: git diff --exit-code -- package.json package-lock.json apps/admin/package.json
      - name: Write admin public env (.env.production.local)
        # admin's NEXT_PUBLIC_API_URL has NO /api/v1 suffix (the admin apiClient
        # appends it) — distinct from web. APP_NAME also differs ("Force Admin").
        env:
          V_POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
          V_SENTRY_DSN_ADMIN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN_ADMIN }}
        run: |
          cat > apps/admin/.env.production.local <<EOF
          NEXT_PUBLIC_API_URL=https://api.force-ai.co
          NEXT_PUBLIC_APP_NAME=Force Admin
          NEXT_PUBLIC_APP_URL=https://admin.force-ai.co
          NEXT_PUBLIC_WEB_URL=https://store.force-ai.co
          NEXT_PUBLIC_POSTHOG_HOST=https://us.i.posthog.com
          NEXT_PUBLIC_POSTHOG_KEY=${V_POSTHOG_KEY}
          NEXT_PUBLIC_SENTRY_DSN_ADMIN=${V_SENTRY_DSN_ADMIN}
          EOF
          echo "wrote apps/admin/.env.production.local"
      - name: Build for Cloudflare (OpenNext)
        # Source maps: withSentryConfig (apps/admin/next.config.js) uploads the
        # browser + server maps for release = GITHUB_SHA during `next build`,
        # then deletes them so they are never served. Without the token it
        # skips with a warning, and a failed upload only warns (errorHandler):
        # this step can never fail the deploy because of Sentry.
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT_ADMIN }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "::warning::SENTRY_AUTH_TOKEN secret is not set: admin source maps will NOT be uploaded and Sentry stack traces stay minified. See docs/ENVIRONMENT.md (Sentry build-time config)."
          elif [ -z "$SENTRY_PROJECT" ] || { [ -z "$SENTRY_ORG" ] && [ "${SENTRY_AUTH_TOKEN#sntrys_}" = "$SENTRY_AUTH_TOKEN" ]; }; then
            echo "::warning::SENTRY_AUTH_TOKEN is set but SENTRY_ORG / SENTRY_PROJECT is missing: the admin upload will fail and be skipped. See docs/ENVIRONMENT.md."
          else
            echo "Sentry source map upload enabled: org=${SENTRY_ORG:-<from token>} project=$SENTRY_PROJECT release=$GITHUB_SHA"
          fi
          bash scripts/cf-build.sh admin
      - name: Deploy worker
        working-directory: apps/admin
        run: npx wrangler deploy

  deploy-orders:
    name: Deploy orders PWA
    needs: detect
    if: needs.detect.outputs.orders == 'true'
    runs-on: ${{ (inputs.force_cloud || vars.USE_SELF_HOSTED != 'true') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","wsl2"]') }}
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # Pre-checkout guard (#1883): survives an OOM-kill/guest-restart on a
      # prior job that stranded a root-owned trufflehog-*/ dir `if: always()`
      # cannot cover, because nothing after the kill runs, checkout included.
      - name: Remove root-owned trufflehog scratch (pre-checkout guard, issue 1883)
        # Inline, not a local composite action: a `uses: ./.github/actions/...`
        # step cannot resolve before actions/checkout has put the repo on disk.
        shell: bash
        run: |
          shopt -s nullglob
          # Sparse-checkout leak (2026-09-30): a sparse job on this persistent
          # self-hosted workspace left core.sparseCheckout in .git/config, and
          # the next plain actions/checkout reused it, so orders' deploy got a
          # scripts-only tree ("npm ci: no package-lock.json"). Undo any
          # inherited sparse config BEFORE checkout, in every job.
          if [ -d .git ] && [ "$(git config --get core.sparseCheckout 2>/dev/null)" = "true" ]; then
            echo "::warning::workspace .git carries a sparse-checkout config from a prior job — disabling it before checkout"
            git sparse-checkout disable 2>/dev/null || true
            git config --unset-all core.sparseCheckout 2>/dev/null || true
            git config --unset-all core.sparseCheckoutCone 2>/dev/null || true
            rm -f .git/info/sparse-checkout
          fi
          leftovers=(trufflehog-*)
          if [ ${#leftovers[@]} -eq 0 ]; then
            exit 0
          fi
          echo "::warning::found stranded root-owned trufflehog scratch from a prior job (${leftovers[*]}) — removing before checkout"
          docker run --rm -v "$PWD":/workspace -w /workspace \
            alpine:3.20 sh -c 'rm -rf trufflehog-*' || {
            echo "::warning::trufflehog scratch cleanup failed — checkout may still hit EACCES; needs a root delete on this runner" >&2
            exit 0
          }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Preflight — require Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID repo secrets are not set — see docs/migration/cloudflare-ci-deploy.md"
            exit 1
          fi
      - name: Install dependencies
        run: npm ci
      - name: Build workspace packages (database → shared → ui)
        run: npm run build -w @force/database -w @force/shared -w @force/ui
      - name: Setup Cloudflare build tooling (orders)
        env:
          # Lockfile-only (see the web setup step): no deploy-time re-resolution.
          CF_SETUP_SKIP_DEPS: '1'
        run: bash scripts/cf-setup-local.sh orders
      - name: Assert setup did not mutate package.json / package-lock.json
        run: git diff --exit-code -- package.json package-lock.json apps/orders/package.json
      - name: Write orders public env (.env.production.local)
        env:
          V_ONESIGNAL_ORDERS: ${{ vars.NEXT_PUBLIC_ONESIGNAL_ORDERS_APP_ID }}
          V_VAPID_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          V_SENTRY_DSN_ORDERS: ${{ vars.NEXT_PUBLIC_SENTRY_DSN_ORDERS }}
          V_POSTHOG_HOST: ${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}
          V_POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
        run: |
          cat > apps/orders/.env.production.local <<EOF
          NEXT_PUBLIC_API_URL=https://api.force-ai.co
          NEXT_PUBLIC_ONESIGNAL_ORDERS_APP_ID=${V_ONESIGNAL_ORDERS}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY=${V_VAPID_PUBLIC_KEY}
          NEXT_PUBLIC_SENTRY_DSN_ORDERS=${V_SENTRY_DSN_ORDERS}
          NEXT_PUBLIC_POSTHOG_HOST=${V_POSTHOG_HOST:-https://us.i.posthog.com}
          NEXT_PUBLIC_POSTHOG_KEY=${V_POSTHOG_KEY}
          EOF
          echo "wrote apps/orders/.env.production.local"
      - name: Build for Cloudflare (OpenNext)
        # Source maps: withSentryConfig (apps/orders/next.config.js) uploads the
        # browser + server maps for release = GITHUB_SHA during `next build`,
        # then deletes them so they are never served. Without the token it
        # skips with a warning, and a failed upload only warns (errorHandler):
        # this step can never fail the deploy because of Sentry.
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT_ORDERS }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "::warning::SENTRY_AUTH_TOKEN secret is not set: orders source maps will NOT be uploaded and Sentry stack traces stay minified. See docs/ENVIRONMENT.md (Sentry build-time config)."
          elif [ -z "$SENTRY_PROJECT" ] || { [ -z "$SENTRY_ORG" ] && [ "${SENTRY_AUTH_TOKEN#sntrys_}" = "$SENTRY_AUTH_TOKEN" ]; }; then
            echo "::warning::SENTRY_AUTH_TOKEN is set but SENTRY_ORG / SENTRY_PROJECT is missing: the orders upload will fail and be skipped. See docs/ENVIRONMENT.md."
          else
            echo "Sentry source map upload enabled: org=${SENTRY_ORG:-<from token>} project=$SENTRY_PROJECT release=$GITHUB_SHA"
          fi
          bash scripts/cf-build.sh orders
      - name: Deploy worker
        working-directory: apps/orders
        run: npx wrangler deploy

  smoke-test:
    # Added 2026-09-02 (adversarial audit, P3): tests/smoke/ (5 browsers ×
    # real prod URLs) existed and worked but was wired into NOTHING — zero
    # references in any workflow, so a broken deploy was detected by users,
    # not by the repo (railway-deploy.yml at least curls /health; this
    # workflow had no post-deploy check at all). Only the fast chromium
    # storefront+admin projects run here — the full 5-browser matrix is for
    # local/manual runs (npm run test:smoke), not every deploy. This checks
    # the deployed shell actually renders, one layer past a green wrangler
    # deploy or a passing /health check (client hydration, routing).
    name: Post-deploy smoke test
    needs: [deploy-web, deploy-admin, deploy-orders]
    # Run whenever at least one of web/admin actually deployed (not skipped),
    # regardless of whether a SIBLING deploy job was skipped/failed — orders
    # has no smoke coverage yet (tests/smoke/README.md), so it doesn't gate
    # this job either way.
    if: always() && (needs.deploy-web.result == 'success' || needs.deploy-admin.result == 'success')
    runs-on: ${{ (inputs.force_cloud || vars.USE_SELF_HOSTED != 'true') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","wsl2"]') }}
    timeout-minutes: 10
    steps:
      # Pre-checkout guard (#1883): survives an OOM-kill/guest-restart on a
      # prior job that stranded a root-owned trufflehog-*/ dir `if: always()`
      # cannot cover, because nothing after the kill runs, checkout included.
      - name: Remove root-owned trufflehog scratch (pre-checkout guard, issue 1883)
        # Inline, not a local composite action: a `uses: ./.github/actions/...`
        # step cannot resolve before actions/checkout has put the repo on disk.
        shell: bash
        run: |
          shopt -s nullglob
          # Sparse-checkout leak (2026-09-30): a sparse job on this persistent
          # self-hosted workspace left core.sparseCheckout in .git/config, and
          # the next plain actions/checkout reused it, so orders' deploy got a
          # scripts-only tree ("npm ci: no package-lock.json"). Undo any
          # inherited sparse config BEFORE checkout, in every job.
          if [ -d .git ] && [ "$(git config --get core.sparseCheckout 2>/dev/null)" = "true" ]; then
            echo "::warning::workspace .git carries a sparse-checkout config from a prior job — disabling it before checkout"
            git sparse-checkout disable 2>/dev/null || true
            git config --unset-all core.sparseCheckout 2>/dev/null || true
            git config --unset-all core.sparseCheckoutCone 2>/dev/null || true
            rm -f .git/info/sparse-checkout
          fi
          leftovers=(trufflehog-*)
          if [ ${#leftovers[@]} -eq 0 ]; then
            exit 0
          fi
          echo "::warning::found stranded root-owned trufflehog scratch from a prior job (${leftovers[*]}) — removing before checkout"
          docker run --rm -v "$PWD":/workspace -w /workspace \
            alpine:3.20 sh -c 'rm -rf trufflehog-*' || {
            echo "::warning::trufflehog scratch cleanup failed — checkout may still hit EACCES; needs a root delete on this runner" >&2
            exit 0
          }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run smoke suite (storefront + admin, chromium only)
        # The storefront target is a REPO VARIABLE so the reference merchant can
        # change without a code change (#1139 — this deploy gate is otherwise
        # hard-wired to one merchant's custom domain via playwright.config.ts's
        # default). The fallback keeps today's behavior: wadyaljuz.com is the
        # flagship live storefront, and the platform host serves the landing
        # page (no product links), so it cannot satisfy the PDP smoke test.
        # If wadyaljuz churns/lapses, set `SMOKE_STOREFRONT_URL` in the repo's
        # Actions variables to the next reference storefront — no PR needed.
        env:
          SMOKE_STOREFRONT_URL: ${{ vars.SMOKE_STOREFRONT_URL || 'https://wadyaljuz.com' }}
        run: npx playwright test --project=storefront --project=admin
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-smoke-report
          path: playwright-report/
          retention-days: 14

  notify-failure:
    # Stays on ubuntu-latest so it still alerts when the self-hosted runner is
    # the thing that died (mirrors ci.yml's fail-open notify job).
    name: Notify on failure (main only)
    # Self-hosted too — see the detect job note. A deploy workflow only "fails"
    # when a build/deploy step errors; if the self-hosted runner itself is down,
    # the deploys queue (don't fail) so there's nothing to alert about anyway.
    runs-on: ${{ (inputs.force_cloud || vars.USE_SELF_HOSTED != 'true') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","wsl2"]') }}
    timeout-minutes: 2
    needs: [deploy-web, deploy-admin, deploy-orders, smoke-test]
    if: always() && failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Send Telegram alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          WEB_RES: ${{ needs.deploy-web.result }}
          ADMIN_RES: ${{ needs.deploy-admin.result }}
          ORDERS_RES: ${{ needs.deploy-orders.result }}
          SMOKE_RES: ${{ needs.smoke-test.result }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_ALERT_CHAT_ID" ]; then
            echo "telegram secrets not configured — skipping alert"
            exit 0
          fi
          TEXT="🔴 CF deploy FAILED
          web: ${WEB_RES}  admin: ${ADMIN_RES}  orders: ${ORDERS_RES}  smoke: ${SMOKE_RES}
          repo: ${REPO}
          sha: ${SHA:0:8}
          https://github.com/${REPO}/actions/runs/${RUN_ID}"
          curl -sS -m 15 -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_ALERT_CHAT_ID}" \
            --data-urlencode "text=${TEXT}" || true
