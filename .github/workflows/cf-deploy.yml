name: Deploy to Cloudflare

# Auto-deploys the three Next apps (web / admin / orders) to Cloudflare Workers
# via OpenNext on every push to main. A per-app path filter (detect job) means a
# change to one app only rebuilds that app; a change to packages/** or the CF
# tooling rebuilds all three. Manual workflow_dispatch deploys all three.
#
# Runs on the SELF-HOSTED runner by default (vars.USE_SELF_HOSTED == 'true') so it
# costs ZERO GitHub Actions minutes; falls back to ubuntu-latest when offline or
# dispatched with force_cloud.
#
#   web    → store.force-ai.co + every merchant Custom Hostname (SaaS */* fallback)
#   admin  → admin.force-ai.co   (Vercel app.forcemediakw.com stays live until cutover)
#   orders → orders.force-ai.co  (Vercel orders.forcemediakw.com stays live until cutover)
#
# REQUIRED repo SECRETS: CLOUDFLARE_API_TOKEN (Workers Scripts:Edit + Account
# Settings:Read + Zone Workers-Routes/DNS/SSL:Edit on force-ai.co),
# CLOUDFLARE_ACCOUNT_ID. (TELEGRAM_* already set for ci.yml.)
# REQUIRED repo VARIABLES (public NEXT_PUBLIC_*, build-time inlined) — see
# docs/migration/cloudflare-ci-deploy.md for the full list + setup.

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'apps/admin/**'
      - 'apps/orders/**'
      - 'packages/**'
      - 'scripts/cf-build.sh'
      - 'scripts/cf-setup-local.sh'
      - '.github/workflows/cf-deploy.yml'
  workflow_dispatch:
    inputs:
      force_cloud:
        description: 'Run on cloud (ubuntu-latest) instead of self-hosted'
        type: boolean
        default: false

# Cancel a superseded deploy if a newer push lands while one is mid-flight.
concurrency:
  group: cf-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

permissions:
  contents: read

jobs:
  # Decide which apps to (re)deploy. A change under packages/** or the CF tooling
  # marks all three. On workflow_dispatch (no diff base) dorny/paths-filter reports
  # every filter true, so a manual run deploys all three.
  detect:
    name: Detect changed apps
    # Self-hosted (same as the deploy jobs). GitHub HOSTED ubuntu-latest runners
    # were failing this job before any step ran ("about to start on hosted
    # runner" → failure, no logs), which skipped all three deploys. The
    # self-hosted runner is healthy (it builds + deploys the workers), so run
    # detect there too — no hosted-runner dependency anywhere in this workflow.
    runs-on: ${{ (inputs.force_cloud || vars.USE_SELF_HOSTED != 'true') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","wsl2"]') }}
    timeout-minutes: 5
    outputs:
      web: ${{ steps.f.outputs.web }}
      admin: ${{ steps.f.outputs.admin }}
      orders: ${{ steps.f.outputs.orders }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Need the parent commit to diff against. main only ever advances by ONE
          # squash-merge commit (repo policy), so HEAD~1 is always the prior tip.
          fetch-depth: 2
      # Native git diff — no external action. (The previous dorny/paths-filter
      # step failed on push.) A change under packages/** or the CF tooling marks
      # all three apps; workflow_dispatch (no diff base) deploys all three.
      - id: f
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            printf 'web=true\nadmin=true\norders=true\n' >> "$GITHUB_OUTPUT"
            echo "workflow_dispatch → deploying all three"
            exit 0
          fi
          changed="$(git diff --name-only HEAD~1 HEAD)"
          echo "Changed files:"; echo "$changed"
          shared=false
          if echo "$changed" | grep -qE '^(packages/|scripts/cf-(build|setup-local)\.sh$|\.github/workflows/cf-deploy\.yml$)'; then
            shared=true
          fi
          for app in web admin orders; do
            if [ "$shared" = "true" ] || echo "$changed" | grep -qE "^apps/$app/"; then
              echo "$app=true" >> "$GITHUB_OUTPUT"; echo "  → $app: deploy"
            else
              echo "$app=false" >> "$GITHUB_OUTPUT"; echo "  → $app: skip"
            fi
          done

  deploy-web:
    name: Deploy storefront (web)
    needs: detect
    if: needs.detect.outputs.web == 'true'
    runs-on: ${{ (inputs.force_cloud || vars.USE_SELF_HOSTED != 'true') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","wsl2"]') }}
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Preflight — require Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID repo secrets are not set — see docs/migration/cloudflare-ci-deploy.md"
            exit 1
          fi
      - name: Install dependencies
        run: npm ci
      - name: Build workspace packages (database → shared → ui)
        run: npm run build -w @force/database -w @force/shared -w @force/ui
      - name: Setup Cloudflare build tooling (web)
        env:
          # Unset (default) → empty OpenNext config = current behaviour.
          # Set repo variable OPENNEXT_CACHE=true to emit the R2 + sharded-DO
          # revalidateTag cache (theme saves apply in ~1s instead of ~15s).
          # Verify on a preview deploy before enabling — see
          # docs/migration/cf-opennext-hardening-plan.md.
          OPENNEXT_CACHE: ${{ vars.OPENNEXT_CACHE }}
        run: bash scripts/cf-setup-local.sh web
      - name: Write storefront public env (.env.production.local)
        # NEXT_PUBLIC_* are BUILD-TIME inlined; public values → repo variables,
        # with prod defaults so a missing var still builds.
        env:
          V_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          V_APP_NAME: ${{ vars.NEXT_PUBLIC_APP_NAME }}
          V_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          V_ONESIGNAL: ${{ vars.NEXT_PUBLIC_ONESIGNAL_APP_ID }}
          V_POSTHOG_HOST: ${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}
          V_POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
          V_SENTRY_DSN_WEB: ${{ vars.NEXT_PUBLIC_SENTRY_DSN_WEB }}
          V_VAPID_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
        run: |
          cat > apps/web/.env.production.local <<EOF
          NEXT_PUBLIC_API_URL=${V_API_URL:-https://api.force-ai.co/api/v1}
          NEXT_PUBLIC_APP_NAME=${V_APP_NAME:-Force Store}
          NEXT_PUBLIC_SITE_URL=${V_SITE_URL:-https://store.force-ai.co}
          NEXT_PUBLIC_ONESIGNAL_APP_ID=${V_ONESIGNAL}
          NEXT_PUBLIC_POSTHOG_HOST=${V_POSTHOG_HOST:-https://us.i.posthog.com}
          NEXT_PUBLIC_POSTHOG_KEY=${V_POSTHOG_KEY}
          NEXT_PUBLIC_SENTRY_DSN_WEB=${V_SENTRY_DSN_WEB}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY=${V_VAPID_PUBLIC_KEY}
          EOF
          echo "wrote apps/web/.env.production.local"
      - name: Build for Cloudflare (OpenNext)
        run: bash scripts/cf-build.sh web
      - name: Ensure R2 cache bucket
        # Only when the OpenNext cache is enabled. Idempotent — ignores the
        # "already exists" error so reruns are safe.
        if: vars.OPENNEXT_CACHE == 'true'
        working-directory: apps/web
        run: npx wrangler r2 bucket create force-web-opennext-cache || true
      - name: Deploy worker
        working-directory: apps/web
        # SSR/RSC Sentry (@sentry/cloudflare, see sentry-worker-entry.ts) reads
        # its DSN from the Worker's runtime `env`, not build-time NEXT_PUBLIC_*
        # inlining — `--var` sets it as a plain (non-secret; the DSN is already
        # public in the client bundle) runtime var. Reuses the SAME repo
        # variable as client Sentry, so no new secret to provision. Omitted
        # entirely when unset → sentry-worker-entry.ts no-ops cleanly.
        env:
          SENTRY_DSN_WEB: ${{ vars.NEXT_PUBLIC_SENTRY_DSN_WEB }}
        run: |
          if [ -n "$SENTRY_DSN_WEB" ]; then
            npx wrangler deploy --var "SENTRY_DSN:${SENTRY_DSN_WEB}"
          else
            npx wrangler deploy
          fi

  deploy-admin:
    name: Deploy admin
    needs: detect
    if: needs.detect.outputs.admin == 'true'
    runs-on: ${{ (inputs.force_cloud || vars.USE_SELF_HOSTED != 'true') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","wsl2"]') }}
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Preflight — require Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID repo secrets are not set — see docs/migration/cloudflare-ci-deploy.md"
            exit 1
          fi
      - name: Install dependencies
        run: npm ci
      - name: Build workspace packages (database → shared → ui)
        run: npm run build -w @force/database -w @force/shared -w @force/ui
      - name: Setup Cloudflare build tooling (admin)
        run: bash scripts/cf-setup-local.sh admin
      - name: Write admin public env (.env.production.local)
        # admin's NEXT_PUBLIC_API_URL has NO /api/v1 suffix (the admin apiClient
        # appends it) — distinct from web. APP_NAME also differs ("Force Admin").
        env:
          V_POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
          V_SENTRY_DSN_ADMIN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN_ADMIN }}
        run: |
          cat > apps/admin/.env.production.local <<EOF
          NEXT_PUBLIC_API_URL=https://api.force-ai.co
          NEXT_PUBLIC_APP_NAME=Force Admin
          NEXT_PUBLIC_APP_URL=https://admin.force-ai.co
          NEXT_PUBLIC_WEB_URL=https://store.force-ai.co
          NEXT_PUBLIC_POSTHOG_HOST=https://us.i.posthog.com
          NEXT_PUBLIC_POSTHOG_KEY=${V_POSTHOG_KEY}
          NEXT_PUBLIC_SENTRY_DSN_ADMIN=${V_SENTRY_DSN_ADMIN}
          EOF
          echo "wrote apps/admin/.env.production.local"
      - name: Build for Cloudflare (OpenNext)
        run: bash scripts/cf-build.sh admin
      - name: Deploy worker
        working-directory: apps/admin
        run: npx wrangler deploy

  deploy-orders:
    name: Deploy orders PWA
    needs: detect
    if: needs.detect.outputs.orders == 'true'
    runs-on: ${{ (inputs.force_cloud || vars.USE_SELF_HOSTED != 'true') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","wsl2"]') }}
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Preflight — require Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID repo secrets are not set — see docs/migration/cloudflare-ci-deploy.md"
            exit 1
          fi
      - name: Install dependencies
        run: npm ci
      - name: Build workspace packages (database → shared → ui)
        run: npm run build -w @force/database -w @force/shared -w @force/ui
      - name: Setup Cloudflare build tooling (orders)
        run: bash scripts/cf-setup-local.sh orders
      - name: Write orders public env (.env.production.local)
        env:
          V_ONESIGNAL_ORDERS: ${{ vars.NEXT_PUBLIC_ONESIGNAL_ORDERS_APP_ID }}
          V_VAPID_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          V_SENTRY_DSN_ORDERS: ${{ vars.NEXT_PUBLIC_SENTRY_DSN_ORDERS }}
          V_POSTHOG_HOST: ${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}
          V_POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
        run: |
          cat > apps/orders/.env.production.local <<EOF
          NEXT_PUBLIC_API_URL=https://api.force-ai.co
          NEXT_PUBLIC_ONESIGNAL_ORDERS_APP_ID=${V_ONESIGNAL_ORDERS}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY=${V_VAPID_PUBLIC_KEY}
          NEXT_PUBLIC_SENTRY_DSN_ORDERS=${V_SENTRY_DSN_ORDERS}
          NEXT_PUBLIC_POSTHOG_HOST=${V_POSTHOG_HOST:-https://us.i.posthog.com}
          NEXT_PUBLIC_POSTHOG_KEY=${V_POSTHOG_KEY}
          EOF
          echo "wrote apps/orders/.env.production.local"
      - name: Build for Cloudflare (OpenNext)
        run: bash scripts/cf-build.sh orders
      - name: Deploy worker
        working-directory: apps/orders
        run: npx wrangler deploy

  smoke-test:
    # Added 2026-09-02 (adversarial audit, P3): tests/smoke/ (5 browsers ×
    # real prod URLs) existed and worked but was wired into NOTHING — zero
    # references in any workflow, so a broken deploy was detected by users,
    # not by the repo (railway-deploy.yml at least curls /health; this
    # workflow had no post-deploy check at all). Only the fast chromium
    # storefront+admin projects run here — the full 5-browser matrix is for
    # local/manual runs (npm run test:smoke), not every deploy. This checks
    # the deployed shell actually renders, one layer past a green wrangler
    # deploy or a passing /health check (client hydration, routing).
    name: Post-deploy smoke test
    needs: [deploy-web, deploy-admin, deploy-orders]
    # Run whenever at least one of web/admin actually deployed (not skipped),
    # regardless of whether a SIBLING deploy job was skipped/failed — orders
    # has no smoke coverage yet (tests/smoke/README.md), so it doesn't gate
    # this job either way.
    if: always() && (needs.deploy-web.result == 'success' || needs.deploy-admin.result == 'success')
    runs-on: ${{ (inputs.force_cloud || vars.USE_SELF_HOSTED != 'true') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","wsl2"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run smoke suite (storefront + admin, chromium only)
        # The storefront target is a REPO VARIABLE so the reference merchant can
        # change without a code change (#1139 — this deploy gate is otherwise
        # hard-wired to one merchant's custom domain via playwright.config.ts's
        # default). The fallback keeps today's behavior: wadyaljuz.com is the
        # flagship live storefront, and the platform host serves the landing
        # page (no product links), so it cannot satisfy the PDP smoke test.
        # If wadyaljuz churns/lapses, set `SMOKE_STOREFRONT_URL` in the repo's
        # Actions variables to the next reference storefront — no PR needed.
        env:
          SMOKE_STOREFRONT_URL: ${{ vars.SMOKE_STOREFRONT_URL || 'https://wadyaljuz.com' }}
        run: npx playwright test --project=storefront --project=admin
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-report
          path: playwright-report/
          retention-days: 14

  notify-failure:
    # Stays on ubuntu-latest so it still alerts when the self-hosted runner is
    # the thing that died (mirrors ci.yml's fail-open notify job).
    name: Notify on failure (main only)
    # Self-hosted too — see the detect job note. A deploy workflow only "fails"
    # when a build/deploy step errors; if the self-hosted runner itself is down,
    # the deploys queue (don't fail) so there's nothing to alert about anyway.
    runs-on: ${{ (inputs.force_cloud || vars.USE_SELF_HOSTED != 'true') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","wsl2"]') }}
    timeout-minutes: 2
    needs: [deploy-web, deploy-admin, deploy-orders, smoke-test]
    if: always() && failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Send Telegram alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          WEB_RES: ${{ needs.deploy-web.result }}
          ADMIN_RES: ${{ needs.deploy-admin.result }}
          ORDERS_RES: ${{ needs.deploy-orders.result }}
          SMOKE_RES: ${{ needs.smoke-test.result }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_ALERT_CHAT_ID" ]; then
            echo "telegram secrets not configured — skipping alert"
            exit 0
          fi
          TEXT="🔴 CF deploy FAILED
          web: ${WEB_RES}  admin: ${ADMIN_RES}  orders: ${ORDERS_RES}  smoke: ${SMOKE_RES}
          repo: ${REPO}
          sha: ${SHA:0:8}
          https://github.com/${REPO}/actions/runs/${RUN_ID}"
          curl -sS -m 15 -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_ALERT_CHAT_ID}" \
            --data-urlencode "text=${TEXT}" || true
