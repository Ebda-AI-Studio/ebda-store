name: Deploy Ebda storefront to Cloudflare
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/shared/**'
      - 'packages/ui/**'
      - 'package-lock.json'
      - 'scripts/cf-setup-local.sh'
      - 'scripts/cf-routes.cjs'
      - 'scripts/cf-build.sh'
      - 'scripts/assert-cf-cache-bindings.sh'
      - '.github/workflows/cf-web-deploy.yml'
permissions:
  contents: read
concurrency:
  group: ebda-web-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ fromJSON(vars.EBDA_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 30
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: ${{ vars.EBDA_RUNS_ON == '' && 'npm' || '' }}
      - name: Require deployment credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - run: npm ci
      - run: npm run db:generate
      - run: npm run -w packages/shared build
      - run: npm run -w packages/database build
      - run: npx vitest run tests/unit/ebda-cf-generated-routes.test.ts tests/unit/cf-cache-bindings-assert.test.ts
      - name: Generate the web Worker config (routes from BRAND, scripts/cf-routes.cjs)
        env:
          OPENNEXT_CACHE: 'true'
          CF_SETUP_SKIP_DEPS: '1'
        run: |
          bash scripts/cf-setup-local.sh web
          bash scripts/assert-cf-cache-bindings.sh web
      - name: Build web for Cloudflare (OpenNext)
        env:
          # NEXT_PUBLIC_* are baked into the browser bundle at build time.
          NEXT_PUBLIC_API_URL: https://api.ebda.app/api/v1
          NEXT_PUBLIC_SENTRY_DSN_WEB: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN_WEB }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}
          NEXT_PUBLIC_ONESIGNAL_APP_ID: ${{ vars.NEXT_PUBLIC_ONESIGNAL_APP_ID }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT_WEB }}
        run: |
          bash scripts/cf-build.sh web
          echo "BUILD_ID=$(cat apps/web/.next/BUILD_ID)" >> "$GITHUB_ENV"
      - name: Require configured runtime secrets
        working-directory: apps/web
        run: |
          npx wrangler secret list --name ebda-web > "$RUNNER_TEMP/ebda-web-secret-names.json"
          node -e 'const names = new Set(require(process.argv[1]).map(x => x.name)); for (const name of process.argv.slice(2)) { if (!names.has(name)) throw new Error(`Missing Worker secret on ebda-web: ${name}`); }' "$RUNNER_TEMP/ebda-web-secret-names.json" REVALIDATE_SECRET
      - name: Record the version serving production (rollback target)
        id: previous
        working-directory: apps/web
        run: node ../../scripts/ci/deploy-guard.mjs previous --name ebda-web
      - name: Deploy ebda-web Worker
        working-directory: apps/web
        env:
          SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN_WEB }}
        run: |
          # Server-side Sentry DSN for sentry-worker-entry.ts; omitted (clean no-op) when unset.
          if [ -n "$SENTRY_DSN" ]; then npx wrangler deploy --var "BUILD_COMMIT_SHA:$GITHUB_SHA" --var "SENTRY_DSN:$SENTRY_DSN" --var "SHOW_DEMO_STORE_LINK:${{ vars.SHOW_DEMO_STORE_LINK || 'false' }}"; else npx wrangler deploy --var "BUILD_COMMIT_SHA:$GITHUB_SHA" --var "SHOW_DEMO_STORE_LINK:${{ vars.SHOW_DEMO_STORE_LINK || 'false' }}"; fi
      - name: Verify the live Worker serves THIS build, roll back automatically if not
        # Ruling DEPLOY-SAFETY-2. Poll (right after `wrangler deploy` the edge can still serve the
        # previous version for a few seconds). Identity: /_next/static/<BUILD_ID>/_buildManifest.js
        # exists only in this build's assets; the page probe must not 5xx. On failure within 120s:
        # `wrangler rollback <recorded version>`, confirm the old version serves, fail the job.
        # --resolve-ip pins the zone's edge IP so a probe never depends on the runner's DNS cache.
        env:
          PREVIOUS_VERSION: ${{ steps.previous.outputs.previous }}
        run: |
          ip=$(dig +short api.ebda.app | head -1)
          test -n "$ip" || { echo "::error::could not resolve the ebda.app edge IP"; exit 1; }
          node scripts/ci/deploy-guard.mjs verify --name ebda-web --cwd apps/web \
            --previous "$PREVIOUS_VERSION" --sha "$GITHUB_SHA" --window 120 --resolve-ip "$ip" \
            --probe "https://ebda-deploy-probe.ebda.app/_next/static/$BUILD_ID/_buildManifest.js|200" \
            --probe "https://ebda-deploy-probe.ebda.app/|404" \
            --probe "https://ebda-deploy-probe.ebda.app/health|200|commit=$GITHUB_SHA" \
            --rollback-probe "https://ebda-deploy-probe.ebda.app/|404"

  # OPS-5: a failed deploy used to be silent (the storefront stayed on an old build for days). Alerts the Telegram bridge;
  # no secrets configured = skip, never fail.
  notify-failure:
    name: Notify on deploy failure
    needs: [deploy]
    if: always() && needs.deploy.result == 'failure'
    runs-on: ${{ fromJSON(vars.EBDA_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 2
    steps:
      - name: Send Telegram alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          WORKFLOW: ${{ github.workflow }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "${TELEGRAM_BOT_TOKEN:-}" ] && [ -n "${TELEGRAM_ALERT_CHAT_ID:-}" ] || { echo "no telegram secrets - skip"; exit 0; }
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_ALERT_CHAT_ID}" \
            --data-urlencode text="DEPLOY FAILED: ${WORKFLOW} at ${SHA:0:9}. Production did not change (or rolled back). ${RUN_URL}" >/dev/null || true
