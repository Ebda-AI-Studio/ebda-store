name: Deploy Ebda storefront to Cloudflare
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/shared/**'
      - 'packages/ui/**'
      - 'package-lock.json'
      - 'scripts/cf-setup-local.sh'
      - 'scripts/cf-routes.cjs'
      - 'scripts/cf-build.sh'
      - 'scripts/assert-cf-cache-bindings.sh'
      - '.github/workflows/cf-web-deploy.yml'
permissions:
  contents: read
concurrency:
  group: ebda-web-production
  cancel-in-progress: false
# Ruling DEPLOY-OOM-1: every tsc / build step of a deploy gets the same heap as ci.yml. cf-api-deploy's `tsc --noEmit` hit the
# default heap limit on 2026-11-02 (exit 134) and left main undeployed; tests/unit/deploy-workflows-heap.test.ts pins this.
env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  # Ruling CI-BUDGET-2: skip the whole deploy (seconds, not a build) when nothing this app is built from changed -
  # a workflow-only edit, a shared script another app uses, a lockfile entry this app does not depend on.
  # workflow_dispatch and `[force-deploy]` in the head commit message always deploy. scripts/ci/deploy-plan.mjs.
  plan:
    name: Does this push change web?
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ fromJSON(vars.EBDA_RUNS_ON_LIGHT || vars.EBDA_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.plan.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - id: plan
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: node scripts/ci/deploy-plan.mjs --app web --event "$EVENT" --before "$BEFORE" --sha "$GITHUB_SHA"
  deploy:
    needs: [plan]
    if: github.ref == 'refs/heads/main' && needs.plan.outputs.deploy == 'true'
    # ubuntu-latest became 26.04 (2026-11); Playwright 1.60 unsupported — Ruling CI-HOSTED-2
    runs-on: ${{ fromJSON(vars.EBDA_RUNS_ON_LIGHT || vars.EBDA_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: ${{ ((vars.EBDA_RUNS_ON_LIGHT || vars.EBDA_RUNS_ON) == '' || (vars.EBDA_RUNS_ON_LIGHT || vars.EBDA_RUNS_ON) == '"ubuntu-24.04"') && 'npm' || '' }}
      - name: Require deployment credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - run: npm ci
      - run: npm run db:generate
      - run: npm run -w packages/shared build
      - run: npm run -w packages/database build
      - run: npx vitest run tests/unit/ebda-cf-generated-routes.test.ts tests/unit/cf-cache-bindings-assert.test.ts
      - name: Generate the web Worker config (routes from BRAND, scripts/cf-routes.cjs)
        env:
          OPENNEXT_CACHE: 'true'
          CF_SETUP_SKIP_DEPS: '1'
        run: |
          bash scripts/cf-setup-local.sh web
          bash scripts/assert-cf-cache-bindings.sh web
      - name: Build web for Cloudflare (OpenNext)
        env:
          # NEXT_PUBLIC_* are baked into the browser bundle at build time.
          NEXT_PUBLIC_API_URL: https://api.ebda.app/api/v1
          NEXT_PUBLIC_SENTRY_DSN_WEB: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN_WEB }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}
          NEXT_PUBLIC_ONESIGNAL_APP_ID: ${{ vars.NEXT_PUBLIC_ONESIGNAL_APP_ID }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT_WEB }}
        run: |
          bash scripts/cf-build.sh web
          echo "BUILD_ID=$(cat apps/web/.next/BUILD_ID)" >> "$GITHUB_ENV"
      - name: Require configured runtime secrets
        working-directory: apps/web
        run: |
          npx wrangler secret list --name ebda-web > "$RUNNER_TEMP/ebda-web-secret-names.json"
          node -e 'const names = new Set(require(process.argv[1]).map(x => x.name)); for (const name of process.argv.slice(2)) { if (!names.has(name)) throw new Error(`Missing Worker secret on ebda-web: ${name}`); }' "$RUNNER_TEMP/ebda-web-secret-names.json" REVALIDATE_SECRET
      - name: Record the version serving production (rollback target)
        id: previous
        working-directory: apps/web
        run: node ../../scripts/ci/deploy-guard.mjs previous --name ebda-web
      - name: Deploy ebda-web Worker
        # Ruling DEPLOY-TIMEOUT-1: a hung wrangler/OpenNext R2 populate must fail the step, not hold the runner.
        timeout-minutes: 15
        working-directory: apps/web
        env:
          SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN_WEB }}
        run: |
          # Server-side Sentry DSN for sentry-worker-entry.ts; omitted (clean no-op) when unset.
          # Language in the URL for every store host (Rulings LOCALE-PATHS-1/-2): plain vars, re-passed on every deploy
          # (a plain var is dropped by the next deploy unless it is passed again). Roll back with the repo variable
          # STOREFRONT_LOCALE_PATHS=false, or by narrowing STOREFRONT_LOCALE_PATHS_STORES to named stores.
          VARS=(--var "BUILD_COMMIT_SHA:$GITHUB_SHA" --var "SHOW_DEMO_STORE_LINK:${{ vars.SHOW_DEMO_STORE_LINK || 'false' }}" --var "STOREFRONT_LOCALE_PATHS:${{ vars.STOREFRONT_LOCALE_PATHS || 'true' }}" --var "STOREFRONT_LOCALE_PATHS_STORES:${{ vars.STOREFRONT_LOCALE_PATHS_STORES || 'all' }}")
          if [ -n "$SENTRY_DSN" ]; then VARS+=(--var "SENTRY_DSN:$SENTRY_DSN"); fi
          # Ruling DEPLOY-R2-POPULATE-2: the OpenNext CLI deploy populates the R2 cache through a remote-proxy worker whose
          # tunnel never answers on the self-hosted runner (all entries time out, 2026-11-03/04). Populate over the Cloudflare REST API
          # instead (same assets + keys, from OpenNext's own functions), then run the same `wrangler deploy` OpenNext would run.
          # OPEN_NEXT_DEPLOY=true stops wrangler delegating back to OpenNext. Skew protection and the D1 tag cache are not enabled
          # (open-next.config.ts), so OpenNext adds no further --var or populate step.
          node ../../scripts/ci/populate-r2-cache.mjs
          OPEN_NEXT_DEPLOY=true npx wrangler deploy "${VARS[@]}"
      - name: Verify the live Worker serves THIS build, roll back automatically if not
        # Ruling DEPLOY-SAFETY-2. Poll (right after `wrangler deploy` the edge can still serve the
        # previous version for a few seconds). Identity: /_next/static/<BUILD_ID>/_buildManifest.js
        # exists only in this build's assets; the page probe must not 5xx. On failure within 120s:
        # `wrangler rollback <recorded version>`, confirm the old version serves, fail the job.
        # --resolve-ip pins the zone's edge IP so a probe never depends on the runner's DNS cache.
        env:
          PREVIOUS_VERSION: ${{ steps.previous.outputs.previous }}
        run: |
          ip=$(dig +short api.ebda.app | head -1)
          test -n "$ip" || { echo "::error::could not resolve the ebda.app edge IP"; exit 1; }
          node scripts/ci/deploy-guard.mjs verify --name ebda-web --cwd apps/web \
            --previous "$PREVIOUS_VERSION" --sha "$GITHUB_SHA" --window 120 --resolve-ip "$ip" \
            --probe "https://ebda-deploy-probe.ebda.app/_next/static/$BUILD_ID/_buildManifest.js|200" \
            --probe "https://ebda-deploy-probe.ebda.app/|404" \
            --probe "https://ebda-deploy-probe.ebda.app/health|200|commit=$GITHUB_SHA" \
            --rollback-probe "https://ebda-deploy-probe.ebda.app/|404"

  # OPS-5: a failed deploy used to be silent (the storefront stayed on an old build for days). Alerts the Telegram bridge;
  # no secrets configured = skip, never fail.
  notify-failure:
    name: Notify on deploy failure
    needs: [deploy]
    if: always() && needs.deploy.result == 'failure'
    runs-on: ${{ fromJSON(vars.EBDA_RUNS_ON_LIGHT || vars.EBDA_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 2
    steps:
      - name: Send Telegram alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          WORKFLOW: ${{ github.workflow }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "${TELEGRAM_BOT_TOKEN:-}" ] && [ -n "${TELEGRAM_ALERT_CHAT_ID:-}" ] || { echo "no telegram secrets - skip"; exit 0; }
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_ALERT_CHAT_ID}" \
            --data-urlencode text="DEPLOY FAILED: ${WORKFLOW} at ${SHA:0:9}. Production did not change (or rolled back). ${RUN_URL}" >/dev/null || true
