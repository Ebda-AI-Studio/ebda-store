name: Load Test (Manual)

# CORRECTED 2026-09-02 (adversarial audit, P1-6): despite the (legacy) name
# and the header this workflow used to carry, it does NOT run nightly (the
# schedule below has been disabled since 2026-05-27) and its configured
# target does not currently exist: ci.yml's own comment records that "the
# staging environment + branch were retired" 2026-06-13 (staging drained
# Neon + Railway 24/7 for zero use). The K6_BASE_URL/K6_STORE_ID/
# K6_BYPASS_TOKEN/K6_PRODUCT_SLUG secrets are still SET on this repo (so the
# "skip gracefully when secrets are missing" guard below won't save you) —
# but they point at that retired staging env, so a workflow_dispatch today
# will fail against a dead host, not skip. This workflow was last run
# (and failing) 2026-06-04; loadtests/results/ has never held an artifact.
#
# This is a genuinely parked layer, not a dead one to delete: k6 install,
# 5 scenarios and the Axiom metrics push are real, working tooling, and
# docs/DEPLOYMENT.md's "Environments & staging posture" section already
# names "the team is about to run a load test that needs realistic
# concurrent traffic" as one of its 4 documented triggers for graduating to
# a real fwb-staging Railway project. Re-pointing the K6_* secrets at that
# real staging env when it exists is what turns this back on — provisioning
# it is Ahmad's call (real cost, ~$5/mo Railway + Neon branch), not
# something fixable from a git worktree. Until then: manual-dispatch-only,
# and do not read "k6 exists in this repo" as "the load-testing layer is
# live" — it isn't.
#
# Required GitHub repository secrets (already set, but point at a retired target):
#   K6_BYPASS_TOKEN  — matches LOAD_TEST_BYPASS_TOKEN on the target API
#   K6_STORE_ID      — UUID of a live test store on that env
#   K6_PRODUCT_SLUG  — slug of an in-stock product (for checkout-flow scenario)
#   K6_BASE_URL      — target API base, e.g. https://<real-staging-host>/api/v1
#
# NOTE: checkout-flow.js creates real orders on whatever K6_BASE_URL points
# at. It is intentionally gated to manual workflow_dispatch only.

on:
  # schedule: DISABLED 2026-05-27 — load tests are intended for pre-launch + post-infra-change runs, NOT nightly. Pure waste of action minutes when no real merchant load exists. Use workflow_dispatch to fire manually.
  # schedule:
  #   - cron: \'0 3 * * *\'
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Which scenario to run (all | storefront-browse | api-bursts | checkout-flow | multi-store-storm | multi-store-checkout-storm)'
        required: false
        default: 'all'
      store_ids:
        description: 'multi-store-storm only: comma-separated seeded store UUIDs (from seed:loadtest)'
        required: false
        default: ''
      base_url:
        description: 'Override BASE_URL (e.g. the staging API base). Falls back to the K6_BASE_URL secret when blank.'
        required: false
        default: ''
      max_vus:
        description: 'multi-store-storm only: peak VUs (default 100; use 300-500 to find the ceiling)'
        required: false
        default: ''
      force_cloud:
        description: 'Run on cloud (ubuntu-latest) instead of self-hosted'
        type: boolean
        default: false

# Least-privilege default: read-only workflow GITHUB_TOKEN. Jobs that need write
# override upward with their own `permissions:` block.
permissions:
  contents: read

jobs:
  load-test:
    name: k6 Load Test
    runs-on: ${{ (inputs.force_cloud || vars.USE_SELF_HOSTED != 'true') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","wsl2"]') }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check required secrets
        id: secrets-check
        env:
          BYPASS_TOKEN: ${{ secrets.K6_BYPASS_TOKEN }}
          STORE_ID: ${{ secrets.K6_STORE_ID }}
          BASE_URL: ${{ secrets.K6_BASE_URL }}
        run: |
          missing=""
          [ -z "$BYPASS_TOKEN" ] && missing="$missing K6_BYPASS_TOKEN"
          [ -z "$STORE_ID" ]     && missing="$missing K6_STORE_ID"
          [ -z "$BASE_URL" ]     && missing="$missing K6_BASE_URL"
          if [ -n "$missing" ]; then
            echo "::warning::Load test skipped — missing required secrets:$missing"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # No-sudo install — works on BOTH ubuntu-latest (cloud) and the
      # self-hosted WSL runner, whose runner user cannot sudo.
      - name: install k6 (no-sudo, self-hosted + cloud safe)
        if: steps.secrets-check.outputs.skip == 'false'
        run: |
          set -euo pipefail
          if command -v k6 >/dev/null 2>&1; then
            echo "k6 already present: $(k6 version)"
            exit 0
          fi
          K6_VER="v2.0.0"
          ASSET="k6-${K6_VER}-linux-amd64"
          SHA256="2ae87d976f6cdba17185bdd980d8819a3a98e9092c6f0638cd58272ecefc8b90"
          TMP="$(mktemp -d)"
          cd "$TMP"
          curl -fsSL -o k6.tar.gz "https://github.com/grafana/k6/releases/download/${K6_VER}/${ASSET}.tar.gz"
          echo "${SHA256}  k6.tar.gz" | sha256sum -c -
          tar xzf k6.tar.gz
          mkdir -p "$HOME/.local/bin"
          install -m 0755 "${ASSET}/k6" "$HOME/.local/bin/k6"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/k6" version

      - name: Create results directory
        if: steps.secrets-check.outputs.skip == 'false'
        run: mkdir -p loadtests/results

      - name: Run storefront-browse
        id: run-browse
        if: >
          steps.secrets-check.outputs.skip == 'false' &&
          (github.event_name == 'schedule' ||
           github.event.inputs.scenario == 'all' ||
           github.event.inputs.scenario == 'storefront-browse')
        env:
          BASE_URL: ${{ secrets.K6_BASE_URL }}
          STORE_ID: ${{ secrets.K6_STORE_ID }}
          LOAD_TEST_TOKEN: ${{ secrets.K6_BYPASS_TOKEN }}
        run: |
          k6 run \
            --out json=loadtests/results/storefront-browse-$(date +%Y%m%dT%H%M%S).json \
            --summary-export=loadtests/results/summary-storefront-browse-$(date +%Y%m%dT%H%M%S).json \
            loadtests/scenarios/storefront-browse.js

      - name: Run api-bursts
        id: run-bursts
        if: >
          steps.secrets-check.outputs.skip == 'false' &&
          (github.event_name == 'schedule' ||
           github.event.inputs.scenario == 'all' ||
           github.event.inputs.scenario == 'api-bursts')
        env:
          BASE_URL: ${{ secrets.K6_BASE_URL }}
          STORE_ID: ${{ secrets.K6_STORE_ID }}
          LOAD_TEST_TOKEN: ${{ secrets.K6_BYPASS_TOKEN }}
        run: |
          k6 run \
            --out json=loadtests/results/api-bursts-$(date +%Y%m%dT%H%M%S).json \
            --summary-export=loadtests/results/summary-api-bursts-$(date +%Y%m%dT%H%M%S).json \
            loadtests/scenarios/api-bursts.js

      - name: Run checkout-flow (manual only)
        # checkout-flow writes real orders — only available on explicit manual
        # workflow_dispatch targeting this scenario. Never runs on the nightly cron.
        if: >
          steps.secrets-check.outputs.skip == 'false' &&
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.scenario == 'checkout-flow'
        env:
          BASE_URL: ${{ secrets.K6_BASE_URL }}
          STORE_ID: ${{ secrets.K6_STORE_ID }}
          PRODUCT_SLUG: ${{ secrets.K6_PRODUCT_SLUG }}
          LOAD_TEST_TOKEN: ${{ secrets.K6_BYPASS_TOKEN }}
        run: |
          k6 run \
            --out json=loadtests/results/checkout-flow-$(date +%Y%m%dT%H%M%S).json \
            --summary-export=loadtests/results/summary-checkout-flow-$(date +%Y%m%dT%H%M%S).json \
            loadtests/scenarios/checkout-flow.js

      - name: Run multi-store-storm (manual only)
        # Cross-tenant concurrent load across N seeded stores. Manual-dispatch
        # only — needs store_ids (seeded via seed:loadtest) that don't exist
        # until set up. base_url override lets the dispatcher force staging so
        # this never accidentally hammers production.
        if: >
          steps.secrets-check.outputs.skip == 'false' &&
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.scenario == 'multi-store-storm'
        env:
          BASE_URL: ${{ github.event.inputs.base_url != '' && github.event.inputs.base_url || secrets.K6_BASE_URL }}
          STORE_IDS: ${{ github.event.inputs.store_ids }}
          LOAD_TEST_TOKEN: ${{ secrets.K6_BYPASS_TOKEN }}
          STORM_MAX_VUS: ${{ github.event.inputs.max_vus }}
        run: |
          if [ -z "${STORE_IDS:-}" ]; then
            echo "::error::multi-store-storm requires the store_ids input (comma-separated seeded store UUIDs)"
            exit 1
          fi
          k6 run \
            --out json=loadtests/results/multi-store-storm-$(date +%Y%m%dT%H%M%S).json \
            --summary-export=loadtests/results/summary-multi-store-storm-$(date +%Y%m%dT%H%M%S).json \
            loadtests/scenarios/multi-store-storm.js

      - name: Run multi-store-checkout-storm (manual only)
        # Cross-tenant WRITE storm: concurrent COD checkouts across N seeded
        # stores → uncached order placement + per-tenant RLS transaction. The
        # real pool-contention test. Writes real orders (staging + disposable
        # stores only); seed:loadtest:cleanup removes them (orders deleted first).
        if: >
          steps.secrets-check.outputs.skip == 'false' &&
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.scenario == 'multi-store-checkout-storm'
        env:
          BASE_URL: ${{ github.event.inputs.base_url != '' && github.event.inputs.base_url || secrets.K6_BASE_URL }}
          STORE_IDS: ${{ github.event.inputs.store_ids }}
          LOAD_TEST_TOKEN: ${{ secrets.K6_BYPASS_TOKEN }}
          STORM_MAX_VUS: ${{ github.event.inputs.max_vus }}
        run: |
          if [ -z "${STORE_IDS:-}" ]; then
            echo "::error::multi-store-checkout-storm requires the store_ids input (comma-separated seeded store UUIDs)"
            exit 1
          fi
          k6 run \
            --out json=loadtests/results/multi-store-checkout-storm-$(date +%Y%m%dT%H%M%S).json \
            --summary-export=loadtests/results/summary-multi-store-checkout-storm-$(date +%Y%m%dT%H%M%S).json \
            loadtests/scenarios/multi-store-checkout-storm.js

      - name: Push metrics to Axiom
        # Runs even when k6 exits non-zero (threshold breach) so we always record the data point.
        if: steps.secrets-check.outputs.skip == 'false' && always()
        env:
          AXIOM_INGEST_TOKEN: ${{ secrets.AXIOM_INGEST_TOKEN }}
        run: |
          bash loadtests/push-metrics.sh

      - name: Upload k6 results
        if: steps.secrets-check.outputs.skip == 'false' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: k6-results-${{ github.run_id }}
          path: loadtests/results/
          retention-days: 30
