name: Cloud rescue (self-hosted infra-flake failover)

# Auto-falls-back to ubuntu-latest cloud ONLY when a self-hosted run failed for an
# INFRA reason (runner offline, DNS drop, Docker hiccup, missing tool) — never for a
# real test failure (it would fail on cloud too). Default stays self-hosted to save
# GitHub-Pro cloud minutes; this is the safety net. Must run on ubuntu-latest itself.
# Policy set 2026-06-01 (Ahmad). force_cloud=true re-dispatch prevents rescue loops.

on:
  workflow_run:
    workflows:
      - "CI"
      - "gitleaks"
      - "Neon snapshot"
      - "Preview env isolation (rule 13)"
      - "Lighthouse storefront audit"
      - "Load Test (Nightly)"
      - "Deploy"
      - "Auto-fix watchdog"
    types:
      - completed

permissions:
  actions: write
  contents: read

jobs:
  rescue:
    name: Detect runner infra flake and re-dispatch on cloud
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt == 1
    steps:
      - name: Decide whether failure is a self-hosted infra flake
        id: flake-check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          JOBS=$(gh api "repos/${REPO}/actions/runs/${RUN_ID}/jobs")
          TOTAL=$(echo "$JOBS" | jq '.total_count')
          if [ "$TOTAL" -eq 0 ]; then
            echo "flake=true" >> "$GITHUB_OUTPUT"
            echo "Infra flake: no jobs picked up (runner offline)"; exit 0
          fi
          SETUP_FLAKE=$(echo "$JOBS" | jq '
            [.jobs[] | select((.conclusion == "failure") and (
              (.steps == null) or ((.steps | length) == 0) or
              (.steps[0].name == "Set up job" and .steps[0].conclusion == "failure")))] | length > 0')
          if [ "$SETUP_FLAKE" = "true" ]; then
            echo "flake=true" >> "$GITHUB_OUTPUT"
            echo "Infra flake: a job failed at 'Set up job' (runner offline)"; exit 0
          fi
          LOG_ZIP="$(mktemp).zip"
          if gh api "repos/${REPO}/actions/runs/${RUN_ID}/logs" > "$LOG_ZIP" 2>/dev/null; then
            mkdir -p /tmp/runlogs && unzip -oq "$LOG_ZIP" -d /tmp/runlogs || true
            if grep -rqiE "Could not resolve host|Temporary failure in name resolution|Docker start fail with exit code|failed to start service container|jq: command not found|exit code 127|gzip: stdin: unexpected end of file|tar: Child returned status" /tmp/runlogs 2>/dev/null; then
              echo "flake=true" >> "$GITHUB_OUTPUT"
              echo "Infra flake: matched a WSL-runner infra signature (DNS/Docker/missing-tool)"; exit 0
            fi
          else
            echo "Note: could not download run logs — skipping log-signature check"
          fi
          echo "flake=false" >> "$GITHUB_OUTPUT"
          echo "Real test/build failure — no cloud rescue"

      - name: Re-dispatch workflow with force_cloud=true
        if: steps.flake-check.outputs.flake == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
        run: |
          set -euo pipefail
          WORKFLOW_FILE=$(gh api "repos/${REPO}/actions/workflows/${WORKFLOW_ID}" --jq '.path' | sed 's|.github/workflows/||')
          echo "Re-dispatching ${WORKFLOW_NAME} (${WORKFLOW_FILE}) on CLOUD for ${HEAD_SHA:0:8} (${HEAD_BRANCH})"
          gh workflow run "$WORKFLOW_FILE" --repo "$REPO" --ref "$HEAD_BRANCH" -f force_cloud=true
          echo "Cloud rescue dispatched."
