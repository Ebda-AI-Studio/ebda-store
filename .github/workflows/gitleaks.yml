name: gitleaks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      force_cloud:
        description: 'Run on cloud (ubuntu-latest) instead of self-hosted'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # A push to main gets a group of its OWN (keyed by sha) so a burst of merges never collapses
  # into one. `cancel-in-progress: false` alone was not enough (issue 2454): GitHub keeps at most
  # ONE pending run per group, so a second merge cancelled the earlier main run while it was still
  # pending, before it ever scanned, and the required "Scan for leaked secrets" gate went
  # `cancelled` on main commits. PR pushes keep the per-ref group, where cancelling the superseded
  # run is correct (a newer sha supersedes it).
  group: gitleaks-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan:
    name: Scan for leaked secrets
    runs-on: ${{ (inputs.force_cloud || vars.USE_SELF_HOSTED != 'true') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","wsl2"]') }}
    timeout-minutes: 10
    steps:
      # Pre-checkout guard (#1883): survives an OOM-kill/guest-restart on a
      # prior job that stranded a root-owned trufflehog-*/ dir `if: always()`
      # cannot cover, because nothing after the kill runs, checkout included.
      - name: Remove root-owned trufflehog scratch (pre-checkout guard, issue 1883)
        # Inline, not a local composite action: a `uses: ./.github/actions/...`
        # step cannot resolve before actions/checkout has put the repo on disk.
        shell: bash
        run: |
          shopt -s nullglob
          # Sparse-checkout leak (2026-09-30): a sparse job on this persistent
          # self-hosted workspace left core.sparseCheckout in .git/config, and
          # the next plain actions/checkout reused it, so orders' deploy got a
          # scripts-only tree ("npm ci: no package-lock.json"). Undo any
          # inherited sparse config BEFORE checkout, in every job.
          if [ -d .git ] && [ "$(git config --get core.sparseCheckout 2>/dev/null)" = "true" ]; then
            echo "::warning::workspace .git carries a sparse-checkout config from a prior job — disabling it before checkout"
            git sparse-checkout disable 2>/dev/null || true
            git config --unset-all core.sparseCheckout 2>/dev/null || true
            git config --unset-all core.sparseCheckoutCone 2>/dev/null || true
            rm -f .git/info/sparse-checkout
          fi
          leftovers=(trufflehog-*)
          if [ ${#leftovers[@]} -eq 0 ]; then
            exit 0
          fi
          echo "::warning::found stranded root-owned trufflehog scratch from a prior job (${leftovers[*]}) — removing before checkout"
          docker run --rm -v "$PWD":/workspace -w /workspace \
            alpine:3.20 sh -c 'rm -rf trufflehog-*' || {
            echo "::warning::trufflehog scratch cleanup failed — checkout may still hit EACCES; needs a root delete on this runner" >&2
            exit 0
          }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -eu
          GITLEAKS_VERSION=8.21.2
          # Match the runner's architecture — hardcoding x64 only ever worked on
          # the OrbStack runners because of Rosetta binfmt; arm64 runners without
          # it (Umbra fwb-ci VMs) die with "cannot execute binary file".
          case "$(uname -m)" in
            aarch64|arm64) GITLEAKS_ARCH=arm64 ;;
            *) GITLEAKS_ARCH=x64 ;;
          esac
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_${GITLEAKS_ARCH}.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Run gitleaks
        run: gitleaks detect --source . --config .gitleaks.toml --redact --verbose --exit-code 1

  notify-failure:
    name: Notify on failure (main only)
    needs: [scan]
    if: always() && failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Self-hosted by DEFAULT, but still behind the toggle — same form as the
    # identical job in ci.yml:842, which carries the same rationale without
    # giving up the kill switch.
    #
    # This was a hardcoded `[self-hosted, linux, wsl2]`, the only one in the
    # repo. The reasoning was sound (with the org billing block a
    # GitHub-hosted job dies in ~3s with no runner assigned, and silence from
    # an alerting job reads as green) but it traded one silence for another:
    # `vars.USE_SELF_HOSTED=false` is the documented escape hatch for a runner
    # that is drained or offline, and a hardcoded label opts this job out of
    # it. GitHub does not FAIL a job whose labels match no online runner — it
    # QUEUES it, for up to ~24h, and `timeout-minutes` below only starts
    # counting once a runner is assigned. So in the exact incident the runbook
    # is written for, the secret-leak alert never sends and the run shows as
    # still in progress.
    #
    # The billing block is expressed by `vars.USE_SELF_HOSTED` being 'true',
    # not by hardcoding the label.
    #
    # To be explicit about what the toggle is and is not: GitHub-hosted runners
    # are billing-blocked for this org, so setting it to 'false' does NOT move
    # this job to runners that can execute it. Today the toggle's value is that
    # no job is UN-MOVABLE and the escape hatch is ready if billing is
    # restored. When the guest is sick, the fix is the guest — see
    # docs/runbooks/wsl-runner-maintenance.md.
    runs-on: ${{ vars.USE_SELF_HOSTED != 'true' && 'ubuntu-latest' || fromJSON('["self-hosted","linux","wsl2"]') }}
    timeout-minutes: 2
    steps:
      - name: Telegram alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
        # Inert (skips) when secrets are absent — never a hard failure.
        run: |
          [ -n "${TELEGRAM_BOT_TOKEN:-}" ] && [ -n "${TELEGRAM_ALERT_CHAT_ID:-}" ] || { echo "no telegram secrets — skip"; exit 0; }
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_ALERT_CHAT_ID}" -d parse_mode=Markdown \
            -d text="🔴 [GITLEAKS] ${{ github.repository }} on \`${{ github.sha }}\` — https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
