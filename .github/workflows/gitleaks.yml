name: gitleaks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly scan of main's FULL history (HEAD of the default branch; never other refs, GITLEAKS-SCOPE-1).
    - cron: '23 2 * * *'

permissions:
  contents: read

concurrency:
  # A push to main gets a group of its OWN (keyed by sha) so a burst of merges never collapses
  # into one. `cancel-in-progress: false` alone was not enough (issue 2454): GitHub keeps at most
  # ONE pending run per group, so a second merge cancelled the earlier main run while it was still
  # pending, before it ever scanned, and the required "Scan for leaked secrets" gate went
  # `cancelled` on main commits. PR pushes keep the per-ref group, where cancelling the superseded
  # run is correct (a newer sha supersedes it).
  group: gitleaks-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan:
    name: Scan for leaked secrets
    # ubuntu-latest became 26.04 (2026-11); Playwright 1.60 unsupported — Ruling CI-HOSTED-2
    runs-on: ${{ fromJSON(contains(github.event.pull_request.labels.*.name, 'ci-umbra') && '["self-hosted","umbra-ebda"]' || vars.EBDA_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -eu
          GITLEAKS_VERSION=8.21.2
          # Match the runner's architecture (x64 on ubuntu-latest).
          case "$(uname -m)" in
            aarch64|arm64) GITLEAKS_ARCH=arm64 ;;
            *) GITLEAKS_ARCH=x64 ;;
          esac
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_${GITLEAKS_ARCH}.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Run gitleaks
        # Scope (Ruling GITLEAKS-SCOPE-1). `gitleaks detect` with no --log-opts walks `git log --all`, and with
        # fetch-depth 0 that includes every open PR branch, so a test fixture on someone's branch turned main
        # red and paged on every push (12 times overnight). Each event now scans exactly its own history:
        #   pull_request   base..head (the PR's own commits)
        #   push to main   before..after (what this push added); a first push / zero `before` scans HEAD
        #   schedule, manual dispatch   HEAD only = the checked-out branch (main for the nightly), never --all
        # No allowlist is added: a real finding on main still fails.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = "pull_request" ]; then
            RANGE="${BASE_SHA}..${HEAD_SHA}"
          elif [ "$EVENT_NAME" = "push" ] && [ -n "${PUSH_BEFORE:-}" ] && [ "${PUSH_BEFORE}" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            RANGE="${PUSH_BEFORE}..${PUSH_AFTER}"
          else
            RANGE="HEAD"
          fi
          echo "gitleaks: scanning ${RANGE}"
          gitleaks detect --source . --config .gitleaks.toml --log-opts="${RANGE}" --redact --verbose --exit-code 1

  notify-failure:
    name: Notify on failure (main only)
    needs: [scan]
    if: always() && failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ fromJSON(contains(github.event.pull_request.labels.*.name, 'ci-umbra') && '["self-hosted","umbra-ebda"]' || vars.EBDA_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 2
    steps:
      - name: Telegram alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
        # Inert (skips) when secrets are absent — never a hard failure.
        run: |
          [ -n "${TELEGRAM_BOT_TOKEN:-}" ] && [ -n "${TELEGRAM_ALERT_CHAT_ID:-}" ] || { echo "no telegram secrets — skip"; exit 0; }
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_ALERT_CHAT_ID}" -d parse_mode=Markdown \
            -d text="🔴 [GITLEAKS] ${{ github.repository }} on \`${{ github.sha }}\` — https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
