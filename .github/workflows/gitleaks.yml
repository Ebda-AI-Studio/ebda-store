name: gitleaks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      force_cloud:
        description: 'Run on cloud (ubuntu-latest) instead of self-hosted'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  scan:
    name: Scan for leaked secrets
    runs-on: ${{ (inputs.force_cloud || vars.USE_SELF_HOSTED != 'true') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","wsl2"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -eu
          GITLEAKS_VERSION=8.21.2
          # Match the runner's architecture — hardcoding x64 only ever worked on
          # the OrbStack runners because of Rosetta binfmt; arm64 runners without
          # it (Umbra fwb-ci VMs) die with "cannot execute binary file".
          case "$(uname -m)" in
            aarch64|arm64) GITLEAKS_ARCH=arm64 ;;
            *) GITLEAKS_ARCH=x64 ;;
          esac
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_${GITLEAKS_ARCH}.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Run gitleaks
        run: gitleaks detect --source . --config .gitleaks.toml --redact --verbose --exit-code 1

  notify-failure:
    name: Notify on failure (main only)
    needs: [scan]
    if: always() && failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Telegram alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
        # Inert (skips) when secrets are absent — never a hard failure.
        run: |
          [ -n "${TELEGRAM_BOT_TOKEN:-}" ] && [ -n "${TELEGRAM_ALERT_CHAT_ID:-}" ] || { echo "no telegram secrets — skip"; exit 0; }
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_ALERT_CHAT_ID}" -d parse_mode=Markdown \
            -d text="🔴 [GITLEAKS] ${{ github.repository }} on \`${{ github.sha }}\` — https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
