name: gitleaks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      force_cloud:
        description: 'Run on cloud (ubuntu-latest) instead of self-hosted'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  scan:
    name: Scan for leaked secrets
    runs-on: ${{ (inputs.force_cloud || vars.USE_SELF_HOSTED != 'true') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","wsl2"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -eu
          GITLEAKS_VERSION=8.21.2
          # Match the runner's architecture — hardcoding x64 only ever worked on
          # the OrbStack runners because of Rosetta binfmt; arm64 runners without
          # it (Umbra fwb-ci VMs) die with "cannot execute binary file".
          case "$(uname -m)" in
            aarch64|arm64) GITLEAKS_ARCH=arm64 ;;
            *) GITLEAKS_ARCH=x64 ;;
          esac
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_${GITLEAKS_ARCH}.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Run gitleaks
        run: gitleaks detect --source . --config .gitleaks.toml --redact --verbose --exit-code 1
