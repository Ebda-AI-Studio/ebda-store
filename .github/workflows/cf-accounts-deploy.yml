name: Deploy Ebda accounts (identity) to Cloudflare
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/accounts/**'
      # The sign-in page validates `return` with the Store's allowlist (Ruling ACCOUNTS-PAGE-1): a change to it ships here too.
      - 'apps/admin/src/lib/sign-in-return.ts'
      - 'package-lock.json'
      - '.github/workflows/cf-accounts-deploy.yml'
permissions:
  contents: read
concurrency:
  group: ebda-accounts-production
  cancel-in-progress: false
# Ruling DEPLOY-OOM-1: every tsc / build step of a deploy gets the same heap as ci.yml. cf-api-deploy's `tsc --noEmit` hit the
# default heap limit on 2026-11-02 (exit 134) and left main undeployed; tests/unit/deploy-workflows-heap.test.ts pins this.
env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  # Ruling CI-BUDGET-2: skip the whole deploy (seconds, not a build) when nothing this app is built from changed -
  # a workflow-only edit, a shared script another app uses, a lockfile entry this app does not depend on.
  # workflow_dispatch and `[force-deploy]` in the head commit message always deploy. scripts/ci/deploy-plan.mjs.
  plan:
    name: Does this push change accounts?
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ fromJSON(vars.EBDA_LIGHT_RUNS_ON || vars.EBDA_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 15 # a full-history clone on a slow link took >5 min (Ruling DEPLOY-PLAN-CLONE-1)
    outputs:
      deploy: ${{ steps.plan.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none # full history, file contents fetched on demand (Ruling DEPLOY-PLAN-CLONE-1)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - id: plan
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: node scripts/ci/deploy-plan.mjs --app accounts --event "$EVENT" --before "$BEFORE" --sha "$GITHUB_SHA"
  deploy:
    needs: [plan]
    if: github.ref == 'refs/heads/main' && needs.plan.outputs.deploy == 'true'
    # ubuntu-latest became 26.04 (2026-11); Playwright 1.60 unsupported — Ruling CI-HOSTED-2
    runs-on: ${{ fromJSON(vars.EBDA_LIGHT_RUNS_ON || vars.EBDA_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: ${{ vars.EBDA_RUNS_ON == '' && 'npm' || '' }}
      - name: Require deployment credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - run: npm ci
      - name: Typecheck and test the identity service (workerd, local D1)
        run: |
          npm run typecheck -w apps/accounts
          npm run test -w apps/accounts
      - name: Record the version serving production (rollback target)
        id: previous
        working-directory: apps/accounts
        run: node ../../scripts/ci/deploy-guard.mjs previous --name ebda-accounts
      # Migrations are additive and idempotent (d1_migrations ledger); the Worker only ever reads columns that exist
      # in the CURRENT migration set, so schema goes first.
      - name: Apply D1 migrations (ebda-identity)
        working-directory: apps/accounts
        run: npx wrangler d1 migrations apply ebda-identity --remote
      - name: Deploy ebda-accounts Worker
        # Ruling DEPLOY-TIMEOUT-1: a hung wrangler/OpenNext R2 populate must fail the step, not hold the runner.
        timeout-minutes: 10
        working-directory: apps/accounts
        run: npx wrangler deploy --var BUILD_COMMIT_SHA:$GITHUB_SHA
      - name: Verify the live Worker, roll back automatically if not
        env:
          PREVIOUS_VERSION: ${{ steps.previous.outputs.previous }}
        run: |
          ip=$(dig +short api.ebda.app | head -1)
          test -n "$ip" || { echo "::error::could not resolve the ebda.app edge IP"; exit 1; }
          node scripts/ci/deploy-guard.mjs verify --name ebda-accounts --cwd apps/accounts \
            --previous "$PREVIOUS_VERSION" --sha "$GITHUB_SHA" --window 120 --resolve-ip "$ip" \
            --probe "https://accounts.ebda.app/health|200" \
            --probe "https://accounts.ebda.app/.well-known/jwks.json|200" \
            --rollback-probe "https://accounts.ebda.app/health|200"

  # OPS-5: a failed deploy used to be silent (the storefront stayed on an old build for days). Alerts the Telegram bridge;
  # no secrets configured = skip, never fail.
  notify-failure:
    name: Notify on deploy failure
    needs: [deploy]
    if: always() && needs.deploy.result == 'failure'
    runs-on: ${{ fromJSON(vars.EBDA_LIGHT_RUNS_ON || vars.EBDA_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 2
    steps:
      - name: Send Telegram alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          WORKFLOW: ${{ github.workflow }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "${TELEGRAM_BOT_TOKEN:-}" ] && [ -n "${TELEGRAM_ALERT_CHAT_ID:-}" ] || { echo "no telegram secrets - skip"; exit 0; }
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_ALERT_CHAT_ID}" \
            --data-urlencode text="DEPLOY FAILED: ${WORKFLOW} at ${SHA:0:9}. Production did not change (or rolled back). ${RUN_URL}" >/dev/null || true
