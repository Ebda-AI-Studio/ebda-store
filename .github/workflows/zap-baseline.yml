name: ZAP Baseline DAST

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: 'URL to scan (defaults to repo ZAP_TARGET var)'
        required: false
        type: string
      force_cloud:
        description: 'Run on cloud (ubuntu-latest) instead of self-hosted'
        type: boolean
        default: false

permissions:
  # `issues: write` dropped with `allow_issue_writing` — no reason to hand a
  # write-scoped token to a third-party action running against a production URL
  # on a nightly schedule.
  contents: read

# #1748: `gh run list` on 2026-09-25 showed several nightly runs sitting
# QUEUED for 1-24h before running/being cancelled — the self-hosted runner was
# out of disk space (17 MB free, confirmed in a run's own annotations), not
# scanning slowly. A superseded queued run (yesterday's scan of the same URL,
# still waiting for a runner) is stale the moment a newer one is dispatched, so
# let the newer one cancel it instead of the two competing for the same
# starved runner.
concurrency:
  group: zap-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zap:
    name: ZAP baseline
    # Stays dormant until a ZAP_TARGET repo variable (or dispatch input) is set,
    # so scheduled runs don't fail before a staging/preview URL is configured.
    if: ${{ github.event.inputs.target != '' || vars.ZAP_TARGET != '' }}
    runs-on: ${{ (inputs.force_cloud || vars.USE_SELF_HOSTED != 'true') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","wsl2"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ github.event.inputs.target || vars.ZAP_TARGET }}
          rules_file_name: '.zap/rules.tsv'
          # `-I` REMOVED (2026-09-11). It is zap-baseline.py's "do not return
          # failure on warning", and baseline alerts are WARN-level by default
          # — so with `-I` the scan exited 0 and `fail_action: true` never
          # fired. The job stayed green even on a brand-new alert. Turning off
          # issue writing while `-I` was still set would have replaced a noisy
          # channel with NO channel, which is strictly worse than the 37
          # duplicates it was meant to fix.
          #
          # `-a` (include the alpha passive rules) is kept.
          cmd_options: '-a'
          # `false` since 2026-09-11. The action re-opens a NEW issue titled
          # "ZAP Scan Baseline Report" on runs where its dedupe search does not
          # find the previous one — the GitHub search API it queries is
          # eventually consistent, and a nightly schedule compounds every miss.
          # Measured result: 37 open duplicates between 2026-07-15 and
          # 2026-09-11, all of the same scan, which is how a REAL finding ends
          # up somewhere nobody reads.
          #
          # The signal is not lost. `fail_action: true` still fails the job on a
          # new alert, the HTML/JSON report is still uploaded as an artifact by
          # the action itself, and this repo's CI standard already routes a
          # failed job to Telegram. A red job with an attached report is a
          # better alert than the 38th copy of an issue.
          allow_issue_writing: false
          fail_action: true

      # Explicit, rather than trusting the action to upload its own report.
      # That behaviour lives in the same report-processing path as issue
      # creation in this action family and is not documented as independent of
      # it — so with issue writing off, "the report is still an artifact" was
      # an assumption, not a guarantee. `if: always()` because the run we most
      # want the report from is the failing one.
      # Suppression expiry runs AFTER the scan, and this ordering is the whole
      # point.
      #
      # It used to run FIRST, and on 2026-09-12 it stopped the DAST entirely
      # for two consecutive nights — not because a date had lapsed, but because
      # the step invoked `node` and this job never installs it. `node: command
      # not found`, exit 127, and the scan never started. A security gate was
      # silently off and the only signal was a red workflow that read like a
      # scan finding. That is audit-followup #1754/#1749 exactly: an expiry
      # check placed before the scan makes ANY failure in it — a lapsed date, a
      # missing runtime, a typo — suppress the thing it is supposed to
      # annotate.
      #
      # `if: always()` so a failing scan does not skip the expiry report, and a
      # failing expiry report does not hide the scan's own verdict. Both gate
      # the job; neither gates the other.
      #
      # `setup-node` because the runner does not carry one. No `npm ci`: the
      # script is dependency-free, and installing the workspace here would add
      # ~4 minutes to a job that scans a URL.
      #
      # It lives here rather than in tests/unit because in the PR-blocking
      # suite a review-by date would fail every unrelated pull request — a
      # hotfix included — with no way to tell "this PR broke something" from "a
      # calendar date passed". The deterministic half (every IGNORE HAS a date)
      # stays PR-blocking in tests/unit/zap-rules-have-review-dates.test.ts.
      - name: Set up Node for the suppression-expiry check
        if: always()
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Check ZAP suppressions have not expired
        if: always()
        run: node scripts/check-zap-review-dates.mjs

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zap-baseline-report
          path: |
            report_html.html
            report_json.json
            report_md.md
          if-no-files-found: warn
          retention-days: 30

  notify-failure:
    name: Notify on failure
    runs-on: ${{ vars.USE_SELF_HOSTED != 'true' && 'ubuntu-latest' || fromJSON('["self-hosted","linux","wsl2"]') }}
    timeout-minutes: 2
    needs: [zap]
    if: always() && failure()
    steps:
      # The delivery channel that replaces the issue. Mirrors
      # lighthouse-nightly.yml:69 — the claim that "this repo's CI standard
      # already routes a failed job to Telegram" was true of OTHER workflows
      # and not of this one, which is what made turning off issue writing a
      # silent drop rather than a channel swap.
      - name: Compose + send Telegram alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_ALERT_CHAT_ID" ]; then
            echo "telegram secrets not configured — skipping alert"
            exit 0
          fi
          MSG=$(printf '🔴 *ZAP baseline DAST FAILED* — %s\nA new alert appeared, or the scan errored. Report is attached to the run as an artifact.\n[view run](https://github.com/%s/actions/runs/%s)' \
            "$REPO" "$REPO" "$RUN_ID")
          curl -sS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_ALERT_CHAT_ID}" \
            -d parse_mode=Markdown \
            -d disable_web_page_preview=true \
            --data-urlencode text="$MSG" \
            >/dev/null
