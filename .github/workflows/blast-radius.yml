name: blast-radius

# Informational PR gate: for every changed file, surface its transitive
# DEPENDENTS from the committed graphify dependency graph, so the reviewer
# (human or AI) reviews the BLAST RADIUS — not just the diff. Catches the
# "changed a shared symbol, silently broke a consumer" class (incl. stale test
# doubles). Never fails the build; it annotates + comments.
#
# Stays on pull requests in the lean CI (SP4 task 9) because it is cheap: no
# `npm ci`, no build, just a checkout, a git diff and a python3 walk of the
# committed graph, ~1 billed minute. It is skipped for docs-only PRs. Every
# heavier gate moved to main/nightly; see docs/ebda/ci.md.

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  workflow_dispatch:

concurrency:
  group: blast-radius-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  blast-radius:
    # ubuntu-latest became 26.04 (2026-11); Playwright 1.60 unsupported — Ruling CI-HOSTED-2
    runs-on: ${{ fromJSON(contains(github.event.pull_request.labels.*.name, 'ci-umbra') && '["self-hosted","umbra-ebda"]' || vars.EBDA_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # need base + head to diff

      - name: Compute blast radius
        id: br
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail
          # ref-based mode (no gh needed); path = repo root. Degrades gracefully
          # if graphify-out/graph.json is absent.
          # Three-dot (issue 2338): diff from the merge base, so a PR that is
          # merely behind main reports only its own files, not main's newer ones.
          bash scripts/blast-radius.sh ebda "${BASE_SHA:-HEAD~1}...${HEAD_SHA:-HEAD}" . \
            | tee blast-radius.txt || true
          {
            echo '## 🌐 Blast radius (transitive dependents of the changed files)'
            echo ''
            echo '```'
            cat blast-radius.txt 2>/dev/null || echo '(no output)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        # No `gh` dependency (issue 2452): a `gh pr comment` step died with exit 127 under
        # continue-on-error and the report never reached a PR while the job read green. This calls the REST API with python3 (which
        # scripts/blast-radius.sh already requires). A delivery failure is logged as an explicit
        # ::warning:: (never a silent green) and does not fail the informational job.
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if ! command -v python3 >/dev/null 2>&1; then
            echo "::warning::blast-radius: python3 missing on this runner — PR comment NOT posted (report is in the step summary)"
            exit 0
          fi
          python3 - <<'PY'
          import json, os, urllib.request

          api = os.environ.get("GITHUB_API_URL", "https://api.github.com")
          repo = os.environ["GITHUB_REPOSITORY"]
          pr = os.environ["PR"]
          marker = "<!-- blast-radius-bot -->"

          def call(method, path, payload=None):
              req = urllib.request.Request(
                  api + path,
                  data=None if payload is None else json.dumps(payload).encode(),
                  method=method,
                  headers={
                      "Authorization": "Bearer " + os.environ["GITHUB_TOKEN"],
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "blast-radius-bot",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read() or "null")

          try:
              try:
                  report = "".join(open("blast-radius.txt").readlines()[:120])
              except OSError:
                  report = ""
              body = (
                  "## \U0001F310 Blast radius\n\n"
                  "Transitive dependents of this PR's changed files (review THESE, not just the diff):\n\n"
                  "```\n" + report + "\n```\n" + marker
              )
              # upsert ONE marker comment so re-runs don't spam the PR (walk every page: a marker
              # past the first page must still be found)
              existing, page = None, 1
              while existing is None:
                  items = call("GET", f"/repos/{repo}/issues/{pr}/comments?per_page=100&page={page}")
                  existing = next((c for c in items if marker in (c.get("body") or "")), None)
                  if len(items) < 100:
                      break
                  page += 1
              if existing:
                  call("PATCH", f"/repos/{repo}/issues/comments/{existing['id']}", {"body": body})
              else:
                  call("POST", f"/repos/{repo}/issues/{pr}/comments", {"body": body})
              print("blast-radius: PR comment upserted")
          except Exception as e:  # noqa: BLE001 - informational job: no delivery problem may fail it (Ruling CI-BLAST-COMMENT-1)
              # A 403 on a fork PR (read-only token) is an HTTPError; a network blip is NOT always a URLError: a timeout while
              # reading the body raises TimeoutError, a dropped connection ConnectionResetError / http.client.RemoteDisconnected
              # (all OSError / HTTPException, none wrapped by urllib). The first one in CI killed the job on a transient blip.
              # The step summary still has the report either way.
              print(f"::warning::blast-radius: PR comment NOT posted ({type(e).__name__}: {e}); report is in the step summary")
          PY
