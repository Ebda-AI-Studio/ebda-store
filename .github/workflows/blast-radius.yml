name: blast-radius

# Informational PR gate: for every changed file, surface its transitive
# DEPENDENTS from the committed graphify dependency graph, so the reviewer
# (human or AI) reviews the BLAST RADIUS — not just the diff. Catches the
# "changed a shared symbol, silently broke a consumer" class (incl. stale test
# doubles). Never fails the build; it annotates + comments.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_cloud:
        description: 'Run on cloud (ubuntu-latest) instead of self-hosted'
        type: boolean
        default: false

concurrency:
  group: blast-radius-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  blast-radius:
    runs-on: ${{ (inputs.force_cloud || vars.USE_SELF_HOSTED != 'true') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","wsl2"]') }}
    timeout-minutes: 8
    steps:
      # Pre-checkout guard (#1883): survives an OOM-kill/guest-restart on a
      # prior job that stranded a root-owned trufflehog-*/ dir `if: always()`
      # cannot cover, because nothing after the kill runs, checkout included.
      - name: Remove root-owned trufflehog scratch (pre-checkout guard, issue 1883)
        # Inline, not a local composite action: a `uses: ./.github/actions/...`
        # step cannot resolve before actions/checkout has put the repo on disk.
        shell: bash
        run: |
          shopt -s nullglob
          # Sparse-checkout leak (2026-09-30): a sparse job on this persistent
          # self-hosted workspace left core.sparseCheckout in .git/config, and
          # the next plain actions/checkout reused it, so orders' deploy got a
          # scripts-only tree ("npm ci: no package-lock.json"). Undo any
          # inherited sparse config BEFORE checkout, in every job.
          if [ -d .git ] && [ "$(git config --get core.sparseCheckout 2>/dev/null)" = "true" ]; then
            echo "::warning::workspace .git carries a sparse-checkout config from a prior job — disabling it before checkout"
            git sparse-checkout disable 2>/dev/null || true
            git config --unset-all core.sparseCheckout 2>/dev/null || true
            git config --unset-all core.sparseCheckoutCone 2>/dev/null || true
            rm -f .git/info/sparse-checkout
          fi
          leftovers=(trufflehog-*)
          if [ ${#leftovers[@]} -eq 0 ]; then
            exit 0
          fi
          echo "::warning::found stranded root-owned trufflehog scratch from a prior job (${leftovers[*]}) — removing before checkout"
          docker run --rm -v "$PWD":/workspace -w /workspace \
            alpine:3.20 sh -c 'rm -rf trufflehog-*' || {
            echo "::warning::trufflehog scratch cleanup failed — checkout may still hit EACCES; needs a root delete on this runner" >&2
            exit 0
          }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # need base + head to diff

      - name: Compute blast radius
        id: br
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail
          # ref-based mode (no gh needed); path = repo root. Degrades gracefully
          # if graphify-out/graph.json is absent.
          # Three-dot (issue 2338): diff from the merge base, so a PR that is
          # merely behind main reports only its own files, not main's newer ones.
          bash scripts/blast-radius.sh force-website-builder "${BASE_SHA:-HEAD~1}...${HEAD_SHA:-HEAD}" . \
            | tee blast-radius.txt || true
          {
            echo '## 🌐 Blast radius (transitive dependents of the changed files)'
            echo ''
            echo '```'
            cat blast-radius.txt 2>/dev/null || echo '(no output)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        # No `gh` dependency (issue 2452): the self-hosted WSL runners ship without the gh CLI, so
        # the old `gh pr comment` step died with exit 127 under continue-on-error and the report
        # never reached a PR while the job read green. This calls the REST API with python3 (which
        # scripts/blast-radius.sh already requires). A delivery failure is logged as an explicit
        # ::warning:: (never a silent green) and does not fail the informational job.
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if ! command -v python3 >/dev/null 2>&1; then
            echo "::warning::blast-radius: python3 missing on this runner — PR comment NOT posted (report is in the step summary)"
            exit 0
          fi
          python3 - <<'PY'
          import json, os, urllib.error, urllib.request

          api = os.environ.get("GITHUB_API_URL", "https://api.github.com")
          repo = os.environ["GITHUB_REPOSITORY"]
          pr = os.environ["PR"]
          marker = "<!-- blast-radius-bot -->"

          def call(method, path, payload=None):
              req = urllib.request.Request(
                  api + path,
                  data=None if payload is None else json.dumps(payload).encode(),
                  method=method,
                  headers={
                      "Authorization": "Bearer " + os.environ["GITHUB_TOKEN"],
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "blast-radius-bot",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read() or "null")

          try:
              try:
                  report = "".join(open("blast-radius.txt").readlines()[:120])
              except OSError:
                  report = ""
              body = (
                  "## \U0001F310 Blast radius\n\n"
                  "Transitive dependents of this PR's changed files (review THESE, not just the diff):\n\n"
                  "```\n" + report + "\n```\n" + marker
              )
              # upsert ONE marker comment so re-runs don't spam the PR (walk every page: a marker
              # past the first page must still be found)
              existing, page = None, 1
              while existing is None:
                  items = call("GET", f"/repos/{repo}/issues/{pr}/comments?per_page=100&page={page}")
                  existing = next((c for c in items if marker in (c.get("body") or "")), None)
                  if len(items) < 100:
                      break
                  page += 1
              if existing:
                  call("PATCH", f"/repos/{repo}/issues/comments/{existing['id']}", {"body": body})
              else:
                  call("POST", f"/repos/{repo}/issues/{pr}/comments", {"body": body})
              print("blast-radius: PR comment upserted")
          except (urllib.error.URLError, KeyError, ValueError) as e:
              # e.g. 403 on a fork PR (read-only token): the step summary still has the report.
              print(f"::warning::blast-radius: PR comment NOT posted ({e}); report is in the step summary")
          PY
