name: blast-radius

# Informational PR gate: for every changed file, surface its transitive
# DEPENDENTS from the committed graphify dependency graph, so the reviewer
# (human or AI) reviews the BLAST RADIUS — not just the diff. Catches the
# "changed a shared symbol, silently broke a consumer" class (incl. stale test
# doubles). Never fails the build; it annotates + comments.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_cloud:
        description: 'Run on cloud (ubuntu-latest) instead of self-hosted'
        type: boolean
        default: false

concurrency:
  group: blast-radius-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  blast-radius:
    runs-on: ${{ (inputs.force_cloud || vars.USE_SELF_HOSTED != 'true') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","wsl2"]') }}
    timeout-minutes: 8
    steps:
      # Pre-checkout guard (#1883): survives an OOM-kill/guest-restart on a
      # prior job that stranded a root-owned trufflehog-*/ dir `if: always()`
      # cannot cover, because nothing after the kill runs, checkout included.
      - name: Remove root-owned trufflehog scratch (pre-checkout guard, issue 1883)
        # Inline, not a local composite action: a `uses: ./.github/actions/...`
        # step cannot resolve before actions/checkout has put the repo on disk.
        shell: bash
        run: |
          shopt -s nullglob
          # Sparse-checkout leak (2026-09-30): a sparse job on this persistent
          # self-hosted workspace left core.sparseCheckout in .git/config, and
          # the next plain actions/checkout reused it, so orders' deploy got a
          # scripts-only tree ("npm ci: no package-lock.json"). Undo any
          # inherited sparse config BEFORE checkout, in every job.
          if [ -d .git ] && [ "$(git config --get core.sparseCheckout 2>/dev/null)" = "true" ]; then
            echo "::warning::workspace .git carries a sparse-checkout config from a prior job — disabling it before checkout"
            git sparse-checkout disable 2>/dev/null || true
            git config --unset-all core.sparseCheckout 2>/dev/null || true
            git config --unset-all core.sparseCheckoutCone 2>/dev/null || true
            rm -f .git/info/sparse-checkout
          fi
          leftovers=(trufflehog-*)
          if [ ${#leftovers[@]} -eq 0 ]; then
            exit 0
          fi
          echo "::warning::found stranded root-owned trufflehog scratch from a prior job (${leftovers[*]}) — removing before checkout"
          docker run --rm -v "$PWD":/workspace -w /workspace \
            alpine:3.20 sh -c 'rm -rf trufflehog-*' || {
            echo "::warning::trufflehog scratch cleanup failed — checkout may still hit EACCES; needs a root delete on this runner" >&2
            exit 0
          }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # need base + head to diff

      - name: Compute blast radius
        id: br
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail
          # ref-based mode (no gh needed); path = repo root. Degrades gracefully
          # if graphify-out/graph.json is absent.
          # Three-dot (issue 2338): diff from the merge base, so a PR that is
          # merely behind main reports only its own files, not main's newer ones.
          bash scripts/blast-radius.sh force-website-builder "${BASE_SHA:-HEAD~1}...${HEAD_SHA:-HEAD}" . \
            | tee blast-radius.txt || true
          {
            echo '## 🌐 Blast radius (transitive dependents of the changed files)'
            echo ''
            echo '```'
            cat blast-radius.txt 2>/dev/null || echo '(no output)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          body=$(printf '## 🌐 Blast radius\n\nTransitive dependents of this PR'\''s changed files (review THESE, not just the diff):\n\n```\n%s\n```\n' "$(cat blast-radius.txt 2>/dev/null | head -120)")
          # upsert a single marker comment so re-runs don't spam the PR
          marker='<!-- blast-radius-bot -->'
          body="$body"$'\n'"$marker"
          existing=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json comments \
            --jq ".comments[] | select(.body | contains(\"$marker\")) | .url" 2>/dev/null | head -1)
          if [ -n "$existing" ]; then
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --edit-last --body "$body" 2>/dev/null \
              || gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "$body"
          fi
