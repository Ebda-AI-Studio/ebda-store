name: Deploy API (Railway)

# Deploys the Express API to Railway from GitHub Actions instead of Railway's own
# GitHub App auto-deploy. Why: the dashboard Git integration is OAuth-wired and NOT
# version-controlled — it silently broke on the 2026-07 org migration (like the CF
# Workers Builds integration did). An Actions deploy IS the pipeline-as-code: it
# survives org moves (just needs the secret), is reviewable, and is the clean place
# to gate + verify. Mirrors cf-deploy.yml (the frontends already deploy this way).
#
# SAFE TO MERGE BEFORE CUTOVER: the deploy is guarded on the RAILWAY_TOKEN secret —
# with it unset this workflow no-ops (warning only), so merging changes nothing until
# you actively cut over. See docs/migration/railway-actions-deploy.md for the 2-step
# activation (add token + disable Railway auto-deploy so they don't double-fire).
#
# Migrations still run via railway.json `preDeployCommand` (prisma migrate deploy)
# on Railway BEFORE the new replica is promoted — unchanged by this.
#
# REQUIRED to activate:
#   secret   RAILWAY_TOKEN     — a Railway PROJECT token (Project → Settings → Tokens),
#                                scoped to the `production` environment.
#   variable RAILWAY_SERVICE   — the exact service name to deploy (default below).

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - 'railway.json'
      - 'Dockerfile.api'
      - '.github/workflows/railway-deploy.yml'
  workflow_dispatch:

# Never cancel a mid-flight production API deploy.
concurrency:
  group: railway-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy API to Railway
    # Gated at JOB level, not inside a step, so a pre-cutover run reports as
    # SKIPPED. It used to no-op inside the step and report SUCCESS — a green
    # tick on main that had deployed nothing, indistinguishable from one that
    # had. A grey skip says what actually happened; a green tick lied.
    #
    # A variable rather than the secret because job-level `if:` cannot read
    # secrets. The token is still checked below, but as a FAILURE rather than a
    # skip: once this is switched on, a missing token is a misconfiguration and
    # must be loud, not silently absorbed.
    if: vars.RAILWAY_ACTIONS_DEPLOY == 'true'
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && 'self-hosted' || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - name: Require RAILWAY_TOKEN (deploy is switched on)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::RAILWAY_ACTIONS_DEPLOY is 'true' but the RAILWAY_TOKEN secret is unset — this deploy cannot run. Add the secret, or set RAILWAY_ACTIONS_DEPLOY to 'false' to go back to Railway's own GitHub auto-deploy. See docs/migration/railway-actions-deploy.md."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      # The self-hosted runner has no node/npm on PATH — setup-node provides it
      # (on ubuntu-latest it's a no-op-ish re-pin). Without this: "npm: command
      # not found" (exit 127) on the CLI install.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Railway CLI
        # PINNED. The commands below were verified against this exact version;
        # `@4` floats to whatever 4.x is newest at run time, so the surface that
        # was checked is not necessarily the surface that runs. A CLI whose
        # subcommand changed would exit non-zero at the stamp step BEFORE
        # `railway up`, leaving the API with no deploy path at all — precisely
        # the state the cutover runbook exists to avoid.
        run: npm install -g @railway/cli@4.68.0

      # Railway builds the image itself, so the CLI cannot pass a Docker build
      # arg — the value has to reach the build as a SERVICE variable. Set per
      # deploy, never statically: a fixed value would make /health report a
      # commit that is not the one running, which is a confident lie and worse
      # than the null it replaces.
      - name: Stamp the commit being deployed
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          # Verified against 4.68.0, the version pinned above: `variable set`
          # exists, takes --service/--environment/--skip-deploys, and is the
          # form the CLI's own help recommends. `variables --set` is present
          # too, carrying "(legacy, use 'variable set' instead)". Both work;
          # this is the non-deprecated one, and the pin is what keeps that true.
          #
          # --skip-deploys because `railway up` below is what deploys; letting
          # the variable write trigger its own deploy would race it.
          #
          # NOT yet proven in CI. A command that is right in a terminal is not
          # thereby right in the job, so the runbook requires one dispatch run
          # while Railway's own auto-deploy is still enabled, before anyone
          # disables it.
          railway variable set "GIT_COMMIT_SHA=${{ github.sha }}" \
            --service "${{ vars.RAILWAY_SERVICE || 'api' }}" \
            --environment "${{ vars.RAILWAY_ENVIRONMENT || 'production' }}" \
            --skip-deploys

      - name: Deploy (railway up)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        # --ci streams build/deploy logs then exits with the deploy's status, so a
        # failed build/deploy fails this step. railway.json's preDeployCommand runs
        # the Prisma migration on Railway before the new replica is promoted.
        run: |
          railway up --ci \
            --service "${{ vars.RAILWAY_SERVICE || 'api' }}" \
            --environment "${{ vars.RAILWAY_ENVIRONMENT || 'production' }}"

      - name: Verify the deployed build is THIS commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
          HEALTH_URL: ${{ vars.RAILWAY_HEALTH_URL || 'https://api.force-ai.co/health' }}
        # A 200 proves something is answering, not that the NEW build is — the
        # container still serving the previous release returns exactly the same
        # 200, so the old check passed just as happily on a deploy that never
        # landed.
        #
        # The verdict comes from the whole polling window, never from a single
        # poll. An earlier version tolerated an unknown commit per-attempt and
        # so passed on attempt ONE against the previous release, which by
        # construction predates this field and reports no commit at all.
        # Absence of evidence arrives instantly; evidence takes a rollout.
        # See .github/scripts/live-commit-verdict.mjs.
        run: |
          observations=()
          for i in $(seq 1 30); do
            body=$(curl -s -m 10 "$HEALTH_URL" || echo '')
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 10 "$HEALTH_URL" || echo 000)
            live=$(printf '%s' "$body" | python3 -c 'import json,sys;print((json.load(sys.stdin).get("commit") or ""))' 2>/dev/null || echo '')
            observations+=("$(printf '{"ok":%s,"commit":%s}' \
              "$([ "$code" = "200" ] && echo true || echo false)" \
              "$([ -n "$live" ] && printf '"%s"' "$live" || echo null)")")
            if [ "$code" = "200" ] && [ "$live" = "$EXPECTED_SHA" ]; then break; fi
            echo "attempt $i: code=$code live=${live:0:8} want=${EXPECTED_SHA:0:8}"
            sleep 10
          done

          printf '[%s]' "$(IFS=,; echo "${observations[*]}")" > /tmp/observations.json
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const { liveCommitVerdict, exitCodeFor, VERDICT } =
              await import("./.github/scripts/live-commit-verdict.mjs");
            const obs = JSON.parse(readFileSync("/tmp/observations.json", "utf8"));
            const want = process.env.EXPECTED_SHA;
            const verdict = liveCommitVerdict(obs, want);
            if (verdict === VERDICT.LIVE) {
              console.log(`live build is ${want.slice(0, 8)}`);
            } else if (verdict === VERDICT.UNKNOWN) {
              console.log(`::warning::${process.env.HEALTH_URL} stayed healthy but no build reported a commit, so ${want.slice(0, 8)} could not be confirmed live. Ensure the stamp step ran and GIT_COMMIT_SHA reached the build.`);
            } else {
              console.log(`::error::${process.env.HEALTH_URL} never reported ${want.slice(0, 8)} — the deploy did not take, or an older build is still serving.`);
            }
            process.exit(exitCodeFor(verdict));
          '

  notify-failure:
    name: Notify on failure
    needs: deploy
    if: failure() && github.event_name == 'push'
    # Umbra-only CI policy (2026-07-15): billing-blocked cloud runners can
    # never fire; ride the self-hosted runner (runner-death alerting = OS medic).
    runs-on: ${{ vars.USE_SELF_HOSTED != 'true' && 'ubuntu-latest' || fromJSON('["self-hosted","linux","wsl2"]') }}
    timeout-minutes: 2
    steps:
      - name: Telegram alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && exit 0
          curl -sS -m 15 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_ALERT_CHAT_ID}" \
            -d text="🚨 Railway API deploy FAILED on main (${GITHUB_SHA:0:7}). Check the run + consider rollback." >/dev/null || true
