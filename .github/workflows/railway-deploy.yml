name: Deploy API (Railway)

# Deploys the Express API to Railway from GitHub Actions instead of Railway's own
# GitHub App auto-deploy. Why: the dashboard Git integration is OAuth-wired and NOT
# version-controlled — it silently broke on the 2026-07 org migration (like the CF
# Workers Builds integration did). An Actions deploy IS the pipeline-as-code: it
# survives org moves (just needs the secret), is reviewable, and is the clean place
# to gate + verify. Mirrors cf-deploy.yml (the frontends already deploy this way).
#
# SAFE TO MERGE BEFORE CUTOVER: the deploy job is gated at JOB level on the
# RAILWAY_ACTIONS_DEPLOY repo variable, so until it is 'true' the job is reported
# as SKIPPED and nothing happens. It used to no-op inside a step and report
# SUCCESS — a green tick on main that had deployed nothing, which is the exact
# signal an operator reads to answer "did it ship?".
#
# ⚠️ DO NOT disable Railway's own auto-deploy until RAILWAY_ACTIONS_DEPLOY is
# 'true' AND one dispatch run has been observed succeeding. Setting only the
# token leaves this job skipped, and turning Railway's deploy off at the same
# time leaves the API with NO deploy path at all. The runbook's pre-cutover
# section exists for exactly this order of operations:
# docs/migration/railway-actions-deploy.md
#
# Migrations still run via railway.json `preDeployCommand` (prisma migrate deploy)
# on Railway BEFORE the new replica is promoted — unchanged by this.
#
# REQUIRED to activate, in this order:
#   variable RAILWAY_ACTIONS_DEPLOY = 'true'  — THE switch. Until set, job skipped.
#   secret   RAILWAY_TOKEN     — a Railway PROJECT token (Project → Settings → Tokens),
#                                scoped to the `production` environment. Once the
#                                variable is 'true', a missing token FAILS the job
#                                rather than skipping it: after cutover an absent
#                                token is a misconfiguration, not a no-op.
#   variable RAILWAY_SERVICE   — the service name to deploy (default 'api').
#
# ALSO READ (optional, defaulted):
#   variable RAILWAY_ENVIRONMENT  — default 'production'
#   variable RAILWAY_HEALTH_URL   — default 'https://api.force-ai.co/health'

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - 'railway.json'
      - 'Dockerfile.api'
      - '.github/workflows/railway-deploy.yml'
      # A lockfile-only dependency/security fix changes what the Docker build
      # actually ships (Dockerfile.api runs `npm ci`) without touching any
      # app or package source — previously invisible to this trigger.
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
  # Independent of everything above: see the guest-checkout-probe job's own
  # header comment for why this exists on a schedule rather than only inside
  # the deploy job.
  schedule:
    - cron: '0 * * * *' # hourly — a single curl call, negligible runner cost

# Never cancel a mid-flight production API deploy.
#
# The hourly probe runs in its OWN group. `cancel-in-progress: false` only
# protects the RUNNING run: GitHub keeps one PENDING run per group and cancels
# any older pending one when a new run queues. With one shared group, a push
# deploy queued behind a running deploy was cancelled by the next hourly cron,
# which then skips the deploy job (event_name == 'schedule') — the API change
# never shipped, the same stranded-merge class cf-deploy.yml had. Push and
# dispatch runs still share a group; that is safe because `railway up` ships
# the whole tree at HEAD, so the newer pending run carries the older one's
# changes.
concurrency:
  group: railway-deploy-${{ github.event_name == 'schedule' && 'probe' || 'deploy' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy API to Railway
    # Gated at JOB level, not inside a step, so a pre-cutover run reports as
    # SKIPPED. It used to no-op inside the step and report SUCCESS — a green
    # tick on main that had deployed nothing, indistinguishable from one that
    # had. A grey skip says what actually happened; a green tick lied.
    #
    # A variable rather than the secret because job-level `if:` cannot read
    # secrets. The token is still checked below, but as a FAILURE rather than a
    # skip: once this is switched on, a missing token is a misconfiguration and
    # must be loud, not silently absorbed.
    #
    # event_name != 'schedule' is load-bearing, not decoration: the hourly
    # cron added for guest-checkout-probe triggers this WHOLE workflow, and
    # without this guard a post-cutover RAILWAY_ACTIONS_DEPLOY='true' would
    # redeploy production every hour regardless of whether anything changed.
    if: vars.RAILWAY_ACTIONS_DEPLOY == 'true' && github.event_name != 'schedule'
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && 'self-hosted' || 'ubuntu-latest' }}
    # Covers checkout + setup-node + a global CLI install + `railway up --ci`
    # streaming a full multi-stage Docker build of this monorepo, AND the verify
    # poll window below. The verify step only short-circuits on a MATCH, so an
    # unknown-commit deploy runs the whole window — and the first post-cutover
    # deploy is unknown by construction, because the release it replaces predates
    # the commit field. At 15 the job could time out on a deploy that had already
    # succeeded, and notify-failure would then post "consider rollback" for a
    # healthy release.
    timeout-minutes: 30
    steps:
      # Pre-checkout guard (#1883): survives an OOM-kill/guest-restart on a
      # prior job that stranded a root-owned trufflehog-*/ dir `if: always()`
      # cannot cover, because nothing after the kill runs, checkout included.
      - name: Remove root-owned trufflehog scratch (pre-checkout guard, issue 1883)
        # Inline, not a local composite action: a `uses: ./.github/actions/...`
        # step cannot resolve before actions/checkout has put the repo on disk.
        shell: bash
        run: |
          shopt -s nullglob
          leftovers=(trufflehog-*)
          if [ ${#leftovers[@]} -eq 0 ]; then
            exit 0
          fi
          echo "::warning::found stranded root-owned trufflehog scratch from a prior job (${leftovers[*]}) — removing before checkout"
          docker run --rm -v "$PWD":/workspace -w /workspace \
            alpine:3.20 sh -c 'rm -rf trufflehog-*' || {
            echo "::warning::trufflehog scratch cleanup failed — checkout may still hit EACCES; needs a root delete on this runner" >&2
            exit 0
          }
        if: vars.USE_SELF_HOSTED == 'true'

      - name: Require RAILWAY_TOKEN (deploy is switched on)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::RAILWAY_ACTIONS_DEPLOY is 'true' but the RAILWAY_TOKEN secret is unset — this deploy cannot run. Add the secret, or set RAILWAY_ACTIONS_DEPLOY to 'false' to go back to Railway's own GitHub auto-deploy. See docs/migration/railway-actions-deploy.md."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The self-hosted runner has no node/npm on PATH — setup-node provides it
      # (on ubuntu-latest it's a no-op-ish re-pin). Without this: "npm: command
      # not found" (exit 127) on the CLI install.
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install Railway CLI
        # PINNED. The commands below were verified against this exact version;
        # `@4` floats to whatever 4.x is newest at run time, so the surface that
        # was checked is not necessarily the surface that runs. A CLI whose
        # subcommand changed would exit non-zero at the stamp step BEFORE
        # `railway up`, leaving the API with no deploy path at all — precisely
        # the state the cutover runbook exists to avoid.
        run: npm install -g @railway/cli@4.68.0

      # Railway builds the image itself, so the CLI cannot pass a Docker build
      # arg — the value has to reach the build as a SERVICE variable. Set per
      # deploy, never statically: a fixed value would make /health report a
      # commit that is not the one running, which is a confident lie and worse
      # than the null it replaces.
      - name: Stamp the commit being deployed
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          # Verified against 4.68.0, the version pinned above: `variable set`
          # exists, takes --service/--environment/--skip-deploys, and is the
          # form the CLI's own help recommends. `variables --set` is present
          # too, carrying "(legacy, use 'variable set' instead)". Both work;
          # this is the non-deprecated one, and the pin is what keeps that true.
          #
          # --skip-deploys because `railway up` below is what deploys; letting
          # the variable write trigger its own deploy would race it.
          #
          # NOT yet proven in CI. A command that is right in a terminal is not
          # thereby right in the job, so the runbook requires one dispatch run
          # while Railway's own auto-deploy is still enabled, before anyone
          # disables it.
          #
          # Non-fatal (#1494): this stamps VERIFICATION metadata, not the
          # deploy itself. Any drift in this subcommand's surface (the CLI is
          # pinned above precisely because that surface is unverified from
          # here) used to fail here and exit BEFORE `railway up` ever ran,
          # turning a metadata step into a total production deploy outage.
          # Shipping the code matters more than stamping which commit it was.
          railway variable set "GIT_COMMIT_SHA=${{ github.sha }}" \
            --service "${{ vars.RAILWAY_SERVICE || 'api' }}" \
            --environment "${{ vars.RAILWAY_ENVIRONMENT || 'production' }}" \
            --skip-deploys \
            || echo "::warning::could not set GIT_COMMIT_SHA — /health will report commit: null for this deploy. The deploy itself still proceeds."

      - name: Deploy (railway up)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        # --ci streams build/deploy logs then exits with the deploy's status, so a
        # failed build/deploy fails this step. railway.json's preDeployCommand runs
        # the Prisma migration on Railway before the new replica is promoted.
        run: |
          railway up --ci \
            --service "${{ vars.RAILWAY_SERVICE || 'api' }}" \
            --environment "${{ vars.RAILWAY_ENVIRONMENT || 'production' }}"

      - name: Verify the deployed build is THIS commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
          HEALTH_URL: ${{ vars.RAILWAY_HEALTH_URL || 'https://api.force-ai.co/health' }}
        # A 200 proves something is answering, not that the NEW build is — the
        # container still serving the previous release returns exactly the same
        # 200, so the old check passed just as happily on a deploy that never
        # landed.
        #
        # The verdict comes from the whole polling window, never from a single
        # poll. An earlier version tolerated an unknown commit per-attempt and
        # so passed on attempt ONE against the previous release, which by
        # construction predates this field and reports no commit at all.
        # Absence of evidence arrives instantly; evidence takes a rollout.
        # See .github/scripts/live-commit-verdict.mjs.
        run: |
          observations=()
          for i in $(seq 1 30); do
            # ONE request, not two (#1519): body and code used to come from
            # two independent curls up to ~10s apart during a rolling deploy.
            # If the body request hit a blip while the status request a
            # moment later returned 200, `unreadable` was computed from
            # observations that never described the same instant — a
            # perfectly healthy poll could read as UNREADABLE, which latches
            # and fails the whole window (see live-commit-verdict.mjs). The
            # trailing %{http_code} write-out keeps both fields sourced from
            # the exact same response.
            resp=$(curl -s -m 10 -w '\n%{http_code}' "$HEALTH_URL" || printf '\n000')
            code="$(printf '%s' "$resp" | tail -n1)"
            body="$(printf '%s' "$resp" | sed '$d')"
            # Parsed with the node setup-node already guarantees, not python3:
            # this runner is conditionally self-hosted, and `2>/dev/null || echo ''`
            # made a missing interpreter, a non-JSON body and a genuine null
            # commit indistinguishable — all three read as "unknown", which
            # passes. A broken parser would then pass every deploy forever.
            # `|| parse_rc=$?` is not stylistic. The step runs under the Actions
            # default `bash -e`, where a bare assignment from a command
            # substitution inherits that command's exit status — so node's
            # `exit 3` would terminate the STEP right here. The line below would
            # never run, no observation would be recorded, the verdict script
            # would never execute, and UNREADABLE could never fire: the whole
            # point of this check, unreachable. The retry window would also
            # collapse to a single poll, so one transient would fail a healthy
            # deploy and trigger the rollback alert.
            #
            # The python3 form this replaced was immune only because its
            # `|| echo ''` swallowed the failure — which is the same swallow
            # that made a broken parser indistinguishable from a null commit.
            # Catching the status explicitly keeps errexit satisfied AND keeps
            # the distinction.
            parse_rc=0
            live=$(printf '%s' "$body" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.stdout.write(String(JSON.parse(s).commit ?? ""))}catch{process.exit(3)}})' 2>/dev/null) || parse_rc=$?
            observations+=("$(printf '{"ok":%s,"commit":%s,"unreadable":%s}' \
              "$([ "$code" = "200" ] && echo true || echo false)" \
              "$([ -n "$live" ] && printf '"%s"' "$live" || echo null)" \
              "$([ "$code" = "200" ] && [ "$parse_rc" != "0" ] && echo true || echo false)")")
            if [ "$code" = "200" ] && [ "$live" = "$EXPECTED_SHA" ]; then break; fi
            echo "attempt $i: code=$code live=${live:0:8} want=${EXPECTED_SHA:0:8}"
            sleep 10
          done

          printf '[%s]' "$(IFS=,; echo "${observations[*]}")" > /tmp/observations.json
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const { liveCommitVerdict, exitCodeFor, VERDICT } =
              await import("./.github/scripts/live-commit-verdict.mjs");
            const obs = JSON.parse(readFileSync("/tmp/observations.json", "utf8"));
            const want = process.env.EXPECTED_SHA;
            const verdict = liveCommitVerdict(obs, want);
            if (verdict === VERDICT.LIVE) {
              console.log(`live build is ${want.slice(0, 8)}`);
            } else if (verdict === VERDICT.UNREADABLE) {
              console.log(`::error::${process.env.HEALTH_URL} answered but its response could not be parsed, so ${want.slice(0, 8)} could not be verified. This is a broken check, not a healthy deploy.`);
            } else if (verdict === VERDICT.UNKNOWN) {
              console.log(`::warning::${process.env.HEALTH_URL} stayed healthy but no build reported a commit, so ${want.slice(0, 8)} could not be confirmed live. Ensure the stamp step ran and GIT_COMMIT_SHA reached the build.`);
            } else {
              console.log(`::error::${process.env.HEALTH_URL} never reported ${want.slice(0, 8)} — the deploy did not take, or an older build is still serving.`);
            }
            process.exit(exitCodeFor(verdict));
          '

      # Guest-checkout admission probe.
      #
      # On 2026-09-03 a correct security fix (removing the merchant-origin CSRF
      # exemption) made POST /payments/create unreachable for cookieless guests,
      # and pecannbee.com.kw took 17 orders over two days without a single
      # payment row. Nothing caught it: the checkout monitor probes
      # /payments/methods with curl, which never carries the browser's cookies
      # or CSRF headers, so it stayed green the whole time.
      #
      # This asserts the ADMISSION decision only. A deliberately non-existent
      # order id means a healthy API answers 404 NOT_FOUND -- the request cleared
      # CSRF and reached business logic -- and nothing is created. A CSRF_* code
      # means guests are locked out of the money path again.
      #
      # It cannot pass vacuously: a non-200/404 status, an unparseable body or a
      # dead host all fail the step rather than being read as healthy.
      - name: Verify guest checkout is still admitted
        env:
          API_BASE: ${{ vars.RAILWAY_API_BASE || 'https://api.force-ai.co' }}
        # Bounded retry (#1535), matching the shape of "Verify the deployed
        # build is THIS commit" above: that step already reasons that the
        # verdict must come from the whole polling window, never a single
        # poll — this probe fired exactly one curl and treated any non-404 as
        # fatal. paymentLimiter (apps/api/src/middleware/security.ts) is
        # keyed by IP with a shared self-hosted runner IP behind it, so a 429
        # RATE_LIMITED is reachable on a healthy deploy; a transient 502/504
        # during the post-deploy replica swap is too. Both are retry-worthy.
        # CSRF_* stays an immediate hard fail: a CSRF lockout is deterministic
        # and does not benefit from retrying.
        run: |
          set -euo pipefail
          probe_args=(-s -m 20 -X POST "$API_BASE/api/v1/payments/create" -H 'Content-Type: application/json' -H 'X-Session-ID: deploy-admission-probe' -d '{"orderId":"00000000-0000-0000-0000-000000000000","provider":"tap"}')

          for i in $(seq 1 5); do
            body=$(mktemp) || body="${RUNNER_TEMP:-/tmp}/admission-probe.json"
            code=$(curl "${probe_args[@]}" -o "$body" -w '%{http_code}') || code=000
            err=$(node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.stdout.write(String(JSON.parse(s)?.error?.code ?? ""))}catch{process.exit(3)}})' < "$body" 2>/dev/null) || err='__UNPARSEABLE__'
            echo "attempt $i: status=$code error_code=${err:-<none>}"

            if [ "$code" = "404" ]; then
              echo "Guest checkout admitted: cleared CSRF and reached business logic."
              exit 0
            fi

            # Status-code retry check BEFORE the error-code switch below: an
            # infra-level 000/429/5xx is exactly the case whose body is NOT
            # our app's JSON error shape (a load balancer error page, or no
            # body at all on a connection failure), so it reads as
            # __UNPARSEABLE__ — checking that case first would treat the most
            # realistic transient failures as fatal, defeating the retry.
            case "$code" in
              000 | 429 | 5??)
                echo "retry-worthy: status=$code error_code=${err:-<none>} — waiting 5s"
                sleep 5
                continue ;;
            esac

            case "$err" in
              CSRF_*)
                echo "::error::Guest checkout is locked out again: POST /payments/create returned $code $err for a cookieless request. This is the 2026-09-03 regression. Do not leave this deploy serving."
                exit 1 ;;
              __UNPARSEABLE__)
                echo "::error::$API_BASE/api/v1/payments/create returned $code with a body this probe could not parse, so admission could not be verified. A broken check is not a healthy deploy."
                exit 1 ;;
            esac

            echo "::error::Expected 404 NOT_FOUND for a non-existent order (proving the request cleared CSRF and reached business logic), got $code ${err:-<none>}. Admission is unverified."
            exit 1
          done

          echo "::error::Guest checkout admission never reached a verifiable state after 5 attempts (last: status=$code error_code=${err:-<none>}) — likely still rate-limited or a persistent 5xx. Admission is unverified."
          exit 1

  # Same probe as the deploy job's "Verify guest checkout is still admitted"
  # step, but INDEPENDENT of the RAILWAY_ACTIONS_DEPLOY gate and of any push
  # to main — this repeats it hourly against whatever is actually live.
  #
  # The deploy job's copy only runs post-cutover (RAILWAY_ACTIONS_DEPLOY=
  # 'true') and only right after an Actions-triggered deploy. Until cutover,
  # Railway's own GitHub-App auto-deploy is still what ships main — a deploy
  # path this workflow does not see at all — so the 2026-09-03 regression
  # class (a correct-looking CSRF fix that silently locks out cookieless
  # guest checkout) had NO monitor for as long as that stayed true. A probe
  # that only fires from inside a job gated on a switch that isn't flipped
  # yet is a probe that has never actually run.
  guest-checkout-probe:
    name: Guest checkout admission probe (scheduled)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && 'self-hosted' || 'ubuntu-latest' }}
    timeout-minutes: 3
    steps:
      # The self-hosted runner has no node on the Actions shell PATH — the
      # probe's response-parsing step below is `node -e ...`, which would
      # die with "command not found" (exit 127) without this.
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Verify guest checkout is still admitted
        env:
          API_BASE: ${{ vars.RAILWAY_API_BASE || 'https://api.force-ai.co' }}
        run: |
          set -euo pipefail
          body=$(mktemp) || body="${RUNNER_TEMP:-/tmp}/admission-probe.json"
          probe_args=(-s -m 20 -o "$body" -w '%{http_code}' -X POST "$API_BASE/api/v1/payments/create" -H 'Content-Type: application/json' -H 'X-Session-ID: scheduled-admission-probe' -d '{"orderId":"00000000-0000-0000-0000-000000000000","provider":"tap"}')
          code=$(curl "${probe_args[@]}") || code=000
          err=$(node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.stdout.write(String(JSON.parse(s)?.error?.code ?? ""))}catch{process.exit(3)}})' < "$body" 2>/dev/null) || err='__UNPARSEABLE__'
          echo "status=$code error_code=${err:-<none>}"
          case "$err" in
            CSRF_*)
              echo "::error::Guest checkout is locked out again: POST /payments/create returned $code $err for a cookieless request. This is the 2026-09-03 regression. Do not leave this deploy serving."
              exit 1 ;;
            __UNPARSEABLE__)
              echo "::error::$API_BASE/api/v1/payments/create returned $code with a body this probe could not parse, so admission could not be verified. A broken check is not a healthy deploy."
              exit 1 ;;
          esac
          if [ "$code" != "404" ]; then
            echo "::error::Expected 404 NOT_FOUND for a non-existent order (proving the request cleared CSRF and reached business logic), got $code. Admission is unverified."
            exit 1
          fi
          echo "Guest checkout admitted: cleared CSRF and reached business logic."

      - name: Telegram alert on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && exit 0
          curl -sS -m 15 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_ALERT_CHAT_ID}" \
            -d text="🚨 Guest checkout admission probe FAILED (scheduled) — cookieless POST /payments/create is not reaching business logic. This is the 2026-09-03 CSRF-lockout regression class. Check the run." >/dev/null || true

  notify-failure:
    name: Notify on failure
    needs: deploy
    if: failure() && github.event_name == 'push'
    # Umbra-only CI policy (2026-07-15): billing-blocked cloud runners can
    # never fire; ride the self-hosted runner (runner-death alerting = OS medic).
    runs-on: ${{ vars.USE_SELF_HOSTED != 'true' && 'ubuntu-latest' || fromJSON('["self-hosted","linux","wsl2"]') }}
    timeout-minutes: 2
    steps:
      - name: Telegram alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && exit 0
          curl -sS -m 15 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_ALERT_CHAT_ID}" \
            -d text="🚨 Railway API deploy FAILED on main (${GITHUB_SHA:0:7}). Check the run + consider rollback." >/dev/null || true
