name: Mutation testing (Stryker)

# Manual/quarterly, NOT scheduled — mirrors load-test-nightly.yml's
# manual-dispatch pattern. Added 2026-09-02 (adversarial audit, P2/P3): the
# config existed with thresholds.break: null and ZERO references anywhere
# in .github/workflows/ — a gate that could never fail because nothing ever
# invoked it. It's cheap (~24s for the 4 configured files, measured
# 2026-09-02), so run it by hand every quarter, or after materially changing
# apps/api/src/services/{auth,payment,recommendation}.service.ts or
# apps/api/src/lib/ai-quota.ts, and paste the summary into a new
# docs/test-reports/stryker-baseline-<date>.md following the existing
# pattern. See docs/test-reports/stryker-baseline-2026-09-02.md for the
# current baseline + the rationale for the break=10 floor.

on:
  # The Stryker job stays manual (see the header comment). The defence-mutation
  # job is cheap and gates on a real hole, so it also runs on any PR that
  # touches a defended source, the spec, or the runner — a gate nothing invokes
  # is the exact defect this file's own history is about.
  pull_request:
    paths:
      - 'scripts/defence-mutation-record.mjs'
      - 'docs/security/defence-mutations.json'
      - 'apps/api/src/middleware/**'
      - 'apps/api/src/routes/product.routes.ts'
      # Agent-write auth (Ruling M1) + the two 2026-09-09 P1s. The
      # `mutation-gate-trigger-coverage` unit test fails if a source named in
      # defence-mutations.json is not reachable from this list — that is how
      # this line got added, and it is why the list must grow with the spec.
      - 'apps/api/src/mcp/**'
      # Agent-key admin surface + the denial watcher (this PR). Same rule as
      # the line above: a defended source unreachable from this list means the
      # gate passes every PR having measured nothing about it.
      - 'apps/api/src/routes/agent-credential.routes.ts'
      - 'apps/api/src/services/store.service.ts'
      - 'apps/api/src/lib/inngest/functions/agent-write-denied-watch.ts'
      - 'apps/api/src/routes/auth.routes.ts'
      # `/auth/mfa/*` is a SEPARATE router. The impersonation guard's first
      # rollout walked only auth.routes.ts and so never saw it — an audit found
      # the hole, not the gate. Listing it here is what lets the gate see it.
      - 'apps/api/src/routes/mfa.routes.ts'
      # safe-fetch.ts holds the redirect re-validation loop: `assertPublicHttpUrl`
      # alone proves only the URL you ASKED for is public.
      - 'apps/api/src/lib/safe-fetch.ts'
      - 'apps/api/src/routes/public.routes.ts'
      - 'apps/api/src/services/auth.service.ts'
      - 'apps/api/src/services/accounting/**'
      # cart.service.ts holds the ambient-transaction branches. Their
      # absence is a P2003 on the first cart write of a session, and a
      # deterministic unique violation in the guest-cart merge.
      - 'apps/api/src/services/cart.service.ts'
      - 'apps/api/src/services/payment-providers/**'
      # Carrier clients: iCarry's resolveBaseUrl is the SSRF defence
      # (assertPublicHttpUrl on a merchant-supplied baseUrl). Added because
      # `mutation-gate-trigger-coverage` failed without it — the defence was
      # registered and killed locally while the CI gate would never have run
      # on a PR that changed it.
      - 'apps/api/src/services/carriers/**'
      - 'apps/api/src/lib/inngest/functions/order-refunded.ts'
      - 'apps/web/src/lib/consent-cookie.ts'
      - 'apps/web/src/lib/store-resolver.ts'
      - 'tests/unit/**'
      # The artifact itself: a PR that hand-edits the record must re-run the
      # gate, or the staleness check it exists to enforce never fires.
      - 'docs/security/defence-mutation-record.md'
      # The runner resolves through these, so changing one changes what the run
      # measures — and an unbuilt workspace package makes every defence ERROR.
      - 'vitest.stryker.config.ts'
      - 'vitest.shared.ts'
      - 'vitest.config.ts'
      - 'packages/shared/src/**'
      - 'packages/database/src/**'
      # Colocated suites now inside the retry-0 gate above.
      - 'apps/admin/src/**'
      - 'apps/web/src/**'
      - 'apps/orders/src/**'
      # The admin client's refresh path is now a defended source too: it
      # holds the 429-vs-401 distinction whose absence wiped the only copy
      # of an iOS PWA's refresh token.
      - 'apps/admin/src/lib/**'
      - '.github/workflows/mutation-testing.yml'
  workflow_dispatch:
    inputs:
      force_cloud:
        description: 'Run on cloud (ubuntu-latest) instead of self-hosted'
        type: boolean
        default: false

concurrency:
  group: mutation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mutation-test:
    name: Stryker mutation score
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ (inputs.force_cloud || vars.USE_SELF_HOSTED != 'true') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","wsl2"]') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Build database package
        run: npm run build -w packages/database

      - name: Build API package
        run: npm run build -w apps/api

      - name: Run Stryker
        # stryker.conf.json's thresholds.break gates this — a non-zero exit
        # here means the score dropped below the configured floor.
        run: npx stryker run stryker.conf.json

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stryker-mutation-report
          path: reports/mutation/
          retention-days: 30

  # Stryker's aggregate score cannot reach the defences that matter most: it
  # runs vitest.stryker.config.ts, whose include is tests/unit/** only, and it
  # scores whole FILES. This job answers the per-defence question instead —
  # "remove this exact guard; does a test stop you?" — for the controls the
  # standard marks mutation-record-mandatory (authn/session, tenant/RLS,
  # money/payment/refund, consent, erasure). It is cheap (~2 min) and gates on
  # a SURVIVED defence, so it runs on every PR that touches a defended source
  # or the spec itself.
  defence-mutations:
    name: Defence mutation record
    runs-on: ${{ (inputs.force_cloud || vars.USE_SELF_HOSTED != 'true') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","wsl2"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      # Required, not optional: an unbuilt @force/shared makes every test that
      # imports it fail to COLLECT, which vitest reports as "Tests no tests".
      # The script preflights for this and exits 2 rather than scoring a run
      # that measured nothing.
      - name: Build workspace packages
        run: |
          npm run build -w packages/shared
          npm run build -w packages/database

      # The main config sets `retry: 1` for genuinely flaky NETWORK tests in the
      # e2e/integration tiers. On unit tests that retry masks state pollution:
      # a queued mockResolvedValueOnce left undrained by clearAllMocks fed the
      # next test's first call, and the retry — which re-runs only the failures,
      # by then against a drained queue — turned it green. Five accounting
      # tests were passing that way (fixed 2026-09-02). The Stryker config
      # already sets retry: 0 and includes exactly tests/unit/**, so running it
      # here is the honest unit gate, ~20s, with no risk to the e2e tier.
      - name: Unit tier with retries disabled (no masked-flaky tests)
        # ci.yml's config with retry forced off — NOT the stryker config.
        #
        # Vitest positional arguments are FILTERS applied to whatever
        # `test.include` already collected; they narrow that set and can never
        # widen it. vitest.stryker.config.ts includes `tests/unit/**` only, so
        # running it with these paths collected 159 files where ci.yml's config
        # collects 182 — the four extra filters matched nothing and the run was
        # byte-for-byte what it had always been. The 23 files missing are the
        # colocated __tests__ suites across packages/shared, packages/database,
        # apps/web and apps/admin: precisely the ones ci.yml's own comment
        # records as having been orphaned twice, and precisely where a masked
        # flake would hide.
        #
        # The main config's include is broad, so the same positional list
        # narrows it to exactly ci.yml's unit scope, and --retry=0 overrides the
        # retry: 1 that hides order-dependent failures.
        #
        # Keep this list in step with ci.yml's "Run unit tests with coverage".
        run: |
          ./node_modules/.bin/vitest run --config vitest.config.ts --retry=0 \
            tests/unit packages/shared/src packages/database/src apps/web apps/admin/src apps/orders

      # --write both measures and refreshes the markdown, and exits non-zero if
      # any defence SURVIVED. One run, not two — the measurement is the artifact.
      - name: Run the defence mutation record
        run: npm run test:defence-mutations -- --write

      # A drifted record is the failure mode this job exists to prevent, so the
      # committed markdown must match what the run just produced.
      - name: Fail if the committed record is stale
        run: |
          git diff --exit-code -- docs/security/defence-mutation-record.md \
            || { echo "::error::docs/security/defence-mutation-record.md is stale — re-run 'npm run test:defence-mutations -- --write' and commit it"; exit 1; }
