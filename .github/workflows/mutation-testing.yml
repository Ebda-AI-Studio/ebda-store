name: Mutation testing (Stryker)

# Manual/quarterly, NOT scheduled — mirrors load-test-nightly.yml's
# manual-dispatch pattern. Added 2026-09-02 (adversarial audit, P2/P3): the
# config existed with thresholds.break: null and ZERO references anywhere
# in .github/workflows/ — a gate that could never fail because nothing ever
# invoked it. It's cheap (~24s for the 4 configured files, measured
# 2026-09-02), so run it by hand every quarter, or after materially changing
# apps/api/src/services/{auth,payment,recommendation}.service.ts or
# apps/api/src/lib/ai-quota.ts, and paste the summary into a new
# docs/test-reports/stryker-baseline-<date>.md following the existing
# pattern. See docs/test-reports/stryker-baseline-2026-09-02.md for the
# current baseline + the rationale for the break=10 floor.

on:
  # The Stryker job stays manual (see the header comment). The defence-mutation
  # job is cheap and gates on a real hole, so it also runs on any PR that
  # touches a defended source, the spec, or the runner — a gate nothing invokes
  # is the exact defect this file's own history is about.
  pull_request:
    paths:
      - 'scripts/defence-mutation-record.mjs'
      - 'docs/security/defence-mutations.json'
      - 'apps/api/src/middleware/**'
      - 'apps/api/src/routes/product.routes.ts'
      # Agent-write auth (Ruling M1) + the two 2026-09-09 P1s. The
      # `mutation-gate-trigger-coverage` unit test fails if a source named in
      # defence-mutations.json is not reachable from this list — that is how
      # this line got added, and it is why the list must grow with the spec.
      - 'apps/api/src/mcp/**'
      # Agent-key admin surface + the denial watcher (this PR). Same rule as
      # the line above: a defended source unreachable from this list means the
      # gate passes every PR having measured nothing about it.
      - 'apps/api/src/routes/agent-credential.routes.ts'
      # The merchant-admin MCP endpoint's rate limiter (#1737, 2026-09-25):
      # its unauthenticated-caller keyGenerator is a separate defended source
      # from `apps/api/src/mcp/**` above (this router lives under `routes/`).
      - 'apps/api/src/routes/mcp-admin.routes.ts'
      - 'apps/api/src/services/store.service.ts'
      - 'apps/api/src/lib/inngest/functions/agent-write-denied-watch.ts'
      - 'apps/api/src/routes/auth.routes.ts'
      # `/auth/mfa/*` is a SEPARATE router. The impersonation guard's first
      # rollout walked only auth.routes.ts and so never saw it — an audit found
      # the hole, not the gate. Listing it here is what lets the gate see it.
      - 'apps/api/src/routes/mfa.routes.ts'
      # A THIRD router owning an account-level mutation (Ruling IMP-1):
      # merchant-initiated customer erase/export. Same rule as mfa.routes.ts
      # above — invisible to the gate until listed here.
      - 'apps/api/src/routes/customers.routes.ts'
      # campaign-test-send-*: the test-send route runs WITHOUT tenantContext
      # (#1954), so its own authenticate + requireStoreAccess are the guards.
      - 'apps/api/src/routes/campaign.routes.ts'
      # safe-fetch.ts holds the redirect re-validation loop: `assertPublicHttpUrl`
      # alone proves only the URL you ASKED for is public.
      - 'apps/api/src/lib/safe-fetch.ts'
      # ssrf-ai-image-url: the merchant-supplied product imageUrl call site.
      # safe-fetch.ts above covers the guard itself; this covers the path that
      # has to keep calling it.
      - 'apps/api/src/lib/ai/product-alt-text-generator.ts'
      - 'apps/api/src/routes/public.routes.ts'
      - 'apps/api/src/services/auth.service.ts'
      # cors-trust-requires-live-store (#1214): the credentialed-CORS custom-domain
      # lookup clause lives here, not in middleware/.
      - 'apps/api/src/lib/cors-cache.ts'
      - 'apps/api/src/services/accounting/**'
      # cart.service.ts holds the ambient-transaction branches. Their
      # absence is a P2003 on the first cart write of a session, and a
      # deterministic unique violation in the guest-cart merge.
      - 'apps/api/src/services/cart.service.ts'
      # Loyalty refund reversals: the row lock and the P2002 duplicate
      # backstops (P2 batch M3, #1426/#1427).
      - 'apps/api/src/services/loyalty.service.ts'
      - 'apps/api/src/services/payment-providers/**'
      # ReturnService.complete drives the gateway refund: the order-level returns
      # lock, the per-return refund key, following PaymentService's own
      # whole-order decision, the atomic completion claim, and the
      # providerRefundExecuted retain-on-throw latch are all defended sources
      # there — added because `mutation-gate-trigger-coverage` failed without
      # it (#1319).
      - 'apps/api/src/services/return.service.ts'
      # ...and the complete route that gates a GATEWAY return refund on
      # orders:refund, not only returns:write (issue 2024).
      - 'apps/api/src/routes/return.routes.ts'
      # Carrier clients: iCarry's resolveBaseUrl is the SSRF defence
      # (assertPublicHttpUrl on a merchant-supplied baseUrl). Added because
      # `mutation-gate-trigger-coverage` failed without it — the defence was
      # registered and killed locally while the CI gate would never have run
      # on a PR that changed it.
      - 'apps/api/src/services/carriers/**'
      # The masked-resubmit credential merges. Both services drop a masked
      # field they cannot resolve unless the guard holds, which erases a
      # merchant's carrier / notification provider secret on a normal save.
      - 'apps/api/src/services/shipping-carrier.service.ts'
      - 'apps/api/src/services/notification-config.service.ts'
      # r2-cleanup.service.ts's isStillReferenced holds the RLS-bypass guard
      # on its registry-wide global orphan-existence check (#1599) — without it,
      # the documented Phase 3 RLS cutover silently narrows the check to one
      # store and an R2 delete of a still-referenced cross-tenant object
      # becomes irreversible.
      - 'apps/api/src/services/r2-cleanup.service.ts'
      # ...and that check's column set + SQL now live in the shared registry.
      - 'apps/api/src/lib/r2-references.ts'
      - 'apps/api/src/lib/inngest/functions/order-refunded.ts'
      # Affiliate commission claim guards (#618): a duplicate Inngest delivery
      # credits or debits the affiliate twice without them.
      - 'apps/api/src/services/affiliate.service.ts'
      # Customer wallet (D1): the no-negative-balance guard, the idempotent
      # replay and the wallet row lock.
      - 'apps/api/src/services/wallet.service.ts'
      # The loyalty reversal partial unique index (#1462) — defended in
      # migration SQL because Prisma cannot declare a partial index.
      - 'packages/database/prisma/migrations/20260903130000_loyalty_reversal_tag_unique/migration.sql'
      # Batch M2/D2: the free_shipping coupon eligibility guard lives in
      # order.service.ts; the atomic affiliate payout audit row in
      # affiliate.service.ts (listed above).
      - 'apps/api/src/services/order.service.ts'
      - 'apps/web/src/lib/consent-cookie.ts'
      - 'apps/web/src/lib/store-resolver.ts'
      # #1993: the mount table — no admin router may be mounted at '/public'.
      - 'apps/api/src/routes/index.ts'
      # #1959: agent/feed documents never resolve the store from the cookie.
      - 'apps/web/middleware.ts'
      # #2037: the exception-safe scoped RLS bypass used by erasure.
      - 'apps/api/src/lib/scoped-rls-bypass.ts'
      - 'apps/api/src/lib/ai-quota.ts'
      - 'apps/api/src/lib/store-scoped-read.ts'
      - 'apps/api/src/index.ts'
      - 'apps/api/src/lib/customer-key.ts'
      # Issues 2423-2425: the SMS opt-out token and its derived key, the two
      # sibling link MACs moved off JWT_SECRET with it, and the phone-wide
      # consent reads.
      - 'apps/api/src/lib/sms-consent.ts'
      - 'apps/api/src/lib/derived-secret.ts'
      - 'apps/api/src/lib/campaign-unsubscribe-token.ts'
      - 'apps/api/src/lib/review-token.ts'
      - 'apps/api/src/services/sms-consent.service.ts'
      - 'tests/unit/**'
      # --tier=all runs the integration-tier defences too (issues 2175/2188):
      # their verdicts rest on tests/integration/*.test.ts files, so a PR that
      # weakens one of those tests must re-run the gate. mutation-gate-trigger-
      # coverage.test.ts asserts every spec entry's TEST, not just its source,
      # is reachable from this list.
      - 'tests/integration/**'
      # The artifact itself: a PR that hand-edits the record must re-run the
      # gate, or the staleness check it exists to enforce never fires.
      - 'docs/security/defence-mutation-record.md'
      # The runner resolves through these, so changing one changes what the run
      # measures — and an unbuilt workspace package makes every defence ERROR.
      - 'vitest.stryker.config.ts'
      - 'vitest.shared.ts'
      - 'vitest.config.ts'
      - 'packages/shared/src/**'
      - 'packages/database/src/**'
      # Colocated suites now inside the retry-0 gate above.
      - 'apps/admin/src/**'
      - 'apps/web/src/**'
      - 'apps/orders/src/**'
      # The admin client's refresh path is now a defended source too: it
      # holds the 429-vs-401 distinction whose absence wiped the only copy
      # of an iOS PWA's refresh token.
      - 'apps/admin/src/lib/**'
      - '.github/workflows/mutation-testing.yml'
  workflow_dispatch:
    inputs:
      force_cloud:
        description: 'Run on cloud (ubuntu-latest) instead of self-hosted'
        type: boolean
        default: false

concurrency:
  group: mutation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mutation-test:
    name: Stryker mutation score
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ (inputs.force_cloud || vars.USE_SELF_HOSTED != 'true') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","wsl2"]') }}
    timeout-minutes: 15
    steps:
      # Pre-checkout guard (#1883): survives an OOM-kill/guest-restart on a
      # prior job that stranded a root-owned trufflehog-*/ dir `if: always()`
      # cannot cover, because nothing after the kill runs, checkout included.
      - name: Remove root-owned trufflehog scratch (pre-checkout guard, issue 1883)
        # Inline, not a local composite action: a `uses: ./.github/actions/...`
        # step cannot resolve before actions/checkout has put the repo on disk.
        shell: bash
        run: |
          shopt -s nullglob
          # Sparse-checkout leak (2026-09-30): a sparse job on this persistent
          # self-hosted workspace left core.sparseCheckout in .git/config, and
          # the next plain actions/checkout reused it, so orders' deploy got a
          # scripts-only tree ("npm ci: no package-lock.json"). Undo any
          # inherited sparse config BEFORE checkout, in every job.
          if [ -d .git ] && [ "$(git config --get core.sparseCheckout 2>/dev/null)" = "true" ]; then
            echo "::warning::workspace .git carries a sparse-checkout config from a prior job — disabling it before checkout"
            git sparse-checkout disable 2>/dev/null || true
            git config --unset-all core.sparseCheckout 2>/dev/null || true
            git config --unset-all core.sparseCheckoutCone 2>/dev/null || true
            rm -f .git/info/sparse-checkout
          fi
          leftovers=(trufflehog-*)
          if [ ${#leftovers[@]} -eq 0 ]; then
            exit 0
          fi
          echo "::warning::found stranded root-owned trufflehog scratch from a prior job (${leftovers[*]}) — removing before checkout"
          docker run --rm -v "$PWD":/workspace -w /workspace \
            alpine:3.20 sh -c 'rm -rf trufflehog-*' || {
            echo "::warning::trufflehog scratch cleanup failed — checkout may still hit EACCES; needs a root delete on this runner" >&2
            exit 0
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Build database package
        run: npm run build -w packages/database

      - name: Build API package
        run: npm run build -w apps/api

      - name: Run Stryker
        # stryker.conf.json's thresholds.break gates this — a non-zero exit
        # here means the score dropped below the configured floor.
        run: npx stryker run stryker.conf.json

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stryker-mutation-report
          path: reports/mutation/
          retention-days: 30

  # Stryker's aggregate score cannot reach the defences that matter most: it
  # runs vitest.stryker.config.ts, whose include is tests/unit/** only, and it
  # scores whole FILES. This job answers the per-defence question instead —
  # "remove this exact guard; does a test stop you?" — for the controls the
  # standard marks mutation-record-mandatory (authn/session, tenant/RLS,
  # money/payment/refund, consent, erasure). It is cheap (~1-2 min for all 78
  # defences, measured 2026-09-25) and gates on a SURVIVED defence, so it runs
  # on every PR that touches a defended source or the spec itself. Runs
  # --tier=all (unit AND every integration-tier entry, each named in the
  # services comment below) in this SAME job; a Postgres service is enough
  # (see below), so no separate integration job or schedule is needed.
  defence-mutations:
    name: Defence mutation record
    runs-on: ${{ (inputs.force_cloud || vars.USE_SELF_HOSTED != 'true') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","wsl2"]') }}
    # 20 -> 30 (#1439): budgeted when the retry-0 unit-tier step below was a
    # ~20s, 159-file stryker run; it now mirrors ci.yml's own comparable unit
    # job, whose sibling jobs in that file use 20-35. Kept at 30 (not reverted
    # to 20) even after the postgres service + --tier=all integration-tier
    # defence below were added, since those only add work, not headroom.
    timeout-minutes: 30
    # Postgres only, no Redis, no API server. The spec has EIGHT
    # integration-tier defences (issues 2184/2187 — this comment used to say
    # "the one"; the three admin-coupon entries were added for issues
    # 2304/2317, the two SMS-consent entries for issue 2423);
    # tests/unit/mutation-gate-trigger-coverage.test.ts fails if
    # an integration-tier id is added to docs/security/defence-mutations.json
    # without being named and reasoned about here:
    #   - password-reset-bumps-token-version (tests/integration/refresh-token-
    #     rotation.test.ts): drives AuthService directly against Prisma, no
    #     HTTP layer; fail-opens on a missing Redis client.
    #   - money-wallet-row-lock (tests/integration/customer-wallet.test.ts):
    #     drives WalletService/OrderService/CartService/ReturnService/
    #     StoreService and the order-refunded Inngest handler IN-PROCESS
    #     against Prisma — no HTTP, no API server, no seed (it builds its own
    #     fixtures). redis.service falls back to in-memory when REDIS_URL is
    #     unset ("[REDIS] Failed to connect, using in-memory fallback").
    #   - money-loyalty-reversal-index (tests/integration/partial-unique-
    #     indexes.test.ts): needs only the migrated schema (it reads
    #     pg_indexes and exercises the partial unique index).
    #   - money-admin-coupon-rules-enforced,
    #     money-admin-coupon-override-role-gate,
    #     money-admin-coupon-atomic-reservation (all three:
    #     tests/integration/admin-order-coupon-rules.test.ts): drive
    #     OrderService.createAdminOrder IN-PROCESS against Prisma with their
    #     own seedBundleStore fixtures — no HTTP, no API server, no seed; the
    #     reservation test stubs the rules pre-check with vi.spyOn, not Redis.
    #     Measured KILLED against a migrated Postgres 16 with REDIS_URL unset
    #     (2026-10-01, batch z-ci-other).
    #   - sms-consent-read-phone-wide, sms-consent-list-phone-wide (both:
    #     tests/integration/sms-marketing-consent.test.ts): drive
    #     SmsConsentService, the notification dispatcher and the consent
    #     routers IN-PROCESS (supertest on a bare express app, authenticate
    #     stubbed) against Prisma; the SMS queue is spied, nothing is sent; the
    #     dispatcher's rate limiter uses redis.service's in-memory fallback.
    #     Signing the opt-out link needs ENCRYPTION_KEY, which the run step
    #     below sets. Measured KILLED against a migrated Postgres 16 with
    #     REDIS_URL unset (2026-10-02, batch followups10).
    # Measured, not assumed: run 36667422016 (2026-09-30) scored the first
    # three KILLED in this exact environment. If one ever scores ERROR here, the
    # environment is short a dependency — provision it; do not drop the tier.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: force_test
        ports:
          - 5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s
    steps:
      # Pre-checkout guard (#1883): survives an OOM-kill/guest-restart on a
      # prior job that stranded a root-owned trufflehog-*/ dir `if: always()`
      # cannot cover, because nothing after the kill runs, checkout included.
      - name: Remove root-owned trufflehog scratch (pre-checkout guard, issue 1883)
        # Inline, not a local composite action: a `uses: ./.github/actions/...`
        # step cannot resolve before actions/checkout has put the repo on disk.
        shell: bash
        run: |
          shopt -s nullglob
          # Sparse-checkout leak (2026-09-30): a sparse job on this persistent
          # self-hosted workspace left core.sparseCheckout in .git/config, and
          # the next plain actions/checkout reused it, so orders' deploy got a
          # scripts-only tree ("npm ci: no package-lock.json"). Undo any
          # inherited sparse config BEFORE checkout, in every job.
          if [ -d .git ] && [ "$(git config --get core.sparseCheckout 2>/dev/null)" = "true" ]; then
            echo "::warning::workspace .git carries a sparse-checkout config from a prior job — disabling it before checkout"
            git sparse-checkout disable 2>/dev/null || true
            git config --unset-all core.sparseCheckout 2>/dev/null || true
            git config --unset-all core.sparseCheckoutCone 2>/dev/null || true
            rm -f .git/info/sparse-checkout
          fi
          leftovers=(trufflehog-*)
          if [ ${#leftovers[@]} -eq 0 ]; then
            exit 0
          fi
          echo "::warning::found stranded root-owned trufflehog scratch from a prior job (${leftovers[*]}) — removing before checkout"
          docker run --rm -v "$PWD":/workspace -w /workspace \
            alpine:3.20 sh -c 'rm -rf trufflehog-*' || {
            echo "::warning::trufflehog scratch cleanup failed — checkout may still hit EACCES; needs a root delete on this runner" >&2
            exit 0
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      # Required, not optional: an unbuilt @force/shared makes every test that
      # imports it fail to COLLECT, which vitest reports as "Tests no tests".
      # The script preflights for this and exits 2 rather than scoring a run
      # that measured nothing.
      - name: Build workspace packages
        run: |
          npm run build -w packages/shared
          npm run build -w packages/database

      - name: Run database migrations
        run: npx prisma migrate deploy --schema=packages/database/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://test:test@localhost:${{ job.services.postgres.ports['5432'] }}/force_test
          DIRECT_URL: postgresql://test:test@localhost:${{ job.services.postgres.ports['5432'] }}/force_test

      # ci.yml's e2e/integration jobs opt into `--retry=1` at the invocation
      # site for genuinely flaky NETWORK tests (the main config itself
      # defaults to `retry: 0` since #1248 — see vitest.config.ts). Before
      # that fix, a global `retry: 1` masked state pollution on unit tests:
      # a queued mockResolvedValueOnce left undrained by clearAllMocks fed the
      # next test's first call, and the retry — which re-runs only the failures,
      # by then against a drained queue — turned it green. Five accounting
      # tests were passing that way (fixed 2026-09-02). This job's explicit
      # `--retry=0` below is now reinforcement of ci.yml's own default rather
      # than the only honest unit gate, and stays as a second line of defence
      # against the default ever drifting back.
      - name: Unit tier with retries disabled (no masked-flaky tests)
        # ci.yml's config with retry forced off — NOT the stryker config.
        #
        # Vitest positional arguments are FILTERS applied to whatever
        # `test.include` already collected; they narrow that set and can never
        # widen it. vitest.stryker.config.ts includes `tests/unit/**` only, so
        # running it with these paths collected 159 files where ci.yml's config
        # collects 182 — the four extra filters matched nothing and the run was
        # byte-for-byte what it had always been. The 23 files missing are the
        # colocated __tests__ suites across packages/shared, packages/database,
        # apps/web and apps/admin: precisely the ones ci.yml's own comment
        # records as having been orphaned twice, and precisely where a masked
        # flake would hide.
        #
        # The main config's include is broad, so the same positional list
        # narrows it to exactly ci.yml's unit scope, and this explicit
        # --retry=0 stays as reinforcement even though the config now
        # defaults to it (#1248).
        #
        # Keep this list in step with ci.yml's "Run unit tests with coverage".
        # --maxWorkers=2 + NODE_OPTIONS match ci.yml's identical-scope unit job
        # (#1439): vitest.config.ts defaults to maxWorkers: 1, so this ran the
        # full 182-file scope single-worker — roughly double ci.yml's wall
        # clock — inside a job whose timeout was budgeted when this step was a
        # ~20s, 159-file stryker run, plus npm ci + db:generate + two package
        # builds + the defence-mutation runner (14 defences, ~2 fresh vitest
        # boots each). A timeout-cancelled job surfaces as a red gate with no
        # diagnostic — the same false-signal class ci.yml's orphan-tests job
        # comment documents fixing.
        run: |
          ./node_modules/.bin/vitest run --config vitest.config.ts --retry=0 --maxWorkers=2 \
            tests/unit packages/shared/src packages/database/src apps/web apps/admin/src apps/orders
        env:
          NODE_OPTIONS: --max-old-space-size=2048

      # --write both measures and refreshes the markdown, and exits non-zero if
      # any defence SURVIVED. One run, not two — the measurement is the artifact.
      # --tier=all is REQUIRED, not a default: the script now refuses --write
      # on anything less (#1233/#1262) because a partial-tier write silently
      # DROPS the other tiers' entries from the committed record — which is
      # exactly how an integration-tier entry here went unrun by every CI
      # invocation while the record still claimed a clean scope.
      - name: Run the defence mutation record
        run: npm run test:defence-mutations -- --write --tier=all
        env:
          DATABASE_URL: postgresql://test:test@localhost:${{ job.services.postgres.ports['5432'] }}/force_test
          DIRECT_URL: postgresql://test:test@localhost:${{ job.services.postgres.ports['5432'] }}/force_test
          JWT_SECRET: test-jwt-secret-for-ci-only-32chars
          ENCRYPTION_KEY: test-encryption-key-for-ci-32chars
          NODE_ENV: test

      # A drifted record is the failure mode this job exists to prevent, so the
      # committed markdown must match what the run just produced.
      - name: Fail if the committed record is stale
        run: |
          git diff --exit-code -- docs/security/defence-mutation-record.md \
            || { echo "::error::docs/security/defence-mutation-record.md is stale — re-run 'npm run test:defence-mutations -- --write --tier=all' (a migrated Postgres DATABASE_URL is needed for the integration-tier entries) and commit it"; exit 1; }
