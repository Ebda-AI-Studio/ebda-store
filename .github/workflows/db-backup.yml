name: db-backup
# Off-machine encrypted daily DB backup -> private R2 bucket (Mac-independent).
# Verified path (rclone). Retention ~30d (prune + bucket lifecycle). Restore: docs/DB-BACKUP-RESTORE.md
on:
  schedule:
    - cron: '50 3 * * *'
  workflow_dispatch: {}
concurrency:
  group: db-backup
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  backup:
    # Umbra-only CI policy (2026-07-15): GitHub-hosted runners are billing-
    # blocked permanently; this backup MUST run, so it rides the self-hosted
    # runner like every other job. Docker (postgres:17) + apt are available
    # in the Umbra guest.
    runs-on: ${{ ((github.event_name == 'schedule' && vars.SCHEDULED_ON_CLOUD == 'true') || (github.event_name != 'schedule' && vars.USE_SELF_HOSTED != 'true')) && 'ubuntu-latest' || fromJSON('["self-hosted","linux","wsl2"]') }}
    timeout-minutes: 15
    steps:
      # Needed for scripts/verify-dump.sh below. This job used to run with no
      # checkout at all, which is why its only quality bar could be an inline
      # byte count.
      # Pre-checkout guard (#1883): survives an OOM-kill/guest-restart on a
      # prior job that stranded a root-owned trufflehog-*/ dir `if: always()`
      # cannot cover, because nothing after the kill runs, checkout included.
      - name: Remove root-owned trufflehog scratch (pre-checkout guard, issue 1883)
        # Inline, not a local composite action: a `uses: ./.github/actions/...`
        # step cannot resolve before actions/checkout has put the repo on disk.
        shell: bash
        run: |
          shopt -s nullglob
          # Sparse-checkout leak (2026-09-30): a sparse job on this persistent
          # self-hosted workspace left core.sparseCheckout in .git/config, and
          # the next plain actions/checkout reused it, so orders' deploy got a
          # scripts-only tree ("npm ci: no package-lock.json"). Undo any
          # inherited sparse config BEFORE checkout, in every job.
          if [ -d .git ] && [ "$(git config --get core.sparseCheckout 2>/dev/null)" = "true" ]; then
            echo "::warning::workspace .git carries a sparse-checkout config from a prior job — disabling it before checkout"
            git sparse-checkout disable 2>/dev/null || true
            git config --unset-all core.sparseCheckout 2>/dev/null || true
            git config --unset-all core.sparseCheckoutCone 2>/dev/null || true
            rm -f .git/info/sparse-checkout
          fi
          leftovers=(trufflehog-*)
          if [ ${#leftovers[@]} -eq 0 ]; then
            exit 0
          fi
          echo "::warning::found stranded root-owned trufflehog scratch from a prior job (${leftovers[*]}) — removing before checkout"
          docker run --rm -v "$PWD":/workspace -w /workspace \
            alpine:3.20 sh -c 'rm -rf trufflehog-*' || {
            echo "::warning::trufflehog scratch cleanup failed — checkout may still hit EACCES; needs a root delete on this runner" >&2
            exit 0
          }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: dump -> gzip -> VERIFY -> encrypt -> upload to R2 (rclone, verified path)
        env:
          PGURL: ${{ secrets.DATABASE_URL_DIRECT }}
          KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          PROJECT: force-website-builder
        run: |
          set -euo pipefail
          for v in PGURL KEY R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET; do
            [ -n "${!v:-}" ] || { echo "::error::missing secret $v"; exit 1; }
          done
          TS=$(date -u +%Y%m%dT%H%M%SZ)
          OUT="${PROJECT}-backup-${TS}.sql.gz.enc"

          WORK="$(mktemp -d)"
          trap 'rm -rf "$WORK"' EXIT
          GZ="${WORK}/${PROJECT}-backup-${TS}.sql.gz"

          # pg_dump 17 (matches Neon PG17) via docker; gzip to a TEMP FILE rather
          # than straight into openssl. The plaintext has to exist for one step so
          # that it can be INSPECTED: once encrypted, nothing downstream — not this
          # job, not a restore six weeks from now — can tell a complete dump from
          # an empty one without the decryption key and a manual look.
          docker run --rm -e PGURL postgres:17 sh -c 'pg_dump "$PGURL"' | gzip > "$GZ"

          # Assert the dump is RESTORABLE before it is encrypted or uploaded:
          # gzip integrity, a decompressed floor, the pg_dump header, at least one
          # CREATE TABLE, and data rows >= tables.
          #
          # The last one is the assertion that matters and the reason a byte count
          # is not enough. A schema-only dump is a few KB — it clears any sane size
          # floor and restores an EMPTY DATABASE. That is not hypothetical: the
          # Force Media CRM archived 30 consecutive schema-only dumps over five
          # weeks, each one reported as a successful backup, and they were the DR
          # that was supposed to survive the wipe that had already happened.
          #
          # On failure this exits non-zero, which fails the job, fires the
          # "notify on failure" step below, and leaves NOTHING uploaded — a missing
          # backup is loud, a worthless one is silent.
          bash scripts/verify-dump.sh "$GZ"

          openssl enc -aes-256-cbc -salt -pbkdf2 -pass env:KEY -in "$GZ" -out "$OUT"
          SZ=$(stat -c%s "$OUT"); echo "encrypted dump: ${SZ} bytes"
          # Belt-and-braces on the ENCRYPTED artifact: catches a truncated write or
          # a failed encryption between the check above and the upload below. It is
          # not, and never was, a check on the dump's contents.
          [ "${SZ:-0}" -gt 200 ] || { echo "::error::encrypted artifact empty/too small"; exit 1; }
          # rclone S3 -> R2. NO_CHECK_BUCKET=true is REQUIRED for a bucket-scoped
          # R2 token (else CreateBucket probe 403s). Verified end-to-end 2026-07-01.
          command -v rclone >/dev/null || {
            # 18 runners share one guest, so concurrent jobs race for the dpkg
            # lock: CRM's db-backup died with "Could not get lock
            # /var/lib/dpkg/lock-frontend" AFTER dumping, so the backup never
            # uploaded. Skip apt when the tool is already there, and wait for
            # the lock rather than failing when it is not.
            sudo apt-get -o DPkg::Lock::Timeout=600 update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=600 install -y rclone
          }
          export RCLONE_CONFIG_R2_TYPE=s3 RCLONE_CONFIG_R2_PROVIDER=Cloudflare \
            RCLONE_CONFIG_R2_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID" \
            RCLONE_CONFIG_R2_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY" \
            RCLONE_CONFIG_R2_ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            RCLONE_CONFIG_R2_NO_CHECK_BUCKET=true
          rclone copyto "$OUT" "R2:${R2_BUCKET}/${PROJECT}/${OUT}"
          echo "uploaded R2:${R2_BUCKET}/${PROJECT}/${OUT}"
          rclone delete --min-age 30d "R2:${R2_BUCKET}/${PROJECT}/" || true   # 1-month retention
      - name: notify on failure
        if: ${{ failure() }}
        env:
          TG: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
        run: |
          [ -z "${TG:-}" ] && exit 0
          curl -sS -m 15 "https://api.telegram.org/bot${TG}/sendMessage" \
            --data-urlencode "chat_id=${CHAT}" \
            --data-urlencode "text=🔴 db-backup FAILED (run ${GITHUB_RUN_ID})" >/dev/null || true
