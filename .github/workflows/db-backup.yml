name: Off-machine database backup
# OPS-7 / M-011: the only copy of the production database used to be a dump on one Mac. This nightly job (GitHub-hosted, so it
# survives the Mac and the CI guest being down) dumps production with pg_dump 17, refuses a dump that looks empty, encrypts it
# with age to a public key whose private half lives only in Ahmad's macOS Keychain (ebda-db-backup-age-key), and writes it to
# the R2 bucket `ebda-db-backups` (object lock 7 days, expires after 35 days). Restore: docs/DB-BACKUP-RESTORE.md.
on:
  schedule:
    - cron: '43 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ebda-db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      AGE_PUBLIC_KEY: ${{ vars.EBDA_BACKUP_AGE_PUBLIC_KEY }}
      DUMP_URL: ${{ secrets.EBDA_MIGRATE_DATABASE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Require the inputs
        run: |
          test -n "$DUMP_URL" || { echo "::error::EBDA_MIGRATE_DATABASE_URL is not set in the production environment"; exit 1; }
          test -n "$AGE_PUBLIC_KEY" || { echo "::error::EBDA_BACKUP_AGE_PUBLIC_KEY is not set"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Install pg_dump 17 and age
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y >/dev/null
          sudo apt-get install -y -qq postgresql-client-17 age >/dev/null
          pg_dump --version
      - name: Dump production (custom format) and verify it is not empty
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/ebda.dump"
          /usr/lib/postgresql/17/bin/pg_dump --format=custom --no-owner --no-privileges --dbname="$DUMP_URL" --file="$out"
          bash scripts/ops/verify-db-dump.sh "$out"
          echo "DUMP=$out" >> "$GITHUB_ENV"
      - name: Encrypt with age (public key only on this runner)
        run: |
          set -euo pipefail
          age -r "$AGE_PUBLIC_KEY" -o "$DUMP.age" "$DUMP"
          rm -f "$DUMP"
          ls -l "$DUMP.age"
          echo "KEY=db/$(date -u +%Y/%m)/ebda-$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_SHA::9}.dump.age" >> "$GITHUB_ENV"
      - name: Upload to R2 (ebda-db-backups, object-locked) and read it back
        run: |
          set -euo pipefail
          npx wrangler r2 object put "ebda-db-backups/$KEY" --file "$DUMP.age" --remote
          npx wrangler r2 object get "ebda-db-backups/$KEY" --file "$RUNNER_TEMP/readback.age" --remote
          cmp "$DUMP.age" "$RUNNER_TEMP/readback.age"
          echo "stored and read back: ebda-db-backups/$KEY ($(stat -c %s "$DUMP.age") bytes, encrypted)"

  notify-failure:
    name: Notify on backup failure
    needs: [backup]
    if: always() && needs.backup.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send Telegram alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "${TELEGRAM_BOT_TOKEN:-}" ] && [ -n "${TELEGRAM_ALERT_CHAT_ID:-}" ] || { echo "no telegram secrets - skip"; exit 0; }
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_ALERT_CHAT_ID}" \
            --data-urlencode text="DB BACKUP FAILED (nightly off-machine dump). The newest off-machine copy is now older than a day. ${RUN_URL}" >/dev/null || true
