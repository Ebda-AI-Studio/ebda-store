name: Scoped Audit Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_cloud:
        description: 'Force cloud runner (bypass self-hosted)'
        type: boolean
        default: false

concurrency:
  group: scoped-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  scoped-audit:
    name: Blast-radius scoped audit (Opus)
    runs-on: ${{ (inputs.force_cloud || vars.USE_SELF_HOSTED != 'true') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","wsl2"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build scoped-audit input (changed files + dependents + dimensions + diff)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          AUDIT_INPUT: /tmp/scoped-audit-input.md
        run: |
          BASE_REF="${BASE_SHA}..${HEAD_SHA}"
          bash scripts/scoped-audit.sh force-website-builder "$BASE_REF" .

      - name: Run Claude scoped audit (subscription OAuth)
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          AUDIT_INPUT: /tmp/scoped-audit-input.md
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "CLAUDE_CODE_OAUTH_TOKEN not set — skipping audit (fail-open)."
            printf '%s' '{"result":"{\"summary\":\"Scoped audit skipped: CLAUDE_CODE_OAUTH_TOKEN not configured.\",\"findings\":[]}"}' \
              > /tmp/scoped-audit-out.json
          else
            # flock + skip-if-present: self-hosted runners share one global
            # node_modules; concurrent 'npm install -g claude-code' jobs race it
            # and one dies with ENOTEMPTY (the 2026-06-10 merge-blocking flake).
            (
              flock 200
              command -v claude >/dev/null 2>&1 || npm install -g @anthropic-ai/claude-code
            ) 200>/tmp/.force-claude-code-install.lock
            claude -p \
              --output-format json \
              --model claude-opus-4-8 \
              --allowedTools "Read,Grep,Glob" \
              < "$AUDIT_INPUT" > /tmp/scoped-audit-out.json
          fi

      - name: Parse findings, comment, gate (blocks on P0/P1; files P2/P3 as issues)
        id: gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CLAUDE_OUTPUT: /tmp/scoped-audit-out.json
        run: node .github/scoped-audit/audit.mjs
