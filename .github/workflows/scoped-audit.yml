name: Scoped Audit Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_cloud:
        description: 'Force cloud runner (bypass self-hosted)'
        type: boolean
        default: false

concurrency:
  group: scoped-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  scoped-audit:
    name: Blast-radius scoped audit (Opus)
    # Not on Dependabot's PRs (issue 2254): a Dependabot-triggered run has no
    # CLAUDE_CODE_OAUTH_TOKEN (Dependabot secret store) and a read-only
    # GITHUB_TOKEN, so audit.mjs would take its did-not-run path every week —
    # a red tick plus a Telegram "scoped-audit did not run" alert on a PR that
    # only bumps a pinned action SHA. That is an expected no-op, not a masked
    # failure; skipping it here keeps the did-not-run alert meaning something.
    # Keyed on the PR author, not github.actor (a human re-run keeps it).
    if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ${{ (inputs.force_cloud || vars.USE_SELF_HOSTED != 'true') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","wsl2"]') }}
    timeout-minutes: 20
    steps:
      # Pre-checkout guard (#1883): survives an OOM-kill/guest-restart on a
      # prior job that stranded a root-owned trufflehog-*/ dir `if: always()`
      # cannot cover, because nothing after the kill runs, checkout included.
      - name: Remove root-owned trufflehog scratch (pre-checkout guard, issue 1883)
        # Inline, not a local composite action: a `uses: ./.github/actions/...`
        # step cannot resolve before actions/checkout has put the repo on disk.
        shell: bash
        run: |
          shopt -s nullglob
          # Sparse-checkout leak (2026-09-30): a sparse job on this persistent
          # self-hosted workspace left core.sparseCheckout in .git/config, and
          # the next plain actions/checkout reused it, so orders' deploy got a
          # scripts-only tree ("npm ci: no package-lock.json"). Undo any
          # inherited sparse config BEFORE checkout, in every job.
          if [ -d .git ] && [ "$(git config --get core.sparseCheckout 2>/dev/null)" = "true" ]; then
            echo "::warning::workspace .git carries a sparse-checkout config from a prior job — disabling it before checkout"
            git sparse-checkout disable 2>/dev/null || true
            git config --unset-all core.sparseCheckout 2>/dev/null || true
            git config --unset-all core.sparseCheckoutCone 2>/dev/null || true
            rm -f .git/info/sparse-checkout
          fi
          leftovers=(trufflehog-*)
          if [ ${#leftovers[@]} -eq 0 ]; then
            exit 0
          fi
          echo "::warning::found stranded root-owned trufflehog scratch from a prior job (${leftovers[*]}) — removing before checkout"
          docker run --rm -v "$PWD":/workspace -w /workspace \
            alpine:3.20 sh -c 'rm -rf trufflehog-*' || {
            echo "::warning::trufflehog scratch cleanup failed — checkout may still hit EACCES; needs a root delete on this runner" >&2
            exit 0
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Build scoped-audit input (changed files + dependents + dimensions + diff)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          AUDIT_INPUT: /tmp/scoped-audit-input.md
        run: |
          # Three-dot (issues 2338, 2352): `base..head` is a direct two-commit
          # diff, so when main has moved since the branch point every main-only
          # file showed up as a PR "deletion" (204 of 214 files on PR 2331).
          # `base...head` diffs from the merge base: only the PR's own change.
          # fetch-depth: 0 above guarantees the merge base is present.
          BASE_REF="${BASE_SHA}...${HEAD_SHA}"
          bash scripts/scoped-audit.sh force-website-builder "$BASE_REF" .

      - name: Run Claude scoped audit (subscription OAuth)
        id: run-audit
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          AUDIT_INPUT: /tmp/scoped-audit-input.md
        run: |
          # AUDIT_RAN sentinel (2026-09-02, adversarial audit P2, tracked
          # #1115): this step is fail-open by design (continue-on-error) so a
          # broken model never blocks every PR — but that used to also mean
          # "model never ran" and "model ran, found nothing" produced the
          # SAME green check with the same PASSED comment. audit.mjs now
          # reads AUDIT_RAN/AUDIT_RAN_REASON and alerts loudly (PR comment +
          # step summary + Telegram) whenever this is false, instead of
          # silently passing.
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "CLAUDE_CODE_OAUTH_TOKEN not set — skipping audit (fail-open)."
            printf '%s' '{"result":"{\"summary\":\"Scoped audit skipped: CLAUDE_CODE_OAUTH_TOKEN not configured.\",\"findings\":[]}"}' \
              > /tmp/scoped-audit-out.json
            echo "audit_ran=false" >> "$GITHUB_OUTPUT"
            echo "audit_ran_reason=CLAUDE_CODE_OAUTH_TOKEN not configured" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # flock + skip-if-present: self-hosted runners share one global
          # node_modules; concurrent 'npm install -g claude-code' jobs race it
          # and one dies with ENOTEMPTY (the 2026-06-10 merge-blocking flake).
          (
            flock 200
            command -v claude >/dev/null 2>&1 || npm install -g @anthropic-ai/claude-code
          ) 200>/tmp/.force-claude-code-install.lock

          if claude -p \
              --output-format json \
              --model claude-opus-5 \
              --allowedTools "Read,Grep,Glob" \
              < "$AUDIT_INPUT" > /tmp/scoped-audit-out.json; then
            # CLI exited 0 — still confirm it actually produced a non-empty
            # `.result` before calling this a real run. A 0-exit with an
            # empty/malformed envelope is the same "silently vanished"
            # failure mode as a non-zero exit.
            if node -e "
              const fs = require('fs');
              const o = JSON.parse(fs.readFileSync('/tmp/scoped-audit-out.json', 'utf8'));
              const text = typeof o === 'string' ? o : o.result;
              process.exit(typeof text === 'string' && text.length > 0 ? 0 : 1);
            " 2>/dev/null; then
              echo "audit_ran=true" >> "$GITHUB_OUTPUT"
            else
              echo "::error::claude CLI exited 0 but produced an empty/malformed .result"
              echo "audit_ran=false" >> "$GITHUB_OUTPUT"
              echo "audit_ran_reason=CLI exited 0 but .result was empty or malformed" >> "$GITHUB_OUTPUT"
            fi
          else
            CLI_EXIT=$?
            echo "::error::claude CLI exited $CLI_EXIT — the scoped-audit gate did not run for this PR"
            echo "audit_ran=false" >> "$GITHUB_OUTPUT"
            echo "audit_ran_reason=claude CLI exited $CLI_EXIT" >> "$GITHUB_OUTPUT"
          fi

      - name: Parse findings, comment, gate (blocks on P0/P1; files P2/P3 as issues)
        id: gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CLAUDE_OUTPUT: /tmp/scoped-audit-out.json
          AUDIT_RAN: ${{ steps.run-audit.outputs.audit_ran }}
          AUDIT_RAN_REASON: ${{ steps.run-audit.outputs.audit_ran_reason }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
        run: node .github/scoped-audit/audit.mjs
