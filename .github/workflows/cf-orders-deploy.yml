name: Deploy Ebda orders PWA to Cloudflare
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/orders/**'
      - 'packages/shared/**'
      - 'packages/ui/**'
      - 'package-lock.json'
      - 'scripts/cf-setup-local.sh'
      - 'scripts/cf-routes.cjs'
      - 'scripts/cf-build.sh'
      - 'scripts/assert-cf-cache-bindings.sh'
      - '.github/workflows/cf-orders-deploy.yml'
permissions:
  contents: read
concurrency:
  group: ebda-orders-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ fromJSON(vars.EBDA_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 30
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: ${{ vars.EBDA_RUNS_ON == '' && 'npm' || '' }}
      - name: Require deployment credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - run: npm ci
      - run: npm run db:generate
      - run: npm run -w packages/shared build
      - run: npm run -w packages/database build
      - run: npx vitest run tests/unit/ebda-cf-generated-routes.test.ts tests/unit/cf-cache-bindings-assert.test.ts
      - name: Generate the orders Worker config (routes from BRAND, scripts/cf-routes.cjs)
        env:
          OPENNEXT_CACHE: 'false'
          CF_SETUP_SKIP_DEPS: '1'
        run: |
          bash scripts/cf-setup-local.sh orders
          bash scripts/assert-cf-cache-bindings.sh orders
      - name: Build orders for Cloudflare (OpenNext)
        env:
          # NEXT_PUBLIC_* are baked into the browser bundle at build time.
          NEXT_PUBLIC_API_URL: https://api.ebda.app
          NEXT_PUBLIC_SENTRY_DSN_ORDERS: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN_ORDERS }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}
          NEXT_PUBLIC_ONESIGNAL_ORDERS_APP_ID: ${{ vars.NEXT_PUBLIC_ONESIGNAL_ORDERS_APP_ID }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT_ORDERS }}
        run: |
          bash scripts/cf-build.sh orders
          echo "BUILD_ID=$(cat apps/orders/.next/BUILD_ID)" >> "$GITHUB_ENV"
      - name: Record the version serving production (rollback target)
        id: previous
        working-directory: apps/orders
        run: node ../../scripts/ci/deploy-guard.mjs previous --name ebda-orders
      - name: Deploy ebda-orders Worker
        working-directory: apps/orders
        run: |
          npx wrangler deploy
      - name: Verify the live Worker serves THIS build, roll back automatically if not
        # Ruling DEPLOY-SAFETY-2. Poll (right after `wrangler deploy` the edge can still serve the
        # previous version for a few seconds). Identity: /_next/static/<BUILD_ID>/_buildManifest.js
        # exists only in this build's assets; the page probe must not 5xx. On failure within 120s:
        # `wrangler rollback <recorded version>`, confirm the old version serves, fail the job.
        # --resolve-ip pins the zone's edge IP so a probe never depends on the runner's DNS cache.
        env:
          PREVIOUS_VERSION: ${{ steps.previous.outputs.previous }}
        run: |
          ip=$(dig +short api.ebda.app | head -1)
          test -n "$ip" || { echo "::error::could not resolve the ebda.app edge IP"; exit 1; }
          node scripts/ci/deploy-guard.mjs verify --name ebda-orders --cwd apps/orders \
            --previous "$PREVIOUS_VERSION" --sha "$GITHUB_SHA" --window 120 --resolve-ip "$ip" \
            --probe "https://orders.ebda.app/_next/static/$BUILD_ID/_buildManifest.js|200" \
            --probe "https://orders.ebda.app/login|200" \
            --rollback-probe "https://orders.ebda.app/login|200"
