name: Deploy Ebda API to Cloudflare
on:
  workflow_dispatch:
  # Auto-deploy (Ahmad, 2026-10-25): a merge that changes anything the API Worker is built from deploys it,
  # so main and production cannot drift (before this a push never redeployed the API and the frontends rolled
  # on without it). Same gates as a manual run: workerd smoke, migrate, deploy, /health commit verify with
  # automatic rollback. The concurrency group below queues deploys and never cancels one.
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/ebda-cf-api-config.mjs'
      - 'scripts/ci/deploy-guard.mjs'
      - 'scripts/ci/workerd-smoke.*'
      - '.github/workflows/cf-api-deploy.yml'
permissions:
  contents: read
concurrency:
  group: ebda-api-production
  cancel-in-progress: false
# Ruling DEPLOY-OOM-1: every tsc / build step of a deploy gets the same heap as ci.yml. cf-api-deploy's `tsc --noEmit` hit the
# default heap limit on 2026-11-02 (exit 134) and left main undeployed; tests/unit/deploy-workflows-heap.test.ts pins this.
env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  # Ruling CI-BUDGET-2: skip the whole deploy (seconds, not a build) when nothing this app is built from changed -
  # a workflow-only edit, a shared script another app uses, a lockfile entry this app does not depend on.
  # workflow_dispatch and `[force-deploy]` in the head commit message always deploy. scripts/ci/deploy-plan.mjs.
  plan:
    name: Does this push change api?
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ fromJSON(vars.EBDA_LIGHT_RUNS_ON || vars.EBDA_RUNS_ON || '["ebda-mac-light"]') }}
    timeout-minutes: 15 # a full-history clone on a slow link took >5 min (Ruling DEPLOY-PLAN-CLONE-1)
    outputs:
      deploy: ${{ steps.plan.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none # full history, file contents fetched on demand (Ruling DEPLOY-PLAN-CLONE-1)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - id: plan
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: node scripts/ci/deploy-plan.mjs --app api --event "$EVENT" --before "$BEFORE" --sha "$GITHUB_SHA"
  deploy:
    needs: [plan]
    if: github.ref == 'refs/heads/main' && needs.plan.outputs.deploy == 'true'
    runs-on: ${{ fromJSON(vars.EBDA_LIGHT_RUNS_ON || vars.EBDA_RUNS_ON || '["ebda-mac-light"]') }}
    timeout-minutes: 20
    environment: production
    # Throwaway Postgres for the pre-deploy workerd smoke (Ruling DEPLOY-SAFETY-1); never production.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      # Cloudflare Images binding for PWA icon resizing (Ruling D1016-ICONS-1); unset = no binding.
      EBDA_IMAGES_BINDING: ${{ vars.EBDA_IMAGES_BINDING }}
      EBDA_KV_CACHE_ID: ${{ vars.EBDA_KV_CACHE_ID }}
      # D1 ebda-platform (task 2.4): the per-store backend switch; the deploy config refuses to build without it.
      EBDA_PLATFORM_D1_ID: ${{ vars.EBDA_PLATFORM_D1_ID }}
      # INSTAPAY-AUTO-1a: unset = the dedupe binding is dropped from the deploy config (auto-confirm stays not ready)
      EBDA_INSTAPAY_DEDUPE_D1_ID: ${{ vars.EBDA_INSTAPAY_DEDUPE_D1_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Require deployment credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          # Bindings the Worker cannot run without: an unset id deploys a Worker with no cache binding (M-052).
          # No Hyperdrive id any more: the Worker has no Postgres (NEON-ZERO N-17, Ruling NZ-D23).
          test -n "$EBDA_KV_CACHE_ID" || { echo "::error::EBDA_KV_CACHE_ID is not set"; exit 1; }
      - run: npm ci
      - run: npm run -w packages/shared build
      - run: npm run -w packages/database build
      - run: npx tsc --noEmit -p apps/api/tsconfig.json
      - run: npx vitest run tests/unit/cf-database-role-guard.test.ts tests/unit/cron-tenant-scopes.test.ts tests/unit/merchant-signup-phone.test.ts
      - run: node scripts/ebda-cf-api-config.mjs
      - name: Require configured runtime secrets
        # The required list lives in scripts/ci/api-required-secrets.json and is checked against the code by
        # tests/unit/api-deploy-gates.test.ts (M-052: this gate used to require the retired RESEND_API_KEY and miss the
        # alert token, so a deploy could ship an API that cannot alert).
        working-directory: apps/api
        run: |
          npx wrangler secret list --config .wrangler.deploy.jsonc > "$RUNNER_TEMP/ebda-secret-names.json"
          node -e 'const names = new Set(require(process.env.RUNNER_TEMP + "/ebda-secret-names.json").map(x => x.name)); const req = require(process.env.GITHUB_WORKSPACE + "/scripts/ci/api-required-secrets.json").required; const missing = req.filter(n => !names.has(n)); if (missing.length) throw new Error(`Missing Worker secret(s): ${missing.join(", ")}`); for (const name of ["SEARCH_SEMANTIC_ENABLED"]) { if (names.has(name)) throw new Error(`${name} must be a wrangler.jsonc var, not a Worker secret (Ruling SEARCH-T10-1)`); }'
      - name: Pre-deploy smoke - boot THIS Worker on workerd (refuse to deploy a Worker that cannot boot)
        # Ruling DEPLOY-SAFETY-1. The Worker built from the deploy config and booted in local workerd with a local D1
        # directory (no Postgres exists any more, N-17); /health and the store-directory reads must answer without a 5xx.
        run: bash scripts/ci/workerd-smoke.sh --config .wrangler.deploy.jsonc
      # NEON-ZERO N-17 (Ruling NZ-D23): the Postgres schema-migration step is gone with Postgres; the store schema lives in
      # the StoreDO migrations and D1 (next step).
      # Same pattern as cf-accounts-deploy.yml (CF-MIGRATE-1): additive, idempotent (d1_migrations ledger), schema
      # first. The Worker reads stores.storage_backend, so the column must exist before the new code serves.
      - name: Apply D1 migrations (ebda-platform)
        working-directory: apps/api
        run: npx wrangler d1 migrations apply ebda-platform --remote --config .wrangler.deploy.jsonc
      # INSTAPAY-AUTO-1a: the shared dedupe D1, only once it is provisioned (the deploy config has no binding while the variable is unset).
      - name: Apply D1 migrations (ebda-instapay-dedupe)
        if: ${{ vars.EBDA_INSTAPAY_DEDUPE_D1_ID != '' }}
        working-directory: apps/api
        run: npx wrangler d1 migrations apply ebda-instapay-dedupe --remote --config .wrangler.deploy.jsonc
      - name: Record the version serving production (rollback target)
        id: previous
        run: node scripts/ci/deploy-guard.mjs previous --name ebda-api --cwd apps/api --config .wrangler.deploy.jsonc
      - name: Deploy reviewed API
        id: deploy
        # Ruling DEPLOY-TIMEOUT-1: a hung wrangler/OpenNext R2 populate must fail the step, not hold the runner.
        timeout-minutes: 10
        working-directory: apps/api
        run: npx wrangler deploy --config .wrangler.deploy.jsonc --var BUILD_COMMIT_SHA:$GITHUB_SHA
      - name: Verify the live API, roll back automatically if it is unhealthy
        # M-007: `wrangler deploy` can upload the new version and still exit non-zero ("Some triggers failed to deploy"). The
        # verify/rollback step MUST still run then, or a half-deployed Worker is neither verified nor rolled back.
        if: always() && steps.deploy.conclusion != 'skipped' && steps.previous.conclusion == 'success'
        # Ruling DEPLOY-SAFETY-2. Poll (right after `wrangler deploy` the edge can still serve the
        # previous version for a few seconds): /health must be ok on THIS commit AND a second route
        # (an unknown store through the database path) must be a clean 404. If not within 90s,
        # `wrangler rollback <recorded version>`, confirm it serves, and fail the job. Code
        # rollback does NOT undo the migration above: migrations stay expand-then-contract
        # (Ruling CF-MIGRATE-1).
        env:
          PREVIOUS_VERSION: ${{ steps.previous.outputs.previous }}
        run: |
          node scripts/ci/deploy-guard.mjs verify --name ebda-api --cwd apps/api \
            --config .wrangler.deploy.jsonc --previous "$PREVIOUS_VERSION" --sha "$GITHUB_SHA" \
            --probe "https://api.ebda.app/health|200|commit=$GITHUB_SHA" \
            --probe "https://api.ebda.app/api/v1/public/stores/ebda-deploy-probe-nonexistent|404" \
            --rollback-probe "https://api.ebda.app/health|200" \
            --rollback-probe "https://api.ebda.app/api/v1/public/stores/ebda-deploy-probe-nonexistent|404"

  # OPS-5: a failed deploy used to be silent (the storefront stayed on an old build for days). Alerts the Telegram bridge;
  # no secrets configured = skip, never fail.
  notify-failure:
    name: Notify on deploy failure
    needs: [deploy]
    if: always() && needs.deploy.result == 'failure'
    runs-on: ${{ fromJSON(vars.EBDA_LIGHT_RUNS_ON || vars.EBDA_RUNS_ON || '["ebda-mac-light"]') }}
    timeout-minutes: 2
    steps:
      - name: Send Telegram alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          WORKFLOW: ${{ github.workflow }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "${TELEGRAM_BOT_TOKEN:-}" ] && [ -n "${TELEGRAM_ALERT_CHAT_ID:-}" ] || { echo "no telegram secrets - skip"; exit 0; }
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_ALERT_CHAT_ID}" \
            --data-urlencode text="DEPLOY FAILED: ${WORKFLOW} at ${SHA:0:9}. Production did not change (or rolled back). ${RUN_URL}" >/dev/null || true
