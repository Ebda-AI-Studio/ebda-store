name: Lighthouse storefront audit

# 2026-09-02 (adversarial audit, P1-6): every run since 2026-07-13 failed
# with "Chrome installation not found" (the self-hosted umbra runner has no
# Chrome/Chromium and its user cannot sudo one in) — 7 weeks red, unnoticed,
# because this workflow had no notify-failure job. Two fixes below: a
# no-sudo Chrome install attempting the root cause, and a notify-failure job
# guaranteeing the NEXT time this goes red (Chrome or anything else) someone
# is told, per ci.yml/gitleaks.yml's existing pattern. The Chrome install is
# unverified against the live umbra runner (this worktree can't execute
# workflows) — the next scheduled run or a workflow_dispatch settles it; if
# it's still failing, the notify-failure job means that will be visible
# instead of silent.

on:
  schedule:
    - cron: '0 4 * * *' # 4am UTC = 7am Kuwait
  workflow_dispatch:
    inputs:
      force_cloud:
        description: 'Run on cloud (ubuntu-latest) instead of self-hosted'
        type: boolean
        default: false

# Least-privilege default: read-only workflow GITHUB_TOKEN. Jobs that need write
# override upward with their own `permissions:` block.
permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ${{ (inputs.force_cloud || (github.event_name == 'schedule' && vars.SCHEDULED_ON_CLOUD == 'true') || (github.event_name != 'schedule' && vars.USE_SELF_HOSTED != 'true')) && 'ubuntu-latest' || fromJSON('["self-hosted","linux","wsl2"]') }}
    timeout-minutes: 20
    steps:
      # Pre-checkout guard (#1883): survives an OOM-kill/guest-restart on a
      # prior job that stranded a root-owned trufflehog-*/ dir `if: always()`
      # cannot cover, because nothing after the kill runs, checkout included.
      - name: Remove root-owned trufflehog scratch (pre-checkout guard, issue 1883)
        # Inline, not a local composite action: a `uses: ./.github/actions/...`
        # step cannot resolve before actions/checkout has put the repo on disk.
        shell: bash
        run: |
          shopt -s nullglob
          # Sparse-checkout leak (2026-09-30): a sparse job on this persistent
          # self-hosted workspace left core.sparseCheckout in .git/config, and
          # the next plain actions/checkout reused it, so orders' deploy got a
          # scripts-only tree ("npm ci: no package-lock.json"). Undo any
          # inherited sparse config BEFORE checkout, in every job.
          if [ -d .git ] && [ "$(git config --get core.sparseCheckout 2>/dev/null)" = "true" ]; then
            echo "::warning::workspace .git carries a sparse-checkout config from a prior job — disabling it before checkout"
            git sparse-checkout disable 2>/dev/null || true
            git config --unset-all core.sparseCheckout 2>/dev/null || true
            git config --unset-all core.sparseCheckoutCone 2>/dev/null || true
            rm -f .git/info/sparse-checkout
          fi
          leftovers=(trufflehog-*)
          if [ ${#leftovers[@]} -eq 0 ]; then
            exit 0
          fi
          echo "::warning::found stranded root-owned trufflehog scratch from a prior job (${leftovers[*]}) — removing before checkout"
          docker run --rm -v "$PWD":/workspace -w /workspace \
            alpine:3.20 sh -c 'rm -rf trufflehog-*' || {
            echo "::warning::trufflehog scratch cleanup failed — checkout may still hit EACCES; needs a root delete on this runner" >&2
            exit 0
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - name: Install @lhci/cli
        run: npm install -D @lhci/cli

      - name: Install Chrome (no-sudo, self-hosted + cloud safe)
        # chrome-launcher (which lhci uses under the hood) needs a Chrome/
        # Chromium binary and respects the CHROME_PATH env var override.
        # @puppeteer/browsers installs a pinned Chrome build into a
        # user-writable cache dir with no sudo — same no-sudo pattern already
        # used for k6 (load-test-nightly.yml) and jq on this runner. Skips
        # the download if a previous run already cached one.
        run: |
          set -euo pipefail
          CACHE_DIR="$HOME/.cache/chrome-for-lighthouse"
          CHROME_BIN=$(find "$CACHE_DIR" -type f -name chrome -perm -u+x 2>/dev/null | head -1)
          if [ -z "$CHROME_BIN" ]; then
            npx --yes @puppeteer/browsers install chrome@stable --path "$CACHE_DIR"
            CHROME_BIN=$(find "$CACHE_DIR" -type f -name chrome -perm -u+x 2>/dev/null | head -1)
          fi
          if [ -z "$CHROME_BIN" ]; then
            echo "::error::Chrome install did not produce a usable binary under $CACHE_DIR"
            exit 1
          fi
          echo "Chrome at: $CHROME_BIN"
          echo "CHROME_PATH=$CHROME_BIN" >> "$GITHUB_ENV"

      - name: Run Lighthouse CI
        run: npx lhci autorun --config=apps/web/lighthouserc.json
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

  notify-failure:
    name: Notify on failure
    runs-on: ${{ ((github.event_name == 'schedule' && vars.SCHEDULED_ON_CLOUD == 'true') || (github.event_name != 'schedule' && vars.USE_SELF_HOSTED != 'true')) && 'ubuntu-latest' || fromJSON('["self-hosted","linux","wsl2"]') }}
    timeout-minutes: 2
    needs: [lighthouse]
    if: always() && failure()
    steps:
      - name: Compose + send Telegram alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_ALERT_CHAT_ID" ]; then
            echo "telegram secrets not configured — skipping alert"
            exit 0
          fi
          MSG=$(printf '🔴 *Lighthouse nightly FAILED* — %s\n[view run](https://github.com/%s/actions/runs/%s)' \
            "$REPO" "$REPO" "$RUN_ID")
          curl -sS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_ALERT_CHAT_ID}" \
            -d parse_mode=Markdown \
            -d disable_web_page_preview=true \
            --data-urlencode text="$MSG" \
            >/dev/null
          echo "alert sent"
