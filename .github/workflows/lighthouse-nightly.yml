name: Lighthouse storefront audit

on:
  schedule:
    - cron: '0 4 * * *' # 4am UTC = 7am Kuwait
  workflow_dispatch:
    inputs:
      force_cloud:
        description: 'Run on cloud (ubuntu-latest) instead of self-hosted'
        type: boolean
        default: false

# Least-privilege default: read-only workflow GITHUB_TOKEN. Jobs that need write
# override upward with their own `permissions:` block.
permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ${{ (inputs.force_cloud || vars.USE_SELF_HOSTED != 'true') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","wsl2"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install @lhci/cli
        run: npm install -D @lhci/cli
      - name: Run Lighthouse CI
        run: npx lhci autorun --config=apps/web/lighthouserc.json
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
