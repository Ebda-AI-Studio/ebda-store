name: Cloudflare data backup
# Ruling NZ-BACKUP-1: Postgres is gone (NEON-ZERO), so the nightly copy is D1 `ebda-platform` + D1 `ebda-identity` (ICEBERG-BK-1) + every StoreDO store ->
# gzip -9 -> age (public key only on this runner) -> R2 `ebda-db-backups` under cf/{daily,weekly,monthly}/. Unchanged artifacts are
# referenced, not re-uploaded; every object is read back and sha256-compared; a size guard fails the run on >2x growth or a cf/ cap
# breach. Restore: docs/DB-BACKUP-RESTORE.md "Real recovery"; drill: scripts/ops/restore-drill.mjs (weekly: cf-backup-drill.yml).
# R2 `ebda-media` is copied incrementally (new/changed etag only, encrypted) to media/ (ICEBERG-BK-2). The bucket is in the same
# Cloudflare account; the off-account copy is the Mac pull scripts/ops/pull-cf-backups.mjs (ICEBERG-BK-3).
# The legacy Postgres job (db-backup.yml) stays disabled.
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ebda-cf-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ${{ fromJSON(vars.EBDA_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 45
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      EBDA_BACKUP_AGE_PUBLIC_KEY: ${{ vars.EBDA_BACKUP_AGE_PUBLIC_KEY }}
      BACKUP_EXPORT_SECRET: ${{ secrets.BACKUP_EXPORT_SECRET }}
      EBDA_BACKUP_CF_CAP_BYTES: ${{ vars.EBDA_BACKUP_CF_CAP_BYTES }}
      EBDA_BACKUP_MEDIA_CAP_BYTES: ${{ vars.EBDA_BACKUP_MEDIA_CAP_BYTES }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          # remote Actions cache on hosted runners only (a self-hosted runner already has ~/.npm; the remote cache pulled GBs there)
          cache: ${{ vars.EBDA_RUNS_ON == '' && 'npm' || '' }}
      - uses: ./.github/actions/npm-ci
      - name: Require the inputs
        run: |
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID EBDA_BACKUP_AGE_PUBLIC_KEY BACKUP_EXPORT_SECRET; do
            test -n "${!v}" || { echo "::error::$v is not set in the production environment"; exit 1; }
          done
          command -v age >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq age >/dev/null; }
      - name: Warn when the failure alert cannot fire
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_ALERT_CHAT_ID:-}" ]; then
            echo "::warning::TELEGRAM_BOT_TOKEN / TELEGRAM_ALERT_CHAT_ID missing in environment production: a backup failure will NOT alert anyone"
            echo "### WARNING: failure alerts are not configured (TELEGRAM_BOT_TOKEN, TELEGRAM_ALERT_CHAT_ID)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Export, compress, encrypt, upload, read back
        run: node scripts/ops/backup-cf.mjs

  notify-failure:
    name: Notify on backup failure
    needs: [backup]
    if: always() && needs.backup.result == 'failure'
    runs-on: ${{ fromJSON(vars.EBDA_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 2
    # Environment secrets are only visible to a job that names the environment: without this line the alert saw no
    # TELEGRAM_* values even when they were set in `production` (first real run: "no telegram secrets - skip").
    environment: production
    steps:
      - name: Send Telegram alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_ALERT_CHAT_ID:-}" ]; then
            echo "::warning::NO ALERT SENT: TELEGRAM_BOT_TOKEN and/or TELEGRAM_ALERT_CHAT_ID are not set in environment production"
            echo "### NO ALERT SENT - the backup failed and nobody was told. Set TELEGRAM_BOT_TOKEN and TELEGRAM_ALERT_CHAT_ID as secrets in GitHub environment production." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_ALERT_CHAT_ID}" \
            --data-urlencode text="CF DATA BACKUP FAILED (D1 platform + identity + StoreDO + media to R2, or a size guard). There is NO other nightly copy of production data. ${RUN_URL}" >/dev/null || true
