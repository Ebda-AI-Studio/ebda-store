name: AI-output eval (model-as-judge, nightly)

# The model-as-judge layer (real Gemini calls scoring grounding /
# duplication / relevance / tone for every AI generation path) is
# deliberately NOT part of ci.yml's per-push gate — it costs Gemini
# free-tier quota and is non-deterministic, neither of which belongs in a
# hard per-push check. The offline deterministic layer
# (tests/unit/ai-eval-*.test.ts) already runs on every push as part of the
# normal unit-test job; this workflow runs the deeper, slower complement
# on a schedule (or manually before/after a generator-prompt change).
#
# Requires GOOGLE_GENERATIVE_AI_KEY (or GEMINI_API_KEY) as a repo secret —
# the same key production uses. Degrades gracefully (deterministic-only,
# non-zero exit still possible from that layer) if it's missing.

on:
  schedule:
    - cron: '30 2 * * *' # 2:30am UTC = 5:30am Kuwait — off-peak, ahead of the working day
  workflow_dispatch:
    inputs:
      type:
        description: 'Only evaluate one AI output type (e.g. product-faq). Leave blank for all.'
        required: false
        default: ''
      force_cloud:
        description: 'Run on cloud (ubuntu-latest) instead of self-hosted'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ai-eval:
    name: Model-as-judge AI output eval
    runs-on: ${{ (inputs.force_cloud || (github.event_name == 'schedule' && vars.SCHEDULED_ON_CLOUD == 'true') || (github.event_name != 'schedule' && vars.USE_SELF_HOSTED != 'true')) && 'ubuntu-latest' || fromJSON('["self-hosted","linux","wsl2"]') }}
    timeout-minutes: 20
    steps:
      # Pre-checkout guard (#1883): survives an OOM-kill/guest-restart on a
      # prior job that stranded a root-owned trufflehog-*/ dir `if: always()`
      # cannot cover, because nothing after the kill runs, checkout included.
      - name: Remove root-owned trufflehog scratch (pre-checkout guard, issue 1883)
        # Inline, not a local composite action: a `uses: ./.github/actions/...`
        # step cannot resolve before actions/checkout has put the repo on disk.
        shell: bash
        run: |
          shopt -s nullglob
          # Sparse-checkout leak (2026-09-30): a sparse job on this persistent
          # self-hosted workspace left core.sparseCheckout in .git/config, and
          # the next plain actions/checkout reused it, so orders' deploy got a
          # scripts-only tree ("npm ci: no package-lock.json"). Undo any
          # inherited sparse config BEFORE checkout, in every job.
          if [ -d .git ] && [ "$(git config --get core.sparseCheckout 2>/dev/null)" = "true" ]; then
            echo "::warning::workspace .git carries a sparse-checkout config from a prior job — disabling it before checkout"
            git sparse-checkout disable 2>/dev/null || true
            git config --unset-all core.sparseCheckout 2>/dev/null || true
            git config --unset-all core.sparseCheckoutCone 2>/dev/null || true
            rm -f .git/info/sparse-checkout
          fi
          leftovers=(trufflehog-*)
          if [ ${#leftovers[@]} -eq 0 ]; then
            exit 0
          fi
          echo "::warning::found stranded root-owned trufflehog scratch from a prior job (${leftovers[*]}) — removing before checkout"
          docker run --rm -v "$PWD":/workspace -w /workspace \
            alpine:3.20 sh -c 'rm -rf trufflehog-*' || {
            echo "::warning::trufflehog scratch cleanup failed — checkout may still hit EACCES; needs a root delete on this runner" >&2
            exit 0
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          # No GitHub Actions npm cache on self-hosted: ~/.npm already persists on
          # the guest, so the cache buys nothing and only grows — this repo's entry
          # reached 911MB, restored at ~0.6 MB/s. ci.yml dropped it on 2026-07-05 for
          # exactly this reason; this workflow was missed.
          #
          # Inverted on purpose: `A && '' || 'npm'` is NOT a ternary ('' is falsy in
          # Actions expressions, so it always yields 'npm' — see foundation #122).
          cache: ${{ runner.environment != 'self-hosted' && 'npm' || '' }}
      - name: Install dependencies
        run: npm ci
      # The eval imports @force/database + @force/shared, which resolve to their
      # compiled dist/ — npm ci alone does not build workspace packages, so the
      # eval crashed with "Cannot find module '@force/database/dist/index.js'".
      # Build them (Prisma client first) exactly like ci.yml does.
      - name: Generate Prisma Client
        run: npm run db:generate
      - name: Build database package
        run: npm run build -w packages/database
      - name: Build shared package
        run: npm run build -w packages/shared
      - name: Run AI-output eval (deterministic + model-judge)
        env:
          GOOGLE_GENERATIVE_AI_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          EVAL_TYPE: ${{ github.event.inputs.type }}
        run: |
          if [ -n "$EVAL_TYPE" ]; then
            npm run ai:eval -- --type="$EVAL_TYPE"
          else
            npm run ai:eval
          fi

  notify-failure:
    name: Notify on failure
    # Umbra-only CI policy (2026-07-15): billing-blocked cloud runners can
    # never fire; ride the self-hosted runner (runner-death alerting = OS medic).
    runs-on: ${{ ((github.event_name == 'schedule' && vars.SCHEDULED_ON_CLOUD == 'true') || (github.event_name != 'schedule' && vars.USE_SELF_HOSTED != 'true')) && 'ubuntu-latest' || fromJSON('["self-hosted","linux","wsl2"]') }}
    timeout-minutes: 2
    needs: [ai-eval]
    if: always() && failure()
    steps:
      - name: Compose + send Telegram alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_ALERT_CHAT_ID" ]; then
            echo "::warning::Telegram alert secrets not set — skipping notification"
            exit 0
          fi
          MSG="🤖 AI-output eval failed: a generator's output no longer meets its grounding/quality bar.
          Repo: ${REPO}
          Run: https://github.com/${REPO}/actions/runs/${RUN_ID}"
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_ALERT_CHAT_ID}" \
            --data-urlencode text="${MSG}"
