name: Railway deploy drift check

# #1490: the API deploy job (railway-deploy.yml) is gated at JOB level on
# `vars.RAILWAY_ACTIONS_DEPLOY == 'true'` — deliberately, so a pre-cutover run
# reports SKIPPED rather than a lying green tick. But post-cutover, if that
# variable is ever lost, mistyped ('True'/'TRUE'/'1') or unset, the job goes
# back to silently skipping — and `notify-failure` (`needs: deploy`, `if:
# failure()`) is skipped right along with it, because a skipped dependency
# never satisfies `failure()`. Every push to main would then deploy nothing
# and alert nobody, with only a grey square on a workflow nobody watches.
#
# Rather than restructuring the deploy job's gate (real risk to a production
# deploy pipeline for a monitoring concern), this is the cheaper, independent
# alternative named in #1490: compare `origin/main`'s HEAD against what
# `/health` actually reports running (`apps/api/src/lib/build-identity.ts`
# exposes `commit` for exactly this — CLAUDE.md's "is the merged code live?"
# answer), and never touch the deploy job itself.
#
# What counts as drift (each one alerts on Telegram and fails the run):
#   1. RAILWAY_ACTIONS_DEPLOY is set to a truthy-looking value that is not
#      exactly 'true' ('True', 'TRUE', '1', 'yes', 'on') — railway-deploy.yml
#      compares the exact string, so its deploy job is skipping every push.
#      Pure configuration, no network call.
#   2. The live commit is not an ancestor of main (rollback, branch deploy,
#      force-push).
#   3. STALLED: the live commit IS an ancestor of main, but main carries
#      deploy-relevant commits (the same paths railway-deploy.yml triggers on)
#      that have not gone live, and the oldest of them landed more than
#      DRIFT_STALE_MINUTES ago, or more than DRIFT_MAX_BEHIND of them are
#      waiting. A pipeline that silently stopped leaves the live commit
#      permanently an ancestor of main, so "ancestor = healthy" with no bound
#      could never fire on the case this workflow exists for (scoped audit,
#      PR 1978). The age bound must exceed a normal deploy (the deploy job's
#      own timeout is 30 min), hence 90.
#   4. UNKNOWN, alerted as unknown (issue 2205): /health unreachable or not
#      JSON after 3 attempts, or answering with `commit: null`. Neither is
#      drift, but either one blinds this monitor — and a blind monitor that
#      exits 0 is a green square over the exact stall it was built to catch.
#
# NOT gated on RAILWAY_ACTIONS_DEPLOY. It used to be — `if: vars.RAILWAY_
# ACTIONS_DEPLOY == 'true'` — which made it blind to the one failure its
# header names: lose or mistype that variable and the deploy job, its
# notify-failure AND this monitor all skip together. /health reports the live
# commit whichever pipeline deployed it (Railway's own auto-deploy stamps
# RAILWAY_GIT_COMMIT_SHA pre-cutover; the Actions job stamps GIT_COMMIT_SHA
# after), so the comparison is meaningful before and after the cutover alike.

on:
  schedule:
    - cron: '*/30 * * * *' # every 30 min — cheap (two curls), self-hosted budget
  workflow_dispatch: {}

concurrency:
  group: railway-deploy-drift-check
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Compare origin/main against /health's reported commit
    # Umbra-only CI policy (2026-07-15): GitHub-hosted runners are billing-
    # blocked permanently, so this rides the self-hosted runner like every
    # other job. Cheap (two HTTP calls), so a 30-min schedule is not a
    # meaningful load on the 2-runner pool.
    runs-on: ${{ ((github.event_name == 'schedule' && vars.SCHEDULED_ON_CLOUD == 'true') || (github.event_name != 'schedule' && vars.USE_SELF_HOSTED != 'true')) && 'ubuntu-latest' || fromJSON('["self-hosted","linux","wsl2"]') }}
    # 3 x (10s curl + 10s wait) for an unreachable /health, plus checkout.
    timeout-minutes: 4
    steps:
      - name: Remove root-owned trufflehog scratch (pre-checkout guard, issue 1883)
        # Inline, not a local composite action: a `uses: ./.github/actions/...`
        # step cannot resolve before actions/checkout has put the repo on disk.
        shell: bash
        run: |
          shopt -s nullglob
          # Sparse-checkout leak (2026-09-30): a sparse job on this persistent
          # self-hosted workspace left core.sparseCheckout in .git/config, and
          # the next plain actions/checkout reused it, so orders' deploy got a
          # scripts-only tree ("npm ci: no package-lock.json"). Undo any
          # inherited sparse config BEFORE checkout, in every job.
          if [ -d .git ] && [ "$(git config --get core.sparseCheckout 2>/dev/null)" = "true" ]; then
            echo "::warning::workspace .git carries a sparse-checkout config from a prior job — disabling it before checkout"
            git sparse-checkout disable 2>/dev/null || true
            git config --unset-all core.sparseCheckout 2>/dev/null || true
            git config --unset-all core.sparseCheckoutCone 2>/dev/null || true
            rm -f .git/info/sparse-checkout
          fi
          leftovers=(trufflehog-*)
          if [ ${#leftovers[@]} -eq 0 ]; then
            exit 0
          fi
          echo "::warning::found stranded root-owned trufflehog scratch from a prior job (${leftovers[*]}) — removing before checkout"
          docker run --rm -v "$PWD":/workspace -w /workspace \
            alpine:3.20 sh -c 'rm -rf trufflehog-*' || {
            echo "::warning::trufflehog scratch cleanup failed — checkout may still hit EACCES; needs a root delete on this runner" >&2
            exit 0
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, not the default shallow clone: the ancestor check
          # below needs LIVE_SHA reachable in local history, and a live
          # commit a few pushes behind main during a normal deploy window is
          # exactly the case that must NOT read as drift.
          fetch-depth: 0

      # The Compare step below calls `node` to parse /health's JSON body —
      # not on the self-hosted runner's Actions shell PATH without this.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Compare
        env:
          RAILWAY_HEALTH_URL: ${{ vars.RAILWAY_HEALTH_URL || 'https://api.force-ai.co/health' }}
          RAILWAY_ACTIONS_DEPLOY: ${{ vars.RAILWAY_ACTIONS_DEPLOY }}
          # Minutes the oldest undeployed deploy-relevant commit may wait
          # before it is a stall, and how many may queue. See the header.
          DRIFT_STALE_MINUTES: '90'
          DRIFT_MAX_BEHIND: '10'
          # MUST mirror railway-deploy.yml's `on.push.paths` (as git
          # pathspecs: a trailing `/**` dropped). A commit outside these never
          # triggers a deploy, so it can never be "undeployed".
          # tests/unit/railway-deploy-drift-check.test.ts asserts the parity.
          DEPLOY_PATHS: 'apps/api packages railway.json Dockerfile.api .github/workflows/railway-deploy.yml package.json package-lock.json'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
        run: |
          alert() {
            echo "::error::$1"
            if [ -n "${TELEGRAM_BOT_TOKEN:-}" ]; then
              curl -sS -m 15 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                -d chat_id="${TELEGRAM_ALERT_CHAT_ID:-}" \
                -d text="🚨 $1" >/dev/null || true
            fi
            exit 1
          }

          # 1. The cutover switch, mistyped. railway-deploy.yml's gate is an
          #    exact-string compare, so any of these skips every deploy.
          gate="${RAILWAY_ACTIONS_DEPLOY:-}"
          if [ -n "$gate" ] && [ "$gate" != "true" ]; then
            case "$(printf '%s' "$gate" | tr '[:upper:]' '[:lower:]')" in
              true | 1 | yes | on | y)
                alert "Railway deploy misconfigured: RAILWAY_ACTIONS_DEPLOY is '$gate', not exactly 'true' — railway-deploy.yml's deploy job (and its notify-failure) is SKIPPING every push to main. Set it to exactly: true"
                ;;
            esac
          fi

          MAIN_SHA="$(git rev-parse HEAD)"
          echo "origin/main: $MAIN_SHA"

          # What is live. The two UNKNOWN answers used to warn and exit 0
          #    (scoped audit on PR 1978, issue 2205): a `::warning::` on a
          #    scheduled run nobody watches is indistinguishable from success,
          #    and railway-deploy.yml's GIT_COMMIT_SHA stamp is deliberately
          #    non-fatal — so a drifted Railway CLI would leave /health at
          #    `commit: null` forever and this monitor green forever, blind to
          #    the stall it exists to catch. Unknown is still not DRIFT, and the
          #    alerts say so; but a monitor that cannot see is itself a finding.
          #    Unreachable/unparseable is retried first (a single blip is not an
          #    outage); `commit: null` is deterministic, so it is not.
          LIVE_SHA=''
          health_state=unreachable
          for attempt in $(seq 1 "${DRIFT_HEALTH_ATTEMPTS:-3}"); do
            resp="$(curl -sS -m 10 "$RAILWAY_HEALTH_URL" || true)"
            health_state="$(node -e "
              try {
                const d = JSON.parse(process.argv[1]);
                process.stdout.write(typeof d.commit === 'string' && d.commit ? 'commit:' + d.commit : 'nocommit');
              } catch { process.stdout.write('unparseable'); }
            " "$resp")"
            [ -z "$resp" ] && health_state=unreachable
            case "$health_state" in
              commit:*) LIVE_SHA="${health_state#commit:}"; break ;;
              nocommit) break ;;
            esac
            echo "::warning::/health attempt $attempt: $health_state"
            sleep "${DRIFT_HEALTH_RETRY_SECS:-10}"
          done

          case "$health_state" in
            unreachable | unparseable)
              alert "Railway drift check could not read $RAILWAY_HEALTH_URL (${health_state} after ${DRIFT_HEALTH_ATTEMPTS:-3} attempts). Not a deploy-drift finding — the API /health endpoint is down or not returning JSON, so neither the API nor this monitor can be vouched for."
              ;;
            nocommit)
              alert "Railway drift monitor is BLIND: /health answers but reports no commit (commit: null). The live build is UNKNOWN, not drifted — but until the commit stamp is restored this check cannot detect a stalled or diverged deploy. Check railway-deploy.yml's 'railway variable set GIT_COMMIT_SHA' step / RAILWAY_GIT_COMMIT_SHA."
              ;;
          esac

          echo "live commit: $LIVE_SHA"

          if [ "$LIVE_SHA" = "$MAIN_SHA" ]; then
            echo "up to date"
            exit 0
          fi

          # 2. Not an ancestor of main: a rollback, branch deploy or force-push.
          if ! { git cat-file -e "$LIVE_SHA" 2>/dev/null && git merge-base --is-ancestor "$LIVE_SHA" "$MAIN_SHA" 2>/dev/null; }; then
            alert "Railway deploy drift: origin/main is at ${MAIN_SHA:0:7} but /health reports ${LIVE_SHA:0:7}, which is not an ancestor of main. The deploy pipeline may have stopped running — check RAILWAY_ACTIONS_DEPLOY, RAILWAY_TOKEN, and the railway-deploy.yml run history."
          fi

          # 3. An ancestor — but for how long, and by how much? Only commits
          #    that touch a deploy path can be waiting on a deploy; first-parent
          #    so a merged branch's old commit dates do not read as old merges.
          read -r -a paths <<< "$DEPLOY_PATHS"
          behind="$(git rev-list --count --first-parent "$LIVE_SHA..$MAIN_SHA" -- "${paths[@]}")"
          if [ "$behind" -eq 0 ]; then
            echo "live commit is an ancestor of main and main is ahead only by commits outside the deploy paths — nothing to deploy, not drift."
            exit 0
          fi
          oldest="$(git rev-list --first-parent --reverse "$LIVE_SHA..$MAIN_SHA" -- "${paths[@]}" | sed -n '1p')"
          age_min=$(( ( $(date +%s) - $(git log -1 --format=%ct "$oldest") ) / 60 ))
          echo "undeployed deploy-relevant commits: $behind (oldest ${oldest:0:7}, ${age_min} min ago)"

          if [ "$age_min" -gt "$DRIFT_STALE_MINUTES" ] || [ "$behind" -gt "$DRIFT_MAX_BEHIND" ]; then
            alert "Railway deploy STALLED: /health reports ${LIVE_SHA:0:7}; main is ${behind} deploy-relevant commit(s) ahead and the oldest (${oldest:0:7}) landed ${age_min} min ago (bounds: ${DRIFT_STALE_MINUTES} min / ${DRIFT_MAX_BEHIND} commits). The deploy pipeline has stopped following main — check RAILWAY_ACTIONS_DEPLOY, RAILWAY_TOKEN, and the railway-deploy.yml run history."
          fi

          echo "live commit is behind main within bounds — a deploy is plausibly in flight, not drift."
