<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" width="640" height="600" role="img" aria-label="A WhatsApp conversation between a store and a customer: a cash-on-delivery order confirmation message, the customer reply, and the confirmed order"><style>
text{font-family:'Noto Sans Arabic','Segoe UI',Tahoma,'Helvetica Neue',Arial,sans-serif;}
.dot{animation:blink 1.4s infinite ease-in-out;transform-box:fill-box;transform-origin:center}
.d2{animation-delay:.2s}.d3{animation-delay:.4s}
.pulse{animation:pulse 2.6s infinite ease-in-out;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,80%,100%{opacity:.3}40%{opacity:1}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@media (prefers-reduced-motion:reduce){.dot,.pulse{animation:none}}
</style><rect width="640" height="600" rx="28" fill="#0A0B0C"/><rect x="1" y="1" width="638" height="598" rx="27" fill="none" stroke="#2A2D31"/><rect x="100" y="40" width="320" height="520" rx="40" fill="#15171A" stroke="#B08D57" stroke-opacity=".55" stroke-width="2"/><rect x="110" y="50" width="300" height="500" rx="32" fill="#0F1113"/><rect x="110" y="50" width="300" height="64" rx="32" fill="#16181B"/><rect x="110" y="84" width="300" height="30" fill="#16181B"/><circle cx="144" cy="84" r="18" fill="#B08D57"/><text x="144" y="90" font-size="17" fill="#0A0B0C" text-anchor="middle" font-weight="700">N</text><text x="174" y="80" font-size="15" fill="#FAF8F3" text-anchor="start" font-weight="600">Nadine Jewellery</text><text x="174" y="98" font-size="12" fill="#CBA873" text-anchor="start" font-weight="400">Online</text><rect x="124" y="140" width="232" height="150" rx="16" fill="#1C1F23" stroke="#2A2D31"/><text x="140" y="170" font-size="13.5" fill="#FAF8F3" text-anchor="start" font-weight="400">Hi! Your order #1042 is</text><text x="140" y="190" font-size="13.5" fill="#FAF8F3" text-anchor="start" font-weight="400">cash on delivery.</text><text x="140" y="210" font-size="13.5" fill="#FAF8F3" text-anchor="start" font-weight="600">Confirm the order?</text><rect x="140" y="232" width="100" height="38" rx="12" fill="#B08D57"/><text x="190.0" y="256" font-size="14" fill="#0A0B0C" text-anchor="middle" font-weight="700">Confirm</text><rect x="248" y="232" width="92" height="38" rx="12" fill="none" stroke="#2A2D31" stroke-width="1.5"/><text x="294.0" y="256" font-size="14" fill="#9A9486" text-anchor="middle" font-weight="500">Refuse</text><rect x="266" y="310" width="130" height="44" rx="16" fill="#B08D57"/><text x="331.0" y="338" font-size="14" fill="#0A0B0C" text-anchor="middle" font-weight="700">Confirm</text><rect x="124" y="378" width="232" height="64" rx="16" fill="#1C1F23" stroke="#2A2D31"/><text x="140" y="406" font-size="13.5" fill="#FAF8F3" text-anchor="start" font-weight="400">Done, your order is confirmed. Thank you!</text><rect x="124" y="462" width="70" height="34" rx="16" fill="#1C1F23" stroke="#2A2D31"/><circle class="dot d1" cx="146" cy="479" r="3.6" fill="#CBA873"/><circle class="dot d2" cx="159" cy="479" r="3.6" fill="#CBA873"/><circle class="dot d3" cx="172" cy="479" r="3.6" fill="#CBA873"/><g class="pulse"><rect x="374" y="440" width="196" height="66" rx="18" fill="#0A0B0C" stroke="#B08D57" stroke-width="1.5"/><circle cx="404" cy="473" r="12" fill="#B08D57"/><path d="M399 473 l4 4 l7 -8" stroke="#0A0B0C" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="426" y="470" font-size="14.5" fill="#FAF8F3" text-anchor="start" font-weight="700">Order confirmed</text><text x="426" y="490" font-size="12" fill="#9A9486" text-anchor="start" font-weight="400">Sent back to your store</text></g></svg>