<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-label="إرسال حملة: قالب معتمد، شريحة عملاء وافقوا على العروض، تكلفة متوقعة قبل التأكيد"><style>
text{font-family:'Noto Sans Arabic','Segoe UI',Tahoma,'Helvetica Neue',Arial,sans-serif;}
.dot{animation:blink 1.4s infinite ease-in-out;transform-box:fill-box;transform-origin:center}
.d2{animation-delay:.2s}.d3{animation-delay:.4s}
.pulse{animation:pulse 2.6s infinite ease-in-out;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,80%,100%{opacity:.3}40%{opacity:1}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@media (prefers-reduced-motion:reduce){.dot,.pulse{animation:none}}
</style><rect width="640" height="420" rx="28" fill="#0A0B0C"/><rect x="1" y="1" width="638" height="418" rx="27" fill="none" stroke="#2A2D31"/><text x="608" y="52" font-size="20" fill="#FAF8F3" text-anchor="start" font-weight="700" direction="rtl" unicode-bidi="plain">حملة بموافقة العميل</text><rect x="24" y="76" width="592" height="150" rx="18" fill="#15171A" stroke="#2A2D31"/><text x="600" y="106" font-size="13" fill="#CBA873" text-anchor="start" font-weight="600" direction="rtl" unicode-bidi="plain">قالب معتمد من Meta</text><rect x="40" y="120" width="560" height="86" rx="14" fill="#1C1F23"/><text x="584" y="158" font-size="15" fill="#FAF8F3" text-anchor="start" font-weight="400" direction="rtl" unicode-bidi="plain">عرض نهاية الأسبوع: خصم على مجموعة الذهب.</text><rect x="464" y="172" width="120" height="22" rx="11" fill="none" stroke="#B08D57" stroke-opacity=".6"/><text x="524" y="188" font-size="11" fill="#9A9486" text-anchor="middle" font-weight="500">STOP</text><rect x="24" y="242" width="592" height="64" rx="18" fill="#15171A" stroke="#2A2D31"/><circle cx="584" cy="274" r="14" fill="#B08D57"/><path d="M578 274 l4 4 l8 -9" stroke="#0A0B0C" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="556" y="280" font-size="15.5" fill="#FAF8F3" text-anchor="start" font-weight="500" direction="rtl" unicode-bidi="plain">العملاء اللي وافقوا على العروض</text><text x="608" y="344" font-size="14" fill="#9A9486" text-anchor="start" font-weight="400" direction="rtl" unicode-bidi="plain">التكلفة المتوقعة قبل ما تأكّد</text><g class="pulse"><rect x="24" y="326" width="210" height="50" rx="16" fill="#B08D57"/><text x="129.0" y="358" font-size="16" fill="#0A0B0C" text-anchor="middle" font-weight="700">ابعت الحملة</text></g><text x="608" y="372" font-size="13" fill="#CBA873" text-anchor="start" font-weight="500" direction="rtl" unicode-bidi="plain">جدولها لوقت تختاره</text></svg>