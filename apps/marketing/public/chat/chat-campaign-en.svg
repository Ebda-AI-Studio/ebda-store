<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-label="Sending a campaign: an approved template, a segment of customers who agreed to offers, and the estimated cost before confirming"><style>
text{font-family:'Noto Sans Arabic','Segoe UI',Tahoma,'Helvetica Neue',Arial,sans-serif;}
.dot{animation:blink 1.4s infinite ease-in-out;transform-box:fill-box;transform-origin:center}
.d2{animation-delay:.2s}.d3{animation-delay:.4s}
.pulse{animation:pulse 2.6s infinite ease-in-out;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,80%,100%{opacity:.3}40%{opacity:1}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@media (prefers-reduced-motion:reduce){.dot,.pulse{animation:none}}
</style><rect width="640" height="420" rx="28" fill="#0A0B0C"/><rect x="1" y="1" width="638" height="418" rx="27" fill="none" stroke="#2A2D31"/><text x="32" y="52" font-size="20" fill="#FAF8F3" text-anchor="start" font-weight="700">Campaign with consent</text><rect x="24" y="76" width="592" height="150" rx="18" fill="#15171A" stroke="#2A2D31"/><text x="40" y="106" font-size="13" fill="#CBA873" text-anchor="start" font-weight="600">Meta-approved template</text><rect x="40" y="120" width="560" height="86" rx="14" fill="#1C1F23"/><text x="56" y="158" font-size="15" fill="#FAF8F3" text-anchor="start" font-weight="400">Weekend offer: a discount on the gold collection.</text><rect x="56" y="172" width="120" height="22" rx="11" fill="none" stroke="#B08D57" stroke-opacity=".6"/><text x="116" y="188" font-size="11" fill="#9A9486" text-anchor="middle" font-weight="500">STOP</text><rect x="24" y="242" width="592" height="64" rx="18" fill="#15171A" stroke="#2A2D31"/><circle cx="56" cy="274" r="14" fill="#B08D57"/><path d="M50 274 l4 4 l8 -9" stroke="#0A0B0C" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="84" y="280" font-size="15.5" fill="#FAF8F3" text-anchor="start" font-weight="500">Customers who agreed to offers</text><text x="32" y="344" font-size="14" fill="#9A9486" text-anchor="start" font-weight="400">Estimated cost before you confirm</text><g class="pulse"><rect x="406" y="326" width="210" height="50" rx="16" fill="#B08D57"/><text x="511.0" y="358" font-size="16" fill="#0A0B0C" text-anchor="middle" font-weight="700">Send campaign</text></g><text x="32" y="372" font-size="13" fill="#CBA873" text-anchor="start" font-weight="500">Schedule it for a time you pick</text></svg>