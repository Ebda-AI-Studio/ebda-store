<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" width="640" height="600" role="img" aria-label="محادثة على واتساب بين متجر وعميل: رسالة تأكيد طلب دفع عند الاستلام، ورد العميل، وتأكيد الطلب"><style>
text{font-family:'Noto Sans Arabic','Segoe UI',Tahoma,'Helvetica Neue',Arial,sans-serif;}
.dot{animation:blink 1.4s infinite ease-in-out;transform-box:fill-box;transform-origin:center}
.d2{animation-delay:.2s}.d3{animation-delay:.4s}
.pulse{animation:pulse 2.6s infinite ease-in-out;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,80%,100%{opacity:.3}40%{opacity:1}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@media (prefers-reduced-motion:reduce){.dot,.pulse{animation:none}}
</style><rect width="640" height="600" rx="28" fill="#0A0B0C"/><rect x="1" y="1" width="638" height="598" rx="27" fill="none" stroke="#2A2D31"/><rect x="220" y="40" width="320" height="520" rx="40" fill="#15171A" stroke="#B08D57" stroke-opacity=".55" stroke-width="2"/><rect x="230" y="50" width="300" height="500" rx="32" fill="#0F1113"/><rect x="230" y="50" width="300" height="64" rx="32" fill="#16181B"/><rect x="230" y="84" width="300" height="30" fill="#16181B"/><circle cx="496" cy="84" r="18" fill="#B08D57"/><text x="496" y="90" font-size="17" fill="#0A0B0C" text-anchor="middle" font-weight="700">ن</text><text x="466" y="80" font-size="15" fill="#FAF8F3" text-anchor="start" font-weight="600" direction="rtl" unicode-bidi="plain">نادين للمجوهرات</text><text x="466" y="98" font-size="12" fill="#CBA873" text-anchor="start" font-weight="400" direction="rtl" unicode-bidi="plain">متصل</text><rect x="284" y="140" width="232" height="150" rx="16" fill="#1C1F23" stroke="#2A2D31"/><text x="500" y="170" font-size="13.5" fill="#FAF8F3" text-anchor="start" font-weight="400" direction="rtl" unicode-bidi="plain">أهلاً! طلبك رقم 1042</text><text x="500" y="190" font-size="13.5" fill="#FAF8F3" text-anchor="start" font-weight="400" direction="rtl" unicode-bidi="plain">دفع عند الاستلام.</text><text x="500" y="210" font-size="13.5" fill="#FAF8F3" text-anchor="start" font-weight="600" direction="rtl" unicode-bidi="plain">تأكّد الطلب؟</text><rect x="400" y="232" width="100" height="38" rx="12" fill="#B08D57"/><text x="450.0" y="256" font-size="14" fill="#0A0B0C" text-anchor="middle" font-weight="700">أكّد الطلب</text><rect x="300" y="232" width="92" height="38" rx="12" fill="none" stroke="#2A2D31" stroke-width="1.5"/><text x="346.0" y="256" font-size="14" fill="#9A9486" text-anchor="middle" font-weight="500">رفض</text><rect x="244" y="310" width="130" height="44" rx="16" fill="#B08D57"/><text x="309.0" y="338" font-size="14" fill="#0A0B0C" text-anchor="middle" font-weight="700">أكّد الطلب</text><rect x="284" y="378" width="232" height="64" rx="16" fill="#1C1F23" stroke="#2A2D31"/><text x="500" y="406" font-size="13.5" fill="#FAF8F3" text-anchor="start" font-weight="400" direction="rtl" unicode-bidi="plain">تمام، طلبك اتأكّد. شكراً ليك!</text><rect x="446" y="462" width="70" height="34" rx="16" fill="#1C1F23" stroke="#2A2D31"/><circle class="dot d1" cx="468" cy="479" r="3.6" fill="#CBA873"/><circle class="dot d2" cx="481" cy="479" r="3.6" fill="#CBA873"/><circle class="dot d3" cx="494" cy="479" r="3.6" fill="#CBA873"/><g class="pulse"><rect x="70" y="440" width="196" height="66" rx="18" fill="#0A0B0C" stroke="#B08D57" stroke-width="1.5"/><circle cx="236" cy="473" r="12" fill="#B08D57"/><path d="M231 473 l4 4 l7 -8" stroke="#0A0B0C" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="216" y="470" font-size="14.5" fill="#FAF8F3" text-anchor="start" font-weight="700" direction="rtl" unicode-bidi="plain">الطلب اتأكّد</text><text x="216" y="490" font-size="12" fill="#9A9486" text-anchor="start" font-weight="400" direction="rtl" unicode-bidi="plain">رجع لمتجرك</text></g></svg>