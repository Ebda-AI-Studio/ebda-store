; Transaction-mode pooler in front of local Postgres, the stand-in for Hyperdrive's pooler in
; `wrangler dev`, the Stage 1 exit test and the workerd tests (spikes/workers-api pattern).
; A server connection goes back to the pool at COMMIT/ROLLBACK, so a session-level setting
; (GUC) would leak to the next tenant: exactly what R-EBDA-001 forbids.
[databases]
ebda_s1 = host=127.0.0.1 port=5432 dbname=ebda_s1

[pgbouncer]
listen_addr = 127.0.0.1
listen_port = 6433
unix_socket_dir =
auth_type = scram-sha-256
auth_file = /tmp/ebda-api-pgbouncer/userlist.txt
pool_mode = transaction
; Small on purpose: far fewer server connections than concurrent requests, so a server
; connection is DEFINITELY reused across tenants.
default_pool_size = 8
min_pool_size = 0
reserve_pool_size = 0
max_client_conn = 600
; no session state may survive between transactions
server_reset_query =
server_reset_query_always = 0
ignore_startup_parameters = extra_float_digits,options
logfile = /tmp/ebda-api-pgbouncer/pgbouncer.log
pidfile = /tmp/ebda-api-pgbouncer/pgbouncer.pid
admin_users = ebda_app
stats_users = ebda_app
log_connections = 0
log_disconnections = 0
