# Gitleaks config — extends the built-in ruleset, then allowlists known
# CI-ONLY test secrets by their literal value (NOT by commit fingerprint).
#
# Why this exists: the test secrets below live in committed history (CI env
# blocks in .github/workflows/*.yml + test fixtures). A .gitleaksignore entry
# is `<commit>:<file>:<rule>:<line>` — pinned to a commit SHA, so it STOPS
# matching the moment that secret's commit gets a new SHA (every squash-merge).
# That made gitleaks re-flag the same test key on every PR. Matching the literal
# value here is commit-independent, so it holds across merges/rebases forever.
#
# RULE: only add PROVEN CI-only/test values here — never silence a real secret.
# Real production secrets are injected via GitHub repository secrets at runtime
# and never appear as literals in the tree.

[extend]
useDefault = true

[allowlist]
description = "CI-only test secrets (not real credentials)"
regexTarget = "line"
regexes = [
  # Paymob OFFICIAL DOCS example values (public, test-mode) used verbatim in
  # tests/contracts/paymob/*.official.json contract fixtures — not credentials.
  '''egy_csk_test_94042f793419c5a0f14a4cadfda9d626''',
  '''eyJhbGciOiJIUzUxMiIsInR5cCI6IkpXVCJ9\.eyJ1c2VyX2lkIjo0Mzk5NTYs''',
  '''ZXlKaGJHY2lPaUpJVXpVeE1pSXNJblI1Y0NJNklrcFhWQ0o5LmV5SjFjMlZ5WDJsa0lqb3pNREk0TlRJ''',
  '''ZXlKaGJHY2lPaUpJVXpVeE1pSXNJblI1Y0NJNklrcFhWQ0o5LmV5SjFjMlZ5WDJsa0lqbzBNems1TlRZ''',
  # Fake provider-key fixtures (provider-connect / fawry contract tests) — CI-only.
  '''wrong-key-123456''',
  '''pak_live_0123456789abcdef''',
  '''pak_test_0123456789abcdef''',
  # Synthetic shipping auth fixtures, exercised only by contract/integration tests.
  '''a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718''',
  '''plain-bosta-key-123456''',
  '''test-encryption-key-for-ci-32chars''',
  '''test-jwt-secret-for-ci-only-32chars''',
  # Fake marketing-pixel access-token fixtures (H4 secret-masking tests) — not real creds.
  '''EAAB1234567890abcdef''',
  '''EAAB_NEW_TOKEN_xyz''',
  '''tt_secret_abc''',
  # Fake answer-engine (Perplexity/OpenAI) provider-key fixtures — CI-only, not real creds.
  '''pplx-test-key''',
  '''pplx-secret-123''',
  '''pplx-super-secret-key''',
  '''sk-test-key''',
  '''sk-good-key''',
  '''sk-super-secret-key''',
  # Fake Tap payment-provider secret key fixture (payment-provider.test.ts) — CI-only.
  '''sk_secret_12345''',
  # Fake encryption-key fixture (CI-only), sibling of the
  # test-encryption-key-for-ci-32chars entry above with a different literal value.
  '''test-encryption-key-that-is-32-chars''',
  # mcp-agent-write-auth.test.ts's fixture used THIS literal at commit cad3d87e
  # before a later commit switched it to test-encryption-key-for-ci-32chars
  # above — but CI checks out full history, so gitleaks still scans that old
  # commit's content. It was allowlisted by SHA-pinned fingerprint in
  # .gitleaksignore, which stops matching the moment that commit's SHA changes
  # (every squash-merge); this regex is commit-independent. CI-only, not a
  # real credential.
  '''test-encryption-key-at-least-32-characters-long''',
  # SMS-consent / review link-key fixtures (#2428: campaign-unsubscribe-token.test.ts,
  # review-token.test.ts) and the tests/setup.ts ENCRYPTION_KEY default (#2437,
  # which extends this literal) — CI-only, not a real credential.
  '''test-encryption-key-0123456789abcdef''',
  # Two-key rotation fixtures (sms-consent-lib.test.ts, #2428) — CI-only, not real creds.
  '''encryption-key-A-0123456789abcdef012''',
  '''encryption-key-B-0123456789abcdef012''',
  # Fake Inngest signing key (inngest-serve-rejects-unsigned.test.ts, #2294) — CI-only.
  '''signkey-prod-0123456789abcdef0123456789abcdef''',
  # Throwaway RSA key generated for the GSC service-account client test (8B) — CI-only,
  # never a real credential (distinctive middle-of-body substring). CORRECTED 2026-09-02:
  # the previous entry here (`ItsSCX8UKLL5pB6IGJ0EOrC6PNjAEw0q`) was missing the `+` the
  # actual key contains after "ItsSC" — it has never matched anything, ever (verified:
  # zero hits for that literal anywhere in the tree or its git history). The `paths`
  # blanket removed above was masking that this entry was dead on arrival; without it,
  # gitleaks correctly flags this fixture (private-key rule) until fixed here.
  '''nDjm07wI9wchYGBdTM7cFDagEuV6dm7xXAFfY5mkviqnPNWmjWChxTLTYs14cL0y''',
  # sha256 content pins of published docs pages (support-wa-docs-drift.test.ts,
  # `'en/api.mdx': '<64 hex>'`) - public file digests, not credentials. Matches the
  # pin line shape only, commit-independent.
  '''['"](?:ar|en)/[a-z-]+\.mdx['"]\s*:\s*['"][0-9a-f]{64}['"]''',
]

# CORRECTED 2026-09-02 (adversarial audit, P2): this used to also carry a
# `paths` blanket allowlisting the ENTIRE `*.test.ts`/`__tests__/**` tree —
# the most common real-world leak shape (a dev testing against a live API
# key, pasted into a test file) was permanently invisible to this required
# check. Removed; every fixture that tree actually needs is now the literal-
# value list above (the mechanism already had 12 entries — it works). A new
# fixture that looks secret-shaped needs its own literal entry here, which
# is the point: it forces a human/reviewer to look at it once instead of
# blanket-exempting the whole tree forever.

