ng applyRefundEffects\n      // directly (default options), once per completed return, twice for\n      // two SEPARATE Return requests on the same order.\n      await OrderService.applyRefundEffects(mockStoreId, 'order-123');\n      await OrderService.applyRefundEffects(mockStoreId, 'order-123');\n\n      expect(inngest.send).toHaveBeenCalledTimes(2);\n      expect(prisma.coupon.updateMany).not.toHaveBeenCalled();\n    });\n\n    it('restoreInventory:false calls (backorder-line cancels) carry the flag through on every call', async () => {\n      vi.mocked(prisma.order.findFirst).mockResolvedValue({\n        ...mockOrder,\n        status: 'delivered',\n        couponCode: 'SAVE10',\n      } as any);\n\n      // Simulates accounting/backorder.service.ts cancelBackorder calling\n      // applyRefundEffects once per BackorderLine, 3 lines on the same\n      // order, all with restoreInventory:false (inventory was never\n      // reserved for a backordered item).\n      await OrderService.applyRefundEffects(mockStoreId, 'order-123', { restoreInventory: false });\n      await OrderService.applyRefundEffects(mockStoreId, 'order-123', { restoreInventory: false });\n      await OrderService.applyRefundEffects(mockStoreId, 'order-123', { restoreInventory: false });\n\n      expect(inngest.send).toHaveBeenCalledTimes(3);\n      for (const call of vi.mocked(inngest.send).mock.calls) {\n        expect(call[0]).toEqual(\n          expect.objectContaining({\n            name: 'order/refunded',\n            data: expect.objectContaining({ restoreInventory: false }),\n          })\n        );\n      }\n      expect(prisma.inventoryHistory.create).not.toHaveBeenCalled();\n      expect(prisma.coupon.updateMany).not.toHaveBeenCalled();\n    });\n  });\n\n  describe('getCustomerOrders', () => {\n    it('should return all orders for a customer', async () => {\n      const customerOrders = [mockOrder, { ...mockOrder, id: 'order-456' }];\n      vi.mocked(prisma.order.findMany).mockResolvedValue(customerOrders as any);\n      vi.mocked(prisma.order.count).mockResolvedValue(2);\n\n      const result = await OrderService.getCustomerOrders(mockStoreId, mockCustomerId);\n\n      expect(result.orders).toHaveLength(2);\n      expect(result.meta.total).toBe(2);\n      expect(prisma.order.findMany).toHaveBeenCalledWith(\n        expect.objectContaining({\n          where: { storeId: mockStoreId, customerId: mockCustomerId, deletedAt: null },\n          orderBy: { createdAt: 'desc' },\n        })\n      );\n    });\n  });\n});\n"},"tests/unit/ai-description-balance.test.ts":{"tests":[{"id":"47","name":"balanceProductLanguages returns balanced:false when both name AND description are empty"},{"id":"48","name":"balanceProductLanguages returns balanced:false when product is not found"},{"id":"49","name":"balanceProductLanguages both-Arabic name: keeps nameAr, translates AR→EN into name"},{"id":"50","name":"balanceProductLanguages both-English description: keeps description, translates EN→AR"},{"id":"51","name":"balanceProductLanguages EN-slot holds Arabic + AR-slot holds same Arabic: Arabic authoritative, translates AR→EN"},{"id":"52","name":"balanceProductLanguages swapped slots: moves Arabic to AR slot and English to EN slot without translation"},{"id":"53","name":"balanceProductLanguages skips when name and description pairs are already correct"},{"id":"54","name":"balanceProductLanguages force:true → retranslates both pairs even when already correct"},{"id":"55","name":"balanceProductLanguages snapshots ALL FOUR original fields + aiFieldSources on first balance"},{"id":"56","name":"balanceProductLanguages does NOT overwrite existing backup on second balance call"},{"id":"57","name":"revertProductBalance restores ALL FOUR fields from backup and clears aiBalanceBackup"},{"id":"58","name":"revertProductBalance returns reverted:false when no backup exists (empty object)"},{"id":"59","name":"revertProductBalance returns reverted:false when product is not found"},{"id":"60","name":"balanceProductDescription (back-compat alias) delegates to balanceProductLanguages and returns { balanced, side }"},{"id":"61","name":"balanceProductDescription (back-compat alias) returns side:ar when Arabic description was the source"}],"source":"/**\n * AI Language Balancer — Unit Tests\n *\n * Tests the LANGUAGE-AWARE algorithm (Arabic-authoritative):\n *  1. Both descriptions empty → skip\n *  2. Both-Arabic name  → keeps AR, translates AR→EN into name\n *  3. Both-English description → keeps EN, translates EN→AR\n *  4. EN-slot holds Arabic + good AR slot → Arabic authoritative, translates AR→EN\n *  5. Both already correct (EN in name, AR in nameAr) → skip (no-op guard)\n *  6. force:true → retranslates even when both already correct\n *  7. Backup snapshots ALL FOUR original fields + aiFieldSources on first balance\n *  8. Second balance does NOT overwrite existing backup (preserves true original)\n *  9. revertProductBalance → restores all 4 fields + clears aiBalanceBackup\n * 10. revertProductBalance with no backup → returns reverted:false\n * 11. back-compat alias `balanceProductDescription` → delegates correctly\n */\n\nimport { describe, it, expect, vi, beforeEach } from 'vitest';\n\n// ── Mocks (hoisted) ───────────────────────────────────────────────────────\n\nvi.mock('../../apps/api/src/lib/logger', () => ({\n  default: { warn: vi.fn(), debug: vi.fn(), error: vi.fn(), info: vi.fn() },\n}));\n\n// Mock AIService.translate — controls translation output per test\nconst mockTranslate = vi.fn();\nvi.mock('../../apps/api/src/services/ai.service', () => ({\n  AIService: { translate: (...args: unknown[]) => mockTranslate(...args) },\n}));\n\n// Mock prisma product operations\nconst mockFindFirst = vi.fn();\nconst mockUpdate = vi.fn();\nvi.mock('@force/database', () => ({\n  prisma: {\n    product: {\n      findFirst: (...args: unknown[]) => mockFindFirst(...args),\n      update: (...args: unknown[]) => mockUpdate(...args),\n    },\n  },\n  runInTenantContext: vi.fn((_, fn: () => unknown) => fn()),\n}));\n\n// ── Subject under test ────────────────────────────────────────────────────\n\nimport {\n  balanceProductLanguages,\n  balanceProductDescription,\n  revertProductBalance,\n} from '../../apps/api/src/services/ai-autofill.service';\n\n// ── Helpers ───────────────────────────────────────────────────────────────\n\n// Sample Arabic text (contains Arabic Unicode chars → containsArabic returns true)\nconst AR_NAME = 'اسم المنتج بالعربية';\nconst AR_DESC = 'وصف المنتج باللغة العربية وهو نص مفصل';\nconst EN_NAME = 'Product Name in English';\nconst EN_DESC = 'A detailed English product description with content.';\n\nfunction makeProduct(overrides: Record<"+"string, unknown> = {}) {\n  return {\n    name: null as string | null,\n    nameAr: null as string | null,\n    description: null as string | null,\n    descriptionAr: null as string | null,\n    aiFieldSources: {} as Record<"+"string, string>,\n    aiBalanceBackup: {} as Record<"+"string, unknown>,\n    ...overrides,\n  };\n}\n\nconst STORE_ID = 'store-1';\nconst PRODUCT_ID = 'prod-1';\n\nbeforeEach(() => {\n  mockTranslate.mockReset();\n  mockFindFirst.mockReset();\n  mockUpdate.mockReset();\n  mockTranslate.mockResolvedValue({ translation: 'translated text', cached: false });\n});\n\n// ── balanceProductLanguages ───────────────────────────────────────────────\n\ndescribe('balanceProductLanguages', () => {\n  it('returns balanced:false when both name AND description are empty', async () => {\n    mockFindFirst.mockResolvedValue(makeProduct());\n\n    const result = await balanceProductLanguages(STORE_ID, PRODUCT_ID);\n\n    expect(result.balanced).toBe(false);\n    expect(result.changed).toEqual({});\n    expect(mockTranslate).not.toHaveBeenCalled();\n    expect(mockUpdate).not.toHaveBeenCalled();\n  });\n\n  it('returns balanced:false when product is not found', async () => {\n    mockFindFirst.mockResolvedValue(null);\n\n    const result = await balanceProductLanguages(STORE_ID, PRODUCT_ID);\n\n    expect(result.balanced).toBe(false);\n    expect(mockUpdate).not.toHaveBeenCalled();\n  });\n\n  // ── Case: both-Arabic name ────────────────────────────────────────────\n\n  it('both-Arabic name: keeps nameAr, translates AR→EN into name', async () => {\n    // name slot has Arabic text, nameAr slot also has Arabic text\n    // Arabic is authoritative → keep nameAr, translate nameAr→EN into name\n    mockFindFirst.mockResolvedValue(\n      makeProduct({\n        name: AR_NAME, // wrong language in EN slot\n        nameAr: AR_NAME, // correct Arabic in AR slot\n        description: null,\n        descriptionAr: null,\n      })\n    );\n    mockTranslate.mockResolvedValue({ translation: EN_NAME, cached: false });\n\n    const result = await balanceProductLanguages(STORE_ID, PRODUCT_ID);\n\n    expect(result.balanced).toBe(true);\n    expect(result.changed.name).toBe(true);\n    expect(result.changed.description).toBeUndefined(); // description pair unchanged\n\n    // Should translate AR→EN for the name pair\n    expect(mockTranslate).toHaveBeenCalledWith(\n      expect.objectContaining({\n        storeId: STORE_ID,\n        text: AR_NAME,\n        from: 'ar',\n        to: 'en',\n        kind: 'product-name',\n      })\n    );\n\n    // name gets the EN translation, nameAr stays as-is\n    expect(mockUpdate).toHaveBeenCalledWith(\n      expect.objectContaining({\n        where: { id: PRODUCT_ID, storeId: STORE_ID },\n        data: expect.objectContaining({\n          name: EN_NAME,\n          aiFieldSources: expect.objectContaining({ name: 'ai' }),\n          // backup snapshots originals\n          aiBalanceBackup: expect.objectContaining({\n            name: AR_NAME,\n            nameAr: AR_NAME,\n          }),\n        }),\n      })\n    );\n    // nameAr should NOT be in data (it didn't change)\n    const updateData = mockUpdate.mock.calls[0][0].data;\n    expect(updateData).not.toHaveProperty('nameAr');\n  });\n\n  // ── Case: both-English description ───────────────────────────────────\n\n  it('both-English description: keeps description, translates EN→AR', async () => {\n    // description slot has English, descriptionAr slot also has English\n    // no Arabic found → use English, translate EN→AR\n    mockFindFirst.mockResolvedValue(\n      makeProduct({\n        name: null,\n        nameAr: null,\n        description: EN_DESC, // English in EN slot (correct)\n        descriptionAr: EN_DESC, // English in AR slot (wrong)\n      })\n    );\n    mockTranslate.mockResolvedValue({ translation: AR_DESC, cached: false });\n\n    const result = await balanceProductLanguages(STORE_ID, PRODUCT_ID);\n\n    expect(result.balanced).toBe(true);\n    expect(result.changed.description).toBe(true);\n    expect(result.changed.name).toBeUndefined(); // name pair unchanged\n\n    expect(mockTranslate).toHaveBeenCalledWith(\n      expect.objectContaining({\n        storeId: STORE_ID,\n        text: EN_DESC,\n        from: 'en',\n        to: 'ar',\n        kind: 'product-description',\n      })\n    );\n\n    expect(mockUpdate).toHaveBeenCalledWith(\n      expect.objectContaining({\n        data: expect.objectContaining({\n          descriptionAr: AR_DESC,\n          aiFieldSources: expect.objectContaining({ descriptionAr: 'ai' }),\n          aiBalanceBackup: expect.objectContaining({\n            description: EN_DESC,\n            descriptionAr: EN_DESC,\n          }),\n        }),\n      })\n    );\n  });\n\n  // ── Case: EN slot has Arabic text, AR slot has good Arabic ──────────\n\n  it('EN-slot holds Arabic + AR-slot holds same Arabic: Arabic authoritative, translates AR→EN', async () => {\n    // name slot has Arabic (wrong), nameAr slot has Arabic (right)\n    // → Arabic is authoritative; no English found → translate Arabic→English\n    mockFindFirst.mockResolvedValue(\n      makeProduct({\n        name: AR_NAME, // Arabic in EN slot\n        nameAr: AR_NAME, // Arabic in AR slot\n      })\n    );\n    mockTranslate.mockResolvedValue({ translation: EN_NAME, cached: false });\n\n    const result = await balanceProductLanguages(STORE_ID, PRODUCT_ID);\n\n    expect(result.balanced).toBe(true);\n    expect(mockTranslate).toHaveBeenCalledWith(\n      expect.objectContaining({ from: 'ar', to: 'en', kind: 'product-name' })\n    );\n    const updateData = mockUpdate.mock.calls[0][0].data;\n    expect(updateData.name).toBe(EN_NAME);\n    expect(updateData).not.toHaveProperty('nameAr'); // nameAr unchanged\n  });\n\n  // ── Case: swapped slots (EN in AR slot, AR in EN slot) ───────────────\n\n  it('swapped slots: moves Arabic to AR slot and English to EN slot without translation', async () => {\n    // name slot has AR text, nameAr slot has EN text → swap, no translation needed\n    mockFindFirst.mockResolvedValue(\n      makeProduct({\n        name: AR_NAME, // Arabic in EN slot (wrong)\n        nameAr: EN_NAME, // English in AR slot (wrong)\n      })\n    );\n\n    const result = await balanceProductLanguages(STORE_ID, PRODUCT_ID);\n\n    expect(result.balanced).toBe(true);\n    expect(mockTranslate).not.toHaveBeenCalled(); // no translation needed\n\n    const updateData = mockUpdate.mock.calls[0][0].data;\n    expect(updateData.name).toBe(EN_NAME); // EN slot gets EN text\n    expect(updateData.nameAr).toBe(AR_NAME); // AR slot gets AR text\n  });\n\n  // ── Case: already correct → skip ─────────────────────────────────────\n\n  it('skips when name and description pairs are already correct', async () => {\n    // EN slot has English, AR slot has Arabic → correct, no change needed\n    mockFindFirst.mockResolvedValue(\n      makeProduct({\n        name: EN_NAME,\n        nameAr: AR_NAME,\n        description: EN_DESC,\n        descriptionAr: AR_DESC,\n      })\n    );\n\n    const result = await balanceProductLanguages(STORE_ID, PRODUCT_ID);\n\n    expect(result.balanced).toBe(false);\n    expect(mockTranslate).not.toHaveBeenCalled();\n    expect(mockUpdate).not.toHaveBeenCalled();\n  });\n\n  // ── Case: force:true → retranslates even when correct ────────────────\n\n  it('force:true → retranslates both pairs even when already correct', async () => {\n    mockFindFirst.mockResolvedValue(\n      makeProduct({\n        name: EN_NAME,\n        nameAr: AR_NAME,\n        description: EN_DESC,\n        descriptionAr: AR_DESC,\n      })\n    );\n    mockTranslate.mockResolvedValue({ translation: 'forced translation', cached: false });\n\n    const result = await balanceProductLanguages(STORE_ID, PRODUCT_ID, { force: true });\n\n    expect(result.balanced).toBe(true);\n    // Both pairs should be retranslated → translate called twice\n    expect(mockTranslate).toHaveBeenCalledTimes(2);\n    expect(mockUpdate).toHaveBeenCalled();\n  });\n\n  // ── Backup: all 4 fields snaphotted on first balance ─────────────────\n\n  it('snapshots ALL FOUR original fields + aiFieldSources on first balance', async () => {\n    const origSources = { name: 'human', description: 'ai' };\n    mockFindFirst.mockResolvedValue(\n      makeProduct({\n        name: AR_NAME, // wrong language (will be fixed)\n        nameAr: AR_NAME,\n        description: EN_DESC,\n        descriptionAr: null,\n        aiFieldSources: origSources,\n        aiBalanceBackup: {},\n      })\n    );\n    mockTranslate.mockResolvedValue({ translation: 'translated', cached: false });\n\n    await balanceProductLanguages(STORE_ID, PRODUCT_ID);\n\n    const updateData = mockUpdate.mock.calls[0][0].data;\n    expect(updateData.aiBalanceBackup).toEqual({\n      name: AR_NAME,\n      nameAr: AR_NAME,\n      description: EN_DESC,\n      descriptionAr: null,\n      aiFieldSources: origSources,\n    });\n  });\n\n  // ── Backup: second balance does NOT overwrite ─────────────────────────\n\n  it('does NOT overwrite existing backup on second balance call', async () => {\n    // Simulate a product that has been balanced once: has backup, is now \"correct\"\n    const originalBackup = {\n      name: AR_NAME,\n      nameAr: null,\n      description: null,\n      descriptionAr: null,\n      aiFieldSources: {},\n    };\n    mockFindFirst.mockResolvedValue(\n      makeProduct({\n        name: EN_NAME, // correct EN (was AR before first balance)\n        nameAr: AR_NAME,\n        description: null,\n        descriptionAr: null,\n        aiFieldSources: { name: 'ai', nameAr: 'ai' },\n        aiBalanceBackup: originalBackup, // already has a backup\n      })\n    );\n    // With force:true so the balance actually runs and calls update\n    mockTranslate.mockResolvedValue({ translation: 'retranslated', cached: false });\n\n    await balanceProductLanguages(STORE_ID, PRODUCT_ID, { force: true });\n\n    const updateData = mockUpdate.mock.calls[0][0].data;\n    // Must use the EXISTING backup, not create a new one\n    expect(updateData.aiBalanceBackup).toEqual(originalBackup);\n    // The backup must NOT contain the post-balance EN name (that would lose the original)\n    expect(updateData.aiBalanceBackup.name).toBe(AR_NAME);\n  });\n});\n\n// ── revertProductBalance ──────────────────────────────────────────────────\n\ndescribe('revertProductBalance', () => {\n  it('restores ALL FOUR fields from backup and clears aiBalanceBackup', async () => {\n    const backup = {\n      name: AR_NAME,\n      nameAr: null,\n      description: 'original English desc',\n      descriptionAr: null,\n      aiFieldSources: { name: 'human' },\n    };\n    mockFindFirst.mockResolvedValue(\n      makeProduct({\n        aiBalanceBackup: backup,\n      })\n    );\n\n    const result = await revertProductBalance(STORE_ID, PRODUCT_ID);\n\n    expect(result.reverted).toBe(true);\n    expect(mockUpdate).toHaveBeenCalledWith(\n      expect.objectContaining({\n        where: { id: PRODUCT_ID, storeId: STORE_ID },\n        data: expect.objectContaining({\n          name: AR_NAME,\n          nameAr: null, // nullable field reverts to null (clears a balance-filled value)\n          description: 'original English desc',\n          descriptionAr: null,\n          aiFieldSources: { name: 'human' },\n          aiBalanceBackup: {}, // cleared\n        }),\n      })\n    );\n  });\n\n  it('returns reverted:false when no backup exists (empty object)', async () => {\n    mockFindFirst.mockResolvedValue(\n      makeProduct({\n        aiBalanceBackup: {},\n      })\n    );\n\n    const result = await revertProductBalance(STORE_ID, PRODUCT_ID);\n\n    expect(result.reverted).toBe(false);\n    expect(mockUpdate).not.toHaveBeenCalled();\n  });\n\n  it('returns reverted:false when product is not found', async () => {\n    mockFindFirst.mockResolvedValue(null);\n\n    const result = await revertProductBalance(STORE_ID, PRODUCT_ID);\n\n    expect(result.reverted).toBe(false);\n    expect(mockUpdate).not.toHaveBeenCalled();\n  });\n});\n\n// ── back-compat alias ─────────────────────────────────────────────────────\n\ndescribe('balanceProductDescription (back-compat alias)', () => {\n  it('delegates to balanceProductLanguages and returns { balanced, side }', async () => {\n    // Both descriptions empty → balanced:false, side:null\n    mockFindFirst.mockResolvedValue(makeProduct());\n\n    const result = await balanceProductDescription(STORE_ID, PRODUCT_ID);\n\n    expect(result).toHaveProperty('balanced', false);\n    expect(result).toHaveProperty('side', null);\n  });\n\n  it('returns side:ar when Arabic description was the source', async () => {\n    // descriptionAr has Arabic, description is empty → translates AR→EN → side='ar'\n    mockFindFirst.mockResolvedValue(\n      makeProduct({\n        description: null,\n        descriptionAr: AR_DESC,\n      })\n    );\n    mockTranslate.mockResolvedValue({ translation: EN_DESC, cached: false });\n\n    const result = await balanceProductDescription(STORE_ID, PRODUCT_ID);\n\n    expect(result.balanced).toBe(true);\n    expect(result.side).toBe('ar');\n  });\n});\n"},"tests/unit/cart.test.ts":{"tests":[{"id":"62","name":"CartService getOrCreate should return existing cart if found"},{"id":"63","name":"CartService getOrCreate should create new cart if not found"},{"id":"64","name":"CartService getOrCreate should search by customerId when provided"},{"id":"65","name":"CartService getOrCreate should calculate subtotal correctly with multiple items"},{"id":"66","name":"CartService addItem should add new item to cart"},{"id":"67","name":"CartService addItem should throw error if product not found"},{"id":"68","name":"CartService addItem should throw error if insufficient inventory"},{"id":"69","name":"CartService addItem should update quantity if item already exists"},{"id":"70","name":"CartService addItem should check combined quantity against inventory"},{"id":"71","name":"CartService addItem should skip inventory check if trackInventory is false"},{"id":"72","name":"CartService updateItem should update item quantity"},{"id":"73","name":"CartService updateItem should delete item if quantity is 0"},{"id":"74","name":"CartService updateItem should delete item if quantity is negative"},{"id":"75","name":"CartService updateItem should throw error if item not found"},{"id":"76","name":"CartService updateItem should throw error if update exceeds inventory"},{"id":"77","name":"CartService removeItem should remove item from cart"},{"id":"78","name":"CartService removeItem should throw error if item not found"},{"id":"79","name":"CartService clear should remove all items from cart"},{"id":"80","name":"CartService mergeGuestCart should merge guest cart items into user cart"},{"id":"81","name":"CartService mergeGuestCart should delete guest cart after merge"},{"id":"82","name":"CartService mergeGuestCart should return user cart if guest cart is empty"},{"id":"83","name":"CartService mergeGuestCart should create user cart if it does not exist"}],"source":"/**\n * Cart Service Unit Tests\n * Tests cart operations and business logic\n */\n\nimport { describe, it, expect, beforeEach, vi } from 'vitest';\nimport { CartService } from '@api/services/cart.service';\nimport { prisma } from '@force/database';\n\n// Mock Prisma\nvi.mock('@force/database', () => ({\n  prisma: {\n    cart: {\n      findFirst: vi.fn(),\n      create: vi.fn(),\n      update: vi.fn(),\n      delete: vi.fn(),\n      findUnique: vi.fn(),\n    },\n    cartItem: {\n      findFirst: vi.fn(),\n      create: vi.fn(),\n      update: vi.fn(),\n      delete: vi.fn(),\n      deleteMany: vi.fn(),\n    },\n    product: {\n      findFirst: vi.fn(),\n      update: vi.fn(),\n    },\n    $transaction: vi.fn().mockImplementation(async (fn: any) => {\n      if (typeof fn === 'function') {\n        // Pass the mocked prisma itself as the transaction client\n        const { prisma: mockPrisma } = await import('@force/database');\n        return fn(mockPrisma);\n      }\n      return fn;\n    }),\n  },\n  Prisma: {\n    TransactionIsolationLevel: {\n      Serializable: 'Serializable',\n      ReadCommitted: 'ReadCommitted',\n    },\n  },\n  // CartService.addItem branches on this: inside a tenant transaction it\n  // reuses the ambient client instead of opening a nested $transaction (which\n  // could not see the cart the same request just wrote). These unit tests\n  // exercise the standalone path, so report \"no tenant context\".\n  hasTenantContext: () => false,\n  // CartService now imports STOREFRONT_PRODUCT_SELECT from product.service,\n  // which evaluates `const SOLD_ORDER_STATUSES: OrderStatus[]` at MODULE load.\n  // Without OrderStatus on this mock the whole suite fails to import — the\n  // tests themselves never run. Mirrors enum OrderStatus in schema.prisma.\n  OrderStatus: {\n    pending: 'pending',\n    confirmed: 'confirmed',\n    processing: 'processing',\n    shipped: 'shipped',\n    delivered: 'delivered',\n    cancelled: 'cancelled',\n    refunded: 'refunded',\n  },\n}));\n\n// CartService now resolves the inventory.backorder feature flag before\n// each inventory check. Default to enabled so existing tests pass unmodified.\nvi.mock('@api/services/feature.service', () => ({\n  featureService: {\n    isFeatureEnabled: vi.fn().mockResolvedValue(true),\n    getStoreFeatures: vi.fn(),\n    invalidateCache: vi.fn(),\n  },\n}));\n\ndescribe('CartService', () => {\n  const mockStoreId = 'store-123';\n  const mockSessionId = 'session-456';\n  const mockCustomerId = 'customer-789';\n\n  const mockProduct = {\n    id: 'prod-123',\n    storeId: mockStoreId,\n    name: 'Test Product',\n    price: 5000,\n    inventory: 50,\n    trackInventory: true,\n    status: 'active',\n    images: [{ url: 'https://example.com/image.jpg' }],\n  };\n\n  const mockCart = {\n    id: 'cart-123',\n    storeId: mockStoreId,\n    sessionId: mockSessionId,\n    customerId: null,\n    items: [],\n  };\n\n  const mockCartWithItems = {\n    ...mockCart,\n    items: [\n      {\n        id: 'item-1',\n        cartId: 'cart-123',\n        productId: 'prod-123',\n        quantity: 2,\n        product: mockProduct,\n      },\n    ],\n  };\n\n  beforeEach(() => {\n    vi.clearAllMocks();\n  });\n\n  describe('getOrCreate', () => {\n    it('should return existing cart if found', async () => {\n      vi.mocked(prisma.cart.findFirst).mockResolvedValue(mockCartWithItems as any);\n\n      const result = await CartService.getOrCreate(mockStoreId, mockSessionId);\n\n      expect(prisma.cart.findFirst).toHaveBeenCalledWith(\n        expect.objectContaining({\n          where: expect.objectContaining({ storeId: mockStoreId }),\n        })\n      );\n      expect(result.id).toBe('cart-123');\n      expect(result.subtotal).toBe(10000); // 2 * 5000\n    });\n\n    it('should create new cart if not found', async () => {\n      vi.mocked(prisma.cart.findFirst).mockResolvedValue(null);\n      vi.mocked(prisma.cart.create).mockResolvedValue(mockCart as any);\n\n      const result = await CartService.getOrCreate(mockStoreId, mockSessionId);\n\n      expect(prisma.cart.create).toHaveBeenCalledWith(\n        expect.objectContaining({\n          data: expect.objectContaining({\n            storeId: mockStoreId,\n            sessionId: mockSessionId,\n          }),\n        })\n      );\n      expect(result.subtotal).toBe(0);\n    });\n\n    it('should search by customerId when provided', async () => {\n      vi.mocked(prisma.cart.findFirst).mockResolvedValue(mockCart as any);\n\n      await CartService.getOrCreate(mockStoreId, mockSessionId, mockCustomerId);\n\n      expect(prisma.cart.findFirst).toHaveBeenCalledWith(\n        expect.objectContaining({\n          where: expect.objectContaining({\n            OR: expect.arrayContaining([\n              { sessionId: mockSessionId },\n              { customerId: mockCustomerId },\n            ]),\n          }),\n        })\n      );\n    });\n\n    it('should calculate subtotal correctly with multiple items', async () => {\n      const cartWithMultipleItems = {\n        ...mockCart,\n        items: [\n          { id: 'item-1', productId: 'prod-1', quantity: 2, product: { price: 5000 } },\n          { id: 'item-2', productId: 'prod-2', quantity: 3, product: { price: 3000 } },\n        ],\n      };\n      vi.mocked(prisma.cart.findFirst).mockResolvedValue(cartWithMultipleItems as any);\n\n      const result = await CartService.getOrCreate(mockStoreId, mockSessionId);\n\n      // (2 * 5000) + (3 * 3000) = 10000 + 9000 = 19000\n      expect(result.subtotal).toBe(19000);\n    });\n  });\n\n  describe('addItem', () => {\n    beforeEach(() => {\n      vi.mocked(prisma.product.findFirst).mockResolvedValue(mockProduct as any);\n      vi.mocked(prisma.cart.findFirst).mockResolvedValue(mockCart as any);\n      vi.mocked(prisma.cart.create).mockResolvedValue(mockCart as any);\n      vi.mocked(prisma.cartItem.findFirst).mockResolvedValue(null);\n      vi.mocked(prisma.cartItem.create).mockResolvedValue({} as any);\n    });\n\n    it('should add new item to cart', async () => {\n      await CartService.addItem(mockStoreId, mockSessionId, 'prod-123', 2);\n\n      expect(prisma.cartItem.create).toHaveBeenCalledWith({\n        data: {\n          cartId: mockCart.id,\n          productId: 'prod-123',\n          variantId: null,\n          quantity: 2,\n        },\n      });\n    });\n\n    it('should throw error if product not found', async () => {\n      vi.mocked(prisma.product.findFirst).mockResolvedValue(null);\n\n      await expect(\n        CartService.addItem(mockStoreId, mockSessionId, 'nonexistent', 1)\n      ).rejects.toThrow('Product not found or unavailable');\n    });\n\n    it('should throw error if insufficient inventory', async () => {\n      vi.mocked(prisma.product.findFirst).mockResolvedValue({\n        ...mockProduct,\n        inventory: 5,\n      } as any);\n\n      await expect(CartService.addItem(mockStoreId, mockSessionId, 'prod-123', 10)).rejects.toThrow(\n        'Not enough inventory'\n      );\n    });\n\n    it('should update quantity if item already exists', async () => {\n      const existingItem = {\n        id: 'item-existing',\n        cartId: mockCart.id,\n        productId: 'prod-123',\n        quantity: 2,\n      };\n      vi.mocked(prisma.cartItem.findFirst).mockResolvedValue(existingItem as any);\n      vi.mocked(prisma.cartItem.update).mockResolvedValue({} as any);\n\n      await CartService.addItem(mockStoreId, mockSessionId, 'prod-123', 3);\n\n      expect(prisma.cartItem.update).toHaveBeenCalledWith({\n        where: { id: 'item-existing' },\n        data: { quantity: 5 }, // 2 + 3\n      });\n    });\n\n    it('should check combined quantity against inventory', async () => {\n      const existingItem = {\n        id: 'item-existing',\n        cartId: mockCart.id,\n        productId: 'prod-123',\n        quantity: 45,\n      };\n      vi.mocked(prisma.cartItem.findFirst).mockResolvedValue(existingItem as any);\n\n      // Product has 50 inventory, already have 45, trying to add 10 more\n      await expect(CartService.addItem(mockStoreId, mockSessionId, 'prod-123', 10)).rejects.toThrow(\n        'Not enough inventory'\n      );\n    });\n\n    it('should skip inventory check if trackInventory is false', async () => {\n      vi.mocked(prisma.product.findFirst).mockResolvedValue({\n        ...mockProduct,\n        trackInventory: false,\n        inventory: 0,\n      } as any);\n\n      // Should not throw even with 0 inventory\n      await expect(\n        CartService.addItem(mockStoreId, mockSessionId, 'prod-123', 100)\n      ).resolves.not.toThrow();\n    });\n  });\n\n  describe('updateItem', () => {\n    beforeEach(() => {\n      vi.mocked(prisma.cart.findFirst).mockResolvedValue(mockCart as any);\n      vi.mocked(prisma.cart.create).mockResolvedValue(mockCart as any);\n    });\n\n    it('should update item quantity', async () => {\n      const existingItem = {\n        id: 'item-123',\n        cartId: mockCart.id,\n        productId: 'prod-123',\n        quantity: 2,\n        product: mockProduct,\n      };\n      vi.mocked(prisma.cartItem.findFirst).mockResolvedValue(existingItem as any);\n      vi.mocked(prisma.cartItem.update).mockResolvedValue({} as any);\n\n      await CartService.updateItem(mockStoreId, mockSessionId, 'item-123', 5);\n\n      expect(prisma.cartItem.update).toHaveBeenCalledWith({\n        where: { id: 'item-123' },\n        data: { quantity: 5 },\n      });\n    });\n\n    it('should delete item if quantity is 0', async () => {\n      const existingItem = {\n        id: 'item-123',\n        cartId: mockCart.id,\n        productId: 'prod-123',\n        quantity: 2,\n        product: mockProduct,\n      };\n      vi.mocked(prisma.cartItem.findFirst).mockResolvedValue(existingItem as any);\n      vi.mocked(prisma.cartItem.delete).mockResolvedValue({} as any);\n\n      await CartService.updateItem(mockStoreId, mockSessionId, 'item-123', 0);\n\n      expect(prisma.cartItem.delete).toHaveBeenCalledWith({\n        where: { id: 'item-123' },\n      });\n    });\n\n    it('should delete item if quantity is negative', async () => {\n      const existingItem = {\n        id: 'item-123',\n        cartId: mockCart.id,\n        productId: 'prod-123',\n        quantity: 2,\n        product: mockProduct,\n      };\n      vi.mocked(prisma.cartItem.findFirst).mockResolvedValue(existingItem as any);\n      vi.mocked(prisma.cartItem.delete).mockResolvedValue({} as any);\n\n      await CartService.updateItem(mockStoreId, mockSessionId, 'item-123', -1);\n\n      expect(prisma.cartItem.delete).toHaveBeenCalled();\n    });\n\n    it('should throw error if item not found', async () => {\n      vi.mocked(prisma.cartItem.findFirst).mockResolvedValue(null);\n\n      await expect(\n        CartService.updateItem(mockStoreId, mockSessionId, 'nonexistent', 5)\n      ).rejects.toThrow('Cart item not found');\n    });\n\n    it('should throw error if update exceeds inventory', async () => {\n      const existingItem = {\n        id: 'item-123',\n        cartId: mockCart.id,\n        productId: 'prod-123',\n        quantity: 2,\n        product: { ...mockProduct, inventory: 10 },\n      };\n      vi.mocked(prisma.cartItem.findFirst).mockResolvedValue(existingItem as any);\n\n      await expect(\n        CartService.updateItem(mockStoreId, mockSessionId, 'item-123', 100)\n      ).rejects.toThrow('Not enough inventory');\n    });\n  });\n\n  describe('removeItem', () => {\n    it('should remove item from cart', async () => {\n      vi.mocked(prisma.cart.findFirst).mockResolvedValue(mockCart as any);\n      vi.mocked(prisma.cartItem.findFirst).mockResolvedValue({\n        id: 'item-123',\n        cartId: mockCart.id,\n      } as any);\n      vi.mocked(prisma.cartItem.delete).mockResolvedValue({} as any);\n\n      await CartService.removeItem(mockStoreId, mockSessionId, 'item-123');\n\n      expect(prisma.cartItem.delete).toHaveBeenCalledWith({\n        where: { id: 'item-123' },\n      });\n    });\n\n    it('should throw error if item not found', async () => {\n      vi.mocked(prisma.cart.findFirst).mockResolvedValue(mockCart as any);\n      vi.mocked(prisma.cartItem.findFirst).mockResolvedValue(null);\n\n      await expect(\n        CartService.removeItem(mockStoreId, mockSessionId, 'nonexistent')\n      ).rejects.toThrow('Cart item not found');\n    });\n  });\n\n  describe('clear', () => {\n    it('should remove all items from cart', async () => {\n      vi.mocked(prisma.cart.findFirst).mockResolvedValue(mockCartWithItems as any);\n      vi.mocked(prisma.cartItem.deleteMany).mockResolvedValue({ count: 2 } as any);\n\n      await CartService.clear(mockStoreId, mockSessionId);\n\n      expect(prisma.cartItem.deleteMany).toHaveBeenCalledWith({\n        where: { cartId: mockCartWithItems.id },\n      });\n    });\n  });\n\n  describe('mergeGuestCart', () => {\n    const mockGuestCart = {\n      id: 'guest-cart',\n      storeId: mockStoreId,\n      sessionId: 'guest-session',\n      customerId: null,\n      items: [\n        { id: 'guest-item-1', productId: 'prod-1', variantId: null, quantity: 2 },\n        { id: 'guest-item-2', productId: 'prod-2', variantId: null, quantity: 1 },\n      ],\n    };\n\n    const mockUserCart = {\n      id: 'user-cart',\n      storeId: mockStoreId,\n      sessionId: 'user-session',\n      customerId: mockCustomerId,\n      items: [{ id: 'user-item-1', productId: 'prod-1', variantId: null, quantity: 3 }],\n    };\n\n    beforeEach(() => {\n      vi.mocked(prisma.cartItem.create).mockResolvedValue({} as any);\n      vi.mocked(prisma.cartItem.update).mockResolvedValue({} as any);\n      vi.mocked(prisma.cart.delete).mockResolvedValue({} as any);\n      vi.mocked(prisma.cart.findUnique).mockResolvedValue(mockUserCart as any);\n    });\n\n    it('should merge guest cart items into user cart', async () => {\n      vi.mocked(prisma.cart.findFirst)\n        .mockResolvedValueOnce(mockGuestCart as any)\n        .mockResolvedValueOnce(mockUserCart as any);\n\n      await CartService.mergeGuestCart(mockStoreId, 'guest-session', mockCustomerId);\n\n      // prod-1 exists in both - should update\n      expect(prisma.cartItem.update).toHaveBeenCalledWith({\n        where: { id: 'user-item-1' },\n        data: { quantity: 5 }, // 3 + 2\n      });\n\n      // prod-2 only in guest - should create (with variantId so uniqueness is\n      // correctly enforced at the DB level by the partial unique indexes)\n      expect(prisma.cartItem.create).toHaveBeenCalledWith({\n        data: {\n          cartId: mockUserCart.id,\n          productId: 'prod-2',\n          variantId: null,\n          quantity: 1,\n        },\n      });\n    });\n\n    it('should delete guest cart after merge', async () => {\n      vi.mocked(prisma.cart.findFirst)\n        .mockResolvedValueOnce(mockGuestCart as any)\n        .mockResolvedValueOnce(mockUserCart as any);\n\n      await CartService.mergeGuestCart(mockStoreId, 'guest-session', mockCustomerId);\n\n      expect(prisma.cart.delete).toHaveBeenCalledWith({\n        where: { id: mockGuestCart.id },\n      });\n    });\n\n    it('should return user cart if guest cart is empty', async () => {\n      vi.mocked(prisma.cart.findFirst)\n        .mockResolvedValueOnce({ ...mockGuestCart, items: [] } as any)\n        .mockResolvedValueOnce(mockUserCart as any);\n\n      const result = await CartService.mergeGuestCart(mockStoreId, 'guest-session', mockCustomerId);\n\n      expect(prisma.cartItem.create).not.toHaveBeenCalled();\n      expect(prisma.cartItem.update).not.toHaveBeenCalled();\n      expect(result).toEqual(mockUserCart);\n    });\n\n    it('should create user cart if it does not exist', async () => {\n      vi.mocked(prisma.cart.findFirst)\n        .mockResolvedValueOnce(mockGuestCart as any)\n        .mockResolvedValueOnce(null);\n      vi.mocked(prisma.cart.create).mockResolvedValue(mockUserCart as any);\n\n      await CartService.mergeGuestCart(mockStoreId, 'guest-session', mockCustomerId);\n\n      expect(prisma.cart.create).toHaveBeenCalledWith({\n        data: {\n          storeId: mockStoreId,\n          sessionId: 'guest-session',\n          customerId: mockCustomerId,\n        },\n      });\n    });\n  });\n});\n"},"tests/unit/recommendation.test.ts":{"tests":[{"id":"84","name":"FBT pair normalization stores pair with smaller ID first when productId1 > productId2"},{"id":"85","name":"FBT pair normalization keeps pair in order when productId1 <"+" productId2"},{"id":"86","name":"FBT pair normalization produces the same key regardless of input order (commutativity)"},{"id":"87","name":"Relation types accepts cross_sell as a valid relation type"},{"id":"88","name":"Relation types accepts upsell as a valid relation type"},{"id":"89","name":"Relation types does not include unknown types"},{"id":"90","name":"Relation types has exactly 2 valid types"},{"id":"91","name":"getCartRecommendations returns empty array when no productIds provided"},{"id":"92","name":"getCartRecommendations excludes products already in the cart from recommendations"},{"id":"93","name":"getCartRecommendations does not include a recommended product that is already in cart (via FBT fallback)"},{"id":"94","name":"getProductRecommendations returns object with crossSell, upsell, and alsoLike arrays"},{"id":"95","name":"getProductRecommendations crossSell items include relationId and position from manual relations"},{"id":"96","name":"getProductRecommendations returns result from cache when cache hit"},{"id":"97","name":"getProductRecommendations caches result after fetching from DB"},{"id":"98","name":"getProductRecommendations alsoLike is empty when product has no categories"},{"id":"99","name":"Cache key format uses format recommendations:product:{storeId}:{productId}"},{"id":"100","name":"Cache key format cache key is unique per store+product combination"},{"id":"101","name":"Cache key format cache key is unique per product within the same store"}],"source":"/**\n * Recommendation Service — Unit Tests\n * Tests for FBT pair normalization, relation type validation,\n * cart recommendations, product recommendations structure, and cache key format.\n */\n\nimport { describe, it, expect, vi, beforeEach } from 'vitest';\n\n// Mock prisma before importing the service\nvi.mock('@force/database', () => ({\n  prisma: {\n    productRelation: {\n      findMany: vi.fn(),\n      findFirst: vi.fn(),\n      count: vi.fn(),\n      create: vi.fn(),\n      createMany: vi.fn(),\n      deleteMany: vi.fn(),\n      delete: vi.fn(),\n    },\n    frequentlyBoughtTogether: {\n      findMany: vi.fn(),\n      findFirst: vi.fn(),\n      upsert: vi.fn(),\n      deleteMany: vi.fn(),\n      count: vi.fn(),\n    },\n    product: {\n      findMany: vi.fn(),\n    },\n    productCategory: {\n      findMany: vi.fn(),\n    },\n    order: {\n      findMany: vi.fn(),\n    },\n    aiRecommendation: {\n      findMany: vi.fn().mockResolvedValue([]),\n    },\n  },\n}));\n\n// Mock redis service\nvi.mock('../../apps/api/src/services/redis.service', () => ({\n  redis: {\n    get: vi.fn(),\n    set: vi.fn(),\n    delete: vi.fn(),\n    acquireLock: vi.fn(),\n    releaseLock: vi.fn(),\n    getClient: vi.fn(),\n  },\n}));\n\n// Mock logger\nvi.mock('../../apps/api/src/lib/logger', () => ({\n  default: {\n    info: vi.fn(),\n    warn: vi.fn(),\n    error: vi.fn(),\n    debug: vi.fn(),\n  },\n}));\n\nimport { prisma } from '@force/database';\nimport { redis } from '../../apps/api/src/services/redis.service';\nimport { recommendationService } from '../../apps/api/src/services/recommendation.service';\n\n// ============================================================\n// Test Fixtures\n// ============================================================\n\nconst storeId = 'store-aaa';\nconst productId = 'prod-111';\n\nconst mockProductShape = (id: string) => ({\n  id,\n  name: `Product ${id}`,\n  nameAr: null,\n  slug: `product-${id}`,\n  price: 10.0,\n  compareAtPrice: null,\n  images: [],\n});\n\n// ============================================================\n// FBT Pair Normalization\n// ============================================================\n\ndescribe('FBT pair normalization', () => {\n  it('stores pair with smaller ID first when productId1 > productId2', () => {\n    // The normalization logic used in recalculateFBT:\n    // const key = a <"+" b ? `${a}:${b}` : `${b}:${a}`;\n    const a = 'prod-zzz';\n    const b = 'prod-aaa';\n\n    // Simulate the normalization from the service\n    const normalized = a <"+" b ? `${a}:${b}` : `${b}:${a}`;\n    const [id1, id2] = normalized.split(':');\n\n    expect(id1).toBe('prod-aaa');\n    expect(id2).toBe('prod-zzz');\n    expect(id1 <"+" id2).toBe(true);\n  });\n\n  it('keeps pair in order when productId1 <"+" productId2', () => {\n    const a = 'prod-aaa';\n    const b = 'prod-zzz';\n\n    const normalized = a <"+" b ? `${a}:${b}` : `${b}:${a}`;\n    const [id1, id2] = normalized.split(':');\n\n    expect(id1).toBe('prod-aaa');\n    expect(id2).toBe('prod-zzz');\n  });\n\n  it('produces the same key regardless of input order (commutativity)', () => {\n    const a = 'prod-bbb';\n    const b = 'prod-ccc';\n\n    const key1 = a <"+" b ? `${a}:${b}` : `${b}:${a}`;\n    const key2 = b <"+" a ? `${b}:${a}` : `${a}:${b}`;\n\n    expect(key1).toBe(key2);\n  });\n});\n\n// ============================================================\n// Relation Types\n// ============================================================\n\ndescribe('Relation types', () => {\n  const VALID_RELATION_TYPES = ['cross_sell', 'upsell'];\n\n  it('accepts cross_sell as a valid relation type', () => {\n    expect(VALID_RELATION_TYPES).toContain('cross_sell');\n  });\n\n  it('accepts upsell as a valid relation type', () => {\n    expect(VALID_RELATION_TYPES).toContain('upsell');\n  });\n\n  it('does not include unknown types', () => {\n    expect(VALID_RELATION_TYPES).not.toContain('related');\n    expect(VALID_RELATION_TYPES).not.toContain('bundle');\n    expect(VALID_RELATION_TYPES).not.toContain('fbt');\n  });\n\n  it('has exactly 2 valid types', () => {\n    expect(VALID_RELATION_TYPES).toHaveLength(2);\n  });\n});\n\n// ============================================================\n// Cart Recommendations — exclude products already in cart\n// ============================================================\n\ndescribe('getCartRecommendations', () => {\n  const mockPrisma = prisma as any;\n  const mockRedis = redis as any;\n\n  beforeEach(() => {\n    vi.clearAllMocks();\n  });\n\n  it('returns empty array when no productIds provided', async () => {\n    const result = await recommendationService.getCartRecommendations(storeId, []);\n    expect(result).toEqual([]);\n  });\n\n  it('excludes products already in the cart from recommendations', async () => {\n    const cartProductIds = ['prod-A', 'prod-B'];\n    const recommendedId = 'prod-C';\n\n    // Manual cross-sell returns prod-B (already in cart) and prod-C (not in cart).\n    // The N+1 fix in T1-10 batches manual lookups across every cart item in a\n    // single IN-list query, so the rows now include sourceProductId for the\n    // service's per-source grouping.\n    mockPrisma.productRelation.findMany.mockResolvedValue([\n      { sourceProductId: 'prod-A', targetProductId: 'prod-B' },\n      { sourceProductId: 'prod-A', targetProductId: recommendedId },\n    ]);\n    // FBT runs in parallel with the manual lookup (Promise.all). Cart\n    // items without manual relations fall through to FBT — empty array\n    // here means prod-B (no manual rels) yields no FBT recommendations.\n    mockPrisma.frequentlyBoughtTogether.findMany.mockResolvedValue([]);\n\n    mockPrisma.product.findMany.mockResolvedValue([mockProductShape(recommendedId)]);\n\n    const result = await recommendationService.getCartRecommendations(storeId, cartProductIds);\n\n    // Verify product.findMany was called with ids that do NOT include cart products\n    const productFindManyCall = mockPrisma.product.findMany.mock.calls[0][0];\n    expect(productFindManyCall.where.id.in).not.toContain('prod-A');\n    expect(productFindManyCall.where.id.in).not.toContain('prod-B');\n    expect(productFindManyCall.where.id.in).toContain(recommendedId);\n  });\n\n  it('does not include a recommended product that is already in cart (via FBT fallback)', async () => {\n    const cartProductIds = ['prod-X'];\n\n    // No manual relations — triggers FBT fallback\n    mockPrisma.productRelation.findMany.mockResolvedValue([]);\n    // FBT row where the \"other\" product is already in the cart\n    mockPrisma.frequentlyBoughtTogether.findMany.mockResolvedValue([\n      { productId1: 'prod-X', productId2: 'prod-X' }, // same id, already in cart\n    ]);\n    mockPrisma.product.findMany.mockResolvedValue([]);\n\n    const result = await recommendationService.getCartRecommendations(storeId, cartProductIds);\n    expect(result).toEqual([]);\n  });\n});\n\n// ============================================================\n// Product Recommendations Structure\n// ============================================================\n\ndescribe('getProductRecommendations', () => {\n  const mockPrisma = prisma as any;\n  const mockRedis = redis as any;\n\n  beforeEach(() => {\n    vi.clearAllMocks();\n    // No cached value by default\n    mockRedis.get.mockResolvedValue(null);\n    mockRedis.set.mockResolvedValue(undefined);\n  });\n\n  it('returns object with crossSell, upsell, and alsoLike arrays', async () => {\n    // Manual cross-sell\n    mockPrisma.productRelation.findMany\n      .mockResolvedValueOnce([\n        { id: 'rel-1', targetProduct: mockProductShape('prod-222'), position: 0 },\n      ])\n      // Upsell\n      .mockResolvedValueOnce([\n        { id: 'rel-2', targetProduct: mockProductShape('prod-333'), position: 0 },\n      ]);\n\n    // Product categories\n    mockPrisma.productCategory.findMany.mockResolvedValue([{ categoryId: 'cat-1' }]);\n\n    // Also like products\n    mockPrisma.product.findMany.mockResolvedValue([mockProductShape('prod-444')]);\n\n    const result = await recommendationService.getProductRecommendations(storeId, productId);\n\n    expect(result).toHaveProperty('crossSell');\n    expect(result).toHaveProperty('upsell');\n    expect(result).toHaveProperty('alsoLike');\n\n    expect(Array.isArray(result.crossSell)).toBe(true);\n    expect(Array.isArray(result.upsell)).toBe(true);\n    expect(Array.isArray(result.alsoLike)).toBe(true);\n  });\n\n  it('crossSell items include relationId and position from manual relations', async () => {\n    mockPrisma.productRelation.findMany\n      .mockResolvedValueOnce([\n        { id: 'rel-cross-1', targetProduct: mockProductShape('prod-222'), position: 2 },\n      ])\n      .mockResolvedValueOnce([]); // upsell empty\n\n    mockPrisma.productCategory.findMany.mockResolvedValue([]);\n\n    const result = await recommendationService.getProductRecommendations(storeId, productId);\n\n    expect(result.crossSell).toHaveLength(1);\n    expect((result.crossSell as any[])[0]).toMatchObject({\n      relationId: 'rel-cross-1',\n      position: 2,\n      id: 'prod-222',\n    });\n  });\n\n  it('returns result from cache when cache hit', async () => {\n    const cached = {\n      crossSell: [mockProductShape('prod-cached')],\n      upsell: [],\n      alsoLike: [],\n    };\n    mockRedis.get.mockResolvedValue(cached);\n\n    const result = await recommendationService.getProductRecommendations(storeId, productId);\n\n    expect(result).toEqual(cached);\n    // Prisma should NOT be called on cache hit\n    expect(mockPrisma.productRelation.findMany).not.toHaveBeenCalled();\n  });\n\n  it('caches result after fetching from DB', async () => {\n    // Use a unique productId to ensure no cross-test pollution\n    const uniqueProductId = 'prod-cache-test-unique';\n    mockPrisma.productRelation.findMany.mockResolvedValue([]);\n    mockPrisma.productCategory.findMany.mockResolvedValue([]);\n\n    await recommendationService.getProductRecommendations(storeId, uniqueProductId);\n\n    expect(mockRedis.set).toHaveBeenCalledOnce();\n    const [cacheKey, value, ttl] = mockRedis.set.mock.calls[0];\n    expect(cacheKey).toBe(`recommendations:product:${storeId}:${uniqueProductId}`);\n    expect(value).toHaveProperty('crossSell');\n    expect(value).toHaveProperty('upsell');\n    expect(value).toHaveProperty('alsoLike');\n    expect(ttl).toBeGreaterThan(0);\n  });\n\n  it('alsoLike is empty when product has no categories', async () => {\n    mockPrisma.productRelation.findMany.mockResolvedValue([]);\n    mockPrisma.productCategory.findMany.mockResolvedValue([]); // no categories\n\n    const result = await recommendationService.getProductRecommendations(storeId, productId);\n\n    expect(result.alsoLike).toEqual([]);\n    // product.findMany should not be called for alsoLike when no categoryIds\n    expect(mockPrisma.product.findMany).not.toHaveBeenCalled();\n  });\n});\n\n// ============================================================\n// Cache Key Format\n// ============================================================\n\ndescribe('Cache key format', () => {\n  const mockPrisma = prisma as any;\n  const mockRedis = redis as any;\n\n  beforeEach(() => {\n    vi.clearAllMocks();\n    mockRedis.get.mockResolvedValue(null);\n    mockRedis.set.mockResolvedValue(undefined);\n    mockPrisma.productRelation.findMany.mockResolvedValue([]);\n    mockPrisma.productCategory.findMany.mockResolvedValue([]);\n  });\n\n  it('uses format recommendations:product:{storeId}:{productId}', async () => {\n    const testStoreId = 'my-store';\n    const testProductId = 'my-product';\n\n    await recommendationService.getProductRecommendations(testStoreId, testProductId);\n\n    // redis.get is called first with the expected cache key\n    expect(mockRedis.get).toHaveBeenCalledWith(\n      `recommendations:product:${testStoreId}:${testProductId}`,\n      true\n    );\n  });\n\n  it('cache key is unique per store+product combination', async () => {\n    const storeA = 'store-alpha';\n    const storeB = 'store-beta';\n    const prod = 'prod-xyz';\n\n    const keyA = `recommendations:product:${storeA}:${prod}`;\n    const keyB = `recommendations:product:${storeB}:${prod}`;\n\n    expect(keyA).not.toBe(keyB);\n  });\n\n  it('cache key is unique per product within the same store', async () => {\n    const store = 'store-gamma';\n    const prodA = 'prod-001';\n    const prodB = 'prod-002';\n\n    const keyA = `recommendations:product:${store}:${prodA}`;\n    const keyB = `recommendations:product:${store}:${prodB}`;\n\n    expect(keyA).not.toBe(keyB);\n  });\n});\n"},"tests/unit/payment-webhook-status-transition.test.ts":{"tests":[{"id":"102","name":"PaymentService.refund — state machine guard (site 1/3) calls assertValidTransition(priorStatus, \"refunded\") BEFORE claiming the payment or calling the provider"},{"id":"103","name":"PaymentService.refund — state machine guard (site 1/3) rejects (and never calls the provider) when assertValidTransition throws for a stale order state"},{"id":"104","name":"PaymentService.handleWebhook — state machine guard (sites 2/3 & 3/3) out-of-band refund webhook: calls assertValidTransition(priorStatus, \"refunded\") before applyRefundEffects, and rejects on a stale order state"},{"id":"105","name":"PaymentService.handleWebhook — state machine guard (sites 2/3 & 3/3) out-of-band refund webhook: valid prior state proceeds to applyRefundEffects + the order write"},{"id":"106","name":"PaymentService.handleWebhook — state machine guard (sites 2/3 & 3/3) general payment webhook: calls assertValidTransition(priorStatus, orderStatus) and rejects a stale \"completed\" webhook on an already-refunded order"},{"id":"107","name":"PaymentService.handleWebhook — state machine guard (sites 2/3 & 3/3) general payment webhook: valid prior state (\"pending\" → \"confirmed\" on a completed payment) proceeds to the order write"}],"source":"/**\n * Direct-writer wiring tests for the state machine guard (money-integrity\n * Task 6). `assertValidTransition`'s own pass/reject logic is covered\n * exhaustively against the real implementation in\n * `tests/unit/order-status-machine.test.ts`; this file instead proves that\n * the 3 payment-gateway/webhook sites in `payment.factory.ts` that write\n * `Order.status` directly (bypassing `OrderService.updateStatus`) actually\n * CALL the guard with the loaded prior status before writing, and that a\n * rejection propagates instead of silently regressing the order:\n *\n *   1. `PaymentService.refund()` — full-refund write (`status: 'refunded'`).\n *   2. `PaymentService.handleWebhook()` — out-of-band refund-webhook write.\n *   3. `PaymentService.handleWebhook()` — general payment-webhook write.\n *\n * `@api/services/order.service` is mocked with a directly-controllable\n * `assertValidTransition` spy (rather than the real implementation) so each\n * test can assert exactly what `(from, to)` pair the call site passes, and\n * simulate a reject without needing to fabricate a specific stale order\n * status combination.\n */\n\nimport { describe, it, expect, vi, beforeEach } from 'vitest';\n\n// ─── Mocks (declared before the module-under-test import) ────────────────\n\nconst paymentFindFirst = vi.fn();\nconst paymentUpdateMany = vi.fn();\nconst paymentUpdate = vi.fn().mockResolvedValue({});\nconst orderUpdate = vi.fn().mockResolvedValue({});\nconst orderFindUnique = vi.fn().mockResolvedValue({ storeId: 'store_1' });\nconst paymentConfigFindMany = vi.fn();\nconst txMock = vi.fn((ops: unknown[]) => Promise.all(ops));\n\nvi.mock('@force/database', () => ({\n  prisma: {\n    payment: {\n      findFirst: (...a: unknown[]) => paymentFindFirst(...a),\n      updateMany: (...a: unknown[]) => paymentUpdateMany(...a),\n      update: (...a: unknown[]) => paymentUpdate(...a),\n    },\n    order: {\n      update: (...a: unknown[]) => orderUpdate(...a),\n      findUnique: (...a: unknown[]) => orderFindUnique(...a),\n    },\n    store: { findUnique: vi.fn() },\n    paymentConfig: {\n      findMany: (...a: unknown[]) => paymentConfigFindMany(...a),\n    },\n    $transaction: (ops: unknown[]) => txMock(ops),\n  },\n  Prisma: {},\n}));\n\nvi.mock('@api/config', () => ({\n  config: { paymentTestMode: true },\n}));\n\nvi.mock('@api/services/encryption.service', () => ({\n  encryption: { decrypt: (v: string) => v, encrypt: (v: string) => v },\n}));\n\n// The guard under test — a plain spy so each test controls whether it\n// throws, and can assert the exact (from, to) it was called with.\nconst assertValidTransitionMock = vi.fn();\nconst applyRefundEffects = vi.fn().mockResolvedValue(undefined);\nvi.mock('@api/services/order.service', () => ({\n  OrderService: { applyRefundEffects: (...a: unknown[]) => applyRefundEffects(...a) },\n  assertValidTransition: (...a: unknown[]) => assertValidTransitionMock(...a),\n}));\n\nvi.mock('@api/services/socket.service', () => ({\n  socketService: { emitToStore: vi.fn(), emitToUser: vi.fn() },\n}));\n\nvi.mock('@api/lib/inngest/client', () => ({\n  inngest: { send: vi.fn().mockResolvedValue(undefined) },\n}));\n\nvi.mock('@api/services/onesignal.service', () => ({\n  OneSignalService: { sendToStore: vi.fn(), sendToUser: vi.fn() },\n}));\n\nvi.mock('@api/services/redis.service', () => ({\n  redis: { get: vi.fn(), set: vi.fn(), del: vi.fn(), incrementRateLimit: vi.fn() },\n}));\n\nvi.mock('@api/services/alerts.service', () => ({\n  sendAlert: vi.fn().mockResolvedValue(undefined),\n}));\n\nvi.mock('@api/services/payment-event.service', () => ({\n  recordPaymentEvent: vi.fn().mockResolvedValue(undefined),\n}));\n\nvi.mock('@api/lib/public-cache', () => ({\n  invalidateCustomersCache: vi.fn().mockResolvedValue(undefined),\n}));\n\nvi.mock('@api/lib/logger', () => ({\n  default: { info: vi.fn(), warn: vi.fn(), error: vi.fn(), debug: vi.fn() },\n}));\n\nconst { providerRefund, providerParseWebhook } = vi.hoisted(() => ({\n  providerRefund: vi.fn(),\n  providerParseWebhook: vi.fn(),\n}));\nvi.mock('@api/services/payment-providers/tap.provider', () => ({\n  TapPaymentProvider: class {\n    initialize = vi.fn();\n    refund = providerRefund;\n    parseWebhook = providerParseWebhook;\n    verifyWebhook = vi.fn().mockReturnValue(true);\n  },\n}));\nvi.mock('@api/services/payment-providers/myfatoorah.provider', () => ({\n  MyFatoorahPaymentProvider: class {\n    initialize = vi.fn();\n    refund = providerRefund;\n    parseWebhook = providerParseWebhook;\n    verifyWebhook = vi.fn().mockReturnValue(true);\n  },\n}));\nvi.mock('@api/services/payment-providers/hesabe.provider', () => ({\n  HesabePaymentProvider: class {\n    initialize = vi.fn();\n    refund = providerRefund;\n    parseWebhook = providerParseWebhook;\n    verifyWebhook = vi.fn().mockReturnValue(true);\n  },\n}));\nvi.mock('@api/services/payment-providers/upayments.provider', () => ({\n  UPaymentsProvider: class {\n    initialize = vi.fn();\n    refund = providerRefund;\n    parseWebhook = providerParseWebhook;\n    verifyWebhook = vi.fn().mockReturnValue(true);\n  },\n}));\n\nimport { PaymentService } from '@api/services/payment-providers/payment.factory';\n\nconst PAYMENT_ID = 'pay_1';\nconst ORDER_ID = 'order_1';\nconst STORE_ID = 'store_1';\nconst TRANSACTION_ID = 'txn_1';\n\nfunction mockProviderConfig() {\n  paymentConfigFindMany.mockResolvedValue([\n    {\n      provider: 'myfatoorah',\n      apiKey: 'test-key',\n      secretKey: null,\n      merchantId: null,\n      webhookSecret: null,\n      testMode: true,\n      isEnabled: true,\n      isDefault: true,\n      displayName: null,\n      displayNameAr: null,\n      supportedMethods: ['knet'],\n      supportedCurrencies: ['KWD'],\n      fixedFee: 0,\n      percentageFee: 0,\n    },\n  ]);\n}\n\ndescribe('PaymentService.refund — state machine guard (site 1/3)', () => {\n  beforeEach(() => {\n    vi.clearAllMocks();\n    mockProviderConfig();\n  });\n\n  function mockPayment(orderStatus: string) {\n    paymentFindFirst.mockResolvedValue({\n      id: PAYMENT_ID,\n      orderId: ORDER_ID,\n      amount: 5000,\n      status: 'completed',\n      provider: 'myfatoorah',\n      metadata: {},\n      order: { storeId: STORE_ID, store: {}, status: orderStatus },\n    });\n  }\n\n  it('calls assertValidTransition(priorStatus, \"refunded\") BEFORE claiming the payment or calling the provider', async () => {\n    mockPayment('confirmed');\n    assertValidTransitionMock.mockImplementation(() => undefined);\n    paymentUpdateMany.mockResolvedValue({ count: 1 });\n    providerRefund.mockResolvedValue({\n      success: true,\n      provider: 'myfatoorah',\n      refundId: 'rf_1',\n      transactionId: TRANSACTION_ID,\n      amount: 5000,\n      status: 'completed',\n    });\n    txMock.mockResolvedValue([{}, {}]);\n\n    await PaymentService.refund({ transactionId: TRANSACTION_ID });\n\n    expect(assertValidTransitionMock).toHaveBeenCalledWith('confirmed', 'refunded');\n    // The guard ran before the provider was ever touched (called order matters).\n    const guardCallOrder = assertValidTransitionMock.mock.invocationCallOrder[0];\n    const providerCallOrder = providerRefund.mock.invocationCallOrder[0];\n    expect(guardCallOrder).toBeLessThan(providerCallOrder);\n  });\n\n  it('rejects (and never calls the provider) when assertValidTransition throws for a stale order state', async () => {\n    mockPayment('cancelled');\n    assertValidTransitionMock.mockImplementation(() => {\n      throw new Error('Cannot transition from cancelled to refunded');\n    });\n\n    await expect(PaymentService.refund({ transactionId: TRANSACTION_ID })).rejects.toThrow(\n      'Cannot transition from cancelled to refunded'\n    );\n\n    expect(providerRefund).not.toHaveBeenCalled();\n    expect(paymentUpdateMany).not.toHaveBeenCalled();\n  });\n});\n\ndescribe('PaymentService.handleWebhook — state machine guard (sites 2/3 & 3/3)', () => {\n  beforeEach(() => {\n    vi.clearAllMocks();\n    mockProviderConfig();\n  });\n\n  function mockPaymentForWebhook(orderStatus: string, paymentStatus = 'completed') {\n    paymentFindFirst.mockResolvedValue({\n      id: PAYMENT_ID,\n      orderId: ORDER_ID,\n      amount: 5000,\n      currency: 'KWD',\n      status: paymentStatus,\n      provider: 'myfatoorah',\n      metadata: {},\n      order: { storeId: STORE_ID, store: { name: 'Test Store' }, status: orderStatus },\n    });\n  }\n\n  it('out-of-band refund webhook: calls assertValidTransition(priorStatus, \"refunded\") before applyRefundEffects, and rejects on a stale order state', async () => {\n    mockPaymentForWebhook('cancelled', 'completed');\n    providerParseWebhook.mockReturnValue({\n      transactionId: TRANSACTION_ID,\n      status: 'completed',\n      refund: { status: 'completed', refundId: 'rf_2' },\n    });\n    assertValidTransitionMock.mockImplementation(() => {\n      throw new Error('Cannot transition from cancelled to refunded');\n    });\n\n    await expect(\n      PaymentService.handleWebhook('myfatoorah', { fake: true }, undefined, STORE_ID)\n    ).rejects.toThrow('Cannot transition from cancelled to refunded');\n\n    expect(assertValidTransitionMock).toHaveBeenCalledWith('cancelled', 'refunded');\n    // applyRefundEffects must NOT have run — the guard is checked first so a\n    // rejected transition never runs reversal side-effects it can't commit.\n    expect(applyRefundEffects).not.toHaveBeenCalled();\n  });\n\n  it('out-of-band refund webhook: valid prior state proceeds to applyRefundEffects + the order write', async () => {\n    mockPaymentForWebhook('shipped', 'completed');\n    providerParseWebhook.mockReturnValue({\n      transactionId: TRANSACTION_ID,\n      status: 'completed',\n      refund: { status: 'completed', refundId: 'rf_2' },\n    });\n    assertValidTransitionMock.mockImplementation(() => undefined);\n\n    await PaymentService.handleWebhook('myfatoorah', { fake: true }, undefined, STORE_ID);\n\n    expect(assertValidTransitionMock).toHaveBeenCalledWith('shipped', 'refunded');\n    expect(applyRefundEffects).toHaveBeenCalledWith(STORE_ID, ORDER_ID);\n  });\n\n  it('general payment webhook: calls assertValidTransition(priorStatus, orderStatus) and rejects a stale \"completed\" webhook on an already-refunded order', async () => {\n    mockPaymentForWebhook('refunded', 'refunded');\n    providerParseWebhook.mockReturnValue({\n      transactionId: TRANSACTION_ID,\n      status: 'completed',\n      amount: 5000,\n      currency: 'KWD',\n      paidAt: new Date(),\n    });\n    assertValidTransitionMock.mockImplementation(() => {\n      throw new Error('Cannot transition from refunded to confirmed');\n    });\n\n    await expect(\n      PaymentService.handleWebhook('myfatoorah', { fake: true }, undefined, STORE_ID)\n    ).rejects.toThrow('Cannot transition from refunded to confirmed');\n\n    expect(assertValidTransitionMock).toHaveBeenCalledWith('refunded', 'confirmed');\n    // The order write must never happen once the guard rejects.\n    expect(orderUpdate).not.toHaveBeenCalled();\n  });\n\n  it('general payment webhook: valid prior state (\"pending\" → \"confirmed\" on a completed payment) proceeds to the order write', async () => {\n    mockPaymentForWebhook('pending', 'pending');\n    providerParseWebhook.mockReturnValue({\n      transactionId: TRANSACTION_ID,\n      status: 'completed',\n      amount: 5000,\n      currency: 'KWD',\n      paidAt: new Date(),\n    });\n    assertValidTransitionMock.mockImplementation(() => undefined);\n\n    await PaymentService.handleWebhook('myfatoorah', { fake: true }, undefined, STORE_ID);\n\n    expect(assertValidTransitionMock).toHaveBeenCalledWith('pending', 'confirmed');\n    expect(orderUpdate).toHaveBeenCalledWith({\n      where: { id: ORDER_ID },\n      data: { status: 'confirmed', paymentStatus: 'paid' },\n    });\n  });\n});\n"},"tests/unit/product-faq-tenant-scoping.test.ts":{"tests":[{"id":"108","name":"Product FAQ routes — cross-tenant scoping GET /:id/faqs returns 404 when the product belongs to another store"},{"id":"109","name":"Product FAQ routes — cross-tenant scoping GET /:id/faqs returns the FAQs for a product owned by the authenticated store (control)"},{"id":"110","name":"Product FAQ routes — cross-tenant scoping POST /:id/faqs returns 404 for a cross-tenant product and never creates the FAQ"},{"id":"111","name":"Product FAQ routes — cross-tenant scoping PUT /:id/faqs/:faqId returns 404 for a cross-tenant product and never updates"},{"id":"112","name":"Product FAQ routes — cross-tenant scoping DELETE /:id/faqs/:faqId returns 404 for a cross-tenant product and never deletes"},{"id":"113","name":"Product FAQ routes — cross-tenant scoping DELETE /:id/faqs/:faqId deletes the FAQ for a same-tenant product (control)"}],"source":"/**\n * Product FAQ CRUD — cross-tenant IDOR regression guard.\n *\n * apps/api/src/routes/product.routes.ts `/:id/faqs*` (mounted at\n * `/stores/:storeId/products`) used to query ProductFaq keyed only off\n * `productId: req.params.id`, never checking the product belongs to\n * `req.params.storeId`. Since ProductFaq has no storeId column, a\n * store_admin authenticated for store A could read/write/delete FAQs on a\n * product owned by store B just by passing that product's id — a live\n * exploitable IDOR under the BYPASSRLS app role.\n *\n * Fix: every handler now does `prisma.product.findFirst({ id, storeId })`\n * first and throws AppError(404) when it doesn't match, before touching\n * ProductFaq. This test extracts the 4 handlers directly off the router's\n * route stack (same technique as bulk-ai-catalogue-sweep-routes.test.ts)\n * so it exercises the exact production code without booting the full app\n * or its auth middleware chain (which requireStoreAccess already covers\n * elsewhere — this test is only about the productId->storeId check).\n */\nimport { describe, it, expect, vi, beforeEach } from 'vitest';\n\nconst mockProductFindFirst = vi.fn();\nconst mockFaqFindMany = vi.fn();\nconst mockFaqCreate = vi.fn();\nconst mockFaqUpdateMany = vi.fn();\nconst mockFaqFindUnique = vi.fn();\nconst mockFaqDeleteMany = vi.fn();\n\nvi.mock('@force/database', () => ({\n  prisma: {\n    product: { findFirst: (...args: unknown[]) => mockProductFindFirst(...args) },\n    productFaq: {\n      findMany: (...args: unknown[]) => mockFaqFindMany(...args),\n      create: (...args: unknown[]) => mockFaqCreate(...args),\n      updateMany: (...args: unknown[]) => mockFaqUpdateMany(...args),\n      findUnique: (...args: unknown[]) => mockFaqFindUnique(...args),\n      deleteMany: (...args: unknown[]) => mockFaqDeleteMany(...args),\n    },\n  },\n}));\n\nvi.mock('../../apps/api/src/middleware/auth', () => ({\n  authenticate: (_req: unknown, _res: unknown, next: () => void) => next(),\n  authorize: () => (_req: unknown, _res: unknown, next: () => void) => next(),\n}));\nvi.mock('../../apps/api/src/middleware/store-access', () => ({\n  requireStoreAccess: (_req: unknown, _res: unknown, next: () => void) => next(),\n}));\nvi.mock('../../apps/api/src/middleware/security', () => ({\n  writeLimiter: (_req: unknown, _res: unknown, next: () => void) => next(),\n  auditLog: vi.fn(),\n}));\nvi.mock('../../apps/api/src/middleware/feature-gate', () => ({\n  requireFeature: () => (_req: unknown, _res: unknown, next: () => void) => next(),\n}));\nvi.mock('../../apps/api/src/services/product.service', () => ({\n  ProductService: {},\n}));\nvi.mock('../../apps/api/src/lib/public-cache', () => ({\n  invalidateCachedPrefix: vi.fn(),\n}));\n\nimport productRoutes from '../../apps/api/src/routes/product.routes';\n\ninterface RouteLayer {\n  route?: {\n    path: string;\n    methods: Record<"+"string, boolean>;\n    stack: Array<"+"{ handle: (...args: unknown[]) => unknown }>;\n  };\n}\n\nfunction getHandler(method: 'get' | 'post' | 'put' | 'delete', path: string) {\n  const layers = (productRoutes as unknown as { stack: RouteLayer[] }).stack;\n  const layer = layers.find(l => l.route?.path === path && l.route.methods[method]);\n  if (!layer?.route) throw new Error(`Route ${method.toUpperCase()} ${path} not found`);\n  const stack = layer.route.stack;\n  return stack[stack.length - 1].handle as (\n    req: unknown,\n    res: unknown,\n    next: (err?: unknown) => void\n  ) => Promise<"+"void>;\n}\n\nfunction mockReqRes(params: Record<"+"string, string>, body: object = {}) {\n  const req = { params, body, user: { userId: 'user-1' } };\n  const jsonMock = vi.fn();\n  const statusMock = vi.fn(() => ({ json: jsonMock }));\n  const res = { status: statusMock, json: jsonMock };\n  const next = vi.fn();\n  return { req, res, statusMock, jsonMock, next };\n}\n\nconst STORE_A = 'store-a';\nconst PRODUCT_OF_STORE_B = 'product-owned-by-store-b';\n\ndescribe('Product FAQ routes — cross-tenant scoping', () => {\n  beforeEach(() => vi.clearAllMocks());\n\n  it('GET /:id/faqs returns 404 when the product belongs to another store', async () => {\n    mockProductFindFirst.mockResolvedValue(null); // not found for store A\n    const handler = getHandler('get', '/:id/faqs');\n    const { req, next } = mockReqRes({ storeId: STORE_A, id: PRODUCT_OF_STORE_B });\n\n    await handler(req, {}, next);\n\n    expect(mockProductFindFirst).toHaveBeenCalledWith({\n      where: { id: PRODUCT_OF_STORE_B, storeId: STORE_A },\n      select: { id: true },\n    });\n    expect(mockFaqFindMany).not.toHaveBeenCalled();\n    expect(next).toHaveBeenCalledWith(\n      expect.objectContaining({ statusCode: 404, code: 'NOT_FOUND' })\n    );\n  });\n\n  it('GET /:id/faqs returns the FAQs for a product owned by the authenticated store (control)', async () => {\n    mockProductFindFirst.mockResolvedValue({ id: 'product-a' });\n    mockFaqFindMany.mockResolvedValue([{ id: 'faq-1', question: 'Q?' }]);\n    const handler = getHandler('get', '/:id/faqs');\n    const { req, res, jsonMock, next } = mockReqRes({ storeId: STORE_A, id: 'product-a' });\n\n    await handler(req, res, next);\n\n    expect(next).not.toHaveBeenCalled();\n    expect(jsonMock).toHaveBeenCalledWith(\n      expect.objectContaining({ success: true, data: [{ id: 'faq-1', question: 'Q?' }] })\n    );\n  });\n\n  it('POST /:id/faqs returns 404 for a cross-tenant product and never creates the FAQ', async () => {\n    mockProductFindFirst.mockResolvedValue(null);\n    const handler = getHandler('post', '/:id/faqs');\n    const { req, next } = mockReqRes(\n      { storeId: STORE_A, id: PRODUCT_OF_STORE_B },\n      { question: 'Q', answer: 'A' }\n    );\n\n    await handler(req, {}, next);\n\n    expect(mockFaqCreate).not.toHaveBeenCalled();\n    expect(next).toHaveBeenCalledWith(expect.objectContaining({ statusCode: 404 }));\n  });\n\n  it('PUT /:id/faqs/:faqId returns 404 for a cross-tenant product and never updates', async () => {\n    mockProductFindFirst.mockResolvedValue(null);\n    const handler = getHandler('put', '/:id/faqs/:faqId');\n    const { req, next } = mockReqRes(\n      { storeId: STORE_A, id: PRODUCT_OF_STORE_B, faqId: 'faq-1' },\n      { answer: 'new answer' }\n    );\n\n    await handler(req, {}, next);\n\n    expect(mockFaqUpdateMany).not.toHaveBeenCalled();\n    expect(next).toHaveBeenCalledWith(expect.objectContaining({ statusCode: 404 }));\n  });\n\n  it('DELETE /:id/faqs/:faqId returns 404 for a cross-tenant product and never deletes', async () => {\n    mockProductFindFirst.mockResolvedValue(null);\n    const handler = getHandler('delete', '/:id/faqs/:faqId');\n    const { req, next } = mockReqRes({\n      storeId: STORE_A,\n      id: PRODUCT_OF_STORE_B,\n      faqId: 'faq-1',\n    });\n\n    await handler(req, {}, next);\n\n    expect(mockFaqDeleteMany).not.toHaveBeenCalled();\n    expect(next).toHaveBeenCalledWith(expect.objectContaining({ statusCode: 404 }));\n  });\n\n  it('DELETE /:id/faqs/:faqId deletes the FAQ for a same-tenant product (control)', async () => {\n    mockProductFindFirst.mockResolvedValue({ id: 'product-a' });\n    mockFaqDeleteMany.mockResolvedValue({ count: 1 });\n    const handler = getHandler('delete', '/:id/faqs/:faqId');\n    const { req, res, jsonMock, next } = mockReqRes({\n      storeId: STORE_A,\n      id: 'product-a',\n      faqId: 'faq-1',\n    });\n\n    await handler(req, res, next);\n\n    expect(next).not.toHaveBeenCalled();\n    expect(mockFaqDeleteMany).toHaveBeenCalledWith({\n      where: { id: 'faq-1', productId: 'product-a' },\n    });\n    expect(jsonMock).toHaveBeenCalledWith(expect.objectContaining({ success: true }));\n  });\n});\n"},"tests/unit/payment-service-refund.test.ts":{"tests":[{"id":"114","name":"PaymentService.refund — applyRefundEffects failure must surface REJECTS when applyRefundEffects throws after the provider refund + DB flip succeed"},{"id":"115","name":"PaymentService.refund — applyRefundEffects failure must surface resolves normally when applyRefundEffects succeeds (control case)"}],"source":"/**\n * PaymentService.refund unit tests (money-integrity Task 5)\n *\n * Root-cause coverage for the admin \"refund via provider\" swallow: after the\n * provider refund succeeds and the Payment/Order rows are flipped to\n * `refunded`, `refund()` calls `OrderService.applyRefundEffects` — which, per\n * the Task 1-4 redesign, is now a thin `inngest.send('order/refunded', ...)`\n * dispatcher that fires the ONLY signal driving inventory/coupon/affiliate/\n * loyalty reversal + the customer refund email/admin push. Historically that\n * call was wrapped in a try/catch that only logged the failure (added back\n * when `applyRefundEffects` did heavy inline work and a failure there was\n * genuinely \"non-fatal\" reconciliation debt). Now that it's the sole fanout\n * trigger, swallowing its failure means the reversal/notification chain can\n * silently never fire while `refund()` still resolves normally — and the\n * admin `refund-via-provider` route (order.routes.ts) has no way to know,\n * so it returns HTTP 200 despite a broken refund (money-integrity audit F2).\n *\n * This test asserts `PaymentService.refund()` REJECTS when\n * `applyRefundEffects` throws, so the failure can propagate to the route's\n * error handling instead of being swallowed here.\n */\n\nimport { describe, it, expect, vi, beforeEach } from 'vitest';\n\n// ─── Mocks (declared before the module-under-test import) ────────────────\n\nconst paymentFindFirst = vi.fn();\nconst paymentUpdateMany = vi.fn();\nconst paymentUpdate = vi.fn().mockResolvedValue({});\nconst orderUpdate = vi.fn().mockResolvedValue({});\nconst orderFindUnique = vi.fn();\nconst paymentConfigFindMany = vi.fn();\n// `$transaction` is called with an ARRAY of already-built update promises\n// (`prisma.payment.update(...)`, `prisma.order.update(...)`), so those two\n// must resolve on their own before `$transaction` ever runs.\nconst txMock = vi.fn((ops: unknown[]) => Promise.all(ops));\n\nvi.mock('@force/database', () => ({\n  prisma: {\n    payment: {\n      findFirst: (...a: unknown[]) => paymentFindFirst(...a),\n      updateMany: (...a: unknown[]) => paymentUpdateMany(...a),\n      update: (...a: unknown[]) => paymentUpdate(...a),\n    },\n    order: {\n      findUnique: (...a: unknown[]) => orderFindUnique(...a),\n      update: (...a: unknown[]) => orderUpdate(...a),\n    },\n    paymentConfig: {\n      findMany: (...a: unknown[]) => paymentConfigFindMany(...a),\n    },\n    $transaction: (ops: unknown[]) => txMock(ops),\n  },\n  Prisma: {},\n}));\n\nvi.mock('@api/config', () => ({\n  config: {\n    paymentTestMode: true,\n  },\n}));\n\nvi.mock('@api/services/encryption.service', () => ({\n  encryption: {\n    decrypt: (v: string) => v,\n    encrypt: (v: string) => v,\n  },\n}));\n\n// The function under test (`refund`) fans out to `applyRefundEffects` after\n// the DB transaction commits — this is the mock under direct test control.\nconst applyRefundEffects = vi.fn();\n// `refund()` now also calls the money-integrity Task 6 state machine guard\n// before the DB flip. These tests aren't exercising the guard itself\n// (see tests/unit/order-status-machine.test.ts and\n// tests/unit/payment-webhook-status-transition.test.ts for that) — the\n// mocked order below is always in a valid pre-refund state ('confirmed'),\n// so a no-op pass-through here keeps this file focused on the\n// applyRefundEffects-swallow regression it was written for.\nvi.mock('@api/services/order.service', () => ({\n  OrderService: {\n    applyRefundEffects: (...a: unknown[]) => applyRefundEffects(...a),\n  },\n  assertValidTransition: () => undefined,\n}));\n\nvi.mock('@api/services/socket.service', () => ({\n  socketService: { emitToStore: vi.fn(), emitToUser: vi.fn() },\n}));\n\nvi.mock('@api/lib/inngest/client', () => ({\n  inngest: { send: vi.fn().mockResolvedValue(undefined) },\n}));\n\nvi.mock('@api/services/onesignal.service', () => ({\n  OneSignalService: { sendToStore: vi.fn(), sendToUser: vi.fn() },\n}));\n\nvi.mock('@api/services/redis.service', () => ({\n  redis: { get: vi.fn(), set: vi.fn(), del: vi.fn() },\n}));\n\nvi.mock('@api/services/alerts.service', () => ({\n  sendAlert: vi.fn().mockResolvedValue(undefined),\n}));\n\nvi.mock('@api/services/payment-event.service', () => ({\n  recordPaymentEvent: vi.fn().mockResolvedValue(undefined),\n}));\n\nvi.mock('@api/lib/public-cache', () => ({\n  invalidateCustomersCache: vi.fn().mockResolvedValue(undefined),\n}));\n\nvi.mock('@api/lib/logger', () => ({\n  default: { info: vi.fn(), warn: vi.fn(), error: vi.fn(), debug: vi.fn() },\n}));\n\n// The provider's own `.refund()` call — always succeeds in these tests; we\n// are testing what happens AFTER the provider (and the DB tx) succeed.\nconst providerRefund = vi.fn();\nvi.mock('@api/services/payment-providers/tap.provider', () => ({\n  TapPaymentProvider: class {\n    initialize = vi.fn();\n    refund = providerRefund;\n  },\n}));\nvi.mock('@api/services/payment-providers/myfatoorah.provider', () => ({\n  MyFatoorahPaymentProvider: class {\n    initialize = vi.fn();\n    refund = provider
