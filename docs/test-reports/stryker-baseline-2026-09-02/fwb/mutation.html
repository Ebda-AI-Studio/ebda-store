ide the function: the unreachable check MUST\n      // precede the status checks, or a leftover/defaulted status could fall\n      // through to the cancel branch on an outage.\n      expect(\n        decideAutoCancelAction({\n          hasGatewayPayment: true,\n          providerReachable: false,\n          providerStatus: 'pending',\n        })\n      ).toBe('skip');\n    });\n\n    it('does not mistake an unreachable provider for a completed payment', () => {\n      expect(\n        decideAutoCancelAction({\n          hasGatewayPayment: true,\n          providerReachable: false,\n          providerStatus: 'completed',\n        })\n      ).not.toBe('reconcile_paid');\n    });\n  });\n\n  describe('cancelling is still correct for a definite not-paid answer', () => {\n    it.each(['failed', 'expired', 'cancelled', 'pending'])(\n      'cancels when the provider reports %s',\n      status => {\n        expect(\n          decideAutoCancelAction({\n            hasGatewayPayment: true,\n            providerReachable: true,\n            providerStatus: status,\n          })\n        ).toBe('cancel');\n      }\n    );\n\n    it('cancels an unrecognised provider status rather than rescuing it', () => {\n      // Only an explicit 'completed' may mark money as received. Anything we\n      // do not recognise is NOT treated as paid.\n      expect(\n        decideAutoCancelAction({\n          hasGatewayPayment: true,\n          providerReachable: true,\n          providerStatus: 'some_new_provider_state',\n        })\n      ).toBe('cancel');\n    });\n  });\n\n  describe('orders with no gateway payment keep the original behaviour', () => {\n    it('cancels a COD / never-issued-a-link order without asking any provider', () => {\n      expect(\n        decideAutoCancelAction({\n          hasGatewayPayment: false,\n          providerReachable: true,\n        })\n      ).toBe('cancel');\n    });\n\n    it('cancels a payment-less order even if the provider is unreachable', () => {\n      // Nothing to reconcile means nothing to be unsure about — an unreachable\n      // provider is irrelevant here and must not wedge these orders forever.\n      expect(\n        decideAutoCancelAction({\n          hasGatewayPayment: false,\n          providerReachable: false,\n        })\n      ).toBe('cancel');\n    });\n  });\n});\n"},"tests/unit/cart-variant-stock.test.ts":{"tests":[{"id":"190","name":"CartService.updateItem — variant lines uses the VARIANT stock, not the drifted parent column"},{"id":"191","name":"CartService.updateItem — variant lines still rejects when the VARIANT itself is short"},{"id":"192","name":"CartService.updateItem — variant lines leaves non-variant lines on the product column (unchanged behaviour)"},{"id":"193","name":"CartService.updateItem — variant lines loads the variant alongside the product — omitting it is the bug"}],"source":"/**\n * Regression: CartService.updateItem checked the PARENT product's inventory\n * for a variant cart line. On a variant product the parent column is not\n * stock (and had drifted negative in production — 92 active pecannbee\n * products), so every quantity change threw INSUFFICIENT_INVENTORY no matter\n * how much variant stock existed. `addItem` and `validate` had always\n * resolved `variant ? variant.inventory : product.inventory`; only\n * `updateItem` was missed.\n */\nimport { describe, it, expect, beforeEach, vi } from 'vitest';\nimport { CartService } from '@api/services/cart.service';\nimport { prisma } from '@force/database';\n\nvi.mock('@force/database', () => ({\n  prisma: {\n    cart: { findFirst: vi.fn(), create: vi.fn(), update: vi.fn(), findUnique: vi.fn() },\n    cartItem: { findFirst: vi.fn(), update: vi.fn(), delete: vi.fn() },\n    product: { findFirst: vi.fn(), update: vi.fn() },\n    productVariant: { findUnique: vi.fn() },\n    $transaction: vi.fn(),\n  },\n  Prisma: { TransactionIsolationLevel: { Serializable: 'Serializable' } },\n  OrderStatus: {\n    pending: 'pending',\n    confirmed: 'confirmed',\n    processing: 'processing',\n    shipped: 'shipped',\n    delivered: 'delivered',\n    cancelled: 'cancelled',\n    refunded: 'refunded',\n  },\n}));\n\nvi.mock('@api/services/feature.service', () => ({\n  featureService: { isFeatureEnabled: vi.fn().mockResolvedValue(false) },\n}));\n\nconst CART = { id: 'cart-1', items: [] };\n\nbeforeEach(() => {\n  vi.clearAllMocks();\n  vi.spyOn(CartService, 'getOrCreate').mockResolvedValue(CART as never);\n  (prisma.cart.update as ReturnType<"+"typeof vi.fn>).mockResolvedValue({});\n  (prisma.cartItem.update as ReturnType<"+"typeof vi.fn>).mockResolvedValue({});\n});\n\ndescribe('CartService.updateItem — variant lines', () => {\n  it('uses the VARIANT stock, not the drifted parent column', async () => {\n    // Exact production shape: parent -16, variant holds 1173.\n    (prisma.cartItem.findFirst as ReturnType<"+"typeof vi.fn>).mockResolvedValue({\n      id: 'item-1',\n      cartId: 'cart-1',\n      productId: 'prod-1',\n      variantId: 'var-1',\n      product: { trackInventory: true, inventory: -16, allowBackorder: false },\n      variant: { id: 'var-1', inventory: 1173, allowBackorder: false },\n    });\n\n    await expect(CartService.updateItem('store-1', 'sess-1', 'item-1', 3)).resolves.toBeDefined();\n    expect(prisma.cartItem.update).toHaveBeenCalledWith({\n      where: { id: 'item-1' },\n      data: { quantity: 3 },\n    });\n  });\n\n  it('still rejects when the VARIANT itself is short', async () => {\n    (prisma.cartItem.findFirst as ReturnType<"+"typeof vi.fn>).mockResolvedValue({\n      id: 'item-1',\n      cartId: 'cart-1',\n      productId: 'prod-1',\n      variantId: 'var-1',\n      product: { trackInventory: true, inventory: 500, allowBackorder: false },\n      variant: { id: 'var-1', inventory: 2, allowBackorder: false },\n    });\n\n    await expect(CartService.updateItem('store-1', 'sess-1', 'item-1', 3)).rejects.toThrow(\n      /Not enough inventory/\n    );\n    expect(prisma.cartItem.update).not.toHaveBeenCalled();\n  });\n\n  it('leaves non-variant lines on the product column (unchanged behaviour)', async () => {\n    (prisma.cartItem.findFirst as ReturnType<"+"typeof vi.fn>).mockResolvedValue({\n      id: 'item-1',\n      cartId: 'cart-1',\n      productId: 'prod-1',\n      variantId: null,\n      product: { trackInventory: true, inventory: 2, allowBackorder: false },\n      variant: null,\n    });\n\n    await expect(CartService.updateItem('store-1', 'sess-1', 'item-1', 3)).rejects.toThrow(\n      /Not enough inventory/\n    );\n  });\n\n  it('loads the variant alongside the product — omitting it is the bug', async () => {\n    (prisma.cartItem.findFirst as ReturnType<"+"typeof vi.fn>).mockResolvedValue({\n      id: 'item-1',\n      cartId: 'cart-1',\n      productId: 'prod-1',\n      variantId: 'var-1',\n      product: { trackInventory: true, inventory: -16, allowBackorder: false },\n      variant: { id: 'var-1', inventory: 1173, allowBackorder: false },\n    });\n\n    await CartService.updateItem('store-1', 'sess-1', 'item-1', 3);\n\n    const call = (prisma.cartItem.findFirst as ReturnType<"+"typeof vi.fn>).mock.calls[0][0];\n    expect(call.include).toHaveProperty('variant');\n  });\n});\n"},"tests/unit/cart-ambient-tx.test.ts":{"tests":[{"id":"194","name":"CartService.addItem — transaction scoping inside a tenant transaction it does NOT open a nested $transaction"},{"id":"195","name":"CartService.addItem — transaction scoping outside a tenant context it still uses its own transaction"},{"id":"196","name":"CartService.addItem — transaction scoping still enforces inventory on the ambient path"}],"source":"/**\n * Regression: the first add-to-cart of a session returned 500.\n *\n * `tenantContext` wraps the WHOLE request in one interactive transaction and\n * every proxied Prisma call runs inside it; that transaction only commits when\n * the response finishes. `CartService.addItem` then opened its OWN\n * `prisma.$transaction` — and `$transaction` is deliberately not proxied to the\n * tenant client (`isProxiedProp` rejects anything starting with `$`), so it ran\n * on a different connection that could not see the cart `getOrCreate` had just\n * written. The FK on `cart_items.cart_id` pointed at an invisible row:\n *\n *   Foreign key constraint violated on the constraint: `cart_items_cart_id_fkey`\n *\n * A `GET /cart` first masked it, because that committed the cart in an earlier\n * request — which is why the storefront never tripped it and a direct\n * `POST /cart/items` always did.\n */\nimport { describe, it, expect, beforeEach, vi } from 'vitest';\n\nconst hasTenantContextMock = vi.fn();\n\nvi.mock('@force/database', () => ({\n  prisma: {\n    cart: { findFirst: vi.fn(), create: vi.fn(), update: vi.fn() },\n    cartItem: { findFirst: vi.fn(), create: vi.fn(), update: vi.fn() },\n    product: { findFirst: vi.fn() },\n    productVariant: { findFirst: vi.fn() },\n    $transaction: vi.fn(),\n  },\n  Prisma: {\n    TransactionIsolationLevel: { Serializable: 'Serializable', ReadCommitted: 'ReadCommitted' },\n  },\n  hasTenantContext: () => hasTenantContextMock(),\n  OrderStatus: {\n    pending: 'pending',\n    confirmed: 'confirmed',\n    processing: 'processing',\n    shipped: 'shipped',\n    delivered: 'delivered',\n    cancelled: 'cancelled',\n    refunded: 'refunded',\n  },\n}));\n\nvi.mock('@api/services/feature.service', () => ({\n  featureService: { isFeatureEnabled: vi.fn().mockResolvedValue(false) },\n}));\n\nconst { CartService } = await import('@api/services/cart.service');\nconst { prisma } = await import('@force/database');\n\nconst CART = { id: 'cart-1', items: [], subtotal: 0 };\n\nbeforeEach(() => {\n  vi.clearAllMocks();\n  vi.spyOn(CartService, 'getOrCreate').mockResolvedValue(CART as never);\n  (prisma.cart.update as ReturnType<"+"typeof vi.fn>).mockResolvedValue({});\n  (prisma.cartItem.findFirst as ReturnType<"+"typeof vi.fn>).mockResolvedValue(null);\n  (prisma.cartItem.create as ReturnType<"+"typeof vi.fn>).mockResolvedValue({});\n  (prisma.product.findFirst as ReturnType<"+"typeof vi.fn>).mockResolvedValue({\n    id: 'prod-1',\n    trackInventory: true,\n    inventory: 50,\n    allowBackorder: false,\n  });\n});\n\ndescribe('CartService.addItem — transaction scoping', () => {\n  it('inside a tenant transaction it does NOT open a nested $transaction', async () => {\n    hasTenantContextMock.mockReturnValue(true);\n\n    await CartService.addItem('store-1', 'sess-1', 'prod-1', 1);\n\n    // The bug: a nested transaction cannot see the cart written by the outer\n    // (uncommitted) tenant transaction, so the cart-item FK fails.\n    expect(prisma.$transaction).not.toHaveBeenCalled();\n    expect(prisma.cartItem.create).toHaveBeenCalledWith(\n      expect.objectContaining({ data: expect.objectContaining({ cartId: 'cart-1' }) })\n    );\n  });\n\n  it('outside a tenant context it still uses its own transaction', async () => {\n    hasTenantContextMock.mockReturnValue(false);\n    (prisma.$transaction as ReturnType<"+"typeof vi.fn>).mockImplementation(async (fn: never) =>\n      (fn as unknown as (tx: unknown) => Promise<"+"unknown>)(prisma)\n    );\n\n    await CartService.addItem('store-1', 'sess-1', 'prod-1', 1);\n\n    // Crons/scripts/tests run with no ambient transaction — behaviour unchanged.\n    expect(prisma.$transaction).toHaveBeenCalled();\n  });\n\n  it('still enforces inventory on the ambient path', async () => {\n    hasTenantContextMock.mockReturnValue(true);\n    (prisma.product.findFirst as ReturnType<"+"typeof vi.fn>).mockResolvedValue({\n      id: 'prod-1',\n      trackInventory: true,\n      inventory: 1,\n      allowBackorder: false,\n    });\n\n    await expect(CartService.addItem('store-1', 'sess-1', 'prod-1', 5)).rejects.toThrow(\n      /Not enough inventory/\n    );\n    expect(prisma.cartItem.create).not.toHaveBeenCalled();\n  });\n});\n"},"tests/unit/ai-output-schema-validation.test.ts":{"tests":[{"id":"197","name":"AI output schema validation seoSuggestionSchema accepts a well-formed suggestion"},{"id":"198","name":"AI output schema validation seoSuggestionSchema rejects non-string keyword elements (the gap the old check missed)"},{"id":"199","name":"AI output schema validation seoSuggestionSchema rejects an absurdly long title"},{"id":"200","name":"AI output schema validation seoSuggestionSchema still rejects a missing field, as before"},{"id":"201","name":"AI output schema validation categorizeSchema rejects a confidence value outside the enum"},{"id":"202","name":"AI output schema validation categorizeSchema accepts the three valid confidence levels"},{"id":"203","name":"AI output schema validation categorizeSchema rejects a non-array `matches` instead of throwing out of .filter"},{"id":"204","name":"AI output schema validation parseAiJson maps non-JSON to a 502 AI_BAD_RESPONSE"},{"id":"205","name":"AI output schema validation parseAiJson maps valid JSON of the WRONG SHAPE to the same 502"},{"id":"206","name":"AI output schema validation parseAiJson returns the parsed value on success"}],"source":"import { describe, it, expect, vi } from 'vitest';\n\n// ai.service pulls in Prisma/Redis/Gemini at import time; none of that is\n// needed to exercise the pure validation layer.\nvi.mock('@force/database', () => ({ prisma: {} }));\nvi.mock('../../apps/api/src/services/redis.service', () => ({ redis: {} }));\n\nimport {\n  seoSuggestionSchema,\n  sectionContentSchema,\n  categorizeSchema,\n  parseAiJson,\n} from '../../apps/api/src/services/ai.service';\n\n/**\n * Regression tests for AI output validation.\n *\n * These schemas replaced hand-rolled `typeof x !== 'string'` chains. Those\n * chains DID check that each scalar was present and a string — the gaps were\n * narrower and are what these tests pin down:\n *   - array ELEMENT types (`Array.isArray(keywords)` accepted `[{}, 42]`)\n *   - the `confidence` enum (any string passed through to the admin UI)\n *   - `matches` being an array at all (a non-array threw out of `.filter`,\n *     surfacing as a 500 rather than a clean 502)\n *   - length bounds (nothing stopped a 50 KB title reaching the DB)\n */\ndescribe('AI output schema validation', () => {\n  const ctx = { storeId: 'store-1', kind: 'test' };\n\n  describe('seoSuggestionSchema', () => {\n    const valid = {\n      title: 'Pecan Mix',\n      titleAr: 'بيكان مشكل',\n      description: 'A tasty mix.',\n      descriptionAr: 'خليط لذيذ.',\n      keywords: ['pecan', 'nuts'],\n    };\n\n    it('accepts a well-formed suggestion', () => {\n      expect(seoSuggestionSchema.safeParse(valid).success).toBe(true);\n    });\n\n    it('rejects non-string keyword elements (the gap the old check missed)', () => {\n      // Array.isArray() was true here, so this used to pass straight through\n      // and render as \"[object Object]\" in a meta tag.\n      const bad = { ...valid, keywords: [{ kw: 'pecan' }, 42] };\n      expect(seoSuggestionSchema.safeParse(bad).success).toBe(false);\n    });\n\n    it('rejects an absurdly long title', () => {\n      const bad = { ...valid, title: 'x'.repeat(50_000) };\n      expect(seoSuggestionSchema.safeParse(bad).success).toBe(false);\n    });\n\n    it('still rejects a missing field, as before', () => {\n      const { descriptionAr, ...bad } = valid;\n      expect(seoSuggestionSchema.safeParse(bad).success).toBe(false);\n    });\n  });\n\n  describe('categorizeSchema', () => {\n    it('rejects a confidence value outside the enum', () => {\n      const bad = { matches: [{ id: 'c1', confidence: 'extremely high' }] };\n      expect(categorizeSchema.safeParse(bad).success).toBe(false);\n    });\n\n    it('accepts the three valid confidence levels', () => {\n      const ok = {\n        matches: [\n          { id: 'c1', confidence: 'high' },\n          { id: 'c2', confidence: 'medium' },\n          { id: 'c3', confidence: 'low' },\n        ],\n      };\n      expect(categorizeSchema.safeParse(ok).success).toBe(true);\n    });\n\n    it('rejects a non-array `matches` instead of throwing out of .filter', () => {\n      expect(categorizeSchema.safeParse({ matches: 'nope' }).success).toBe(false);\n    });\n  });\n\n  describe('parseAiJson', () => {\n    it('maps non-JSON to a 502 AI_BAD_RESPONSE', () => {\n      expect(() => parseAiJson(sectionContentSchema, 'not json at all', ctx)).toThrowError(\n        expect.objectContaining({ statusCode: 502, code: 'AI_BAD_RESPONSE' })\n      );\n    });\n\n    it('maps valid JSON of the WRONG SHAPE to the same 502', () => {\n      // Previously this distinction was per-call-site and inconsistent.\n      expect(() => parseAiJson(sectionContentSchema, '{\"kicker\":123}', ctx)).toThrowError(\n        expect.objectContaining({ statusCode: 502, code: 'AI_BAD_RESPONSE' })\n      );\n    });\n\n    it('returns the parsed value on success', () => {\n      const raw = JSON.stringify({ kicker: 'A', kickerAr: 'ب', subtitle: 'S', subtitleAr: 'س' });\n      expect(parseAiJson(sectionContentSchema, raw, ctx)).toEqual({\n        kicker: 'A',\n        kickerAr: 'ب',\n        subtitle: 'S',\n        subtitleAr: 'س',\n      });\n    });\n  });\n});\n"},"tests/unit/product-excerpt-public-payload.test.ts":{"tests":[{"id":"207","name":"ProductService — public payload carries excerpt/excerptAr getPublicBySlug returns excerpt + excerptAr on the response"},{"id":"208","name":"ProductService — public payload carries excerpt/excerptAr getPublicById returns excerpt + excerptAr on the response"},{"id":"209","name":"ProductService — public payload carries excerpt/excerptAr passes through a null excerpt (product never swept) without throwing"}],"source":"/**\n * Product Service — public payload excerpt exposure.\n *\n * The `bulk-ai-excerpt` sweep writes `Product.excerpt` / `excerptAr`, but\n * until this test was added nothing verified that the public storefront\n * payload (`getPublicBySlug` / `getPublicById`) actually carries those\n * fields through. Both queries use Prisma `include` (not `select`), so\n * every scalar column — including `excerpt`/`excerptAr` — flows through the\n * `...product` spread in `reshapePublicProductDetail` automatically. This\n * test guards that behavior against a future refactor to an explicit\n * `select` that could silently drop the fields again.\n *\n * No DB required — prisma + all service-level side-effect modules are\n * mocked (mirrors the pattern in tests/unit/recommendation.test.ts).\n */\nimport { describe, it, expect, vi, beforeEach } from 'vitest';\n\nconst { findFirstMock, reviewAggregateMock } = vi.hoisted(() => ({\n  findFirstMock: vi.fn(),\n  reviewAggregateMock: vi.fn().mockResolvedValue({ _avg: { rating: null }, _count: { rating: 0 } }),\n}));\n\nvi.mock('@force/database', () => ({\n  prisma: {\n    product: {\n      findFirst: findFirstMock,\n    },\n    review: {\n      aggregate: reviewAggregateMock,\n    },\n  },\n  Prisma: {},\n  ProductStatus: {},\n  OrderStatus: {},\n  withMoneyTx: vi.fn(async (_prisma: unknown, cb: (tx: unknown) => unknown) => cb({})),\n}));\n\nvi.mock('../../apps/api/src/services/redis.service', () => ({\n  redis: {\n    get: vi.fn(),\n    set: vi.fn(),\n    delete: vi.fn(),\n  },\n}));\n\nvi.mock('../../apps/api/src/lib/public-cache', () => ({\n  invalidateCached: vi.fn(),\n  invalidateCachedPrefix: vi.fn(),\n  getCached: vi.fn(),\n  setEdgeCache: vi.fn(),\n}));\n\nvi.mock('../../apps/api/src/lib/logger', () => ({\n  default: { info: vi.fn(), warn: vi.fn(), error: vi.fn(), debug: vi.fn() },\n}));\n\nvi.mock('../../apps/api/src/services/r2-cleanup.service', () => ({\n  cleanupRemovedImages: vi.fn(),\n}));\n\nvi.mock('../../apps/api/src/lib/inngest/client', () => ({\n  inngest: { send: vi.fn() },\n}));\n\nvi.mock('../../apps/api/src/services/ai-autofill.service', () => ({\n  stampHumanEdits: vi.fn(() => ({})),\n}));\n\n// eslint-disable-next-line import/first\nimport { ProductService } from '../../apps/api/src/services/product.service';\n\ndescribe('ProductService — public payload carries excerpt/excerptAr', () => {\n  beforeEach(() => {\n    findFirstMock.mockReset();\n    reviewAggregateMock.mockClear();\n  });\n\n  const baseProduct = {\n    id: 'prod-1',\n    storeId: 'store-1',\n    slug: 'olive-oil',\n    name: 'Olive Oil',\n    nameAr: 'زيت زيتون',\n    price: 5000,\n    inventory: 10,\n    lowStockThreshold: 5,\n    allowBackorder: false,\n    excerpt: 'Cold-pressed extra virgin olive oil, bottled fresh.',\n    excerptAr: 'زيت زيتون بكر ممتاز معصور على البارد.',\n    options: [],\n    variants: [],\n    images: [{ id: 'img-1', url: 'https://example.com/a.jpg', alt: 'Olive Oil bottle' }],\n  };\n\n  it('getPublicBySlug returns excerpt + excerptAr on the response', async () => {\n    findFirstMock.mockResolvedValue(baseProduct);\n\n    const result = await ProductService.getPublicBySlug('store-1', 'olive-oil');\n\n    expect(result.excerpt).toBe(baseProduct.excerpt);\n    expect(result.excerptAr).toBe(baseProduct.excerptAr);\n  });\n\n  it('getPublicById returns excerpt + excerptAr on the response', async () => {\n    findFirstMock.mockResolvedValue(baseProduct);\n\n    const result = await ProductService.getPublicById('store-1', 'prod-1');\n\n    expect(result.excerpt).toBe(baseProduct.excerpt);\n    expect(result.excerptAr).toBe(baseProduct.excerptAr);\n  });\n\n  it('passes through a null excerpt (product never swept) without throwing', async () => {\n    findFirstMock.mockResolvedValue({ ...baseProduct, excerpt: null, excerptAr: null });\n\n    const result = await ProductService.getPublicBySlug('store-1', 'olive-oil');\n\n    expect(result.excerpt).toBeNull();\n    expect(result.excerptAr).toBeNull();\n  });\n});\n"},"tests/unit/bulk-ai-alt-text-generator.test.ts":{"tests":[{"id":"210","name":"generateProductAltText throws when the image fetch fails outright"},{"id":"211","name":"generateProductAltText throws when the image fetch returns a non-OK status"},{"id":"212","name":"generateProductAltText returns a trimmed, quote-stripped alt string on success"},{"id":"213","name":"generateProductAltText caps the returned alt text at ALT_TEXT_MAX_LENGTH"},{"id":"214","name":"generateProductAltText throws when Gemini returns an empty response"}],"source":"/**\n * product-alt-text-generator — Unit Tests\n *\n * Covers the Gemini-Vision alt-text generator: fetch failure surfaces as a\n * thrown error, a successful vision call returns a trimmed/quote-stripped\n * string capped at ALT_TEXT_MAX_LENGTH, and an empty model response throws.\n */\nimport { describe, it, expect, vi, beforeEach, afterEach } from 'vitest';\n\nconst mockGenerateContent = vi.fn();\nvi.mock('@google/generative-ai', () => ({\n  GoogleGenerativeAI: class {\n    getGenerativeModel() {\n      return {\n        generateContent: (...args: unknown[]) => mockGenerateContent(...args),\n      };\n    }\n  },\n}));\n\nimport {\n  generateProductAltText,\n  ALT_TEXT_MAX_LENGTH,\n} from '../../apps/api/src/lib/ai/product-alt-text-generator';\n\nfunction respond(text: string) {\n  return { response: { text: () => text } };\n}\n\nconst originalFetch = global.fetch;\n\nbeforeEach(() => {\n  mockGenerateContent.mockReset();\n});\n\nafterEach(() => {\n  global.fetch = originalFetch;\n});\n\ndescribe('generateProductAltText', () => {\n  it('throws when the image fetch fails outright', async () => {\n    global.fetch = vi.fn().mockRejectedValue(new Error('network down'));\n\n    await expect(\n      generateProductAltText(\n        { imageUrl: 'https://example.com/a.jpg', product: { name: 'T-Shirt' } },\n        'fake-key',\n        'gemini-flash-lite-latest'\n      )\n    ).rejects.toThrow('AI_IMAGE_FETCH_FAILED');\n  });\n\n  it('throws when the image fetch returns a non-OK status', async () => {\n    global.fetch = vi.fn().mockResolvedValue({\n      ok: false,\n      status: 404,\n      headers: new Headers({ 'content-type': 'image/jpeg' }),\n      arrayBuffer: async () => new ArrayBuffer(0),\n    });\n\n    await expect(\n      generateProductAltText(\n        { imageUrl: 'https://example.com/a.jpg', product: { name: 'T-Shirt' } },\n        'fake-key',\n        'gemini-flash-lite-latest'\n      )\n    ).rejects.toThrow('AI_IMAGE_FETCH_FAILED');\n  });\n\n  it('returns a trimmed, quote-stripped alt string on success', async () => {\n    global.fetch = vi.fn().mockResolvedValue({\n      ok: true,\n      status: 200,\n      headers: new Headers({ 'content-type': 'image/jpeg' }),\n      arrayBuffer: async () => new Uint8Array([1, 2, 3]).buffer,\n    });\n    mockGenerateContent.mockResolvedValue(respond('\"Blue cotton t-shirt on a hanger\"  '));\n\n    const alt = await generateProductAltText(\n      { imageUrl: 'https://example.com/a.jpg', product: { name: 'T-Shirt', nameAr: 'قميص' } },\n      'fake-key',\n      'gemini-flash-lite-latest'\n    );\n\n    expect(alt).toBe('Blue cotton t-shirt on a hanger');\n  });\n\n  it('caps the returned alt text at ALT_TEXT_MAX_LENGTH', async () => {\n    global.fetch = vi.fn().mockResolvedValue({\n      ok: true,\n      status: 200,\n      headers: new Headers({ 'content-type': 'image/png' }),\n      arrayBuffer: async () => new Uint8Array([1, 2, 3]).buffer,\n    });\n    const longText = 'x'.repeat(ALT_TEXT_MAX_LENGTH + 50);\n    mockGenerateContent.mockResolvedValue(respond(longText));\n\n    const alt = await generateProductAltText(\n      { imageUrl: 'https://example.com/a.png', product: { name: 'Product' } },\n      'fake-key',\n      'gemini-flash-lite-latest'\n    );\n\n    expect(alt.length).toBe(ALT_TEXT_MAX_LENGTH);\n  });\n\n  it('throws when Gemini returns an empty response', async () => {\n    global.fetch = vi.fn().mockResolvedValue({\n      ok: true,\n      status: 200,\n      headers: new Headers({ 'content-type': 'image/jpeg' }),\n      arrayBuffer: async () => new Uint8Array([1, 2, 3]).buffer,\n    });\n    mockGenerateContent.mockResolvedValue(respond('   '));\n\n    await expect(\n      generateProductAltText(\n        { imageUrl: 'https://example.com/a.jpg', product: { name: 'Product' } },\n        'fake-key',\n        'gemini-flash-lite-latest'\n      )\n    ).rejects.toThrow('AI returned an empty alt-text response');\n  });\n});\n"},"tests/unit/bulk-ai-category-suggester.test.ts":{"tests":[{"id":"215","name":"suggestProductCategory returns [] immediately without calling Gemini when the store has no categories"},{"id":"216","name":"suggestProductCategory returns only matches whose id exists in existingCategories"},{"id":"217","name":"suggestProductCategory returns [] when Gemini reports no confident match"},{"id":"218","name":"suggestProductCategory throws on unparseable / malformed Gemini output"},{"id":"219","name":"suggestProductCategory throws when the JSON is valid but missing the matches array"}],"source":"/**\n * product-category-suggester — Unit Tests\n *\n * Covers the catalogue-sweep category generator: never invents categories\n * (only returns ids present in `existingCategories`), returns [] when the\n * store has no categories at all, and throws on an unparseable Gemini\n * response.\n */\nimport { describe, it, expect, vi, beforeEach } from 'vitest';\n\nconst mockGenerateContent = vi.fn();\nvi.mock('@google/generative-ai', () => ({\n  GoogleGenerativeAI: class {\n    getGenerativeModel() {\n      return {\n        generateContent: (...args: unknown[]) => mockGenerateContent(...args),\n      };\n    }\n  },\n}));\n\nimport { suggestProductCategory } from '../../apps/api/src/lib/ai/product-category-suggester';\n\nfunction respond(text: string) {\n  return { response: { text: () => text } };\n}\n\nbeforeEach(() => {\n  mockGenerateContent.mockReset();\n});\n\ndescribe('suggestProductCategory', () => {\n  it('returns [] immediately without calling Gemini when the store has no categories', async () => {\n    const result = await suggestProductCategory(\n      {\n        storeName: 'Test Store',\n        product: { name: 'T-Shirt', description: 'A shirt' },\n        existingCategories: [],\n      },\n      'fake-key',\n      'gemini-flash-lite-latest'\n    );\n\n    expect(result).toEqual([]);\n    expect(mockGenerateContent).not.toHaveBeenCalled();\n  });\n\n  it('returns only matches whose id exists in existingCategories', async () => {\n    mockGenerateContent.mockResolvedValue(\n      respond(\n        JSON.stringify({\n          matches: [\n            { id: 'cat-1', confidence: 'high' },\n            { id: 'cat-does-not-exist', confidence: 'medium' },\n          ],\n        })\n      )\n    );\n\n    const result = await suggestProductCategory(\n      {\n        storeName: 'Test Store',\n        product: { name: 'T-Shirt', description: 'A cotton shirt' },\n        existingCategories: [\n          { id: 'cat-1', name: 'Clothing', nameAr: null },\n          { id: 'cat-2', name: 'Shoes', nameAr: null },\n        ],\n      },\n      'fake-key',\n      'gemini-flash-lite-latest'\n    );\n\n    expect(result).toEqual([{ id: 'cat-1', confidence: 'high' }]);\n  });\n\n  it('returns [] when Gemini reports no confident match', async () => {\n    mockGenerateContent.mockResolvedValue(respond(JSON.stringify({ matches: [] })));\n\n    const result = await suggestProductCategory(\n      {\n        storeName: 'Test Store',\n        product: { name: 'Mystery item', description: null },\n        existingCategories: [{ id: 'cat-1', name: 'Clothing', nameAr: null }],\n      },\n      'fake-key',\n      'gemini-flash-lite-latest'\n    );\n\n    expect(result).toEqual([]);\n  });\n\n  it('throws on unparseable / malformed Gemini output', async () => {\n    mockGenerateContent.mockResolvedValue(respond('not json at all'));\n\n    await expect(\n      suggestProductCategory(\n        {\n          storeName: 'Test Store',\n          product: { name: 'T-Shirt', description: null },\n          existingCategories: [{ id: 'cat-1', name: 'Clothing', nameAr: null }],\n        },\n        'fake-key',\n        'gemini-flash-lite-latest'\n      )\n    ).rejects.toThrow();\n  });\n\n  it('throws when the JSON is valid but missing the matches array', async () => {\n    mockGenerateContent.mockResolvedValue(respond(JSON.stringify({ foo: 'bar' })));\n\n    await expect(\n      suggestProductCategory(\n        {\n          storeName: 'Test Store',\n          product: { name: 'T-Shirt', description: null },\n          existingCategories: [{ id: 'cat-1', name: 'Clothing', nameAr: null }],\n        },\n        'fake-key',\n        'gemini-flash-lite-latest'\n      )\n    ).rejects.toThrow('AI returned unexpected format');\n  });\n});\n"},"tests/unit/bulk-ai-tag-suggester.test.ts":{"tests":[{"id":"220","name":"suggestProductTags returns the suggested tag list, trimmed"},{"id":"221","name":"suggestProductTags de-duplicates suggestions case-insensitively"},{"id":"222","name":"suggestProductTags caps the result at MAX_TAGS_PER_PRODUCT"},{"id":"223","name":"suggestProductTags drops non-string and empty entries"},{"id":"224","name":"suggestProductTags throws when the response is missing the tags array"}],"source":"/**\n * product-tag-suggester — Unit Tests\n *\n * Covers: caps suggestions at MAX_TAGS_PER_PRODUCT, de-duplicates\n * case-insensitively, drops non-string/empty entries, and throws on\n * malformed Gemini output.\n */\nimport { describe, it, expect, vi, beforeEach } from 'vitest';\n\nconst mockGenerateContent = vi.fn();\nvi.mock('@google/generative-ai', () => ({\n  GoogleGenerativeAI: class {\n    getGenerativeModel() {\n      return {\n        generateContent: (...args: unknown[]) => mockGenerateContent(...args),\n      };\n    }\n  },\n}));\n\nimport {\n  suggestProductTags,\n  MAX_TAGS_PER_PRODUCT,\n} from '../../apps/api/src/lib/ai/product-tag-suggester';\n\nfunction respond(text: string) {\n  return { response: { text: () => text } };\n}\n\nbeforeEach(() => {\n  mockGenerateContent.mockReset();\n});\n\ndescribe('suggestProductTags', () => {\n  it('returns the suggested tag list, trimmed', async () => {\n    mockGenerateContent.mockResolvedValue(\n      respond(JSON.stringify({ tags: [' cotton ', 'summer', 'best-seller'] }))\n    );\n\n    const result = await suggestProductTags(\n      {\n        storeName: 'Test Store',\n        product: { name: 'Tee', description: 'cotton tee' },\n        existingTagNames: [],\n      },\n      'fake-key',\n      'gemini-flash-lite-latest'\n    );\n\n    expect(result).toEqual(['cotton', 'summer', 'best-seller']);\n  });\n\n  it('de-duplicates suggestions case-insensitively', async () => {\n    mockGenerateContent.mockResolvedValue(\n      respond(JSON.stringify({ tags: ['Cotton', 'cotton', 'COTTON', 'summer'] }))\n    );\n\n    const result = await suggestProductTags(\n      {\n        storeName: 'Test Store',\n        product: { name: 'Tee', description: null },\n        existingTagNames: [],\n      },\n      'fake-key',\n      'gemini-flash-lite-latest'\n    );\n\n    expect(result).toEqual(['Cotton', 'summer']);\n  });\n\n  it('caps the result at MAX_TAGS_PER_PRODUCT', async () => {\n    const many = Array.from({ length: 20 }, (_, i) => `tag-${i}`);\n    mockGenerateContent.mockResolvedValue(respond(JSON.stringify({ tags: many })));\n\n    const result = await suggestProductTags(\n      {\n        storeName: 'Test Store',\n        product: { name: 'Tee', description: null },\n        existingTagNames: [],\n      },\n      'fake-key',\n      'gemini-flash-lite-latest'\n    );\n\n    expect(result.length).toBe(MAX_TAGS_PER_PRODUCT);\n  });\n\n  it('drops non-string and empty entries', async () => {\n    mockGenerateContent.mockResolvedValue(\n      respond(JSON.stringify({ tags: ['valid', '', '   ', 42, null, 'another'] }))\n    );\n\n    const result = await suggestProductTags(\n      {\n        storeName: 'Test Store',\n        product: { name: 'Tee', description: null },\n        existingTagNames: [],\n      },\n      'fake-key',\n      'gemini-flash-lite-latest'\n    );\n\n    expect(result).toEqual(['valid', 'another']);\n  });\n\n  it('throws when the response is missing the tags array', async () => {\n    mockGenerateContent.mockResolvedValue(respond(JSON.stringify({ foo: 'bar' })));\n\n    await expect(\n      suggestProductTags(\n        {\n          storeName: 'Test Store',\n          product: { name: 'Tee', description: null },\n          existingTagNames: [],\n        },\n        'fake-key',\n        'gemini-flash-lite-latest'\n      )\n    ).rejects.toThrow('AI returned unexpected format');\n  });\n});\n"},"tests/unit/ai-eval-golden-and-known-failures.test.ts":{"tests":[{"id":"225","name":"ai-eval: criteria registry completeness every registered output type has at least one deterministic check"},{"id":"226","name":"ai-eval: criteria registry completeness every registered output type has at least one golden fixture"},{"id":"227","name":"ai-eval: golden fixtures pass every deterministic check product-faq / product-faq-ceramic-mug"},{"id":"228","name":"ai-eval: golden fixtures pass every deterministic check product-excerpt / product-excerpt-ceramic-mug"},{"id":"229","name":"ai-eval: golden fixtures pass every deterministic check product-alt-text / product-alt-text-ceramic-mug"},{"id":"230","name":"ai-eval: golden fixtures pass every deterministic check product-category-suggestion / product-category-suggestion-mug-to-kitchen"},{"id":"231","name":"ai-eval: golden fixtures pass every deterministic check product-tags / product-tags-mug"},{"id":"232","name":"ai-eval: golden fixtures pass every deterministic check translation / translation-name-en-to-ar"},{"id":"233","name":"ai-eval: golden fixtures pass every deterministic check translation / translation-meta-title-ar-to-en"},{"id":"234","name":"ai-eval: golden fixtures pass every deterministic check seo-meta / seo-meta-product"},{"id":"235","name":"ai-eval: golden fixtures pass every deterministic check section-copy / section-copy-new-arrivals"},{"id":"236","name":"ai-eval: golden fixtures pass every deterministic check description-balance / description-balance-arabic-authoritative"},{"id":"237","name":"ai-eval: golden fixtures pass every deterministic check logo-palette / logo-palette-orange-brand"},{"id":"238","name":"ai-eval: golden fixtures pass every deterministic check store-faq / store-faq-payment-methods"},{"id":"239","name":"ai-eval: golden fixtures pass every deterministic check howto-guide / howto-guide-place-order"},{"id":"240","name":"ai-eval: golden fixtures pass every deterministic check meta-aeo / meta-aeo-store"},{"id":"241","name":"ai-eval: golden fixtures pass every deterministic check llms-txt / llms-txt-basic-store"},{"id":"242","name":"ai-eval: golden fixtures pass every deterministic check citation-copy / citation-copy-mug"},{"id":"243","name":"ai-eval: golden fixtures pass every deterministic check brand-facts / brand-facts-basic-store"},{"id":"244","name":"ai-eval: golden fixtures pass every deterministic check product-recommendations / product-recommendations-mug-to-coaster"},{"id":"245","name":"ai-eval: golden fixtures pass every deterministic check review-translation / review-translation-en-review"},{"id":"246","name":"ai-eval: golden fixtures pass every deterministic check review-spam-detection / review-spam-genuine-positive"},{"id":"247","name":"ai-eval: golden fixtures pass every deterministic check review-summary / review-summary-mixed"},{"id":"248","name":"ai-eval: golden fixtures pass every deterministic check review-owner-response / review-owner-response-positive"},{"id":"249","name":"ai-eval: golden fixtures pass every deterministic check expense-ocr / expense-ocr-kwd-no-tax"},{"id":"250","name":"ai-eval: golden fixtures pass every deterministic check expense-ocr / expense-ocr-aed-with-vat"},{"id":"251","name":"ai-eval: known-failure fixtures are correctly flagged product-faq / product-faq-duplicates-description — Merchant-reported bug (2026-07-09): FAQ answer is a near-verbatim restatement of the product description instead of new information."},{"id":"252","name":"ai-eval: known-failure fixtures are correctly flagged product-faq / product-faq-invents-numeric-spec — FAQ answer states a weight (450g) that is not present anywhere in the product description."},{"id":"253","name":"ai-eval: known-failure fixtures are correctly flagged product-excerpt / product-excerpt-exceeds-length — Excerpt generator returned a multi-paragraph summary instead of a short 1-2 sentence excerpt."},{"id":"254","name":"ai-eval: known-failure fixtures are correctly flagged product-alt-text / product-alt-text-just-product-name — Alt text is identical to the product name — adds no visual description for SEO/screen readers."},{"id":"255","name":"ai-eval: known-failure fixtures are correctly flagged product-category-suggestion / product-category-invents-id — Suggestion references a category id that does not exist in the store's taxonomy."},{"id":"256","name":"ai-eval: known-failure fixtures are correctly flagged product-tags / product-tags-duplicate-and-empty — Tags include a case-insensitive duplicate (\"Handmade\" / \"handmade\") and an empty string."},{"id":"257","name":"ai-eval: known-failure fixtures are correctly flagged seo-meta / seo-meta-too-long-and-price-claim — SEO title exceeds 60 chars and the description mentions a KWD price (prompt explicitly forbids price mentions)."},{"id":"258","name":"ai-eval: known-failure fixtures are correctly flagged store-faq / store-faq-names-gateway-company — FAQ answer names \"MyFatoorah\" instead of the payment methods customers actually see (KNET/Visa/Mastercard)."},{"id":"259","name":"ai-eval: known-failure fixtures are correctly flagged howto-guide / howto-guide-step-count-out-of-range — Guide has 8 steps (prompt spec is 3-6) and stepsAr is missing 2 of them."},{"id":"260","name":"ai-eval: known-failure fixtures are correctly flagged citation-copy / citation-copy-invented-spec-and-too-long — Citation copy invents a \"500ml\" capacity not present in the description, and exceeds the 500-char field cap."},{"id":"261","name":"ai-eval: known-failure fixtures are correctly flagged product-recommendations / product-recommendations-self-and-duplicate — Recommendations include the source product itself, a duplicate pick, and an out-of-candidate-list id."},{"id":"262","name":"ai-eval: known-failure fixtures are correctly flagged review-spam-detection / review-spam-status-mismatch — spamScore=0.85 (>= the 0.7 \"spam\" threshold) but recommendedStatus is \"published\" — the status/score mapping is broken."},{"id":"263","name":"ai-eval: known-failure fixtures are correctly flagged review-summary / review-summary-theme-too-long — A \"top positive\" theme is a full run-on sentence instead of a short 3-7 word phrase."},{"id":"264","name":"ai-eval: known-failure fixtures are correctly flagged description-balance / description-balance-wrong-language-slot — descriptionAr holds untranslated English text instead of Arabic after balancing."},{"id":"265","name":"ai-eval: known-failure fixtures are correctly flagged translation / translation-wrong-target-script — Translation to Arabic returned the English source text verbatim, untranslated."},{"id":"266","name":"ai-eval: known-failure fixtures are correctly flagged expense-ocr / expense-ocr-total-mismatch — Stated total (30.00) does not equal subtotal (25.00) + tax (1.25 = 26.25) — a misread/hallucinated total on a money document."},{"id":"267","name":"ai-eval: known-failure fixtures are correctly flagged expense-ocr / expense-ocr-bad-currency-and-lineitem — Currency \"kd\" is not a 3-letter ISO code, and a line item claims lineTotal 5.000 for quantity 2 x unitPrice 1.000 (=2.000)."},{"id":"268","name":"ai-eval: known-failure fixtures are correctly flagged every known-failure fixture declares at least one expected failed check"}],"source":"/**\n * AI-output evaluation harness — deterministic layer, offline, CI-gate.\n *\n * This is the hard gate that runs on every push (wired into `npm run\n * test:unit`): for EVERY AI output type registered in\n * `apps/api/src/lib/ai/eval/criteria.ts`, every golden fixture must pass\n * every deterministic check, and every known-failure fixture (including\n * the real merchant-reported FAQ-duplication regression, PR #538) must\n * fail its expected check(s).\n *\n * The model-as-judge layer (grounding / relevance / tone via a real\n * Gemini call) is NOT exercised here — it costs quota and is\n * non-deterministic, so it only runs via `npm run ai:eval`\n * (tests/ai-eval/live.eval.ts), manually or on the nightly schedule. See\n * that file + .github/workflows/ai-eval-nightly.yml for the cadence.\n */\nimport { describe, it, expect } from 'vitest';\nimport { runDeterministicChecks } from '../../apps/api/src/lib/ai/eval/judge';\nimport { AI_OUTPUT_CRITERIA } from '../../apps/api/src/lib/ai/eval/criteria';\nimport { GOLDEN_CASES, KNOWN_FAILURE_CASES } from '../../apps/api/src/lib/ai/eval/fixtures';\nimport type { AiOutputType } from '../../apps/api/src/lib/ai/eval/types';\n\ndescribe('ai-eval: criteria registry completeness', () => {\n  const ALL_TYPES: AiOutputType[] = Object.keys(AI_OUTPUT_CRITERIA) as AiOutputType[];\n\n  it('every registered output type has at least one deterministic check', () => {\n    for (const type of ALL_TYPES) {\n      expect(\n        AI_OUTPUT_CRITERIA[type].deterministic.length,\n        `${type} has zero deterministic checks`\n      ).toBeGreaterThan(0);\n    }\n  });\n\n  it('every registered output type has at least one golden fixture', () => {\n    const covered = new Set(GOLDEN_CASES.map(c => c.type));\n    for (const type of ALL_TYPES) {\n      expect(covered.has(type), `${type} has no golden fixture`).toBe(true);\n    }\n  });\n});\n\ndescribe('ai-eval: golden fixtures pass every deterministic check', () => {\n  for (const golden of GOLDEN_CASES) {\n    it(`${golden.type} / ${golden.id}`, () => {\n      const results = runDeterministicChecks(golden.type, golden.input, golden.output);\n      const failed = results.filter(r => !r.pass);\n      expect(\n        failed,\n        `unexpected deterministic failures: ${JSON.stringify(failed, null, 2)}`\n      ).toEqual([]);\n    });\n  }\n});\n\ndescribe('ai-eval: known-failure fixtures are correctly flagged', () => {\n  for (const failure of KNOWN_FAILURE_CASES) {\n    it(`${failure.type} / ${failure.id} — ${failure.description}`, () => {\n      const results = runDeterministicChecks(failure.type, failure.input, failure.output);\n      const failedNames = results.filter(r => !r.pass).map(r => r.name);\n      for (const expected of failure.expectedFailedChecks) {\n        expect(\n          failedNames,\n          `expected \"${expected}\" to fail for ${failure.id}, but it passed (all results: ${JSON.stringify(results, null, 2)})`\n        ).toContain(expected);\n      }\n    });\n  }\n\n  it('every known-failure fixture declares at least one expected failed check', () => {\n    for (const failure of KNOWN_FAILURE_CASES) {\n      expect(\n        failure.expectedFailedChecks.length,\n        `${failure.id} declares no expectedFailedChecks`\n      ).toBeGreaterThan(0);\n    }\n  });\n});\n"},"tests/unit/product-faq-generator.test.ts":{"tests":[{"id":"269","name":"buildProductFaqPrompt renders variant options as usable facts and the size-accuracy rule"},{"id":"270","name":"buildProductFaqPrompt asks for UP TO the count (quality over quantity) and forbids meta/SKU filler"},{"id":"271","name":"buildProductFaqPrompt omits the facts block entirely for a simple product with no options"}],"source":"/**\n * product-faq-generator prompt — Unit Tests\n *\n * Focus: the accuracy grounding that stops the model inventing a single\n * wrong size/weight (e.g. \"200g\") when the product actually ships multiple\n * variant options (e.g. Size: 400 Gram / 700 Gram). The prompt must surface\n * the real options as usable facts and instruct the model to use them.\n */\nimport { describe, it, expect } from 'vitest';\nimport { buildProductFaqPrompt } from '../../apps/api/src/lib/ai/product-faq-generator';\n\ndescribe('buildProductFaqPrompt', () => {\n  it('renders variant options as usable facts and the size-accuracy rule', () => {\n    const prompt = buildProductFaqPrompt({\n      storeId: 's1',\n      storeName: 'Pecannbee',\n      product: {\n        name: 'PB Dragee Pecan Caramel',\n        nameAr: 'بي بي دراجيه بيكان كراميل',\n        description: 'Roasted pecans in a peanut-butter caramel shell.',\n        options: [\n          {\n            name: 'Size',\n            nameAr: 'الحجم',\n            values: [\n              { value: '700 Gram', valueAr: '٧٠٠ جرام' },\n              { value: '400 Gram', valueAr: '٤٠٠ جرام' },\n            ],\n          },\n        ],\n      },\n      count: 3,\n    });\n\n    // The real options reach the model as facts (the facts-block header,\n    // distinct from the accuracy-rule mention of the same phrase).\n    expect(prompt).toContain('Available options / variants (these ARE facts you may use):');\n    expect(prompt).toContain('700 Gram');\n    expect(prompt).toContain('400 Gram');\n    // The guard that prevents the \"200g\" hallucination.\n    expect(prompt).toMatch(\n      /NEVER state a single size\\/weight that is not one of the listed options/\n    );\n    // The SKU must NEVER be fed to the prompt — no internal codes as \"facts\".\n    expect(prompt).not.toContain('SKU:');\n  });\n\n  it('asks for UP TO the count (quality over quantity) and forbids meta/SKU filler', () => {\n    const prompt = buildProductFaqPrompt({\n      storeId: 's1',\n      storeName: 'Pecannbee',\n      product: { name: 'PB Dragee', description: 'Pecans.' },\n      count: 5,\n    });\n\n    // Never forces the model to hit an exact count → no filler padding.\n    expect(prompt).toContain('UP TO 5');\n    expect(prompt).not.toContain('exactly 5');\n    expect(prompt).toMatch(/if fewer than 5 genuinely useful questions exist.*return FEWER/i);\n    // No meta/identify/SKU questions.\n    expect(prompt).toMatch(/NEVER ask meta or operational questions/i);\n    expect(prompt).toMatch(/NEVER mention an SKU, product code, internal ID/i);\n  });\n\n  it('omits the facts block entirely for a simple product with no options', () => {\n    const prompt = buildProductFaqPrompt({\n      storeId: 's1',\n      storeName: 'Pecannbee',\n      product: {\n        name: 'Gift Card',\n        description: 'A digital gift card.',\n      },\n      count: 3,\n    });\n\n    // The facts-block header must be absent — only the always-present\n    // accuracy-rule mention of the phrase may remain.\n    expect(prompt).not.toContain('(these ARE facts you may use):');\n  });\n});\n"},"tests/unit/bulk-ai-excerpt-generator.test.ts":{"tests":[{"id":"272","name":"generateProductExcerpt returns trimmed bilingual excerpt on success"},{"id":"273","name":"generateProductExcerpt caps both excerpt fields at EXCERPT_MAX_LENGTH"},{"id":"274","name":"generateProductExcerpt throws when the response is missing the excerpt fields"},{"id":"275","name":"generateProductExcerpt throws on unparseable Gemini output"}],"source":"/**\n * product-excerpt-generator — Unit Tests\n *\n * Covers the bilingual excerpt generator: happy path returns trimmed +\n * capped EN/AR strings, and malformed/missing-field Gemini output throws.\n */\nimport { describe, it, expect, vi, beforeEach } from 'vitest';\n\nconst mockGenerateContent = vi.fn();\nvi.mock('@google/generative-ai', () => ({\n  GoogleGenerativeAI: class {\n    getGenerativeModel() {\n      return {\n        generateContent: (...args: unknown[]) => mockGenerateContent(...args),\n      };\n    }\n  },\n}));\n\nimport {\n  generateProductExcerpt,\n  EXCERPT_MAX_LENGTH,\n} from '../../apps/api/src/lib/ai/product-excerpt-generator';\n\nfunction respond(text: string) {\n  return { response: { text: () => text } };\n}\n\nbeforeEach(() => {\n  mockGenerateContent.mockReset();\n});\n\ndescribe('generateProductExcerpt', () => {\n  it('returns trimmed bilingual excerpt on success', async () => {\n    mockGenerateContent.mockResolvedValue(\n      respond(\n        JSON.stringify({\n          excerpt: '  A soft cotton tee for everyday wear.  ',\n          excerptAr: '  قميص قطني ناعم للارتداء اليومي.  ',\n        })\n      )\n    );\n\n    const result = await generateProductExcerpt(\n      {\n        storeName: 'Test Store',\n        product: {\n          name: 'Basic Tee',\n          description: 'A long description about a soft cotton t-shirt suitable for daily wear.',\n        },\n      },\n      'fake-key',\n      'gemini-flash-lite-latest'\n    );\n\n    expect(result.excerpt).toBe('A soft cotton tee for everyday wear.');\n    expect(result.excerptAr).toBe('قميص قطني ناعم للارتداء اليومي.');\n  });\n\n  it('caps both excerpt fields at EXCERPT_MAX_LENGTH', async () => {\n    const longEn = 'x'.repeat(EXCERPT_MAX_LENGTH + 100);\n    const longAr = 'ي'.repeat(EXCERPT_MAX_LENGTH + 100);\n    mockGenerateContent.mockResolvedValue(\n      respond(JSON.stringify({ excerpt: longEn, excerptAr: longAr }))\n    );\n\n    const result = await generateProductExcerpt(\n      { storeName: 'Test Store', product: { name: 'Product', description: 'desc' } },\n      'fake-key',\n      'gemini-flash-lite-latest'\n    );\n\n    expect(result.excerpt.length).toBe(EXCERPT_MAX_LENGTH);\n    expect(result.excerptAr.length).toBe(EXCERPT_MAX_LENGTH);\n  });\n\n  it('throws when the response is missing the excerpt fields', async () => {\n    mockGenerateContent.mockResolvedValue(respond(JSON.stringify({ foo: 'bar' })));\n\n    await expect(\n      generateProductExcerpt(\n        { storeName: 'Test Store', product: { name: 'Product', description: 'desc' } },\n        'fake-key',\n        'gemini-flash-lite-latest'\n      )\n    ).rejects.toThrow('AI returned unexpected format');\n  });\n\n  it('throws on unparseable Gemini output', async () => {\n    mockGenerateContent.mockResolvedValue(respond('not valid json'));\n\n    await expect(\n      generateProductExcerpt(\n        { storeName: 'Test Store', product: { name: 'Product', description: 'desc' } },\n        'fake-key',\n        'gemini-flash-lite-latest'\n      )\n    ).rejects.toThrow();\n  });\n});\n"},"tests/unit/deadstock-clearance-tenant-scoping.test.ts":{"tests":[{"id":"276","name":"createClearanceCouponFromFlag — cross-tenant scoping throws 404 when the flag belongs to another store"},{"id":"277","name":"createClearanceCouponFromFlag — cross-tenant scoping creates the clearance coupon for a flag owned by the authenticated store (control)"}],"source":"/**\n * createClearanceCouponFromFlag — cross-tenant IDOR regression guard.\n *\n * apps/api/src/services/accounting/deadstock-scan.service.ts used to look\n * up the DeadStockFlag with an unscoped `findUnique({ where: { id } })`\n * then create a Coupon using the flag's OWN storeId — so a store_admin\n * authenticated for store A could pass a dead-stock flag id belonging to\n * store B and mint a live discount coupon on store B's storefront. Fix:\n * the authenticated storeId is now a required parameter and the lookup is\n * `findFirst({ id, storeId })`.\n */\nimport { describe, it, expect, vi, beforeEach } from 'vitest';\n\nconst mockFlagFindFirst = vi.fn();\nconst mockFlagUpdate = vi.fn();\nconst mockCouponCreate = vi.fn();\n\nvi.mock('@force/database', () => ({\n  prisma: {\n    deadStockFlag: {\n      findFirst: (...args: unknown[]) => mockFlagFindFirst(...args),\n      update: (...args: unknown[]) => mockFlagUpdate(...args),\n    },\n    coupon: {\n      create: (...args: unknown[]) => mockCouponCreate(...args),\n    },\n  },\n  withRlsBypass: vi.fn(),\n  Prisma: {},\n}));\nvi.mock('../../apps/api/src/lib/logger', () => ({\n  default: { warn: vi.fn(), debug: vi.fn(), error: vi.fn(), info: vi.fn() },\n}));\nvi.mock('../../apps/api/src/services/accounting/gemini-ai.service', () => ({\n  callGemini: vi.fn(),\n}));\n\nimport { createClearanceCouponFromFlag } from '../../apps/api/src/services/accounting/deadstock-scan.service';\n\nconst STORE_A = 'store-a';\n\ndescribe('createClearanceCouponFromFlag — cross-tenant scoping', () => {\n  beforeEach(() => vi.clearAllMocks());\n\n  it('throws 404 when the flag belongs to another store', async () => {\n    mockFlagFindFirst.mockResolvedValue(null);\n\n    await expect(\n      createClearanceCouponFromFlag('flag-owned-by-store-b', STORE_A)\n    ).rejects.toMatchObject({ statusCode: 404, code: 'FLAG_NOT_FOUND' });\n\n    expect(mockFlagFindFirst).toHaveBeenCalledWith({\n      where: { id: 'flag-owned-by-store-b', storeId: STORE_A },\n      include: { product: { select: { sku: true, id: true } } },\n    });\n    expect(mockCouponCreate).not.toHaveBeenCalled();\n  });\n\n  it('creates the clearance coupon for a flag owned by the authenticated store (control)', async () => {\n    mockFlagFindFirst.mockResolvedValue({\n      id: 'flag-1',\n      storeId: STORE_A,\n      status: 'open',\n      productId: 'product-1',\n      suggestedDiscountBps: 2000,\n      product: { sku: 'SKU-123', id: 'product-1' },\n    });\n    mockCouponCreate.mockResolvedValue({});\n    mockFlagUpdate.mockResolvedValue({});\n\n    const result = await createClearanceCouponFromFlag('flag-1', STORE_A);\n\n    expect(result.couponCode).toBe('CLEAR-SKU123');\n    expect(mockCouponCreate).toHaveBeenCalledWith(\n      expect.objectContaining({ data: expect.objectContaining({ storeId: STORE_A }) })\n    );\n    expect(mockFlagUpdate).toHaveBeenCalledWith({\n      where: { id: 'flag-1' },\n      data: { status: 'accepted_clearance', couponCode: 'CLEAR-SKU123' },\n    });\n  });\n});\n"},"tests/unit/ai-cost-gate.test.ts":{"tests":[{"id":"278","name":"ai cost gate every covered feature has a baseline entry (baseline is in sync with the registry)"},{"id":"279","name":"ai cost gate current prompt costs are within budget delta + total (fails on an un-baselined prompt bloat)"},{"id":"280","name":"ai cost gate the gate actually bites — a doubled prompt trips the delta rule"}],"source":"/**\n * AI cost gate — enforced in the normal unit run (npm run test:unit), so it\n * runs in the existing CI unit job with no new workflow and no live API call.\n *\n * It re-derives each covered feature's prompt from the REAL builder and compares\n * the estimated $/day against the committed baseline. A prompt change that grows\n * the context beyond the budget delta fails HERE — before deploy — which is the\n * whole point (\"a prompt change that doubles the context window should not sneak\n * into production\"). If an increase is intentional: `npx tsx scripts/ai-cost-baseline.ts`\n * and commit the cost-baseline.json diff in the same PR.\n */\nimport { describe, it, expect } from 'vitest';\nimport { AI_COST_FEATURES } from '../../apps/api/src/lib/ai/cost/features';\nimport {\n  evaluateCostGate,\n  estimateFeatureCost,\n  type FeatureCostInput,\n} from '../../apps/api/src/lib/ai/cost/cost';\nimport baseline from '../../apps/api/src/lib/ai/cost/cost-baseline.json';\nimport budget from '../../apps/api/src/lib/ai/cost/cost-budget.json';\n\ndescribe('ai cost gate', () => {\n  it('every covered feature has a baseline entry (baseline is in sync with the registry)', () => {\n    for (const f of AI_COST_FEATURES) {\n      expect(\n        (baseline as Record<"+"string, number>)[f.feature],\n        `${f.feature} has no cost-baseline.json entry — run: npx tsx scripts/ai-cost-baseline.ts`\n      ).toBeGreaterThan(0);\n    }\n  });\n\n  it('current prompt costs are within budget delta + total (fails on an un-baselined prompt bloat)', () => {\n    const result = evaluateCostGate(AI_COST_FEATURES, baseline as Record<"+"string, number>, budget);\n    expect(\n      result.violations,\n      `cost gate violations:\\n${result.violations.map(v => '  - ' + v.message).join('\\n')}`\n    ).toEqual([]);\n    expect(result.ok).toBe(true);\n  });\n\n  it('the gate actually bites — a doubled prompt trips the delta rule', () => {\n    // Sanity check the gate is not a no-op: synthetically double one feature's prompt.\n    const first = AI_COST_FEATURES[0];\n    const bloated: FeatureCostInput = { ...first, prompt: first.prompt + first.prompt };\n    const before = estimateFeatureCost(first).usdPerDay;\n    const after = estimateFeatureCost(bloated).usdPerDay;\n    expect(after).toBeGreaterThan(before); // more input tokens -> higher cost\n    const result = evaluateCostGate([bloated], baseline as Record<"+"string, number>, budget);\n    expect(result.ok).toBe(false);\n    expect(result.violations.some(v => v.feature === first.feature)).toBe(true);\n  });\n});\n"}},"projectRoot":"/Users/ahmadsharaf/Desktop/projects/_worktrees/force-website-builder__fix-audit-record-and-gates","config":{"$schema":"./node_modules/@stryker-mutator/core/schema/stryker-schema.json","packageManager":"npm","testRunner":"vitest","vitest":{"configFile":"vitest.stryker.config.ts","related":true},"reporters":["html","clear-text","progress"],"mutate":["apps/api/src/services/auth.service.ts","apps/api/src/services/payment.service.ts","apps/api/src/services/recommendation.service.ts","apps/api/src/lib/ai-quota.ts"],"thresholds":{"high":80,"low":60,"break":null},"tempDirName":"stryker-tmp","concurrency":2,"timeoutMS":60000,"disableTypeChecks":true,"ignoreStatic":true,"ignorePatterns":[".claude/**","graphify-out/**","stryker-tmp/**","skills/**",".agents/**"],"configFile":"stryker.conf.json","allowConsoleColors":true,"checkers":[],"checkerNodeArgs":[],"commandRunner":{"command":"npm test"},"coverageAnalysis":"perTest","clearTextReporter":{"allowColor":true,"allowEmojis":false,"logTests":true,"maxTestsToLog":3,"reportTests":true,"reportMutants":true,"reportScoreTable":true,"skipFull":false},"dashboard":{"baseUrl":"https://dashboard.stryker-mutator.io/api/reports","reportType":"full"},"dryRunOnly":false,"eventReporter":{"baseDir":"reports/mutation/events"},"incremental":false,"incrementalFile":"reports/stryker-incremental.json","force":false,"fileLogLevel":"off","inPlace":false,"
