ping AI_QUOTA_EXCEEDED in would make callWithRetry stop retrying recoverable\n// per-minute throttles.\nconst AI_QUOTA_STOP_CODES = new Set([\n  AI_QUOTA_DAILY_CODE,\n  AI_QUOTA_MONTHLY_CODE,\n  'AI_QUOTA_EXCEEDED',\n  'AI_BUDGET_EXCEEDED',\n]);\n\nexport function isAiQuotaCapError(err: unknown): boolean {\n  const code = errCode(err);\n  return code !== null && AI_QUOTA_STOP_CODES.has(code);\n}\n\n// Global cap on Gemini calls per day / per month, shared across all\n// stores on this account. Protects the free-tier quota from a single\n// bulk sweep blowing through it for the rest of the day. Only counts\n// non-cached calls — cache hits never touch Gemini.\n//\n// Gemini's real free-tier ceiling is ~500 requests/day per project/model.\n// The default daily cap is kept safely UNDER that (450) so our own\n// friendly AppError trips before Google's raw 429 does — a single named\n// constant so it's trivially raised (or disabled) once billing is\n// enabled or a local-AI-primary/Gemini-fallback setup lands. Override\n// via AI_DAILY_REQUEST_CAP / AI_MONTHLY_REQUEST_CAP env vars.\nconst DEFAULT_DAILY_REQUEST_CAP = 450;\nconst DEFAULT_MONTHLY_REQUEST_CAP = 20000;\n\nexport async function assertAiQuota(): Promise<"+"void> {\n  const startOfDay = new Date();\n  startOfDay.setUTCHours(0, 0, 0, 0);\n  const startOfMonth = new Date();\n  startOfMonth.setUTCDate(1);\n  startOfMonth.setUTCHours(0, 0, 0, 0);\n\n  const [today, thisMonth] = await Promise.all([\n    prisma.aiUsage.count({\n      where: { createdAt: { gte: startOfDay }, cachedHit: false },\n    }),\n    prisma.aiUsage.count({\n      where: { createdAt: { gte: startOfMonth }, cachedHit: false },\n    }),\n  ]);\n\n  const dailyCap = parseInt(\n    process.env.AI_DAILY_REQUEST_CAP ?? String(DEFAULT_DAILY_REQUEST_CAP),\n    10\n  );\n  const monthlyCap = parseInt(\n    process.env.AI_MONTHLY_REQUEST_CAP ?? String(DEFAULT_MONTHLY_REQUEST_CAP),\n    10\n  );\n\n  if (today >= dailyCap) {\n    throw new AppError(\n      429,\n      AI_QUOTA_DAILY_CODE,\n      `Daily AI request cap reached (${today}/${dailyCap}). Resets at 00:00 UTC.`\n    );\n  }\n  if (thisMonth >= monthlyCap) {\n    throw new AppError(\n      429,\n      AI_QUOTA_MONTHLY_CODE,\n      `Monthly AI request cap reached (${thisMonth}/${monthlyCap}). Resets next month.`\n    );\n  }\n}\n"},"apps/api/src/services/auth.service.ts":{"language":"typescript","mutants":[{"id":"58","mutatorName":"BlockStatement","replacement":"{}","status":"NoCoverage","static":false,"coveredBy":[],"location":{"end":{"column":2,"line":37},"start":{"column":59,"line":35}}},{"id":"59","mutatorName":"ConditionalExpression","replacement":"true","status":"NoCoverage","static":false,"coveredBy":[],"location":{"end":{"column":26,"line":36},"start":{"column":10,"line":36}}},{"id":"60","mutatorName":"ConditionalExpression","replacement":"false","status":"NoCoverage","static":false,"coveredBy":[],"location":{"end":{"column":26,"line":36},"start":{"column":10,"line":36}}},{"id":"61","mutatorName":"EqualityOperator","replacement":"storeId !== null","status":"NoCoverage","static":false,"coveredBy":[],"location":{"end":{"column":26,"line":36},"start":{"column":10,"line":36}}},{"id":"62","mutatorName":"ObjectLiteral","replacement":"{}","status":"NoCoverage","static":false,"coveredBy":[],"location":{"end":{"column":61,"line":36},"start":{"column":29,"line":36}}},{"id":"63","mutatorName":"ObjectLiteral","replacement":"{}","status":"NoCoverage","static":false,"coveredBy":[],"location":{"end":{"column":82,"line":36},"start":{"column":64,"line":36}}},{"id":"65","mutatorName":"BlockStatement","replacement":"{}","status":"NoCoverage","static":false,"coveredBy":[],"location":{"end":{"column":4,"line":191},"start":{"column":6,"line":72}}},{"id":"66","mutatorName":"LogicalOperator","replacement":"data.storeId && null","status":"NoCoverage","static":false,"coveredBy":[],"location":{"end":{"column":41,"line":73},"start":{"column":21,"line":73}}},{"id":"67","mutatorNam redBy":["148","149","150","151"],"location":{"end":{"column":90,"line":1015},"start":{"column":14,"line":1014}}},{"id":"649","mutatorName":"ObjectLiteral","replacement":"{}","status":"Survived","static":false,"testsCompleted":1,"coveredBy":["150"],"location":{"end":{"column":36,"line":1015},"start":{"column":21,"line":1015}}},{"id":"650","mutatorName":"StringLiteral","replacement":"\"\"","status":"Survived","static":false,"testsCompleted":1,"coveredBy":["150"],"location":{"end":{"column":89,"line":1015},"start":{"column":38,"line":1015}}}],"source":"import bcrypt from 'bcryptjs';\nimport jwt from 'jsonwebtoken';\nimport crypto from 'crypto';\nimport { prisma, Prisma, withMoneyTx } from '@force/database';\nimport { config } from '../config';\nimport { AppError } from '../middleware/error-handler';\nimport { EmailService } from './email.service';\nimport { accountLockout } from './account-lockout.service';\nimport logger from '../lib/logger';\nimport { redis } from './redis.service';\nimport { deleteR2ObjectIfOrphan } from './r2-cleanup.service';\nimport { inngest } from '../lib/inngest/client';\n\ninterface TokenPayload {\n  userId: string;\n  email: string;\n  role: string;\n  /** Tenant scope for customer accounts; NULL for platform admins. */\n  storeId: string | null;\n  /** Token version for bulk revocation. Bumped on logout-all / password change. */\n  tv?: number;\n}\n\ninterface AuthTokens {\n  accessToken: string;\n  refreshToken: string;\n}\n\n/**\n * Resolve the auth scope for a user lookup. Customers register/login under a\n * specific store and the schema's `@@unique([storeId, email])` constraint\n * keeps them isolated; admins (storeId NULL) live in a global namespace\n * enforced by the partial unique index `users_admin_email_key`.\n */\nfunction authScope(email: string, storeId: string | null) {\n  return storeId === null ? { email, storeId: null as null } : { email, storeId };\n}\n\nexport class AuthService {\n  private static readonly SALT_ROUNDS = 12;\n\n  /**\n   * Pre-computed bcrypt hash of a value no caller can ever provide\n   * (32 random bytes generated once at boot). Used to equalize the\n   * login response time when the user record doesn't exist — without\n   * this dummy compare, \"no user\" returns ~50ms faster than \"user\n   * exists, password wrong\" and an attacker can enumerate registered\n   * emails by timing the response. The hash itself is irrelevant\n   * (compare always fails); we only care that the caller waits the\n   * same wall-clock time as the happy path.\n   */\n  private static readonly DUMMY_PASSWORD_HASH: string = bcrypt.hashSync(\n    crypto.randomBytes(32).toString('hex'),\n    12\n  );\n\n  static async register(data: {\n    email: string;\n    password: string;\n    name?: string;\n    firstName?: string;\n    lastName?: string;\n    /**\n     * Storefront passes the current tenant's storeId. Admin app passes\n     * `null`. Mixing the two scopes deliberately so a registration from\n     * Store A doesn't conflict with an existing global admin email.\n     */\n    storeId?: string | null;\n    /** Buyer's UI locale at registration time — used to send the\n     *  verification email in the customer's language. */\n    language?: 'en' | 'ar';\n  }) {\n    const storeId = data.storeId ?? null;\n\n    // Check if user exists in the target scope. Customers in different\n    // stores can share an email — the lookup must use the composite key.\n    const existingUser = await prisma.user.findFirst({\n      where: authScope(data.email, storeId),\n      select: {\n        id: true,\n        email: true,\n        firstName: true,\n        lastName: true,\n        storeId: true,\n        language: true,\n      },\n    });\n\n    // Parse name into first/last if provided\n    let firstName = data.firstName;\n    let lastName = data.lastName;\n    if (data.name && !firstName) {\n      const nameParts = data.name.trim().split(' ');\n      firstName = nameParts[0];\n      lastName = nameParts.slice(1).join(' ') || '';\n    }\n\n    // Always hash, even for the existing-user branch. Bcrypt is the\n    // expensive part of register; skipping it makes the existing-user\n    // path measurably faster and lets an attacker enumerate registered\n    // emails by stopwatch.\n    const passwordHash = await bcrypt.hash(data.password, this.SALT_ROUNDS);\n\n    // T1-4 enumeration close. Both branches return the IDENTICAL\n    // response shape `{ emailVerificationSent: true }` with NO tokens.\n    //   - new email: create user, send verification email (links to a\n    //     verify endpoint that grants tokens after email is verified)\n    //   - existing email: send a \"registration attempt\" notice to the\n    //     rightful owner (no clickable tokens in the email — if it\n    //     wasn't them, worst case is they reset their password)\n    // The only side-channel left is the wall-clock cost of\n    // `prisma.user.create` vs `EmailService.send` — both involve\n    // network IO so the variance is dominated by SMTP latency, not\n    // the existence check.\n    if (existingUser) {\n      const storeName = existingUser.storeId\n        ? (\n            await prisma.store\n              .findUnique({\n                where: { id: existingUser.storeId },\n                select: { name: true },\n              })\n              .catch(() => null)\n          )?.name\n        : undefined;\n      const recipientName =\n        `${existingUser.firstName ?? ''} ${existingUser.lastName ?? ''}`.trim() ||\n        existingUser.email;\n      const notifyStoreId = storeId ?? existingUser.storeId;\n      if (notifyStoreId) {\n        void EmailService.sendDuplicateRegistrationNotice(\n          notifyStoreId,\n          {\n            email: existingUser.email,\n            name: recipientName,\n            storeName: storeName ?? undefined,\n          },\n          (existingUser.language as 'en' | 'ar' | undefined) ?? undefined\n        ).catch(err =>\n          logger.error(\n            { err, email: existingUser.email },\n            'Failed to send duplicate-registration notice'\n          )\n        );\n      } else {\n        logger.info(\n          { email: existingUser.email },\n          'Skipping duplicate-registration notice — admin account'\n        );\n      }\n      return { emailVerificationSent: true } as const;\n    }\n\n    // Create user\n    const user = await prisma.user.create({\n      data: {\n        email: data.email,\n        storeId,\n        passwordHash,\n        firstName: firstName || '',\n        lastName: lastName || '',\n        role: 'customer',\n        emailVerified: false,\n      },\n      select: {\n        id: true,\n        email: true,\n        storeId: true,\n        firstName: true,\n        lastName: true,\n        role: true,\n        emailVerified: true,\n        createdAt: true,\n      },\n    });\n\n    // Verification email goes out fire-and-forget so a slow / unreachable\n    // SMTP host can't stall the registration response. If delivery fails\n    // the customer can request a resend via /auth/resend-verification.\n    void this.sendVerificationEmail(\n      user.id,\n      user.email,\n      `${user.firstName} ${user.lastName}`.trim() || user.email,\n      storeId,\n      data.language\n    ).catch(err =>\n      logger.error({ err, userId: user.id }, 'Failed to send verification email after register')\n    );\n\n    return { emailVerificationSent: true } as const;\n  }\n\n  /**\n   * Create and send email verification token\n   */\n  static async sendVerificationEmail(\n    userId: string,\n    email: string,\n    name: string,\n    storeId: string | null = null,\n    language?: 'en' | 'ar'\n  ): Promise<"+"void> {\n    // Delete any existing verification tokens for this user\n    await prisma.verificationToken.deleteMany({\n      where: {\n        userId,\n        type: 'email',\n      },\n    });\n\n    // Generate verification token\n    const token = crypto.randomBytes(32).toString('hex');\n    const tokenHash = crypto.createHash('sha256').update(token).digest('hex');\n    const expiresAt = new Date(Date.now() + 24 * 60 * 60 * 1000); // 24 hours\n\n    // Store verification token\n    await prisma.verificationToken.create({\n      data: {\n        token: tokenHash,\n        userId,\n        type: 'email',\n        expiresAt,\n      },\n    });\n\n    // Send verification email\n    const verificationUrl = `${config.webUrl}/auth/verify-email?token=${token}`;\n    if (storeId) {\n      await EmailService.sendEmailVerification(\n        storeId,\n        {\n          email,\n          name,\n          verificationUrl,\n          expiresIn: '24 hours',\n        },\n        language\n      );\n    } else {\n      // Admin accounts (no storeId) skip the branded email path — they\n      // don't belong to a store and verification flow is admin-only.\n      logger.info(\n        { userId, email },\n        'Skipping branded verification email — no storeId (admin account)'\n      );\n    }\n  }\n\n  /**\n   * Verify email with token\n   */\n  static async verifyEmail(token: string): Promise<"+"{ success: boolean; message: string }> {\n    // Hash the provided token\n    const tokenHash = crypto.createHash('sha256').update(token).digest('hex');\n\n    // Find the verification token\n    const verificationToken = await prisma.verificationToken.findFirst({\n      where: {\n        token: tokenHash,\n        type: 'email',\n        usedAt: null,\n      },\n      include: {\n        user: {\n          select: {\n            id: true,\n            email: true,\n            firstName: true,\n            lastName: true,\n            emailVerified: true,\n            storeId: true,\n            language: true,\n            deletedAt: true,\n          },\n        },\n      },\n    });\n\n    if (!verificationToken) {\n      throw new AppError(400, 'TOKEN_INVALID', 'Invalid verification token');\n    }\n\n    if (verificationToken.expiresAt <"+" new Dat in(lockoutKey, ip);\n\n    // If MFA is enabled and a TOTP secret is configured, return a short-lived\n    // challenge token instead of a full session. The client must verify the\n    // TOTP code via /auth/mfa/verify to exchange it for a real session.\n    // Guard: mfaEnabled without mfaSecret is an inconsistent state (should\n    // not occur in production — /enroll/verify always sets both atomically).\n    // Treat it as \"not yet fully enrolled\" so login still issues a session;\n    // the requireMfaEnrolled middleware will use the mfaEnabled flag to gate\n    // access until a real TOTP secret is confirmed.\n    if (user.mfaEnabled && user.mfaSecret) {\n      // Stamp a jti on the challenge token so /auth/mfa/verify can maintain\n      // a per-challenge attempt counter in Redis (H2 brute-force guard).\n      const challengeToken = jwt.sign({ userId: user.id, purpose: 'mfa' }, config.jwtSecret, {\n        algorithm: 'HS256',\n        expiresIn: '5m',\n        issuer: 'force-api',\n        // Distinct audience so this token is NEVER accepted by the authenticate\n        // middleware (which requires audience:'force-app'). Belt-and-suspenders\n        // against token-confusion attacks where the challenge is used as a\n        // real access token before the second factor is verified.\n        audience: 'force-mfa-challenge',\n        // Unique id — lets /auth/mfa/verify key a per-challenge Redis counter\n        // so failed attempts are isolated per login attempt, not per IP.\n        jwtid: crypto.randomUUID(),\n      });\n      // eslint-disable-next-line @typescript-eslint/no-explicit-any\n      return { mfaRequired: true, challengeToken } as any;\n    }\n\n    return this.issueSessionFor(user);\n  }\n\n  /**\n   * Issue a full session (access + refresh tokens) for an already-authenticated\n   * user. Extracted from `login()` so MFA-verify can reuse the same token-issue\n   * and response-shape logic without duplicating the cookie/payload construction.\n   *\n   * Returns the same shape as a normal login response: `{ user, accessToken, refreshToken }`.\n   */\n  static async issueSessionFor(user: {\n    id: string;\n    email: string;\n    storeId: string | null;\n    firstName: string;\n    lastName: string;\n    role: string;\n    emailVerified: boolean;\n    tokenVersion: number;\n  }): Promise<"+"{\n    user: {\n      id: string;\n      email: string;\n      storeId: string | null;\n      firstName: string;\n      lastName: string;\n      role: string;\n      emailVerified: boolean;\n    };\n    accessToken: string;\n    refreshToken: string;\n  }> {\n    const tokens = await this.generateTokens({\n      userId: user.id,\n      email: user.email,\n      role: user.role,\n      storeId: user.storeId,\n      tv: user.tokenVersion,\n    });\n\n    return {\n      user: {\n        id: user.id,\n        email: user.email,\n        storeId: user.storeId,\n        firstName: user.firstName,\n        lastName: user.lastName,\n        role: user.role,\n        emailVerified: user.emailVerified,\n      },\n      ...tokens,\n    };\n  }\n\n  static async refreshTokens(refreshToken: string): Promise<"+"AuthTokens> {\n    // Hash the token to look it up\n    const tokenHash = crypto.createHash('sha256').update(refreshToken).digest('hex');\n\n    const storedToken = await prisma.refreshToken.findUnique({\n      where: { token: tokenHash },\n      include: { user: true },\n    });\n\n    if (!storedToken) {\n      throw new AppError(401, 'TOKEN_INVALID', 'Invalid refresh token');\n    }\n\n    // Reuse detection (OWASP refresh-token rotation guidance): once a\n    // refresh token has been rotated or revoked, any subsequent\n    // presentation is treated as evidence the family is compromised.\n    // Revoke every token for that user — the legitimate session(s) get\n    // a 401 on their next refresh and re-login, which is preferable to\n    // letting an attacker keep refreshing in parallel.\n    if (storedToken.revokedAt) {\ oredToken.user.tokenVersion,\n    });\n\n    const newHash = crypto.createHash('sha256').update(newTokens.refreshToken).digest('hex');\n    const newRow = await prisma.refreshToken.findUnique({\n      where: { token: newHash },\n      select: { id: true },\n    });\n\n    await prisma.refreshToken.update({\n      where: { id: storedToken.id },\n      data: {\n        revokedAt: new Date(),\n        revokedReason: 'rotated',\n        replacedById: newRow?.id ?? null,\n      },\n    });\n\n    return newTokens;\n  }\n\n  /**\n   * Periodic cleanup of refresh-token rows we no longer need. Two\n   * categories are removed:\n   *\n   *   - Expired rows (`expiresAt <"+" now`). The JWT itself is already\n   *     dead; keeping the row only matters for reuse detection, and\n   *     a 1-year-old expired token offers nothing actionable.\n   *   - Revoked rows older than 30 days (`revokedAt <"+" now - 30d`).\n   *     Reuse detection only needs to fire while an attacker could\n   *     plausibly still be holding a stolen token; a 30-day window\n   *     is the same TTL most production OWASP-style implementations\n   *     use, and bounds the table size in steady state.\n   *\n   * Returns the number of rows deleted (sum of both branches).\n   */\n  static async cleanupRefreshTokens(): Promise<"+"number> {\n    const now = new Date();\n    const thirtyDaysAgo = new Date(now.getTime() - 30 * 24 * 60 * 60 * 1000);\n\n    const expired = await prisma.refreshToken.deleteMany({\n      where: { expiresAt: { lt: now } },\n    });\n    const revoked = await prisma.refreshToken.deleteMany({\n      where: { revokedAt: { lt: thirtyDaysAgo } },\n    });\n\n    const total = expired.count + revoked.count;\n    if (total > 0) {\n      logger.info(\n        { expired: expired.count, revoked: revoked.count },\n        'Refresh-token cleanup removed stale rows'\n      );\n    }\n    return total;\n  }\n\n  static async logout(refreshToken: string): Promise<"+"void> {\n    const tokenHash = cry he next authenticate call will re-populate the cache from DB.\n   */\n  static async revokeAllSessions(userId: string): Promise<"+"void> {\n    // Atomically increment tokenVersion and read the new value.\n    const updated = await prisma.user.update({\n      where: { id: userId },\n      data: { tokenVersion: { increment: 1 } },\n      select: { tokenVersion: true },\n    });\n\n    // Warm the Redis cache with the new version so the middleware sees it\n    // immediately without a DB round-trip on the next request.\n    await redis.setUserTokenVersion(userId, updated.tokenVersion);\n\n    // Revoke all live refresh tokens — prevents session resumption via\n    // token rotation even before the access token's tv is checked.\n    await prisma.refreshToken.updateMany({\n      where: { userId, revokedAt: null },\n      data: { revokedAt: new Date(), revokedReason: 'revoke_all' },\n    });\n  }\n\n  static async requestPasswordReset(email: string, storeId: string | null = null): Promise<"+"void> {\n    // Tenant-scoped lookup so a Store A reset request doesn't leak the\n    // existence of an account on Store B with the same email.\n    const user = await prisma.user.findFirst({\n      where: authScope(email, storeId),\n      select: {\n        id: true,\n        email: true,\n        firstName: true,\n        lastName: true,\n        storeId: true,\n        language: true,\n      },\n    });\n\n    if (!user) {\n      // Silently return to prevent email enumeration\n      return;\n    }\n\n    // Generate reset token\n    const resetToken = crypto.randomBytes(32).toString('hex');\n    const resetTokenHash = crypto.createHash('sha256').update(resetToken).digest('hex');\n    const resetExpires = new Date(Date.now() + 60 * 60 * 1000); // 1 hour\n\n    // Store reset token as a special refresh token\n    await prisma.refreshToken.create({\n      data: {\n        token: `reset:${resetTokenHash}`,\n        userId: user.id,\n        expiresAt: resetExpires,\n      },\n    }) "],"location":{"end":{"column":26,"line":259},"start":{"column":9,"line":259}}},{"id":"913","mutatorName":"ArrayDeclaration","replacement":"[\"Stryker was here\"]","statusReason":"expected [ 'Stryker was here' ] to deeply equal []","status":"Killed","static":false,"testsCompleted":1,"killedBy":["93"],"coveredBy":["93"],"location":{"end":{"column":37,"line":259},"start":{"column":35,"line":259}}},{"id":"914","mutatorName":"ObjectLiteral","replacement":"{}","statusReason":"Cannot read properties of undefined (reading 'id')","status":"Killed","static":false,"testsCompleted":1,"killedBy":["92"],"coveredBy":["92"],"location":{"end":{"column":6,"line":269},"start":{"column":52,"line":261}}},{"id":"915","mutatorName":"ObjectLiteral","replacement":"{}","statusReason":"Cannot read properties of undefined (reading 'in')","status":"Killed","static":false,"testsCompleted":1,"killedBy":["92"],"coveredBy":["92"],"location":{"end":{"column":8,"line":267},"start":{"column":14,"line":262}}},{"id":"916","mutatorName":"ObjectLiteral","replacement":"{}","statusReason":"the given combination of arguments (undefined and string) is invalid for this assertion. You can use an array, a map, an object, a set, a string, or a weakset instead of a string","status":"Killed","static":false,"testsCompleted":1,"killedBy":["92"],"coveredBy":["92"],"location":{"end":{"column":30,"line":263},"start":{"column":13,"line":263}}},{"id":"917","mutatorName":"StringLiteral","replacement":"\"\"","status":"Survived","static":false,"testsCompleted":1,"coveredBy":["92"],"location":{"end":{"column":25,"line":265},"start":{"column":17,"line":265}}},{"id":"918","mutatorName":"MethodExpression","replacement":"sortedIds.map(id => products.find((p: any) => p.id === id))","status":"Survived","static":false,"testsCompleted":1,"coveredBy":["92"],"location":{"end":{"column":87,"line":272},"start":{"column":12,"line":272}}},{"id":"919","mutatorName":"ArrowFunction","replacement":"() => undefined","status":"Survived","static":false,"testsCompleted":1,"coveredBy":["92"],"location":{"end":{"column":70,"line":272},"start":{"column":26,"line":272}}},{"id":"920","mutatorName":"ArrowFunction","replacement":"() => undefined","status":"Survived","static":false,"testsCompleted":1,"coveredBy":["92"],"location":{"end":{"column":69,"line":272},"start":{"column":46,"line":272}}},{"id":"921","mutatorName":"ConditionalExpression","replacement":"true","status":"Survived","static":false,"testsCompleted":1,"coveredBy":["92"],"location":{"end":{"column":69,"line":272},"start":{"column":58,"line":272}}},{"id":"922","mutatorName":"ConditionalExpression","replacement":"false","status":"Survived","static":false,"testsCompleted":1,"coveredBy":["92"],"location":{"end":{"column":69,"line":272},"start":{"column":58,"line":272}}},{"id":"923","mutatorName":"EqualityOperator","replacement":"p.id !== id","status":"Survived","static":false,"testsCompleted":1,"coveredBy":["92"],"location":{"end":{"column":69,"line":272},"start":{"column":58,"line":272}}}],"source":"import { prisma } from '@force/database';\nimport { redis } from './redis.service';\nimport { withLeaderLock } from '../lib/leader-election';\nimport logger from '../lib/logger';\n\n// ==========================================\n// Recommendation Service\n// Handles manual product relations (cross-sell, upsell)\n// and auto-calculated Frequently Bought Together (FBT)\n// ==========================================\n\nconst CACHE_TTL_SECONDS = 300; // 5 minutes\nconst FBT_WINDOW_DAYS = 90;\nconst FBT_MIN_THRESHOLD = 2;\nconst FBT_LOCK_TTL_SECONDS = 300;\n\n// Minimal product shape returned in recommendation lists\nconst productSelect = {\n  id: true,\n  name: true,\n  nameAr: true,\n  slug: true,\n  price: true,\n  compareAtPrice: true,\n  images: {\n    take: 2, // primary + hover-reveal second image on recommendation cards\n    orderBy: { position: 'asc' as const },\n    select: { url: true, alt: true },\n  },\n  // Include variants so the storefront can detect variant-parent products\n  // and gate the \"Add to cart\" / \"Add all to cart\" flows accordingly —\n  // without this, the FBT \"Add all\" button silently adds the parent SKU\n  // (no variant chosen) which either errors out or creates ambiguous\n  // cart lines. Same gap fixed earlier on listPublic in commit `8c55a73`.\n  variants: { select: { id: true, price: true } },\n};\n\n// FBT cron handle\nlet fbtCronTimer: ReturnType<"+"typeof setInterval> | null = null;\n\n// ==========================================\n// Recommendation Service Class\n// ==========================================\n\nclass RecommendationService {\n  // ----------------------------------------\n  // getProductRecommendations\n  // ----------------------------------------\n  async getProductRecommendations(storeId: string, productId: string) {\n    const cacheKey = `recommendations:product:${storeId}:${productId}`;\n\n    // 1. Check cache\n    const cached = await redis.get<"+"{\n      crossSell: unknown[];\n      upsell: unknown[];\n      alsoLike: unknown[];\n    }>(cacheKey, true);\n    if (cached) {\n      return cached;\n    }\n\n    // 2. Cross-sell: manual relations first, fall back to FBT\n    let crossSell: unknown[] = [];\n\n    const manualCrossSell = await prisma.productRelation.findMany({\n      where: { storeId, sourceProductId: productId, type: 'cross_sell' },\n      orderBy: { position: 'asc' },\n      take: 4,\n      select: {\n        id: true,\n        targetProduct: { select: productSelect },\n        position: true,\n      },\n    });\n\n    if (manualCrossSell.length > 0) {\n      crossSell = manualCrossSell.map(r => ({\n        relationId: r.id,\n        position: r.position,\n        ...r.targetProduct,\n      }));\n    } else {\n      // AI recommendations — second priority after manual cross-sells.\n      // When the bulk-ai-recommendations sweep has been run for this store\n      // these rows are populated and ordered by Gemini confidence score.\n      const aiRecRows = await prisma.aiRecommendation.findMany({\n        where: { storeId, sourceProductId: productId },\n        orderBy: { score: 'desc' },\n        take: 4,\n        select: {\n          targetProduct: { select: productSelect },\n          score: true,\n          reason: true,\n        },\n      });\n\n      if (aiRecRows.length > 0) {\n        crossSell = aiRecRows.map(r => ({\n          aiScore: r.score,\n          aiReason: r.reason,\n          ...r.targetProduct,\n        }));\n      } else {\n        // FBT fallback — used when no AI recs exist for this product yet.\n        const fbtRows = await prisma.frequentlyBoughtTogether.findMany({\n          where: {\n            storeId,\n            OR: [{ productId1: productId }, { productId2: productId }],\n          },\n          orderBy: { coOccurrenceCount: 'desc' },\n          take: 4,\n          select: {\n            productId1: true,\n            productId2: true,\n            coOccurrenceCount: true,\n            product1: { select: productSelect },\n            product2: { select: productSelect },\n          },\n        });\n\n        crossSell = fbtRows.map(row => {\n          const isSource = row.productId1 === productId;\n          return {\n            coOccurrenceCount: row.coOccurrenceCount,\n            ...(isSource ? row.product2 : row.product1),\n          };\n        });\n      }\n    }\n\n    // 3. Upsell: manual relations\n    const upsellRows = await prisma.productRelation.findMany({\n      where: { storeId, sourceProductId: productId, type: 'upsell' },\n      orderBy: { position: 'asc' },\n      take: 4,\n      select: {\n        id: true,\n        targetProduct: { select: productSelect },\n        position: true,\n      },\n    });\n    const upsell = upsellRows.map(r => ({\n      relationId: r.id,\n      position: r.position,\n      ...r.targetProduct,\n    }));\n\n    // 4. Also Like: products from same categories\n    const alreadyReturnedIds = new Set<"+"string>([\n      productId,\n      ...crossSell.map((p: any) => p.id),\n      ...upsell.map((p: any) => p.id),\n    ]);\n\n    const productCategories = await prisma.productCategory.findMany({\n      where: { productId },\n      select: { categoryId: true },\n    });\n    const categoryIds = productCategories.map(pc => pc.categoryId);\n\n    let alsoLike: unknown[] = [];\n    if (categoryIds.length > 0) {\n      const alsoLikeRows = await prisma.product.findMany({\n        where: {\n          storeId,\n          status: 'active',\n          deletedAt: null,\n          id: { notIn: Array.from(alreadyReturnedIds) },\n          categories: {\n            some: { categoryId: { in: categoryIds } },\n          },\n        },\n        take: 6,\n        select: productSelect,\n      });\n      alsoLike = alsoLikeRows;\n    }\n\n    const result = { crossSell, upsell, alsoLike };\n\n    // 5. Cache result\n    await redis.set(cacheKey, result, CACHE_TTL_SECONDS);\n\n    return result;\n  }\n\n  // ----------------------------------------\n  // getCartRecommendations (not cached)\n  // ----------------------------------------\n  async getCartRecommendations(storeId: string, productIds: string[]) {\n    if (!productIds.length) return [];\n\n    const scoreMap = new Map<"+"string, number>();\n    const productIdSet = new Set(productIds);\n\n    // Batch the manual cross-sell + FBT lookups instead of running\n    // two queries per cart item. Storefront cart pages with 4 items\n    // used to issue 8 queries to render the \"you might also like\"\n    // strip; now it's two queries regardless of cart size.\n    const [manualRows, fbtRows] = await Promise.all([\n      prisma.productRelation.findMany({\n        where: {\n          storeId,\n          sourceProductId: { in: productIds },\n          type: 'cross_sell',\n        },\n        orderBy: { position: 'asc' },\n        select: { sourceProductId: true, targetProductId: true },\n      }),\n      prisma.frequentlyBoughtTogether.findMany({\n        where: {\n          storeId,\n          OR: [{ productId1: { in: productIds } }, { productId2: { in: productIds } }],\n        },\n        orderBy: { coOccurrenceCount: 'desc' },\n        select: { productId1: true, productId2: true },\n      }),\n    ]);\n\n    const manualBySource = new Map<"+"string, string[]>();\n    for (const r of manualRows) {\n      const arr = manualBySource.get(r.sourceProductId);\n      if (arr) arr.push(r.targetProductId);\n      else manualBySource.set(r.sourceProductId, [r.targetProductId]);\n    }\n\n    for (const productId of productIds) {\n      // Manual cross-sell first; per-product cap of 8 mirrors the\n      // pre-batched query that used `take: 8`.\n      const manual = (manualBySource.get(productId) ?? []).slice(0, 8);\n      if (manual.length > 0) {\n        for (const targetId of manual) {\n          if (!productIdSet.has(targetId)) {\n            scoreMap.set(targetId, (scoreMap.get(targetId) ?? 0) + 1);\n          }\n        }\n      } else {\n        // FBT fallback for products without manual cross-sells\n        let added = 0;\n        for (const row of fbtRows) {\n          if (added >= 8) break;\n          const isLeftMatch = row.productId1 === productId;\n          const isRightMatch = row.productId2 === productId;\n          if (!isLeftMatch && !isRightMatch) continue;\n          const targetId = isLeftMatch ? row.productId2 : row.productId1;\n          if (productIdSet.has(targetId)) continue;\n          scoreMap.set(targetId, (scoreMap.get(targetId) ?? 0) + 1);\n          added++;\n        }\n      }\n    }\n\n    // Sort by reference count, take top 4\n    const sortedIds = Array.from(scoreMap.entries())\n      .sort((a, b) => b[1] - a[1])\n      .slice(0, 4)\n      .map(([id]) => id);\n\n    if (!sortedIds.length) return [];\n\n    const products = await prisma.product.findMany({\n      where: {\n        id: { in: sortedIds },\n        storeId,\n        status: 'active',\n        deletedAt: null,\n      },\n      select: productSelect,\n    });\n\n    // Preserve score order\n    return sortedIds.map(id => products.find((p: any) => p.id === id)).filter(Boolean);\n  }\n\n  // ----------------------------------------\n  // setProductRelations — bulk replace\n  // ----------------------------------------\n  async setProductRelations(\n    storeId: string,\n    productId: string,\n    relations: Array<"+"{ targetProductId: string; type: string; position?: number }>\n  ) {\n    await prisma.productRelation.deleteMany({\n      where: { storeId, sourceProductId: productId },\n    });\n\n    if (relations.length > 0) {\n      await prisma.productRelation.createMany({\n        data: relations.map((r, idx) => ({\n          storeId,\n          sourceProductId: productId,\n          targetProductId: r.targetProductId,\n          type: r.type,\n          position: r.position ?? idx,\n        })),\n        skipDuplicates: true,\n      });\n    }\n\n    await this.invalidateCache(storeId, productId);\n  }\n\n  // ----------------------------------------\n  // addRelation — single\n  // ----------------------------------------\n  async addRelation(\n    storeId: string,\n    productId: string,\n    relation: { targetProductId: string; type: string; position?: number }\n  ) {\n    // Count existing to set position\n    const count = await prisma.productRelation.count({\n      where: { storeId, sourceProductId: productId, type: relation.type },\n    });\n\n    const created = await prisma.productRelation.create({\n      data: {\n        storeId,\n        sourceProductId: productId,\n        targetProductId: relation.targetProductId,\n        type: relation.type,\n        position: relation.position ?? count,\n      },\n    });\n\n    await this.invalidateCache(storeId, productId);\n    return created;\n  }\n\n  // ----------------------------------------\n  // removeRelation — single\n  // ----------------------------------------\n  async removeRelation(storeId: string, productId: string, relationId: string) {\n    const relation = await prisma.productRelation.findFirst({\n      where: { id: relationId, storeId, sourceProductId: productId },\n    });\n\n    if (!relation) {\n      throw Object.assign(new Error('Relation not found'), { statusCode: 404 });\n    }\n\n    await prisma.productRelation.delete({ where: { id: relationId } });\n    await this.invalidateCache(storeId, productId);\n  }\n\n  // ----------------------------------------\n  // getRelations — all relations with target details\n  // ----------------------------------------\n  async getRelations(storeId: string, productId: string) {\n    return prisma.productRelation.findMany({\n      where: { storeId, sourceProductId: productId },\n      orderBy: [{ type: 'asc' }, { position: 'asc' }],\n      select: {\n        id: true,\n        type: true,\n        position: true,\n        createdAt: true,\n        targetProduct: { select: productSelect },\n      },\n    });\n  }\n\n  // ----------------------------------------\n  // recalculateFBT\n  // ----------------------------------------\n  async recalculateFBT(storeId: string) {\n    const lockName = `fbt:calculating:${storeId}`;\n    const acquired = await redis.acquireLock(lockName, FBT_LOCK_TTL_SECONDS);\n\n    if (!acquired) {\n      logger.info({ storeId }, '[FBT] Calculation already in progress, skipping');\n      return;\n    }\n\n    try {\n      logger.info({ storeId }, '[FBT] Starting recalculation');\n\n      const since = new Date(Date.now() - FBT_WINDOW_DAYS * 24 * 60 * 60 * 1000);\n\n      // Fetch completed orders with 2+ items in the window\n      const orders = await prisma.order.findMany({\n        where: {\n          storeId,\n          status: { in: ['delivered', 'shipped', 'processing', 'confirmed'] },\n          createdAt: { gte: since },\n          items: { some: {} },\n        },\n        select: {\n          id: true,\n          items: { select: { productId: true } },\n        },\n      });\n\n      // Count co-occurrences\n      const pairCounts = new Map<"+"string, number>();\n      for (const order of orders) {\n        const productIds = [...new Set(order.items.map((i: any) => i.productId))];\n        if (productIds.length <"+" 2) continue;\n\n        for (let i = 0; i <"+" productIds.length; i++) {\n          for (let j = i + 1; j <"+" productIds.length; j++) {\n            const a = productIds[i];\n            const b = productIds[j];\n            // Normalize: smaller ID first\n            const key = a <"+" b ? `${a}:${b}` : `${b}:${a}`;\n            pairCounts.set(key, (pairCounts.get(key) ?? 0) + 1);\n          }\n        }\n      }\n\n      // Upsert pairs that meet threshold\n      const validPairs = Array.from(pairCounts.entries()).filter(\n        ([, count]) => count >= FBT_MIN_THRESHOLD\n      );\n      const upsertedPairKeys = new Set<"+"string>();\n\n      for (const [key, count] of validPairs) {\n        const [productId1, productId2] = key.split(':');\n        upsertedPairKeys.add(key);\n\n        await prisma.frequentlyBoughtTogether.upsert({\n          where: { storeId_productId1_productId2: { storeId, productId1, productId2 } },\n          update: { coOccurrenceCount: count, lastCalculatedAt: new Date() },\n          create: {\n            storeId,\n            productId1,\n            productId2,\n            coOccurrenceCount: count,\n            lastCalculatedAt: new Date(),\n          },\n        });\n      }\n\n      // Delete stale rows (pairs no longer meeting threshold)\n      const existingRows = await prisma.frequentlyBoughtTogether.findMany({\n        where: { storeId },\n        select: { id: true, productId1: true, productId2: true },\n      });\n\n      const staleIds = existingRows\n        .filter(row => {\n          const key = `${row.productId1}:${row.productId2}`;\n          return !upsertedPairKeys.has(key);\n        })\n        .map(row => row.id);\n\n      if (staleIds.length > 0) {\n        await prisma.frequentlyBoughtTogether.deleteMany({ where: { id: { in: staleIds } } });\n      }\n\n      // Invalidate all recommendation caches for this store\n      await this.invalidateStoreCache(storeId);\n\n      logger.info(\n        { storeId, pairsCalculated: validPairs.length, staleRemoved: staleIds.length },\n        '[FBT] Recalculation complete'\n      );\n    } finally {\n      await redis.releaseLock(lockName);\n    }\n  }\n\n  // ----------------------------------------\n  // FBT Cron\n  // ----------------------------------------\n  startFBTCron(intervalMs: number, storeIds: string[]) {\n    if (fbtCronTimer) {\n      logger.warn('[FBT] Cron already running, skipping start');\n      return;\n    }\n\n    fbtCronTimer = setInterval(async () => {\n      // Leader election: only one replica executes the FBT recalculation per\n      // tick so we don't duplicate Prisma writes across Railway instances.\n      await withLeaderLock('fbt-recalculation', intervalMs, async () => {\n        logger.info({ storeIds }, '[FBT] Running scheduled recalculation');\n        for (const storeId of storeIds) {\n          try {\n            await this.recalculateFBT(storeId);\n          } catch (err) {\n            logger.error({ err, storeId }, '[FBT] Scheduled recalculation failed');\n          }\n        }\n      }).catch(err => {\n        logger.error({ err }, '[FBT] Leader-lock acquisition error');\n      });\n    }, intervalMs);\n\n    logger.info({ intervalMs }, '[FBT] Cron started');\n  }\n\n  stopFBTCron() {\n    if (fbtCronTimer) {\n      clearInterval(fbtCronTimer);\n      fbtCronTimer = null;\n      logger.info('[FBT] Cron stopped');\n    }\n  }\n\n  // ----------------------------------------\n  // getStats\n  // ----------------------------------------\n  async getStats(storeId: string) {\n    const fbtCount = await prisma.frequentlyBoughtTogether.count({ where: { storeId } });\n\n    const lastRow = await prisma.frequentlyBoughtTogether.findFirst({\n      where: { storeId },\n      orderBy: { lastCalculatedAt: 'desc' },\n      select: { lastCalculatedAt: true },\n    });\n\n    return {\n      fbtPairCount: fbtCount,\n      lastCalculatedAt: lastRow?.lastCalculatedAt ?? null,\n    };\n  }\n\n  // ----------------------------------------\n  // Cache helpers\n  // ----------------------------------------\n  private async invalidateCache(storeId: string, productId: string) {\n    await redis.delete(`recommendations:product:${storeId}:${productId}`);\n  }\n\n  // Public wrapper so Inngest cleanup functions can invalidate a product's\n  // recommendation cache without accessing the private method directly.\n  async invalidateProductCache(storeId: string, productId: string) {\n    await this.invalidateCache(storeId, productId);\n  }\n\n  private async invalidateStoreCache(storeId: string) {\n    // Best-effort: individual product caches expire within 5 min anyway.\n    // If Redis client is available, use scan to remove all matching keys.\n    const client = redis.getClient();\n    if (!client) return;\n\n    try {\n      let cursor = '0';\n      do {\n        const [nextCursor, keys] = await client.scan(\n          cursor,\n          'MATCH',\n          `cache:recommendations:product:${storeId}:*`,\n          'COUNT',\n          100\n        );\n        cursor = nextCursor;\n        if (keys.length > 0) {\n          await client.del(...keys);\n        }\n      } while (cursor !== '0');\n    } catch (err) {\n      logger.warn({ err, storeId }, '[FBT] Failed to invalidate store recommendation cache');\n    }\n  }\n}\n\nexport const recommendationService = new RecommendationService();\n"}},"schemaVersion":"1.0","thresholds":{"high":80,"low":60,"break":null},"testFiles":{"tests/unit/order.test.ts":{"tests":[{"id":"0","name":"OrderService list should return paginated orders"},{"id":"1","name":"OrderService list should filter by status"},{"id":"2","name":"OrderService list should filter by customerId"},{"id":"3","name":"OrderService list should handle pagination correctly"},{"id":"4","name":"OrderService getById should return order with items and customer"},{"id":"5","name":"OrderService getById should throw error if order not found"},{"id":"6","name":"OrderService getByOrderNumber should return order by order number"},{"id":"7","name":"OrderService getByOrderNumber should throw error if order not found"},{"id":"8","name":"OrderService create should create order from cart"},{"id":"9","name":"OrderService create should throw error if cart is empty"},{"id":"10","name":"OrderService create should throw error if insufficient inventory"},{"id":"11","name":"OrderService create should enqueue order/created Inngest event (email fanout is async)"},{"id":"12","name":"OrderService create should send real-time notification"},{"id":"13","name":"OrderService create should continue even if email fails"},{"id":"14","name":"OrderService create coupon usageLimitPerUser enforcement registered customer already at usageLimitPerUser → rejects, never creates the order"},{"id":"15","name":"OrderService create coupon usageLimitPerUser enforcement registered customer under usageLimitPerUser → order proceeds"},{"id":"16","name":"OrderService create coupon usageLimitPerUser enforcement guest checkout identified by shipping email already at the per-user limit → rejects"},{"id":"17","name":"OrderService create coupon usageLimitPerUser enforcement guest checkout with NEITHER email nor phone → never blocked (identity ambiguous, fail open)"},{"id":"18","name":"OrderService create coupon usageLimitPerUser enforcement coupon with no usageLimitPerUser set → skips the per-user check entirely"},{"id":"19","name":"OrderService create exact-tie coupon vs promotion (no double-count) coupon and promotion tie on discount → promotion is recorded once, coupon is not double-counted"},{"id":"20","name":"OrderService create promotion strictly beats coupon (best-of, no coupon usage reserved) promotion (3000 fils) strictly beats coupon (1000 fils) → promotion wins, coupon unused"},{"id":"21","name":"OrderService createAdminOrder creates an admin order with no coupon (per-user check never runs)"},{"id":"22","name":"OrderService createAdminOrder coupon usageLimitPerUser enforcement registered customer already at usageLimitPerUser → rejects, never creates the admin order"},{"id":"23","name":"OrderService createAdminOrder coupon usageLimitPerUser enforcement registered customer under usageLimitPerUser → admin order proceeds"},{"id":"24","name":"OrderService createAdminOrder coupon usageLimitPerUser enforcement guest admin order identified by shipping email already at the per-user limit → rejects"},{"id":"25","name":"OrderService createAdminOrder coupon usageLimitPerUser enforcement guest admin order with NEITHER email nor phone → never blocked (identity ambiguous, fail open)"},{"id":"26","name":"OrderService createAdminOrder coupon usageLimitPerUser enforcement coupon with no usageLimitPerUser set → skips the per-user check entirely"},{"id":"27","name":"OrderService updateStatus valid transitions should allow pending -> confirmed"},{"id":"28","name":"OrderService updateStatus valid transitions should allow pending -> cancelled"},{"id":"29","name":"OrderService updateStatus valid transitions should allow confirmed -> processing"},{"id":"30","name":"OrderService updateStatus valid transitions should allow processing -> shipped"},{"id":"31","name":"OrderService updateStatus valid transitions should allow shipped -> delivered"},{"id":"32","name":"OrderService updateStatus valid transitions should allow delivered -> refunded"},{"id":"33","name":"OrderService updateStatus invalid transitions should allow pending -> delivered (admin shortcut)"},{"id":"34","name":"OrderService updateStatus invalid transitions should reject cancelled -> any"},{"id":"35","name":"OrderService updateStatus invalid transitions should reject refunded -> any"},{"id":"36","name":"OrderService updateStatus invalid transitions should reject shipped -> cancelled"},{"id":"37","name":"OrderService updateStatus inventory restoration should fire order/refunded with restoreInventory:true on cancellation"},{"id":"38","name":"OrderService updateStatus inventory restoration should fire order/refunded with restoreInventory:true on refund"},{"id":"39","name":"OrderService updateStatus email notifications should send shipped email"},{"id":"40","name":"OrderService updateStatus email notifications should send payment success email on confirmation"},{"id":"41","name":"OrderService updateStatus email notifications should send admin refund email"},{"id":"42","name":"OrderService updateStatus real-time notifications should send status notification to customer"},{"id":"43","name":"OrderService applyRefundEffects — fires order/refunded, no inline reversals delivered→refunded via updateStatus: fires order/refunded once with restoreInventory:true, notify:true; no inline reversal"},{"id":"44","name":"OrderService applyRefundEffects — fires order/refunded, no inline reversals two separate returns on the same order: applyRefundEffects fires order/refunded each time (dedup now lives in the fanout)"},{"id":"45","name":"OrderService applyRefundEffects — fires order/refunded, no inline reversals restoreInventory:false calls (backorder-line cancels) carry the flag through on every call"},{"id":"46","name":"OrderService getCustomerOrders should return all orders for a customer"}],"source":"/**\n * Order Service Unit Tests\n * Tests order creation, status transitions, and business logic\n */\n\nimport { describe, it, expect, beforeEach, vi } from 'vitest';\nimport { OrderService } from '@api/services/order.service';\nimport { prisma } from '@force/database';\nimport { EmailService } from '@api/services/email.service';\nimport { socketService } from '@api/services/socket.service';\n\n// Mock dependencies\nvi.mock('@force/database', () => ({\n  prisma: {\n    order: {\n      findMany: vi.fn(),\n      findFirst: vi.fn(),\n      count: vi.fn(),\n      create: vi.fn(),\n      update: vi.fn(),\n    },\n    cart: {\n      findFirst: vi.fn(),\n      create: vi.fn(),\n    },\n    cartItem: {\n      deleteMany: vi.fn(),\n    },\n    product: {\n      findUnique: vi.fn(),\n      // findMany backs OrderService.createAdminOrder's price-hydration lookup.\n      findMany: vi.fn().mockResolvedValue([]),\n      update: vi.fn(),\n    },\n    productVariant: {\n      update: vi.fn(),\n    },\n    store: {\n      findUnique: vi.fn().mockResolvedValue({ name: 'Test Store' }),\n    },\n    taxRate: {\n      findMany: vi.fn().mockResolvedValue([]),\n    },\n    inventoryHistory: {\n      // findFirst is the return_stock idempotency marker (return null =\n      // \"not yet restored\" so the restore proceeds).\n      findFirst: vi.fn().mockResolvedValue(null),\n      create: vi.fn().mockResolvedValue({}),\n    },\n    // orderEvent backs both the status-audit-trail write in updateStatus\n    // AND the `refund_effects_applied` once-per-order marker inside\n    // applyRefundEffects (F2 rework). Default findFirst → null (\"not yet\n    // applied\") so the coupon decrement proceeds; tests that exercise the\n    // idempotency guard override this per-call.\n    orderEvent: {\n      findFirst: vi.fn().mockResolvedValue(null),\n      create: vi.fn().mockResolvedValue({}),\n    },\n    coupon: {\n      findFirst: vi.fn(),\n      updateMany: vi.fn().mockResolvedValue({ count: 0 }),\n    },\n    // customer + promotion back the checkout targeting resolver\n    // (resolveCustomerContext / resolveBestPromotion) invoked before the order\n    // transaction. Defaults: no matching customer (guest, first order) and no\n    // active automatic promotions, so the coupon-only paths are unchanged.\n    customer: {\n      findFirst: vi.fn().mockResolvedValue(null),\n    },\n    // resolveCustomerContext looks up the account contact (phone/email) by\n    // customerId when the checkout is for a registered customer (Fix B).\n    // Default: no matching user row → falls back to the passed shipping\n    // phone/email, same targeting behavior as before Fix B.\n    user: {\n      findUnique: vi.fn().mockResolvedValue(null),\n    },\n    promotion: {\n      findMany: vi.fn().mockResolvedValue([]),\n    },\n    backorderLine: {\n      updateMany: vi.fn().mockResolvedValue({ count: 0 }),\n    },\n    $transaction: vi.fn(),\n    $queryRaw: vi.fn(),\n  },\n  Prisma: {},\n  OrderStatus: {},\n  // withMoneyTx (F6) wraps prisma.$transaction. Delegate to the mocked\n  // $transaction so existing `expect(prisma.$transaction).toHaveBeenCalled()`\n  // assertions still hold; fall back to invoking the callback directly if a\n  // test passes a client without a mocked $transaction.\n  // eslint-disable-next-line @typescript-eslint/no-explicit-any\n  withMoneyTx: (client: any, fn: any) =>\n    client?.$transaction ? client.$transaction(fn) : fn(client),\n}));\n\nvi.mock('@api/services/email.service', () => ({\n  EmailService: {\n    sendOrderConfirmation: vi.fn().mockResolvedValue(undefined),\n    sendAdminNewOrder: vi.fn().mockResolvedValue(undefined),\n    sendOrderShipped: vi.fn().mockResolvedValue(undefined),\n    sendPaymentSuccess: vi.fn().mockResolvedValue(undefined),\n    sendAdminRefund: vi.fn().mockResolvedValue(undefined),\n  },\n}));\n\nvi.mock('@api/services/socket.service', () => ({\n  socketService: {\n    newOrderNotification: vi.fn(),\n    orderStatusNotification: vi.fn(),\n  },\n}));\n\nvi.mock('@api/services/cart.service', () => ({\n  CartService: {\n    getOrCreate: vi.fn(),\n  },\n}));\n\n// Spy on the `order/refunded` fanout (the \"Refund issued\" merchant push +\n// customer refund email trigger) so the F2 idempotency tests can assert\n// exactly how many times it fired without a real Inngest client.\nvi.mock('@api/lib/inngest/client', () => ({\n  inngest: {\n    send: vi.fn().mockResolvedValue({ ids: [] }),\n    // order.service.ts transitively imports order-status-changed.ts, which\n    // registers a fan-out via inngest.createFunction at module load. The mock\n    // must expose it or the whole suite fails to import.\n    createFunction: vi.fn(() => ({})),\n  },\n}));\n\n// The order service checks the inventory.backorder feature flag before\n// creating BackorderLine rows. Default to enabled so existing tests that\n// don't care about this flag still pass unmodified.\nvi.mock('@api/services/feature.service', () => ({\n  featureService: {\n    isFeatureEnabled: vi.fn().mockResolvedValue(true),\n    getStoreFeatures: vi.fn(),\n    invalidateCache: vi.fn(),\n  },\n}));\n\nimport { CartService } from '@api/services/cart.service';\nimport { inngest } from '@api/lib/inngest/client';\n\ndescribe('OrderService', () => {\n  const mockStoreId = 'store-123';\n  const mockCustomerId = 'customer-456';\n  const mockSessionId = 'session-789';\n\n  const mockProduct = {\n    id: 'prod-123',\n    name: 'Test Product',\n    price: 5000,\n    inventory: 50,\n    trackInventory: true,\n    sku: 'TST-001',\n    images: [{ url: 'https://example.com/image.jpg' }],\n  };\n\n  const mockCartWithItems = {\n    id: 'cart-123',\n    storeId: mockStoreId,\n    sessionId: mockSessionId,\n    customerId: mockCustomerId,\n    items: [\n      {\n        id: 'item-1',\n        productId: 'prod-123',\n        quantity: 2,\n        product: mockProduct,\n      },\n    ],\n    subtotal: 10000,\n  };\n\n  const mockCustomer = {\n    id: mockCustomerId,\n    email: 'customer@test.com',\n    firstName: 'Test',\n    lastName: 'Customer',\n  };\n\n  const mockOrder = {\n    id: 'order-123',\n    storeId: mockStoreId,\n    customerId: mockCustomerId,\n    orderNumber: 'ORD-123456',\n    status: 'pending',\n    subtotal: 10000,\n    tax: 1000,\n    shipping: 0,\n    total: 11000,\n    shippingAddress: {\n      firstName: 'Test',\n      lastName: 'Customer',\n      address1: '123 Test St',\n      city: 'Kuwait City',\n      state: 'Capital',\n      postalCode: '12345',\n      country: 'Kuwait',\n    },\n    items: [\n      {\n        id: 'orderitem-1',\n        productId: 'prod-123',\n        productName: 'Test Product',\n        sku: 'TST-001',\n        quantity: 2,\n        price: 5000,\n        total: 10000,\n      },\n    ],\n    customer: mockCustomer,\n  };\n\n  beforeEach(() => {\n    vi.clearAllMocks();\n  });\n\n  describe('list', () => {\n    it('should return paginated orders', async () => {\n      const mockOrders = [mockOrder, { ...mockOrder, id: 'order-456' }];\n      vi.mocked(prisma.order.findMany).mockResolvedValue(mockOrders as any);\n      vi.mocked(prisma.order.count).mockResolvedValue(2);\n\n      const result = await OrderService.list(mockStoreId);\n\n      expect(result.orders).toHaveLength(2);\n      expect(result.meta.total).toBe(2);\n      expect(result.meta.page).toBe(1);\n      expect(result.meta.limit).toBe(20);\n    });\n\n    it('should filter by status', async () => {\n      vi.mocked(prisma.order.findMany).mockResolvedValue([mockOrder] as any);\n      vi.mocked(prisma.order.count).mockResolvedValue(1);\n\n      await OrderService.list(mockStoreId, { status: 'pending' });\n\n      expect(prisma.order.findMany).toHaveBeenCalledWith(\n        expect.objectContaining({\n          where: expect.objectContaining({ status: 'pending' }),\n        })\n      );\n    });\n\n    it('should filter by customerId', async () => {\n      vi.mocked(prisma.order.findMany).mockResolvedValue([mockOrder] as any);\n      vi.mocked(prisma.order.count).mockResolvedValue(1);\n\n      await OrderService.list(mockStoreId, { customerId: mockCustomerId });\n\n      expect(prisma.order.findMany).toHaveBeenCalledWith(\n        expect.objectContaining({\n          where: expect.objectContaining({ customerId: mockCustomerId }),\n        })\n      );\n    });\n\n    it('should handle pagination correctly', async () => {\n      vi.mocked(prisma.order.findMany).mockResolvedValue([]);\n      vi.mocked(prisma.order.count).mockResolvedValue(100);\n\n      const result = await OrderService.list(mockStoreId, { page: 3, limit: 10 });\n\n      expect(prisma.order.findMany).toHaveBeenCalledWith(\n        expect.objectContaining({\n          skip: 20, // (3-1) * 10\n          take: 10,\n        })\n      );\n      expect(result.meta.totalPages).toBe(10);\n    });\n  });\n\n  describe('getById', () => {\n    it('should return order with items and customer', async () => {\n      vi.mocked(prisma.order.findFirst).mockResolvedValue(mockOrder as any);\n\n      const result = await OrderService.getById(mockStoreId, 'order-123');\n\n      expect(result).toEqual(mockOrder);\n      // `deletedAt: null` is part of the defensive soft-delete filter\n      // added in tier-2 hardening — Order has a soft-delete column the\n      // schema declares but no caller currently sets, and we don't want\n      // a future archive feature to leak archived rows through getById.\n      expect(prisma.order.findFirst).toHaveBeenCalledWith(\n        expect.objectContaining({\n          where: { id: 'order-123', storeId: mockStoreId, deletedAt: null },\n        })\n      );\n    });\n\n    it('should throw error if order not found', async () => {\n      vi.mocked(prisma.order.findFirst).mockResolvedValue(null);\n\n      await expect(OrderService.getById(mockStoreId, 'nonexistent')).rejects.toThrow(\n        'Order not found'\n      );\n    });\n  });\n\n  describe('getByOrderNumber', () => {\n    it('should return order by order number', async () => {\n      vi.mocked(prisma.order.findFirst).mockResolvedValue(mockOrder as any);\n\n      const result = await OrderService.getByOrderNumber(mockStoreId, 'ORD-123456');\n\n      expect(result.orderNumber).toBe('ORD-123456');\n    });\n\n    it('should throw error if order not found', async () => {\n      vi.mocked(prisma.order.findFirst).mockResolvedValue(null);\n\n      await expect(OrderService.getByOrderNumber(mockStoreId, 'INVALID')).rejects.toThrow(\n        'Order not found'\n      );\n    });\n  });\n\n  describe('create', () => {\n    const createOrderData = {\n      shippingAddress: {\n        firstName: 'Test',\n        lastName: 'Customer',\n        address1: '123 Test St',\n        city: 'Kuwait City',\n        state: 'Capital',\n        postalCode: '12345',\n        country: 'Kuwait',\n      },\n      paymentMethod: 'cod',\n    };\n\n    // Exposed so individual tests can override the per-user coupon count\n    // (`tx.order.count`) and the global reserve (`tx.coupon.updateMany`)\n    // without rebuilding the whole $transaction mock.\n    const txOrderCount = vi.fn().mockResolvedValue(0);\n    const txCouponUpdateMany = vi.fn().mockResolvedValue({ count: 1 });\n\n    beforeEach(() => {\n      vi.mocked(CartService.getOrCreate).mockResolvedValue(mockCartWithItems as any);\n      vi.mocked(prisma.taxRate.findMany).mockResolvedValue([]);\n      txOrderCount.mockReset().mockResolvedValue(0);\n      txCouponUpdateMany.mockReset().mockResolvedValue({ count: 1 });\n      vi.mocked(prisma.$transaction).mockImplementation(async (fn: any) => {\n        if (typeof fn === 'function') {\n          return fn({\n            order: {\n              create: vi.fn().mockResolvedValue(mockOrder),\n              count: txOrderCount,\n            },\n            coupon: {\n              updateMany: txCouponUpdateMany,\n            },\n            product: {\n              update: vi.fn().mockResolvedValue({}),\n            },\n            productVariant: {\n              update: vi.fn().mockResolvedValue({}),\n            },\n            cartItem: {\n              deleteMany: vi.fn().mockResolvedValue({}),\n            },\n            inventoryHistory: {\n              // return_stock idempotency marker: null = not yet restored.\n              findFirst: vi.fn().mockResolvedValue(null),\n              create: vi.fn().mockResolvedValue({}),\n              // Order creation now writes the sale-line ledger via a single\n              // batched createMany instead of one create() per cart line.\n              createMany: vi.fn().mockResolvedValue({ count: 0 }),\n            },\n            // refund_effects_applied marker (F2 rework) — this tx mock is\n            // reused by other describe blocks whose own beforeEach doesn't\n            // reset `$transaction` (vi.clearAllMocks() clears call history,\n            // not a previously assigned mockImplementation), so it must\n            // carry orderEvent too or a later applyRefundEffects call\n            // (e.g. from an updateStatus cancel/refund test) throws on\n            // `tx.orderEvent` being undefined.\n            orderEvent: {\n              findFirst: vi.fn().mockResolvedValue(null),\n              create: vi.fn().mockResolvedValue({}),\n            },\n            $queryRaw: vi.fn().mockResolvedValue([{ inventory: 50 }]),\n          } as any);\n        }\n        return fn;\n      });\n    });\n\n    it('should create order from cart', async () => {\n      const result = await OrderService.create(\n        mockStoreId,\n        mockCustomerId,\n        mockSessionId,\n        createOrderData\n      );\n\n      expect(result.orderNumber).toBeDefined();\n      expect(CartService.getOrCreate).toHaveBeenCalledWith(\n        mockStoreId,\n        mockSessionId,\n        mockCustomerId\n      );\n    });\n\n    it('should throw error if cart is empty', async () => {\n      vi.mocked(CartService.getOrCreate).mockResolvedValue({\n        ...mockCartWithItems,\n        items: [],\n      } as any);\n\n      await expect(\n        OrderService.create(mockStoreId, mockCustomerId, mockSessionId, createOrderData)\n      ).rejects.toThrow('Cart is empty');\n    });\n\n    it('should throw error if insufficient inventory', async () => {\n      vi.mocked(CartService.getOrCreate).mockResolvedValue({\n        ...mockCartWithItems,\n        items: [\n          {\n            ...mockCartWithItems.items[0],\n            quantity: 100,\n            product: { ...mockProduct, inventory: 10 },\n          },\n        ],\n      } as any);\n\n      // Inventory is guarded by an atomic conditional decrement\n      // (`UPDATE … WHERE inventory >= qty RETURNING`). A losing/insufficient\n      // write affects 0 rows → $queryRaw resolves to [] → ok=false. With\n      // backorder disallowed (findUnique → allowBackorder:false) it throws.\n      vi.mocked(prisma.$transaction).mockImplementation(async (fn: any) => {\n        if (typeof fn === 'function') {\n          return fn({\n            order: { create: vi.fn() },\n            product: {\n              update: vi.fn(),\n              findUnique: vi.fn().mockResolvedValue({ allowBackorder: false }),\n            },\n            productVariant: {\n              update: vi.fn(),\n              findUnique: vi.fn().mockResolvedValue({ allowBackorder: false }),\n            },\n            cartItem: { deleteMany: vi.fn() },\n            inventoryHistory: { create: vi.fn() },\n            orderEvent: { findFirst: vi.fn().mockResolvedValue(null), create: vi.fn() },\n            $queryRaw: vi.fn().mockResolvedValue([]),\n          } as any);\n        }\n        return fn;\n      });\n\n      await expect(\n        OrderService.create(mockStoreId, mockCustomerId, mockSessionId, createOrderData)\n      ).rejects.toThrow('Not enough inventory');\n    });\n\n    it('should enqueue order/created Inngest event (email fanout is async)', async () => {\n      // Confirmation email is now sent inside the order/created Inngest\n      // handler (not inline) so OrderService.create only enqueues the event.\n      // We verify the socket notification still fires synchronously, which\n      // is the in-process side-effect that the admin page depends on.\n      await OrderService.create(mockStoreId, mockCustomerId, mockSessionId, createOrderData);\n\n      // sendOrderConfirmation is NOT called inline — it fires inside the Inngest\n      // order/created handler. Inline email mocks should NOT be asserted here.\n      expect(EmailService.sendOrderConfirmation).not.toHaveBeenCalled();\n    });\n\n    it('should send real-time notification', async () => {\n      await OrderService.create(mockStoreId, mockCustomerId, mockSessionId, createOrderData);\n\n      expect(socketService.newOrderNotification).toHaveBeenCalledWith(\n        mockStoreId,\n        expect.objectContaining({\n          orderNumber: expect.any(String),\n        })\n      );\n    });\n\n    it('should continue even if email fails', async () => {\n      vi.mocked(EmailService.sendOrderConfirmation).mockRejectedValue(new Error('Email failed'));\n\n      // Should not throw\n      await expect(\n        OrderService.create(mockStoreId, mockCustomerId, mockSessionId, createOrderData)\n      ).resolves.toBeDefined();\n    });\n\n    // Money-integrity audit: `usageLimitPerUser` was collected + stored but\n    // never enforced — only the store-wide `usageLimit` was. These cover the\n    // new per-customer gate in OrderService.create.\n    describe('coupon usageLimitPerUser enforcement', () => {\n      const mockCoupon = {\n        id: 'coupon-1',\n        storeId: mockStoreId,\n        code: 'SAVE10',\n        type: 'percentage',\n        value: 10,\n        minOrderAmount: null,\n        maxDiscount: null,\n        usageLimit: null,\n        usageCount: 0,\n        usageLimitPerUser: 1,\n        isActive: true,\n        startsAt: new Date(Date.now() - 86400000),\n        expiresAt: new Date(Date.now() + 86400000),\n        // Targeting facets (shared with promotions). All empty = \"everyone,\n        // whole cart\" so CouponService.evaluateForCart applies the discount to\n        // the full subtotal, matching the legacy calculateDiscount behaviour.\n        customerGroupId: null,\n        firstOrderOnly: false,\n        minQuantity: null,\n        scopeProductIds: [],\n        scopeCategoryIds: [],\n      };\n\n      const couponOrderData = { ...createOrderData, couponCode: 'SAVE10' };\n\n      beforeEach(() => {\n        vi.mocked(prisma.coupon.findFirst).mockResolvedValue(moc  ...mockOrder,\n          status: 'pending',\n        } as any);\n\n        await expect(\n          OrderService.updateStatus(mockStoreId, 'order-123', 'confirmed')\n        ).resolves.toBeDefined();\n      });\n\n      it('should allow pending -> cancelled', async () => {\n        vi.mocked(prisma.order.findFirst).mockResolvedValue({\n          ...mockOrder,\n          status: 'pending',\n        } as any);\n\n        await expect(\n          OrderService.updateStatus(mockStoreId, 'order-123', 'cancelled')\n        ).resolves.toBeDefined();\n      });\n\n      it('should allow confirmed -> processing', async () => {\n        vi.mocked(prisma.order.findFirst).mockResolvedValue({\n          ...mockOrder,\n          status: 'confirmed',\n        } as any);\n\n        await expect(\n          OrderService.updateStatus(mockStoreId, 'order-123', 'processing')\n        ).resolves.toBeDefined();\n      });\n\n      it('should allow processing -> shipped', async () => {\n        vi.mocked(prisma.order.findFirst).mockResolvedValue({\n          ...mockOrder,\n          status: 'processing',\n        } as any);\n\n        await expect(\n          OrderService.updateStatus(mockStoreId, 'order-123', 'shipped')\n        ).resolves.toBeDefined();\n      });\n\n      it('should allow shipped -> delivered', async () => {\n        vi.mocked(prisma.order.findFirst).mockResolvedValue({\n          ...mockOrder,\n          status: 'shipped',\n        } as any);\n\n        await expect(\n          OrderService.updateStatus(mockStoreId, 'order-123', 'delivered')\n        ).resolves.toBeDefined();\n      });\n\n      it('should allow delivered -> refunded', async () => {\n        vi.mocked(prisma.order.findFirst).mockResolvedValue({\n          ...mockOrder,\n          status: 'delivered',\n        } as any);\n\n        await expect(\n          OrderService.updateStatus(mockStoreId, 'order-123', 'refunded')\n        ).resolves.toBeDefined();\n      });\n    });\n\n    describe('invalid transitions', () => {\n      // pending → delivered is now allowed by design (commit 0ee3741) so an\n      // admin can mark a same-day COD as delivered without stepping through\n      // every intermediate state. Test left as a sanity-check that the\n      // transition resolves rather than rejects.\n      it('should allow pending -> delivered (admin shortcut)', async () => {\n        vi.mocked(prisma.order.findFirst).mockResolvedValue({\n          ...mockOrder,\n          status: 'pending',\n        } as any);\n\n        await expect(\n          OrderService.updateStatus(mockStoreId, 'order-123', 'delivered')\n        ).resolves.toBeDefined();\n      });\n\n      it('should reject cancelled -> any', async () => {\n        vi.mocked(prisma.order.findFirst).mockResolvedValue({\n          ...mockOrder,\n          status: 'cancelled',\n        } as any);\n\n        await expect(\n          OrderService.updateStatus(mockStoreId, 'order-123', 'confirmed')\n        ).rejects.toThrow('Cannot transition from cancelled to confirmed');\n      });\n\n      it('should reject refunded -> any', async () => {\n        vi.mocked(prisma.order.findFirst).mockResolvedValue({\n          ...mockOrder,\n          status: 'refunded',\n        } as any);\n\n        await expect(\n          OrderService.updateStatus(mockStoreId, 'order-123', 'pending')\n        ).rejects.toThrow('Cannot transition from refunded to pending');\n      });\n\n      it('should reject shipped -> cancelled', async () => {\n        vi.mocked(prisma.order.findFirst).mockResolvedValue({\n          ...mockOrder,\n          status: 'shipped',\n        } as any);\n\n        await expect(\n          OrderService.updateStatus(mockStoreId, 'order-123', 'cancelled')\n        ).rejects.toThrow('Cannot transition from shipped to cancelled');\n      });\n    });\n\n    describe('inventory restoration', () => {\n      // Money-integrity redesign (2026-07-16, Task 1): inventory restore no\n      // longer runs inline inside updateStatus/applyRefundEffects — it moves\n      // into the `order-refunded` Inngest fanout as an idempotent step\n      // (Tasks 2-3). `applyRefundEffects` now just fires `order/refunded`\n      // with `restoreInventory` so the fanout knows whether to restore.\n      it('should fire order/refunded with restoreInventory:true on cancellation', async () => {\n        vi.mocked(prisma.order.findFirst).mockResolvedValue({\n          ...mockOrder,\n          status: 'pending',\n          // Refund effects (inventory restore) only fire when the order was\n          // actually paid — cancelling an UNPAID order must NOT refund.\n          paymentStatus: 'paid',\n        } as any);\n\n        await OrderService.updateStatus(mockStoreId, 'order-123', 'cancelled');\n\n        expect(inngest.send).toHaveBeenCalledWith(\n          expect.objectContaining({\n            name: 'order/refunded',\n            data: expect.objectContaining({ restoreInventory: true, notify: true }),\n          })\n        );\n      });\n\n      it('should fire order/refunded with restoreInventory:true on refund', async () => {\n        vi.mocked(prisma.order.findFirst).mockResolvedValue({\n          ...mockOrder,\n          status: 'delivered',\n          paymentStatus: 'paid',\n        } as any);\n\n        await OrderService.updateStatus(mockStoreId, 'order-123', 'refunded');\n\n        expect(inngest.send).toHaveBeenCalledWith(\n          expect.objectContaining({\n            name: 'order/refunded',\n            data: expect.objectContaining({ restoreInventory: true, notify: true }),\n          })\n        );\n      });\n    });\n\n    describe('email notifications', () => {\n      it('should send shipped email', async () => {\n        vi.mocked(prisma.order.findFirst).mockResolvedValue({\n          ...mockOrder,\n          status: 'processing',\n        } as any);\n        vi.mocked(prisma.order.update).mockResolvedValue({\n          ...mockOrder,\n          status: 'shipped',\n        } as any);\n\n        await OrderService.updateStatus(mockStoreId, 'order-123', 'shipped');\n\n        // Post-purchase side effects (shipped email + dispatch) now fan out on\n        // the order/status-changed Inngest event (Lens E, E2-4) — the actual\n        // EmailService call is asserted in order-status-changed.test.ts.\n        // updateStatus just emits the event.\n        expect(inngest.send).toHaveBeenCalledWith(\n          expect.objectContaining({\n            name: 'order/status-changed',\n            data: expect.objectContaining({ status: 'shipped' }),\n          })\n        );\n      });\n\n      it('should send payment success email on confirmation', async () => {\n        vi.mocked(prisma.order.findFirst).mockResolvedValue({\n          ...mockOrder,\n          status: 'pending',\n        } as any);\n        vi.mocked(prisma.order.update).mockResolvedValue({\n          ...mockOrder,\n          status: 'confirmed',\n        } as any);\n\n        await OrderService.updateStatus(mockStoreId, 'order-123', 'confirmed');\n\n        // Payment-success email now fans out on order/status-changed (E2-4).\n        expect(inngest.send).toHaveBeenCalledWith(\n          expect.objectContaining({\n            name: 'order/status-changed',\n            data: expect.objectContaining({ status: 'confirmed' }),\n          })\n        );\n      });\n\n      it('should send admin refund email', async () => {\n        vi.mocked(prisma.order.findFirst).mockResolvedValue({\n          ...mockOrder,\n          status: 'delivered',\n          paymentStatus: 'paid',\n        } as any);\n        vi.mocked(prisma.order.update).mockResolvedValue({\n          ...mockOrder,\n          status: 'refunded',\n        } as any);\n\n        await OrderService.updateStatus(mockStoreId, 'order-123', 'refunded');\n\n        // Admin-refund email now fans out on order/status-changed with\n        // hadCapturedPayment=true (E2-4) — the gate + send are asserted in\n        // order-status-changed.test.ts.\n        expect(inngest.send).toHaveBeenCalledWith(\n          expect.objectContaining({\n            name: 'order/status-changed',\n            data: expect.objectContaining({ status: 'refunded', hadCapturedPayment: true }),\n          })\n        );\n      });\n    });\n\n    describe('real-time notifications', () => {\n      it('should send status notification to customer', async () => {\n        vi.mocked(prisma.order.findFirst).mockResolvedValue({\n          ...mockOrder,\n          status: 'pending',\n        } as any);\n        vi.mocked(prisma.order.update).mockResolvedValue({\n          ...mockOrder,\n          status: 'confirmed',\n        } as any);\n\n        await OrderService.updateStatus(mockStoreId, 'order-123', 'confirmed');\n\n        expect(socketService.orderStatusNotification).toHaveBeenCalledWith(\n          mockCustomerId,\n          expect.objectContaining({\n            orderNumber: mockOrder.orderNumber,\n            status: 'confirmed',\n          })\n        );\n      });\n    });\n  });\n\n  // Money-integrity redesign (2026-07-16, Task 1): `applyRefundEffects` is no\n  // longer where inventory/coupon/affiliate/loyalty/backorder reversals run,\n  // or where their idempotency is decided — it is a thin dispatcher that\n  // fires `order/refunded` with `{ restoreInventory, notify }` flags. The\n  // reversals (and their idempotent markers) move into the `order-refunded`\n  // Inngest fanout as retriable `step.run`s in Tasks 2-3 of the plan\n  // (`docs/superpowers/plans/2026-07-16-refund-money-integrity.md`) — their\n  // idempotency is covered by `tests/unit/order-refunded-reversals.test.ts`\n  // once that lands, not here. This block only covers the event-firing\n  // contract; more direct-call coverage lives in\n  // `apps/api/src/services/__tests__/order-refund-gating.test.ts`.\n  describe('applyRefundEffects — fires order/refunded, no inline reversals', () => {\n    beforeEach(() => {\n      vi.mocked(prisma.order.update).mockResolvedValue(mockOrder as any);\n    });\n\n    it('delivered→refunded via updateStatus: fires order/refunded once with restoreInventory:true, notify:true; no inline reversal', async () => {\n      // A GENUINE new refund of a paid, coupon-bearing order. `refunded` is\n      // terminal (validTransitions), so the previously-considered\n      // refunded→cancelled second hop can't happen through updateStatus.\n      vi.mocked(prisma.order.findFirst).mockResolvedValue({\n        ...mockOrder,\n        status: 'delivered',\n        paymentStatus: 'paid',\n        couponCode: 'SAVE10',\n      } as any);\n      vi.mocked(prisma.order.update).mockResolvedValue({\n        ...mockOrder,\n        status: 'refunded',\n      } as any);\n\n      await OrderService.updateStatus(mockStoreId, 'order-123', 'refunded');\n\n      // applyRefundEffects fires order/refunded exactly once; updateStatus now\n      // ALSO fires order/status-changed (Lens E, E2-4) → two sends total.\n      expect(inngest.send).toHaveBeenCalledTimes(2);\n      const refundedCalls = vi\n        .mocked(inngest.send)\n        .mock.calls.filter(c => (c[0] as { name?: string })?.name === 'order/refunded');\n      expect(refundedCalls).toHaveLength(1);\n      expect(refundedCalls[0][0]).toEqual({\n        name: 'order/refunded',\n        data: { orderId: 'order-123', storeId: mockStoreId, restoreInventory: true, notify: true },\n      });\n\n      // No inline reversal — that now happens in the order-refunded fanout.\n      expect(prisma.coupon.updateMany).not.toHaveBeenCalled();\n      expect(prisma.inventoryHistory.create).not.toHaveBeenCalled();\n    });\n\n    it('two separate returns on the same order: applyRefundEffects fires order/refunded each time (dedup now lives in the fanout)', async () => {\n      vi.mocked(prisma.order.findFirst).mockResolvedValue({\n        ...mockOrder,\n        status: 'delivered',\n        couponCode: 'SAVE10',\n      } as any);\n\n      // Simulates ReturnService.complete() calli
