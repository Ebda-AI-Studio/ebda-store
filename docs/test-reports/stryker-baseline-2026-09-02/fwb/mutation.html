Refund;\n  },\n}));\nvi.mock('@api/services/payment-providers/hesabe.provider', () => ({\n  HesabePaymentProvider: class {\n    initialize = vi.fn();\n    refund = providerRefund;\n  },\n}));\nvi.mock('@api/services/payment-providers/upayments.provider', () => ({\n  UPaymentsProvider: class {\n    initialize = vi.fn();\n    refund = providerRefund;\n  },\n}));\n\nimport { PaymentService } from '@api/services/payment-providers/payment.factory';\n\nconst PAYMENT_ID = 'pay_1';\nconst ORDER_ID = 'order_1';\nconst STORE_ID = 'store_1';\nconst TRANSACTION_ID = 'txn_1';\n\nfunction mockHappyPathUpToEffects() {\n  paymentFindFirst.mockResolvedValue({\n    id: PAYMENT_ID,\n    orderId: ORDER_ID,\n    amount: 5000,\n    status: 'completed',\n    provider: 'myfatoorah',\n    metadata: {},\n    order: { storeId: STORE_ID, store: {}, status: 'confirmed' },\n  });\n  paymentUpdateMany.mockResolvedValue({ count: 1 });\n  paymentConfigFindMany.mockResolvedValue([\n    {\n      provider: 'myfatoorah',\n      apiKey: 'test-key',\n      secretKey: null,\n      merchantId: null,\n      webhookSecret: null,\n      testMode: true,\n      isEnabled: true,\n      isDefault: true,\n      displayName: null,\n      displayNameAr: null,\n      supportedMethods: ['knet'],\n      supportedCurrencies: ['KWD'],\n      fixedFee: 0,\n      percentageFee: 0,\n    },\n  ]);\n  providerRefund.mockResolvedValue({\n    success: true,\n    provider: 'myfatoorah',\n    refundId: 'rf_123',\n    transactionId: TRANSACTION_ID,\n    amount: 5000,\n    status: 'completed',\n  });\n  txMock.mockResolvedValue([{}, {}]);\n  orderFindUnique.mockResolvedValue({ storeId: STORE_ID });\n}\n\ndescribe('PaymentService.refund — applyRefundEffects failure must surface', () => {\n  beforeEach(() => {\n    vi.clearAllMocks();\n  });\n\n  it('REJECTS when applyRefundEffects throws after the provider refund + DB flip succeed', async () => {\n    mockHappyPathUpToEffects();\n    applyRefundEffects.mockRejectedValue(new Error('inngest.send failed: ECONNREFUSED'));\n\n    await expect(PaymentService.refund({ transactionId: TRANSACTION_ID })).rejects.toThrow(\n      'inngest.send failed'\n    );\n  });\n\n  it('resolves normally when applyRefundEffects succeeds (control case)', async () => {\n    mockHappyPathUpToEffects();\n    applyRefundEffects.mockResolvedValue(undefined);\n\n    const result = await PaymentService.refund({ transactionId: TRANSACTION_ID });\n\n    expect(result.refundId).toBe('rf_123');\n    expect(applyRefundEffects).toHaveBeenCalledWith(STORE_ID, ORDER_ID);\n  });\n});\n"},"tests/unit/bulk-ai-tags-sweep.test.ts":{"tests":[{"id":"116","name":"bulk-ai-tags sweep skips a product that already has >=1 tag (default, no force)"},{"id":"117","name":"bulk-ai-tags sweep reuses an existing tag by case-insensitive name instead of creating a duplicate"},{"id":"118","name":"bulk-ai-tags sweep creates a new Tag row only when no case-insensitive match exists"},{"id":"119","name":"bulk-ai-tags sweep force:true tops up an already-tagged product without removing existing tags"},{"id":"120","name":"bulk-ai-tags sweep force:true skips a product already at the per-product tag cap"}],"source":"/**\n * bulk-ai-tags Inngest function — Unit Tests\n *\n * Covers:\n *  - skips a product that already has >=1 tag (default, no force)\n *  - reuses an existing store Tag by case-insensitive name instead of\n *    creating a duplicate\n *  - creates a new Tag row only when no case-insensitive match exists\n *  - force:true tops up an already-tagged product without removing\n *    existing links, respecting the per-product cap\n */\nimport { describe, it, expect, vi, beforeEach } from 'vitest';\n\nvi.mock('../../apps/api/src/lib/logger', () => ({\n  default: { warn: vi.fn(), debug: vi.fn(), error: vi.fn(), info: vi.fn() },\n}));\n\nvi.mock('../../apps/api/src/config', () => ({\n  config: { googleAiKey: 'fake-key' },\n}));\n\nconst mockAssertAiQuota = vi.fn().mockResolvedValue(undefined);\nvi.mock('../../apps/api/src/lib/ai-quota', () => ({\n  assertAiQuota: (...args: unknown[]) => mockAssertAiQuota(...args),\n  isAiQuotaCapError: () => false,\n}));\n\nvi.mock('../../apps/api/src/lib/inngest/ai-retry', () => ({\n  callWithRetry: (fn: () => unknown) => fn(),\n}));\n\nconst mockSuggestProductTags = vi.fn();\nvi.mock('../../apps/api/src/lib/ai/product-tag-suggester', () => ({\n  suggestProductTags: (...args: unknown[]) => mockSuggestProductTags(...args),\n  MAX_TAGS_PER_PRODUCT: 5,\n}));\n\nconst mockFindUniqueStore = vi.fn();\nconst mockFindManyProduct = vi.fn();\nconst mockFindManyTag = vi.fn();\nconst mockCreateTag = vi.fn();\nconst mockCreateManyProductTag = vi.fn();\nconst mockFindUniqueJob = vi.fn();\nconst mockUpdateJob = vi.fn();\n\nvi.mock('@force/database', () => ({\n  prisma: {\n    store: { findUnique: (...args: unknown[]) => mockFindUniqueStore(...args) },\n    product: { findMany: (...args: unknown[]) => mockFindManyProduct(...args) },\n    tag: {\n      findMany: (...args: unknown[]) => mockFindManyTag(...args),\n      create: (...args: unknown[]) => mockCreateTag(...args),\n    },\n    productTag: { createMany: (...args: unknown[]) => mockCreateManyProductTag(...args) },\n    bulkAiJob: {\n      findUnique: (...args: unknown[]) => mockFindUniqueJob(...args),\n      update: (...args: unknown[]) => mockUpdateJob(...args),\n    },\n  },\n}));\n\nlet capturedHandler: (args: {\n  event: { data: unknown };\n  step: { run: (id: string, fn: () => unknown) => Promise<"+"unknown> };\n}) => Promise<"+"void>;\nvi.mock('../../apps/api/src/lib/inngest/client', () => ({\n  inngest: {\n    createFunction: (_cfg: unknown, handler: typeof capturedHandler) => {\n      capturedHandler = handler;\n      return { id: 'bulk-ai-tags' };\n    },\n  },\n}));\n\nbeforeEach(async () => {\n  vi.resetModules();\n  process.env.AI_BULK_THROTTLE_MS = '0';\n  mockAssertAiQuota.mockClear();\n  mockSuggestProductTags.mockReset();\n  mockFindUniqueStore.mockReset();\n  mockFindManyProduct.mockReset();\n  mockFindManyTag.mockReset();\n  mockCreateTag.mockReset();\n  mockCreateManyProductTag.mockReset();\n  mockFindUniqueJob.mockReset();\n  mockUpdateJob.mockReset();\n\n  mockFindUniqueStore.mockResolvedValue({ name: 'Test Store' });\n  mockFindUniqueJob.mockResolvedValue({ status: 'running' });\n  mockUpdateJob.mockResolvedValue({});\n  mockCreateManyProductTag.mockResolvedValue({ count: 1 });\n\n  await import('../../apps/api/src/lib/inngest/functions/bulk-ai-tags.js');\n});\n\nasync function runSweep(data: { jobId: string; storeId: string; force?: boolean }) {\n  const step = { run: (_id: string, fn: () => unknown) => Promise.resolve(fn()) };\n  await capturedHandler({ event: { data }, step });\n}\n\ndescribe('bulk-ai-tags sweep', () => {\n  it('skips a product that already has >=1 tag (default, no force)', async () => {\n    mockFindManyTag.mockResolvedValue([]);\n    mockFindManyProduct.mockResolvedValue([\n      { id: 'p1', name: 'Product 1', description: 'desc', tags: [{ tagId: 'tag-existing' }] },\n    ]);\n\n    await runSweep({ jobId: 'job-1', storeId: 'store-1' });\n\n    expect(mockSuggestProductTags).not.toHaveBeenCalled();\n    const finalCall = mockUpdateJob.mock.calls[mockUpdateJob.mock.calls.length - 1][0];\n    expect(finalCall.data.skipped).toBe(1);\n  });\n\n  it('reuses an existing tag by case-insensitive name instead of creating a duplicate', async () => {\n    mockFindManyTag.mockResolvedValue([{ id: 'tag-cotton', name: 'Cotton' }]);\n    mockFindManyProduct.mockResolvedValue([\n      { id: 'p1', name: 'Product 1', description: 'cotton tee', tags: [] },\n    ]);\n    mockSuggestProductTags.mockResolvedValue(['cotton']); // different case than stored \"Cotton\"\n\n    await runSweep({ jobId: 'job-1', storeId: 'store-1' });\n\n    expect(mockCreateTag).not.toHaveBeenCalled();\n    expect(mockCreateManyProductTag).toHaveBeenCalledWith(\n      expect.objectContaining({\n        data: [{ productId: 'p1', tagId: 'tag-cotton' }],\n        skipDuplicates: true,\n      })\n    );\n  });\n\n  it('creates a new Tag row only when no case-insensitive match exists', async () => {\n    mockFindManyTag.mockResolvedValue([]);\n    mockFindManyProduct.mockResolvedValue([\n      { id: 'p1', name: 'Product 1', description: 'a new kind of product', tags: [] },\n    ]);\n    mockSuggestProductTags.mockResolvedValue(['brand-new-tag']);\n    mockCreateTag.mockResolvedValue({ id: 'tag-new', name: 'brand-new-tag' });\n\n    await runSweep({ jobId: 'job-1', storeId: 'store-1' });\n\n    expect(mockCreateTag).toHaveBeenCalledWith({\n      data: { storeId: 'store-1', name: 'brand-new-tag' },\n    });\n    expect(mockCreateManyProductTag).toHaveBeenCalledWith(\n      expect.objectContaining({ data: [{ productId: 'p1', tagId: 'tag-new' }] })\n    );\n  });\n\n  it('force:true tops up an already-tagged product without removing existing tags', async () => {\n    mockFindManyTag.mockResolvedValue([{ id: 'tag-summer', name: 'Summer' }]);\n    mockFindManyProduct.mockResolvedValue([\n      {\n        id: 'p1',\n        name: 'Product 1',\n        description: 'desc',\n        tags: [{ tagId: 'tag-existing' }], // already has 1 tag\n      },\n    ]);\n    mockSuggestProductTags.mockResolvedValue(['summer']);\n\n    await runSweep({ jobId: 'job-1', storeId: 'store-1', force: true });\n\n    expect(mockSuggestProductTags).toHaveBeenCalledTimes(1);\n    // Only the NEW tag is linked — the existing tag-existing link is untouched\n    // (this sweep never deletes ProductTag rows).\n    expect(mockCreateManyProductTag).toHaveBeenCalledWith(\n      expect.objectContaining({ data: [{ productId: 'p1', tagId: 'tag-summer' }] })\n    );\n  });\n\n  it('force:true skips a product already at the per-product tag cap', async () => {\n    mockFindManyTag.mockResolvedValue([]);\n    mockFindManyProduct.mockResolvedValue([\n      {\n        id: 'p1',\n        name: 'Product 1',\n        description: 'desc',\n        tags: Array.from({ length: 5 }, (_, i) => ({ tagId: `tag-${i}` })), // already at cap\n      },\n    ]);\n\n    await runSweep({ jobId: 'job-1', storeId: 'store-1', force: true });\n\n    expect(mockSuggestProductTags).not.toHaveBeenCalled();\n    const finalCall = mockUpdateJob.mock.calls[mockUpdateJob.mock.calls.length - 1][0];\n    expect(finalCall.data.skipped).toBe(1);\n  });\n});\n"},"tests/unit/order-refund-refresh-route.test.ts":{"tests":[{"id":"121","name":"POST /:orderId/refresh-refund-status returns non-2xx (via next(err)) when applyRefundEffects fails — not swallowed to 200"},{"id":"122","name":"POST /:orderId/refresh-refund-status returns non-2xx (via next(err)) when the order status write fails — not swallowed to 200"},{"id":"123","name":"POST /:orderId/refresh-refund-status returns 200 on a genuinely successful refresh"}],"source":"/**\n * Route-level tests for POST /:orderId/refresh-refund-status (money-integrity\n * Task 6 fix-the-class carry-forward). This route had the IDENTICAL\n * swallow-around-`applyRefundEffects` pattern Task 5 fixed on\n * `refund-via-provider` (see tests/unit/order-refund-route.test.ts): both\n * `OrderService.applyRefundEffects` and the order-status write were wrapped\n * in a `.catch(logger.error)` that let the route fall through to its normal\n * 200 response even when the reversal chain (or the status flip) failed.\n *\n * Contract under test: a failure in either call must reach the client as a\n * non-2xx via `next(err)`, never a swallowed HTTP 200. A genuinely\n * successful refresh still returns 200.\n */\n\nimport { describe, it, expect, vi, beforeAll, afterEach } from 'vitest';\nimport express, { type Express } from 'express';\nimport request from 'supertest';\n\n// ─── Mocks (declared before the route module is dynamically imported) ─────\n\nconst paymentFindFirst = vi.fn();\nconst paymentUpdate = vi.fn().mockResolvedValue({});\nconst orderUpdate = vi.fn().mockResolvedValue({});\nvi.mock('@force/database', () => ({\n  prisma: {\n    payment: {\n      findFirst: (...a: unknown[]) => paymentFindFirst(...a),\n      update: (...a: unknown[]) => paymentUpdate(...a),\n    },\n    order: {\n      update: (...a: unknown[]) => orderUpdate(...a),\n    },\n  },\n  runInTenantContext: (_storeId: string, fn: () => unknown) => fn(),\n  // The error-handler middleware checks `err instanceof\n  // Prisma.PrismaClientKnownRequestError` for every non-AppError/ZodError —\n  // must be present or that check itself throws for a generic Error.\n  Prisma: { PrismaClientKnownRequestError: class PrismaClientKnownRequestError {} },\n}));\n\nvi.mock('@api/middleware/auth', () => ({\n  authenticate: (req: any, _res: any, next: any) => {\n    req.user = { userId: 'admin-1', role: 'store_admin' };\n    next();\n  },\n  authorize:\n    (..._roles: string[]) =>\n    (_req: any, _res: any, next: any) =>\n      next(),\n}));\n\nvi.mock('@api/middleware/store-access', () => ({\n  requireStoreAccess: (_req: any, _res: any, next: any) => next(),\n  checkStoreAccess: (_req: any, _res: any, next: any) => next(),\n}));\n\nvi.mock('@api/middleware/feature-gate', () => ({\n  requireFeature:\n    (..._args: unknown[]) =>\n    (_req: any, _res: any, next: any) =>\n      next(),\n}));\n\nvi.mock('@api/middleware/rbac', () => ({\n  requirePermission:\n    (..._args: unknown[]) =>\n    (_req: any, _res: any, next: any) =>\n      next(),\n}));\n\nconst auditLog = vi.fn().mockResolvedValue(undefined);\nvi.mock('@api/middleware/security', () => ({\n  auditLog: (...a: unknown[]) => auditLog(...a),\n  writeLimiter: (_req: any, _res: any, next: any) => next(),\n}));\n\nvi.mock('@api/utils/store-helpers', () => ({\n  getAuthUser: (req: any) => req.user,\n}));\n\nconst getRefundStatus = vi.fn();\nvi.mock('@api/services/payment-providers/payment.factory', () => ({\n  PaymentService: { getRefundStatus: (...a: unknown[]) => getRefundStatus(...a) },\n}));\n\nconst applyRefundEffects = vi.fn().mockResolvedValue(undefined);\nvi.mock('@api/services/order.service', () => ({\n  OrderService: { applyRefundEffects: (...a: unknown[]) => applyRefundEffects(...a) },\n}));\n\nvi.mock('@api/lib/logger', () => ({\n  default: { info: vi.fn(), warn: vi.fn(), error: vi.fn(), debug: vi.fn() },\n}));\n\nvi.mock('@api/lib/inngest/client', () => ({ inngest: { send: vi.fn() } }));\nvi.mock('@api/services/payment-event.service', () => ({ recordPaymentEvent: vi.fn() }));\nvi.mock('@api/services/payment-confirm.service', () => ({\n  confirmPaymentFromProviderStatus: vi.fn(),\n}));\nvi.mock('@api/services/invoice.service', () => ({ InvoiceService: {} }));\nvi.mock('@api/config', () => ({ config: {} }));\nvi.mock('exceljs', () => ({ default: class {} }));\nvi.mock('@api/lib/exports/xlsx', () => ({ neutralizeRowObject: vi.fn() }));\n\n// ─── App bootstrap ──────────────────────────────────────────────────────────\n\nlet app: Express;\n\nasync function buildApp(): Promise<"+"Express> {\n  const { default: orderRouter } = await import('@api/routes/order.routes');\n  const { errorHandler } = await import('@api/middleware/error-handler');\n  const server = express();\n  server.use(express.json());\n  server.use('/api/v1/stores/:storeId/orders', orderRouter);\n  server.use(errorHandler);\n  return server;\n}\n\nconst STORE_ID = '11111111-1111-1111-1111-111111111111';\nconst ORDER_ID = '22222222-2222-2222-2222-222222222222';\nconst PAYMENT_ID = '33333333-3333-3333-3333-333333333333';\n\nfunction mockPaymentNeedingSideEffects() {\n  paymentFindFirst.mockResolvedValue({\n    id: PAYMENT_ID,\n    orderId: ORDER_ID,\n    refundId: 'rf_123',\n    provider: 'myfatoorah',\n    status: 'completed',\n    metadata: {},\n  });\n  getRefundStatus.mockResolvedValue({\n    status: 'completed',\n    refundedAmount: 5000,\n    amount: 5000,\n    refundReference: 'ref-1',\n  });\n}\n\ndescribe('POST /:orderId/refresh-refund-status', () => {\n  beforeAll(async () => {\n    app = await buildApp();\n  });\n\n  afterEach(() => {\n    vi.clearAllMocks();\n  });\n\n  it('returns non-2xx (via next(err)) when applyRefundEffects fails — not swallowed to 200', async () => {\n    mockPaymentNeedingSideEffects();\n    applyRefundEffects.mockRejectedValue(new Error('inngest.send failed: ECONNREFUSED'));\n\n    const res = await request(app)\n      .post(`/api/v1/stores/${STORE_ID}/orders/${ORDER_ID}/refresh-refund-status`)\n      .send({});\n\n    expect(res.status).not.toBe(200);\n    expect(res.status).toBeGreaterThanOrEqual(400);\n    expect(res.body.success).toBe(false);\n  });\n\n  it('returns non-2xx (via next(err)) when the order status write fails — not swallowed to 200', async () => {\n    mockPaymentNeedingSideEffects();\n    applyRefundEffects.mockResolvedValue(undefined);\n    orderUpdate.mockRejectedValue(new Error('connection reset'));\n\n    const res = await request(app)\n      .post(`/api/v1/stores/${STORE_ID}/orders/${ORDER_ID}/refresh-refund-status`)\n      .send({});\n\n    expect(res.status).not.toBe(200);\n    expect(res.status).toBeGreaterThanOrEqual(400);\n    expect(res.body.success).toBe(false);\n  });\n\n  it('returns 200 on a genuinely successful refresh', async () => {\n    mockPaymentNeedingSideEffects();\n    applyRefundEffects.mockResolvedValue(undefined);\n    orderUpdate.mockResolvedValue({});\n\n    const res = await request(app)\n      .post(`/api/v1/stores/${STORE_ID}/orders/${ORDER_ID}/refresh-refund-status`)\n      .send({});\n\n    expect(res.status).toBe(200);\n    expect(res.body.success).toBe(true);\n    expect(applyRefundEffects).toHaveBeenCalledWith(STORE_ID, ORDER_ID);\n    expect(orderUpdate).toHaveBeenCalledWith({\n      where: { id: ORDER_ID },\n      data: { status: 'refunded', paymentStatus: 'refunded' },\n    });\n  });\n});\n"},"tests/unit/bulk-ai-excerpt-sweep.test.ts":{"tests":[{"id":"124","name":"bulk-ai-excerpt sweep skips a product that already has a human-owned excerpt (default, no force)"},{"id":"125","name":"bulk-ai-excerpt sweep fills a product with no excerpt and stamps aiFieldSources as ai-owned"},{"id":"126","name":"bulk-ai-excerpt sweep force:true regenerates an ai-owned excerpt"},{"id":"127","name":"bulk-ai-excerpt sweep force:true never touches a human-owned excerpt"}],"source":"/**\n * bulk-ai-excerpt Inngest function — Unit Tests\n *\n * Covers the provenance-aware skip/force logic:\n *  - skips a product that already has an excerpt (default, no force)\n *  - fills a product with no excerpt, stamping aiFieldSources 'ai'\n *  - force:true regenerates an ai-owned excerpt\n *  - force:true does NOT touch a human-owned excerpt (never clobbers)\n */\nimport { describe, it, expect, vi, beforeEach } from 'vitest';\n\nvi.mock('../../apps/api/src/lib/logger', () => ({\n  default: { warn: vi.fn(), debug: vi.fn(), error: vi.fn(), info: vi.fn() },\n}));\n\nvi.mock('../../apps/api/src/config', () => ({\n  config: { googleAiKey: 'fake-key' },\n}));\n\nconst mockAssertAiQuota = vi.fn().mockResolvedValue(undefined);\nvi.mock('../../apps/api/src/lib/ai-quota', () => ({\n  assertAiQuota: (...args: unknown[]) => mockAssertAiQuota(...args),\n  isAiQuotaCapError: () => false,\n}));\n\n// callWithRetry just calls the fn directly — retry behaviour isn't under test here.\nvi.mock('../../apps/api/src/lib/inngest/ai-retry', () => ({\n  callWithRetry: (fn: () => unknown) => fn(),\n}));\n\nconst mockGenerateProductExcerpt = vi.fn();\nvi.mock('../../apps/api/src/lib/ai/product-excerpt-generator', () => ({\n  generateProductExcerpt: (...args: unknown[]) => mockGenerateProductExcerpt(...args),\n}));\n\nconst mockFindUniqueStore = vi.fn();\nconst mockFindManyProduct = vi.fn();\nconst mockUpdateProduct = vi.fn();\nconst mockFindUniqueJob = vi.fn();\nconst mockUpdateJob = vi.fn();\n\nvi.mock('@force/database', () => ({\n  prisma: {\n    store: { findUnique: (...args: unknown[]) => mockFindUniqueStore(...args) },\n    product: {\n      findMany: (...args: unknown[]) => mockFindManyProduct(...args),\n      update: (...args: unknown[]) => mockUpdateProduct(...args),\n    },\n    bulkAiJob: {\n      findUnique: (...args: unknown[]) => mockFindUniqueJob(...args),\n      update: (...args: unknown[]) => mockUpdateJob(...args),\n    },\n  },\n}));\n\n// The Inngest function file imports `inngest` from '../client' to register\n// itself via createFunction — stub createFunction to just capture + expose\n// the handler so the test can invoke it directly without a running Inngest.\nlet capturedHandler: (args: {\n  event: { data: unknown };\n  step: { run: (id: string, fn: () => unknown) => Promise<"+"unknown> };\n}) => Promise<"+"void>;\nvi.mock('../../apps/api/src/lib/inngest/client', () => ({\n  inngest: {\n    createFunction: (_cfg: unknown, handler: typeof capturedHandler) => {\n      capturedHandler = handler;\n      return { id: 'bulk-ai-excerpt' };\n    },\n  },\n}));\n\nbeforeEach(async () => {\n  vi.resetModules();\n  // Throttle reads process.env at module-load time — zero it so the sweep's\n  // per-item sleep() doesn't slow down the test suite.\n  process.env.AI_BULK_THROTTLE_MS = '0';\n  mockAssertAiQuota.mockClear();\n  mockGenerateProductExcerpt.mockReset();\n  mockFindUniqueStore.mockReset();\n  mockFindManyProduct.mockReset();\n  mockUpdateProduct.mockReset();\n  mockFindUniqueJob.mockReset();\n  mockUpdateJob.mockReset();\n\n  mockFindUniqueStore.mockResolvedValue({ name: 'Test Store' });\n  mockFindUniqueJob.mockResolvedValue({ status: 'running' });\n  mockUpdateJob.mockResolvedValue({});\n\n  // Re-import so createFunction captures a fresh handler bound to this\n  // test's reset mocks.\n  await import('../../apps/api/src/lib/inngest/functions/bulk-ai-excerpt.js');\n});\n\nasync function runSweep(data: { jobId: string; storeId: string; force?: boolean }) {\n  const step = { run: (_id: string, fn: () => unknown) => Promise.resolve(fn()) };\n  await capturedHandler({ event: { data }, step });\n}\n\ndescribe('bulk-ai-excerpt sweep', () => {\n  it('skips a product that already has a human-owned excerpt (default, no force)', async () => {\n    mockFindManyProduct.mockResolvedValue([\n      {\n        id: 'p1',\n        name: 'Product 1',\n        nameAr: null,\n        description: 'desc',\n        descriptionAr: null,\n        excerpt: 'Already has an excerpt',\n        excerptAr: null,\n        aiFieldSources: {},\n      },\n    ]);\n\n    await runSweep({ jobId: 'job-1', storeId: 'store-1' });\n\n    expect(mockGenerateProductExcerpt).not.toHaveBeenCalled();\n    const finalCall = mockUpdateJob.mock.calls[mockUpdateJob.mock.calls.length - 1][0];\n    expect(finalCall.data.skipped).toBe(1);\n    expect(finalCall.data.filled).toBe(0);\n  });\n\n  it('fills a product with no excerpt and stamps aiFieldSources as ai-owned', async () => {\n    mockFindManyProduct.mockResolvedValue([\n      {\n        id: 'p1',\n        name: 'Product 1',\n        nameAr: null,\n        description: 'A long description.',\n        descriptionAr: null,\n        excerpt: null,\n        excerptAr: null,\n        aiFieldSources: {},\n      },\n    ]);\n    mockGenerateProductExcerpt.mockResolvedValue({\n      excerpt: 'Short excerpt.',\n      excerptAr: 'ملخص قصير.',\n    });\n\n    await runSweep({ jobId: 'job-1', storeId: 'store-1' });\n\n    expect(mockUpdateProduct).toHaveBeenCalledWith(\n      expect.objectContaining({\n        where: { id: 'p1' },\n        data: expect.objectContaining({\n          excerpt: 'Short excerpt.',\n          excerptAr: 'ملخص قصير.',\n          aiFieldSources: expect.objectContaining({ excerpt: 'ai', excerptAr: 'ai' }),\n        }),\n      })\n    );\n    const finalCall = mockUpdateJob.mock.calls[mockUpdateJob.mock.calls.length - 1][0];\n    expect(finalCall.data.filled).toBe(1);\n  });\n\n  it('force:true regenerates an ai-owned excerpt', async () => {\n    mockFindManyProduct.mockResolvedValue([\n      {\n        id: 'p1',\n        name: 'Product 1',\n        nameAr: null,\n        description: 'desc',\n        descriptionAr: null,\n        excerpt: 'Old AI excerpt',\n        excerptAr: null,\n        aiFieldSources: { excerpt: 'ai' },\n      },\n    ]);\n    mockGenerateProductExcerpt.mockResolvedValue({\n      excerpt: 'Fresh excerpt.',\n      excerptAr: 'ملخص جديد.',\n    });\n\n    await runSweep({ jobId: 'job-1', storeId: 'store-1', force: true });\n\n    expect(mockGenerateProductExcerpt).toHaveBeenCalledTimes(1);\n    expect(mockUpdateProduct).toHaveBeenCalledWith(\n      expect.objectContaining({\n        data: expect.objectContaining({ excerpt: 'Fresh excerpt.' }),\n      })\n    );\n  });\n\n  it('force:true never touches a human-owned excerpt', async () => {\n    mockFindManyProduct.mockResolvedValue([\n      {\n        id: 'p1',\n        name: 'Product 1',\n        nameAr: null,\n        description: 'desc',\n        descriptionAr: null,\n        excerpt: 'Human-written excerpt',\n        excerptAr: null,\n        aiFieldSources: { excerpt: 'human' },\n      },\n    ]);\n\n    await runSweep({ jobId: 'job-1', storeId: 'store-1', force: true });\n\n    expect(mockGenerateProductExcerpt).not.toHaveBeenCalled();\n    expect(mockUpdateProduct).not.toHaveBeenCalled();\n  });\n});\n"},"tests/unit/bulk-ai-catalogue-sweep-routes.test.ts":{"tests":[{"id":"128","name":"POST '/bulk/categorize' creates a BulkAiJob with the right kind and sends the matching Inngest event"},{"id":"129","name":"POST '/bulk/categorize' passes force=true through to the Inngest event when requested"},{"id":"130","name":"POST '/bulk/categorize' marks the job failed and returns 503 when the Inngest enqueue throws"},{"id":"131","name":"POST '/bulk/image-alt' creates a BulkAiJob with the right kind and sends the matching Inngest event"},{"id":"132","name":"POST '/bulk/image-alt' passes force=true through to the Inngest event when requested"},{"id":"133","name":"POST '/bulk/image-alt' marks the job failed and returns 503 when the Inngest enqueue throws"},{"id":"134","name":"POST '/bulk/excerpt' creates a BulkAiJob with the right kind and sends the matching Inngest event"},{"id":"135","name":"POST '/bulk/excerpt' passes force=true through to the Inngest event when requested"},{"id":"136","name":"POST '/bulk/excerpt' marks the job failed and returns 503 when the Inngest enqueue throws"},{"id":"137","name":"POST '/bulk/tags' creates a BulkAiJob with the right kind and sends the matching Inngest event"},{"id":"138","name":"POST '/bulk/tags' passes force=true through to the Inngest event when requested"},{"id":"139","name":"POST '/bulk/tags' marks the job failed and returns 503 when the Inngest enqueue throws"}],"source":"/**\n * Catalogue field sweep routes — Unit Tests\n *\n * Covers the 4 new bulk-sweep routes (category, image-alt, excerpt, tags):\n * each creates a BulkAiJob with the right `kind`, sends the matching\n * Inngest event, and marks the job failed (+ 503) when the enqueue itself\n * throws. Handlers are pulled directly off the Express Router's route\n * stack so the test doesn't need to boot the app or its auth middleware.\n */\nimport { describe, it, expect, vi, beforeEach } from 'vitest';\n\nvi.mock('../../apps/api/src/lib/logger', () => ({\n  default: { warn: vi.fn(), debug: vi.fn(), error: vi.fn(), info: vi.fn() },\n}));\n\nconst mockBulkAiJobCreate = vi.fn();\nconst mockBulkAiJobUpdate = vi.fn();\nvi.mock('@force/database', () => ({\n  prisma: {\n    bulkAiJob: {\n      create: (...args: unknown[]) => mockBulkAiJobCreate(...args),\n      update: (...args: unknown[]) => mockBulkAiJobUpdate(...args),\n    },\n  },\n}));\n\nconst mockInngestSend = vi.fn();\nvi.mock('../../apps/api/src/lib/inngest/client', () => ({\n  inngest: { send: (...args: unknown[]) => mockInngestSend(...args) },\n}));\n\nvi.mock('../../apps/api/src/middleware/auth', () => ({\n  authenticate: (_req: unknown, _res: unknown, next: () => void) => next(),\n  authorize: () => (_req: unknown, _res: unknown, next: () => void) => next(),\n}));\nvi.mock('../../apps/api/src/middleware/store-access', () => ({\n  requireStoreAccess: (_req: unknown, _res: unknown, next: () => void) => next(),\n}));\nvi.mock('../../apps/api/src/middleware/security', () => ({\n  writeLimiter: (_req: unknown, _res: unknown, next: () => void) => next(),\n}));\nvi.mock('../../apps/api/src/middleware/feature-gate', () => ({\n  requireFeature: () => (_req: unknown, _res: unknown, next: () => void) => next(),\n}));\nvi.mock('../../apps/api/src/services/ai.service', () => ({\n  AIService: {},\n}));\nvi.mock('../../apps/api/src/services/ai-autofill.service', () => ({\n  fillProductFields: vi.fn(),\n  balanceProductLanguages: vi.fn(),\n  revertProductBalance: vi.fn(),\n}));\nvi.mock('../../apps/api/src/lib/ai/product-faq-generator', () => ({\n  generateProductFaqs: vi.fn(),\n}));\n\nimport aiRoutes from '../../apps/api/src/routes/ai.routes';\n\n// -- Helpers -----------------------------------------------------------\n\ninterface RouteLayer {\n  route?: {\n    path: string;\n    methods: Record<"+"string, boolean>;\n    stack: Array<"+"{ handle: (...args: unknown[]) => unknown }>;\n  };\n}\n\nfunction getHandler(method: 'post' | 'get', path: string) {\n  const layers = (aiRoutes as unknown as { stack: RouteLayer[] }).stack;\n  const layer = layers.find(l => l.route?.path === path && l.route.methods[method]);\n  if (!layer?.route) throw new Error(`Route ${method.toUpperCase()} ${path} not found`);\n  const stack = layer.route.stack;\n  return stack[stack.length - 1].handle as (\n    req: unknown,\n    res: unknown,\n    next: (err?: unknown) => void\n  ) => Promise<"+"void>;\n}\n\nfunction mockReqRes(body: object = {}) {\n  const req = {\n    params: { storeId: 'store-1' },\n    body,\n    user: { userId: 'user-1' },\n  };\n  const jsonMock = vi.fn();\n  const statusMock = vi.fn(() => ({ json: jsonMock }));\n  const res = { status: statusMock, json: jsonMock };\n  const next = vi.fn();\n  return { req, res, next, jsonMock, statusMock };\n}\n\nbeforeEach(() => {\n  mockBulkAiJobCreate.mockReset();\n  mockBulkAiJobUpdate.mockReset();\n  mockInngestSend.mockReset();\n  mockBulkAiJobCreate.mockResolvedValue({\n    id: 'job-1',\n    status: 'queued',\n    kind: 'category_assign',\n    createdAt: new Date(),\n  });\n  mockInngestSend.mockResolvedValue({ ids: ['evt-1'] });\n});\n\ndescribe.each([\n  { path: '/bulk/categorize', kind: 'category_assign', event: 'bulk-ai/categorize-requested' },\n  { path: '/bulk/image-alt', kind: 'image_alt', event: 'bulk-ai/image-alt-requested' },\n  { path: '/bulk/excerpt', kind: 'excerpt', event: 'bulk-ai/excerpt-requested' },\n  { path: '/bulk/tags', kind: 'product_tags', event: 'bulk-ai/tags-requested' },\n])('POST $path', ({ path, kind, event }) => {\n  it('creates a BulkAiJob with the right kind and sends the matching Inngest event', async () => {\n    mockBulkAiJobCreate.mockResolvedValue({\n      id: 'job-1',\n      status: 'queued',\n      kind,\n      createdAt: new Date(),\n    });\n\n    const handler = getHandler('post', path);\n    const { req, res, next, jsonMock, statusMock } = mockReqRes({});\n\n    await handler(req, res, next);\n\n    expect(mockBulkAiJobCreate).toHaveBeenCalledTimes(1);\n    const createArgs = mockBulkAiJobCreate.mock.calls[0][0];\n    expect(createArgs.data.kind).toBe(kind);\n    expect(createArgs.data.storeId).toBe('store-1');\n\n    expect(mockInngestSend).toHaveBeenCalledTimes(1);\n    const sendArgs = mockInngestSend.mock.calls[0][0];\n    expect(sendArgs.name).toBe(event);\n    expect(sendArgs.data.jobId).toBe('job-1');\n    expect(sendArgs.data.storeId).toBe('store-1');\n\n    expect(statusMock).toHaveBeenCalledWith(202);\n    expect(jsonMock).toHaveBeenCalledWith(\n      expect.objectContaining({\n        success: true,\n        data: { job: expect.objectContaining({ id: 'job-1' }) },\n      })\n    );\n  });\n\n  it('passes force=true through to the Inngest event when requested', async () => {\n    const handler = getHandler('post', path);\n    const { req, res, next } = mockReqRes({ force: true });\n\n    await handler(req, res, next);\n\n    const sendArgs = mockInngestSend.mock.calls[0][0];\n    expect(sendArgs.data.force).toBe(true);\n  });\n\n  it('marks the job failed and returns 503 when the Inngest enqueue throws', async () => {\n    mockInngestSend.mockRejectedValueOnce(new Error('enqueue boom'));\n\n    const handler = getHandler('post', path);\n    const { req, res, next, jsonMock, statusMock } = mockReqRes({});\n\n    await handler(req, res, next);\n\n    expect(mockBulkAiJobUpdate).toHaveBeenCalledWith(\n      expect.objectContaining({\n        where: { id: 'job-1' },\n        data: expect.objectContaining({ status: 'failed' }),\n      })\n    );\n    expect(statusMock).toHaveBeenCalledWith(503);\n    expect(jsonMock).toHaveBeenCalledWith(\n      expect.objectContaining({\n        success: false,\n        error: expect.objectContaining({ code: 'AI_QUEUE_UNREACHABLE' }),\n      })\n    );\n  });\n});\n"},"tests/unit/order-status-machine.test.ts":{"tests":[{"id":"140","name":"assertValidTransition rejects a stale/backwards transition (refunded → processing)"},{"id":"141","name":"assertValidTransition rejects any transition out of a terminal cancelled order"},{"id":"142","name":"assertValidTransition rejects a stale \"payment failed\" webhook regressing a shipped order to pending"},{"id":"143","name":"assertValidTransition allows a valid forward transition (pending → confirmed)"},{"id":"144","name":"assertValidTransition allows an admin to jump ahead (pending → delivered)"},{"id":"145","name":"assertValidTransition allows refunded from confirmed/processing/shipped/delivered — the gateway refund flow can refund before shipping"},{"id":"146","name":"assertValidTransition treats a same-status write as an idempotent no-op (duplicate/retried webhook)"},{"id":"147","name":"assertValidTransition throws an AppError with the INVALID_STATUS_TRANSITION code and 400 status"}],"source":"/**\n * `assertValidTransition` unit tests (money-integrity Task 6).\n *\n * `assertValidTransition(from, to)` is the state machine check extracted\n * from `OrderService.updateStatus`'s inline `validTransitions` block. It is\n * now shared by `updateStatus` AND the 3 payment-gateway/webhook direct\n * writers in `payment.factory.ts` that bypass `updateStatus` entirely\n * (`refund()`'s full-refund write, the out-of-band refund-webhook write,\n * and the general payment-webhook order write) — see\n * `tests/unit/payment-webhook-status-transition.test.ts` for the\n * direct-writer wiring tests (each rejects a stale/invalid transition\n * before it can regress the order).\n *\n * Importing `@api/services/order.service` for real requires the full\n * transitive mock scaffold already established in `tests/unit/order.test.ts`\n * (heavy service — email, socket, cart, inngest, feature-flag deps) even\n * though `assertValidTransition` itself touches none of them; the mocks\n * below are copied from that file so the module can load.\n */\n\nimport { describe, it, expect, vi } from 'vitest';\n\nvi.mock('@force/database', () => ({\n  prisma: {\n    order: {\n      findMany: vi.fn(),\n      findFirst: vi.fn(),\n      count: vi.fn(),\n      create: vi.fn(),\n      update: vi.fn(),\n    },\n    cart: { findFirst: vi.fn(), create: vi.fn() },\n    cartItem: { deleteMany: vi.fn() },\n    product: { findUnique: vi.fn(), findMany: vi.fn().mockResolvedValue([]), update: vi.fn() },\n    productVariant: { update: vi.fn() },\n    store: { findUnique: vi.fn().mockResolvedValue({ name: 'Test Store' }) },\n    taxRate: { findMany: vi.fn().mockResolvedValue([]) },\n    inventoryHistory: {\n      findFirst: vi.fn().mockResolvedValue(null),\n      create: vi.fn().mockResolvedValue({}),\n    },\n    orderEvent: {\n      findFirst: vi.fn().mockResolvedValue(null),\n      create: vi.fn().mockResolvedValue({}),\n    },\n    coupon: { findFirst: vi.fn(), updateMany: vi.fn().mockResolvedValue({ count: 0 }) },\n    backorderLine: { updateMany: vi.fn().mockResolvedValue({ count: 0 }) },\n    $transaction: vi.fn(),\n    $queryRaw: vi.fn(),\n  },\n  Prisma: {},\n  OrderStatus: {},\n  // eslint-disable-next-line @typescript-eslint/no-explicit-any\n  withMoneyTx: (client: any, fn: any) =>\n    client?.$transaction ? client.$transaction(fn) : fn(client),\n}));\n\nvi.mock('@api/services/email.service', () => ({\n  EmailService: {\n    sendOrderConfirmation: vi.fn().mockResolvedValue(undefined),\n    sendAdminNewOrder: vi.fn().mockResolvedValue(undefined),\n    sendOrderShipped: vi.fn().mockResolvedValue(undefined),\n    sendPaymentSuccess: vi.fn().mockResolvedValue(undefined),\n    sendAdminRefund: vi.fn().mockResolvedValue(undefined),\n  },\n}));\n\nvi.mock('@api/services/socket.service', () => ({\n  socketService: { newOrderNotification: vi.fn(), orderStatusNotification: vi.fn() },\n}));\n\nvi.mock('@api/services/cart.service', () => ({\n  CartService: { getOrCreate: vi.fn() },\n}));\n\nvi.mock('@api/lib/inngest/client', () => ({\n  inngest: {\n    send: vi.fn().mockResolvedValue({ ids: [] }),\n    createFunction: vi.fn(() => ({})),\n  },\n}));\n\nvi.mock('@api/services/feature.service', () => ({\n  featureService: {\n    isFeatureEnabled: vi.fn().mockResolvedValue(true),\n    getStoreFeatures: vi.fn(),\n    invalidateCache: vi.fn(),\n  },\n}));\n\nimport { assertValidTransition } from '@api/services/order.service';\n\ndescribe('assertValidTransition', () => {\n  it('rejects a stale/backwards transition (refunded → processing)', () => {\n    expect(() => assertValidTransition('refunded', 'processing')).toThrow(\n      'Cannot transition from refunded to processing'\n    );\n  });\n\n  it('rejects any transition out of a terminal cancelled order', () => {\n    expect(() => assertValidTransition('cancelled', 'confirmed')).toThrow(\n      'Cannot transition from cancelled to confirmed'\n    );\n  });\n\n  it('rejects a stale \"payment failed\" webhook regressing a shipped order to pending', () => {\n    expect(() => assertValidTransition('shipped', 'pending')).toThrow(\n      'Cannot transition from shipped to pending'\n    );\n  });\n\n  it('allows a valid forward transition (pending → confirmed)', () => {\n    expect(() => assertValidTransition('pending', 'confirmed')).not.toThrow();\n  });\n\n  it('allows an admin to jump ahead (pending → delivered)', () => {\n    expect(() => assertValidTransition('pending', 'delivered')).not.toThrow();\n  });\n\n  it('allows refunded from confirmed/processing/shipped/delivered — the gateway refund flow can refund before shipping', () => {\n    expect(() => assertValidTransition('confirmed', 'refunded')).not.toThrow();\n    expect(() => assertValidTransition('processing', 'refunded')).not.toThrow();\n    expect(() => assertValidTransition('shipped', 'refunded')).not.toThrow();\n    expect(() => assertValidTransition('delivered', 'refunded')).not.toThrow();\n  });\n\n  it('treats a same-status write as an idempotent no-op (duplicate/retried webhook)', () => {\n    expect(() => assertValidTransition('confirmed', 'confirmed')).not.toThrow();\n    expect(() => assertValidTransition('pending', 'pending')).not.toThrow();\n    expect(() => assertValidTransition('refunded', 'refunded')).not.toThrow();\n  });\n\n  it('throws an AppError with the INVALID_STATUS_TRANSITION code and 400 status', async () => {\n    const { AppError } = await import('@api/middleware/error-handler');\n    try {\n      assertValidTransition('refunded', 'processing');\n      throw new Error('expected assertValidTransition to throw');\n    } catch (err) {\n      expect(err).toBeInstanceOf(AppError);\n      expect((err as InstanceType<"+"typeof AppError>).statusCode).toBe(400);\n      expect((err as InstanceType<"+"typeof AppError>).code).toBe('INVALID_STATUS_TRANSITION');\n    }\n  });\n});\n"},"tests/unit/auth-erase-propagation.test.ts":{"tests":[{"id":"148","name":"AuthService.eraseAccount — third-party propagation fires account/erased with the userId and captured OneSignal player ids"},{"id":"149","name":"AuthService.eraseAccount — third-party propagation captures player ids BEFORE the transaction deletes the rows (read happens pre-transaction)"},{"id":"150","name":"AuthService.eraseAccount — third-party propagation resolves successfully even when the account/erased enqueue rejects (fail-open)"},{"id":"151","name":"AuthService.eraseAccount — third-party propagation sends an empty oneSignalPlayerIds array when the user has no subscriptions"}],"source":"/**\n * Unit tests — AuthService.eraseAccount's third-party propagation hookup.\n *\n * Scope: this file does NOT re-test the full anonymization transaction\n * (see tests/integration/auth-gdpr.test.ts for that, against a real DB).\n * It tests one thing precisely: eraseAccount captures OneSignal player ids\n * BEFORE they're deleted, fires `account/erased` with them after the\n * transaction commits, and — critically — a dead/failing Inngest send\n * NEVER fails eraseAccount itself (fail-open, per the GDPR erasure gap\n * closure: the primary anonymization must succeed independently of any\n * third-party propagation).\n */\n\nimport { describe, it, expect, vi, beforeEach } from 'vitest';\n\nvi.mock('@api/lib/logger', () => ({\n  default: { info: vi.fn(), warn: vi.fn(), error: vi.fn(), debug: vi.fn() },\n}));\n\nvi.mock('@api/services/email.service', () => ({\n  EmailService: { sendOrderConfirmation: vi.fn(), sendAdminNewOrder: vi.fn() },\n}));\n\nvi.mock('@api/services/account-lockout.service', () => ({\n  accountLockout: {\n    isLocked: vi.fn().mockResolvedValue({ locked: false }),\n    recordFailedAttempt: vi.fn(),\n    clearAttempts: vi.fn(),\n  },\n}));\n\nvi.mock('@api/services/redis.service', () => ({\n  redis: { isAvailable: vi.fn().mockReturnValue(false), getClient: vi.fn() },\n}));\n\nvi.mock('@api/services/r2-cleanup.service', () => ({\n  deleteR2ObjectIfOrphan: vi.fn().mockResolvedValue(undefined),\n}));\n\n// vi.mock factories are hoisted above top-level const declarations, so any\n// value a factory closes over must itself be declared via vi.hoisted.\nconst { sendMock, mockPrisma } = vi.hoisted(() => {\n  const sendMock = vi.fn();\n  const mockPrisma = {\n    user: {\n      findUnique: vi.fn(),\n      update: vi.fn().mockResolvedValue({}),\n    },\n    oneSignalSubscription: {\n      findMany: vi.fn().mockResolvedValue([]),\n      deleteMany: vi.fn().mockResolvedValue({ count: 0 }),\n    },\n    order: { updateMany: vi.fn().mockResolvedValue({ count: 0 }) },\n    review: { updateMany: vi.fn().mockResolvedValue({ count: 0 }) },\n    address: { deleteMany: vi.fn().mockResolvedValue({ count: 0 }) },\n    abandonedCart: { deleteMany: vi.fn().mockResolvedValue({ count: 0 }) },\n    cart: { deleteMany: vi.fn().mockResolvedValue({ count: 0 }) },\n    wishlist: { deleteMany: vi.fn().mockResolvedValue({ count: 0 }) },\n    pushSubscription: { deleteMany: vi.fn().mockResolvedValue({ count: 0 }) },\n    refreshToken: { deleteMany: vi.fn().mockResolvedValue({ count: 0 }) },\n    verificationToken: { deleteMany: vi.fn().mockResolvedValue({ count: 0 }) },\n    loyaltyTransaction: { deleteMany: vi.fn().mockResolvedValue({ count: 0 }) },\n    loyaltyPoints: { deleteMany: vi.fn().mockResolvedValue({ count: 0 }) },\n    $transaction: vi.fn(),\n  };\n  return { sendMock, mockPrisma };\n});\n\nvi.mock('@api/lib/inngest/client', () => ({\n  inngest: { send: sendMock },\n}));\n\nvi.mock('@force/database', () => ({\n  prisma: mockPrisma,\n  Prisma: {},\n  // Delegates to the mocked $transaction, invoking the callback with the\n  // same mock prisma object (tx.* === prisma.* here, which is fine — the\n  // real distinction only matters for RLS/isolation, not this test).\n  // eslint-disable-next-line @typescript-eslint/no-explicit-any\n  withMoneyTx: (client: any, fn: any) =>\n    client?.$transaction ? client.$transaction(fn) : fn(client),\n}));\n\nimport { AuthService } from '@api/services/auth.service';\n\nconst CUSTOMER = {\n  id: 'user-erase-1',\n  storeId: 'store-1',\n  role: 'customer',\n  avatar: null,\n};\n\ndescribe('AuthService.eraseAccount — third-party propagation', () => {\n  beforeEach(() => {\n    vi.clearAllMocks();\n    mockPrisma.user.findUnique.mockResolvedValue(CUSTOMER);\n    mockPrisma.$transaction.mockImplementation((fn: (tx: unknown) => unknown) => fn(mockPrisma));\n    mockPrisma.oneSignalSubscription.findMany.mockResolvedValue([]);\n    sendMock.mockResolvedValue({ ids: ['evt-1'] });\n  });\n\n  it('fires account/erased with the userId and captured OneSignal player ids', async () => {\n    mockPrisma.oneSignalSubscription.findMany.mockResolvedValue([\n      { playerId: 'player-a' },\n      { playerId: 'player-b' },\n    ]);\n\n    await AuthService.eraseAccount(CUSTOMER.id);\n\n    expect(sendMock).toHaveBeenCalledWith({\n      name: 'account/erased',\n      data: { userId: CUSTOMER.id, oneSignalPlayerIds: ['player-a', 'player-b'] },\n    });\n  });\n\n  it('captures player ids BEFORE the transaction deletes the rows (read happens pre-transaction)', async () => {\n    await AuthService.eraseAccount(CUSTOMER.id);\n\n    // findMany (the capture read) must have been called at all — proves\n    // the propagation event data isn't just guessed from thin air.\n    expect(mockPrisma.oneSignalSubscription.findMany).toHaveBeenCalledWith({\n      where: { userId: CUSTOMER.id },\n      select: { playerId: true },\n    });\n    expect(mockPrisma.oneSignalSubscription.deleteMany).toHaveBeenCalledWith({\n      where: { userId: CUSTOMER.id },\n    });\n  });\n\n  it('resolves successfully even when the account/erased enqueue rejects (fail-open)', async () => {\n    sendMock.mockRejectedValue(new Error('inngest is down'));\n\n    await expect(AuthService.eraseAccount(CUSTOMER.id)).resolves.toBeUndefined();\n\n    // The primary anonymization transaction still ran to completion.\n    expect(mockPrisma.user.update).toHaveBeenCalledWith(\n      expect.objectContaining({ where: { id: CUSTOMER.id } })\n    );\n  });\n\n  it('sends an empty oneSignalPlayerIds array when the user has no subscriptions', async () => {\n    await AuthService.eraseAccount(CUSTOMER.id);\n\n    expect(sendMock).toHaveBeenCalledWith({\n      name: 'account/erased',\n      data: { userId: CUSTOMER.id, oneSignalPlayerIds: [] },\n    });\n  });\n});\n"},"tests/unit/bulk-ai-categorize-sweep.test.ts":{"tests":[{"id":"152","name":"bulk-ai-categorize sweep queries only uncategorized products"},{"id":"153","name":"bulk-ai-categorize sweep assigns the top match returned by the generator"},{"id":"154","name":"bulk-ai-categorize sweep skips (not fails) when the generator returns no confident match"},{"id":"155","name":"bulk-ai-categorize sweep skips every product cleanly (no Gemini calls) when the store has zero categories"}],"source":"/**\n * bulk-ai-categorize Inngest function — Unit Tests\n *\n * Covers:\n *  - only queries uncategorized products (categories: { none: {} })\n *  - assigns the top match returned by the generator\n *  - skips (does not fail) when the generator returns no confident match\n *  - skips every product cleanly when the store has zero categories\n *    (never calls Gemini)\n */\nimport { describe, it, expect, vi, beforeEach } from 'vitest';\n\nvi.mock('../../apps/api/src/lib/logger', () => ({\n  default: { warn: vi.fn(), debug: vi.fn(), error: vi.fn(), info: vi.fn() },\n}));\n\nvi.mock('../../apps/api/src/config', () => ({\n  config: { googleAiKey: 'fake-key' },\n}));\n\nconst mockAssertAiQuota = vi.fn().mockResolvedValue(undefined);\nvi.mock('../../apps/api/src/lib/ai-quota', () => ({\n  assertAiQuota: (...args: unknown[]) => mockAssertAiQuota(...args),\n  isAiQuotaCapError: () => false,\n}));\n\nvi.mock('../../apps/api/src/lib/inngest/ai-retry', () => ({\n  callWithRetry: (fn: () => unknown) => fn(),\n}));\n\nconst mockSuggestProductCategory = vi.fn();\nvi.mock('../../apps/api/src/lib/ai/product-category-suggester', () => ({\n  suggestProductCategory: (...args: unknown[]) => mockSuggestProductCategory(...args),\n}));\n\nconst mockFindUniqueStore = vi.fn();\nconst mockFindManyCategory = vi.fn();\nconst mockFindManyProduct = vi.fn();\nconst mockCreateProductCategory = vi.fn();\nconst mockFindUniqueJob = vi.fn();\nconst mockUpdateJob = vi.fn();\n\nvi.mock('@force/database', () => ({\n  prisma: {\n    store: { findUnique: (...args: unknown[]) => mockFindUniqueStore(...args) },\n    category: { findMany: (...args: unknown[]) => mockFindManyCategory(...args) },\n    product: { findMany: (...args: unknown[]) => mockFindManyProduct(...args) },\n    productCategory: { create: (...args: unknown[]) => mockCreateProductCategory(...args) },\n    bulkAiJob: {\n      findUnique: (...args: unknown[]) => mockFindUniqueJob(...args),\n      update: (...args: unknown[]) => mockUpdateJob(...args),\n    },\n  },\n}));\n\nlet capturedHandler: (args: {\n  event: { data: unknown };\n  step: { run: (id: string, fn: () => unknown) => Promise<"+"unknown> };\n}) => Promise<"+"void>;\nvi.mock('../../apps/api/src/lib/inngest/client', () => ({\n  inngest: {\n    createFunction: (_cfg: unknown, handler: typeof capturedHandler) => {\n      capturedHandler = handler;\n      return { id: 'bulk-ai-categorize' };\n    },\n  },\n}));\n\nbeforeEach(async () => {\n  vi.resetModules();\n  process.env.AI_BULK_THROTTLE_MS = '0';\n  mockAssertAiQuota.mockClear();\n  mockSuggestProductCategory.mockReset();\n  mockFindUniqueStore.mockReset();\n  mockFindManyCategory.mockReset();\n  mockFindManyProduct.mockReset();\n  mockCreateProductCategory.mockReset();\n  mockFindUniqueJob.mockReset();\n  mockUpdateJob.mockReset();\n\n  mockFindUniqueStore.mockResolvedValue({ name: 'Test Store' });\n  mockFindUniqueJob.mockResolvedValue({ status: 'running' });\n  mockUpdateJob.mockResolvedValue({});\n\n  await import('../../apps/api/src/lib/inngest/functions/bulk-ai-categorize.js');\n});\n\nasync function runSweep(data: { jobId: string; storeId: string; force?: boolean }) {\n  const step = { run: (_id: string, fn: () => unknown) => Promise.resolve(fn()) };\n  await capturedHandler({ event: { data }, step });\n}\n\ndescribe('bulk-ai-categorize sweep', () => {\n  it('queries only uncategorized products', async () => {\n    mockFindManyCategory.mockResolvedValue([{ id: 'cat-1', name: 'Clothing', nameAr: null }]);\n    mockFindManyProduct.mockResolvedValue([]);\n\n    await runSweep({ jobId: 'job-1', storeId: 'store-1' });\n\n    expect(mockFindManyProduct).toHaveBeenCalledWith(\n      expect.objectContaining({\n        where: expect.objectContaining({ categories: { none: {} } }),\n      })\n    );\n  });\n\n  it('assigns the top match returned by the generator', async () => {\n    mockFindManyCategory.mockResolvedValue([{ id: 'cat-1', name: 'Clothing', nameAr: null }]);\n    mockFindManyProduct.mockResolvedValue([\n      { id: 'p1', name: 'Cotton Tee', description: 'A soft cotton tee' },\n    ]);\n    mockSuggestProductCategory.mockResolvedValue([{ id: 'cat-1', confidence: 'high' }]);\n\n    await runSweep({ jobId: 'job-1', storeId: 'store-1' });\n\n    expect(mockCreateProductCategory).toHaveBeenCalledWith({\n      data: { productId: 'p1', categoryId: 'cat-1', position: 0 },\n    });\n    const finalCall = mockUpdateJob.mock.calls[mockUpdateJob.mock.calls.length - 1][0];\n    expect(finalCall.data.filled).toBe(1);\n  });\n\n  it('skips (not fails) when the generator returns no confident match', async () => {\n    mockFindManyCategory.mockResolvedValue([{ id: 'cat-1', name: 'Clothing', nameAr: null }]);\n    mockFindManyProduct.mockResolvedValue([\n      { id: 'p1', name: 'Mystery Item', description: 'unclear' },\n    ]);\n    mockSuggestProductCategory.mockResolvedValue([]);\n\n    await runSweep({ jobId: 'job-1', storeId: 'store-1' });\n\n    expect(mockCreateProductCategory).not.toHaveBeenCalled();\n    const finalCall = mockUpdateJob.mock.calls[mockUpdateJob.mock.calls.length - 1][0];\n    expect(finalCall.data.skipped).toBe(1);\n    expect(finalCall.data.failed).toBe(0);\n  });\n\n  it('skips every product cleanly (no Gemini calls) when the store has zero categories', async () => {\n    mockFindManyCategory.mockResolvedValue([]);\n    mockFindManyProduct.mockResolvedValue([\n      { id: 'p1', name: 'Product 1', description: 'desc' },\n      { id: 'p2', name: 'Product 2', description: 'desc' },\n    ]);\n\n    await runSweep({ jobId: 'job-1', storeId: 'store-1' });\n\n    expect(mockSuggestProductCategory).not.toHaveBeenCalled();\n    const finalCall = mockUpdateJob.mock.calls[mockUpdateJob.mock.calls.length - 1][0];\n    expect(finalCall.data.skipped).toBe(2);\n  });\n});\n"},"tests/unit/order-refund-route.test.ts":{"tests":[{"id":"156","name":"POST /:orderId/refund-via-provider returns non-2xx (via next(err)) when PaymentService.refund fails — not swallowed to 200"},{"id":"157","name":"POST /:orderId/refund-via-provider returns 200 on a genuinely successful refund"}],"source":"/**\n * Route-level tests for POST /:orderId/refund-via-provider (money-integrity\n * Task 5). Boots a minimal Express app mounting only order.routes with every\n * auth/db/provider dependency mocked, then drives the route via supertest —\n * matching the app-bootstrap pattern in tests/unit/contract-wbs-bridge.test.ts.\n *\n * Contract under test: any failure surfacing out of `PaymentService.refund`\n * (whatever the internal cause — provider call, DB flip, or the\n * `applyRefundEffects` fanout covered by the sibling\n * payment-service-refund.test.ts) must reach the client as a non-2xx via\n * `next(err)`, never a swallowed HTTP 200. A genuinely successful refund\n * still returns 200.\n */\n\nimport { describe, it, expect, vi, beforeAll, afterEach } from 'vitest';\nimport express, { type Express } from 'express';\nimport request from 'supertest';\n\n// ─── Mocks (declared before the route module is dynamically imported) ─────\n\nconst orderFindFirst = vi.fn();\nvi.mock('@force/database', () => ({\n  prisma: {\n    order: { findFirst: (...a: unknown[]) => orderFindFirst(...a) },\n  },\n  runInTenantContext: (_storeId: string, fn: () => unknown) => fn(),\n}));\n\nvi.mock('@api/middleware/auth', () => ({\n  authenticate: (req: any, _res: any, next: any) => {\n    req.user = { userId: 'admin-1', role: 'store_admin' };\n    next();\n  },\n  authorize:\n    (..._roles: string[]) =>\n    (_req: any, _res: any, next: any) =>\n      next(),\n}));\n\nvi.mock('@api/middleware/store-access', () => ({\n  requireStoreAccess: (_req: any, _res: any, next: any) => next(),\n  checkStoreAccess: (_req: any, _res: any, next: any) => next(),\n}));\n\nvi.mock('@api/middleware/feature-gate', () => ({\n  requireFeature:\n    (..._args: unknown[]) =>\n    (_req: any, _res: any, next: any) =>\n      next(),\n}));\n\nvi.mock('@api/middleware/rbac', () => ({\n  requirePermission:\n    (..._args: unknown[]) =>\n    (_req: any, _res: any, next: any) =>\n      next(),\n}));\n\nconst auditLog = vi.fn().mockResolvedValue(undefined);\nvi.mock('@api/middleware/security', () => ({\n  auditLog: (...a: unknown[]) => auditLog(...a),\n  writeLimiter: (_req: any, _res: any, next: any) => next(),\n}));\n\nvi.mock('@api/utils/store-helpers', () => ({\n  getAuthUser: (req: any) => req.user,\n}));\n\nconst paymentServiceRefund = vi.fn();\nvi.mock('@api/services/payment-providers/payment.factory', () => ({\n  PaymentService: { refund: (...a: unknown[]) => paymentServiceRefund(...a) },\n}));\n\nvi.mock('@api/lib/logger', () => ({\n  default: { info: vi.fn(), warn: vi.fn(), error: vi.fn(), debug: vi.fn() },\n}));\n\nvi.mock('@api/lib/inngest/client', () => ({ inngest: { send: vi.fn() } }));\nvi.mock('@api/services/payment-event.service', () => ({ recordPaymentEvent: vi.fn() }));\nvi.mock('@api/services/payment-confirm.service', () => ({\n  confirmPaymentFromProviderStatus: vi.fn(),\n}));\nvi.mock('@api/services/order.service', () => ({ OrderService: {} }));\nvi.mock('@api/services/invoice.service', () => ({ InvoiceService: {} }));\nvi.mock('@api/config', () => ({ config: {} }));\nvi.mock('exceljs', () => ({ default: class {} }));\nvi.mock('@api/lib/exports/xlsx', () => ({ neutralizeRowObject: vi.fn() }));\n\n// ─── App bootstrap ──────────────────────────────────────────────────────────\n\nlet app: Express;\n\nasync function buildApp(): Promise<"+"Express> {\n  const { default: orderRouter } = await import('@api/routes/order.routes');\n  const { errorHandler } = await import('@api/middleware/error-handler');\n  const server = express();\n  server.use(express.json());\n  server.use('/api/v1/stores/:storeId/orders', orderRouter);\n  server.use(errorHandler);\n  return server;\n}\n\nconst STORE_ID = '11111111-1111-1111-1111-111111111111';\nconst ORDER_ID = '22222222-2222-2222-2222-222222222222';\n\nfunction mockOrderWithCompletedPayment() {\n  orderFindFirst.mockResolvedValue({\n    id: ORDER_ID,\n    storeId: STORE_ID,\n    orderNumber: 'ORD-1001',\n    paymentStatus: 'paid',\n    payments: [{ transactionId: 'txn_1', provider: 'myfatoorah' }],\n  });\n}\n\ndescribe('POST /:orderId/refund-via-provider', () => {\n  beforeAll(async () => {\n    app = await buildApp();\n  });\n\n  afterEach(() => {\n    vi.clearAllMocks();\n  });\n\n  it('returns non-2xx (via next(err)) when PaymentService.refund fails — not swallowed to 200', async () => {\n    mockOrderWithCompletedPayment();\n    paymentServiceRefund.mockRejectedValue(new Error('gateway timeout'));\n\n    const res = await request(app)\n      .post(`/api/v1/stores/${STORE_ID}/orders/${ORDER_ID}/refund-via-provider`)\n      .send({});\n\n    expect(res.status).not.toBe(200);\n    expect(res.status).toBeGreaterThanOrEqual(400);\n    expect(res.body.success).toBe(false);\n  });\n\n  it('returns 200 on a genuinely successful refund', async () => {\n    mockOrderWithCompletedPayment();\n    paymentServiceRefund.mockResolvedValue({\n      refundId: 'rf_123',\n      amount: 5000,\n      provider: 'myfatoorah',\n      status: 'completed',\n    });\n\n    const res = await request(app)\n      .post(`/api/v1/stores/${STORE_ID}/orders/${ORDER_ID}/refund-via-provider`)\n      .send({});\n\n    expect(res.status).toBe(200);\n    expect(res.body.success).toBe(true);\n    expect(res.body.data.refundId).toBe('rf_123');\n    expect(auditLog).toHaveBeenCalledTimes(1);\n  });\n});\n"},"tests/unit/bulk-ai-image-alt-sweep.test.ts":{"tests":[{"id":"158","name":"bulk-ai-image-alt sweep skips a product whose images all already have alt text"},{"id":"159","name":"bulk-ai-image-alt sweep writes alt text only for images missing it"},{"id":"160","name":"bulk-ai-image-alt sweep counts a product as failed when every missing-alt image errors"}],"source":"/**\n * bulk-ai-image-alt Inngest function — Unit Tests\n *\n * Covers:\n *  - skips a product entirely (no Gemini calls) when all its (capped)\n *    images already have alt text\n *  - writes alt text only for images missing it, leaving existing alt\n *    untouched\n *  - a product counts 'filled' if at least one image got a fresh alt\n */\nimport { describe, it, expect, vi, beforeEach } from 'vitest';\n\nvi.mock('../../apps/api/src/lib/logger', () => ({\n  default: { warn: vi.fn(), debug: vi.fn(), error: vi.fn(), info: vi.fn() },\n}));\n\nvi.mock('../../apps/api/src/config', () => ({\n  config: { googleAiKey: 'fake-key' },\n}));\n\nconst mockAssertAiQuota = vi.fn().mockResolvedValue(undefined);\nvi.mock('../../apps/api/src/lib/ai-quota', () => ({\n  assertAiQuota: (...args: unknown[]) => mockAssertAiQuota(...args),\n  isAiQuotaCapError: () => false,\n}));\n\nvi.mock('../../apps/api/src/lib/inngest/ai-retry', () => ({\n  callWithRetry: (fn: () => unknown) => fn(),\n}));\n\nconst mockGenerateProductAltText = vi.fn();\nvi.mock('../../apps/api/src/lib/ai/product-alt-text-generator', () => ({\n  generateProductAltText: (...args: unknown[]) => mockGenerateProductAltText(...args),\n}));\n\nconst mockFindManyProduct = vi.fn();\nconst mockUpdateProductImage = vi.fn();\nconst mockFindUniqueJob = vi.fn();\nconst mockUpdateJob = vi.fn();\n\nvi.mock('@force/database', () => ({\n  prisma: {\n    product: { findMany: (...args: unknown[]) => mockFindManyProduct(...args) },\n    productImage: { update: (...args: unknown[]) => mockUpdateProductImage(...args) },\n    bulkAiJob: {\n      findUnique: (...args: unknown[]) => mockFindUniqueJob(...args),\n      update: (...args: unknown[]) => mockUpdateJob(...args),\n    },\n  },\n}));\n\nlet capturedHandler: (args: {\n  event: { data: unknown };\n  step: { run: (id: string, fn: () => unknown) => Promise<"+"unknown> };\n}) => Promise<"+"void>;\nvi.mock('../../apps/api/src/lib/inngest/client', () => ({\n  inngest: {\n    createFunction: (_cfg: unknown, handler: typeof capturedHandler) => {\n      capturedHandler = handler;\n      return { id: 'bulk-ai-image-alt' };\n    },\n  },\n}));\n\nbeforeEach(async () => {\n  vi.resetModules();\n  process.env.AI_BULK_THROTTLE_MS = '0';\n  mockAssertAiQuota.mockClear();\n  mockGenerateProductAltText.mockReset();\n  mockFindManyProduct.mockReset();\n  mockUpdateProductImage.mockReset();\n  mockFindUniqueJob.mockReset();\n  mockUpdateJob.mockReset();\n\n  mockFindUniqueJob.mockResolvedValue({ status: 'running' });\n  mockUpdateJob.mockResolvedValue({});\n\n  await import('../../apps/api/src/lib/inngest/functions/bulk-ai-image-alt.js');\n});\n\nasync function runSweep(data: { jobId: string; storeId: string; force?: boolean }) {\n  const step = { run: (_id: string, fn: () => unknown) => Promise.resolve(fn()) };\n  await capturedHandler({ event: { data }, step });\n}\n\ndescribe('bulk-ai-image-alt sweep', () => {\n  it('skips a product whose images all already have alt text', async () => {\n    mockFindManyProduct.mockResolvedValue([\n      {\n        id: 'p1',\n        name: 'Product 1',\n        nameAr: null,\n        images: [\n          { id: 'img-1', url: 'https://x/1.jpg', alt: 'Already has alt' },\n          { id: 'img-2', url: 'https://x/2.jpg', alt: 'Also has alt' },\n        ],\n      },\n    ]);\n\n    await runSweep({ jobId: 'job-1', storeId: 'store-1' });\n\n    expect(mockGenerateProductAltText).not.toHaveBeenCalled();\n    const finalCall = mockUpdateJob.mock.calls[mockUpdateJob.mock.calls.length - 1][0];\n    expect(finalCall.data.skipped).toBe(1);\n  });\n\n  it('writes alt text only for images missing it', async () => {\n    mockFindManyProduct.mockResolvedValue([\n      {\n        id: 'p1',\n        name: 'Product 1',\n        nameAr: null,\n        images: [\n          { id: 'img-1', url: 'https://x/1.jpg', alt: 'Already has alt' },\n          { id: 'img-2', url: 'https://x/2.jpg', alt: null },\n        ],\n      },\n    ]);\n    mockGenerateProductAltText.mockResolvedValue('A generated alt string');\n\n    await runSweep({ jobId: 'job-1', storeId: 'store-1' });\n\n    expect(mockGenerateProductAltText).toHaveBeenCalledTimes(1);\n    expect(mockGenerateProductAltText).toHaveBeenCalledWith(\n      expect.objectContaining({ imageUrl: 'https://x/2.jpg' }),\n      'fake-key',\n      expect.any(String)\n    );\n    expect(mockUpdateProductImage).toHaveBeenCalledWith({\n      where: { id: 'img-2' },\n      data: { alt: 'A generated alt string' },\n    });\n    const finalCall = mockUpdateJob.mock.calls[mockUpdateJob.mock.calls.length - 1][0];\n    expect(finalCall.data.filled).toBe(1);\n  });\n\n  it('counts a product as failed when every missing-alt image errors', async () => {\n    mockFindManyProduct.mockResolvedValue([\n      {\n        id: 'p1',\n        name: 'Product 1',\n        nameAr: null,\n        images: [{ id: 'img-1', url: 'https://x/1.jpg', alt: null }],\n      },\n    ]);\n    mockGenerateProductAltText.mockRejectedValue(new Error('vision call failed'));\n\n    await runSweep({ jobId: 'job-1', storeId: 'store-1' });\n\n    expect(mockUpdateProductImage).not.toHaveBeenCalled();\n    const finalCall = mockUpdateJob.mock.calls[mockUpdateJob.mock.calls.length - 1][0];\n    expect(finalCall.data.failed).toBe(1);\n    expect(finalCall.data.filled).toBe(0);\n  });\n});\n"},"tests/unit/product-meta-aeo-generator.test.ts":{"tests":[{"id":"161","name":"buildMetaAeoPrompt grounds the product prompt in the given name, description, and store name"},{"id":"162","name":"buildMetaAeoPrompt falls back to \"Not provided.\" when the product has no description"},{"id":"163","name":"generateProductMetaAeo returns trimmed bilingual AEO meta on success"},{"id":"164","name":"generateProductMetaAeo caps both fields at 160 characters"},{"id":"165","name":"generateProductMetaAeo degrades to an empty Arabic string when \"ar\" is missing"},{"id":"166","name":"generateProductMetaAeo throws when the response is missing the \"en\" field"},{"id":"167","name":"generateProductMetaAeo throws on unparseable Gemini output"}],"source":"/**\n * product-meta-aeo-generator — Unit Tests\n *\n * Covers the per-product AEO meta-description generator: the prompt\n * grounds on the product name/description/store name (no invented\n * specifics), the happy path returns a trimmed + 160-char-capped\n * bilingual result, a missing Arabic field degrades to an empty string\n * rather than throwing, and malformed/incomplete Gemini output throws.\n *\n * Mirrors tests/unit/bulk-ai-excerpt-generator.test.ts's mock shape.\n */\nimport { describe, it, expect, vi, beforeEach } from 'vitest';\n\nconst mockGenerateContent = vi.fn();\nvi.mock('@google/generative-ai', () => ({\n  GoogleGenerativeAI: class {\n    getGenerativeModel() {\n      return {\n        generateContent: (...args: unknown[]) => mockGenerateContent(...args),\n      };\n    }\n  },\n}));\n\nimport {\n  buildMetaAeoPrompt,\n  generateProductMetaAeo,\n} from '../../apps/api/src/lib/ai/product-meta-aeo-generator';\n\nfunction respond(text: string) {\n  return { response: { text: () => text, usageMetadata: undefined } };\n}\n\nbeforeEach(() => {\n  mockGenerateContent.mockReset();\n});\n\ndescribe('buildMetaAeoPrompt', () => {\n  it('grounds the product prompt in the given name, description, and store name', () => {\n    const prompt = buildMetaAeoPrompt(\n      'product',\n      'Basic Tee',\n      'A soft cotton t-shirt.',\n      'Test Store'\n    );\n\n    expect(prompt).toContain('Product: \"Basic Tee\"');\n    expect(prompt).toContain('From store: \"Test Store\"');\n    expect(prompt).toContain('Product description: A soft cotton t-shirt.');\n    expect(prompt).toContain('Both English and Arabic');\n  });\n\n  it('falls back to \"Not provided.\" when the product has no description', () => {\n    const prompt = buildMetaAeoPrompt('product', 'Basic Tee', '', 'Test Store');\n    expect(prompt).toContain('Product description: Not provided.');\n  });\n});\n\ndescribe('generateProductMetaAeo', () => {\n  it('returns trimmed bilingual AEO meta on success', async () => {\n    mockGenerateContent.mockResolvedValue(\n      respond(\n        JSON.stringify({\n          en: '  Basic Tee is a soft cotton t-shirt from Test Store, made for everyday wear.  ',\n          ar: '  تي شيرت أساسي هو قميص قطني ناعم من متجر تست، مصمم للارتداء اليومي.  ',\n        })\n      )\n    );\n\n    const result = await generateProductMetaAeo(\n      {\n        storeId: 'store-1',\n        storeName: 'Test Store',\n        product: { name: 'Basic Tee', description: 'A soft cotton t-shirt.' },\n      },\n      'fake-key',\n      'gemini-flash-lite-latest'\n    );\n\n    expect(result.en).toBe(\n      'Basic Tee is a soft cotton t-shirt from Test Store, made for everyday wear.'\n    );\n    expect(result.ar).toBe('تي شيرت أساسي هو قميص قطني ناعم من متجر تست، مصمم للارتداء اليومي.');\n  });\n\n  it('caps both fields at 160 characters', async () => {\n    const longEn = 'x'.repeat(200);\n    const longAr = 'ي'.repeat(200);\n    mockGenerateContent.mockResolvedValue(respond(JSON.stringify({ en: longEn, ar: longAr })));\n\n    const result = await generateProductMetaAeo(\n      {\n        storeId: 'store-1',\n        storeName: 'Test Store',\n        product: { name: 'Product', description: 'desc' },\n      },\n      'fake-key',\n      'gemini-flash-lite-latest'\n    );\n\n    expect(result.en.length).toBe(160);\n    expect(result.ar.length).toBe(160);\n  });\n\n  it('degrades to an empty Arabic string when \"ar\" is missing', async () => {\n    mockGenerateContent.mockResolvedValue(respond(JSON.stringify({ en: 'A valid English meta.' })));\n\n    const result = await generateProductMetaAeo(\n      {\n        storeId: 'store-1',\n        storeName: 'Test Store',\n        product: { name: 'Product', description: 'desc' },\n      },\n      'fake-key',\n      'gemini-flash-lite-latest'\n    );\n\n    expect(result.en).toBe('A valid English meta.');\n    expect(result.ar).toBe('');\n  });\n\n  it('throws when the response is missing the \"en\" field', async () => {\n    mockGenerateContent.mockResolvedValue(respond(JSON.stringify({ ar: 'فقط عربي' })));\n\n    await expect(\n      generateProductMetaAeo(\n        {\n          storeId: 'store-1',\n          storeName: 'Test Store',\n          product: { name: 'Product', description: 'desc' },\n        },\n        'fake-key',\n        'gemini-flash-lite-latest'\n      )\n    ).rejects.toThrow('AI returned unexpected format');\n  });\n\n  it('throws on unparseable Gemini output', async () => {\n    mockGenerateContent.mockResolvedValue(respond('not valid json'));\n\n    await expect(\n      generateProductMetaAeo(\n        {\n          storeId: 'store-1',\n          storeName: 'Test Store',\n          product: { name: 'Product', description: 'desc' },\n        },\n        'fake-key',\n        'gemini-flash-lite-latest'\n      )\n    ).rejects.toThrow();\n  });\n});\n"},"tests/unit/public-order-schema.test.ts":{"tests":[{"id":"168","name":"public checkout order schema (KW contract regression) shippingAddressSchema accepts an empty city (KW addresses have none)"},{"id":"169","name":"public checkout order schema (KW contract regression) shippingAddressSchema accepts a completely omitted email"},{"id":"170","name":"public checkout order schema (KW contract regression) shippingAddressSchema treats an empty-string email as 'not given' (not an invalid email)"},{"id":"171","name":"public checkout order schema (KW contract regression) shippingAddressSchema treats a whitespace-only email as not given"},{"id":"172","name":"public checkout order schema (KW contract regression) shippingAddressSchema still accepts and keeps a valid email when provided"},{"id":"173","name":"public checkout order schema (KW contract regression) shippingAddressSchema still rejects a malformed email (validation not disabled, just optional)"},{"id":"174","name":"public checkout order schema (KW contract regression) shippingAddressSchema still requires the genuinely-required fields (firstName/address1/country)"},{"id":"175","name":"public checkout order schema (KW contract regression) shippingAddressSchema passes through governorate+governorateAr+area+areaAr (not stripped)"},{"id":"176","name":"public checkout order schema (KW contract regression) createOrderSchema accepts a full KW order (blank city + no email) with a payment method"},{"id":"177","name":"public checkout order schema (KW contract regression) createOrderSchema accepts an optional ar/en locale and rejects an unknown locale"},{"id":"178","name":"public checkout order schema (KW contract regression) createOrderSchema requires a non-empty payment method"}],"source":"/**\n * Regression: public checkout order validation contract (the P0 that failed in\n * front of a client on 2026-06-09).\n *\n * Kuwait addresses have no \"city\" (the locality is the area/district, sent as\n * `state`), and the email field is optional. The storefront checkout form sends\n * `city: ''` and frequently `email: ''`. An earlier `shippingAddressSchema`\n * required `city` (`.min(1)`) and treated email as required-or-undefined, so a\n * normal KW order 400'd (\"خطأ في الدفع\" → bounced back to the info step) and\n * never reached the payment page. These tests lock the relaxed contract so the\n * regression can't silently come back via a schema edit.\n */\nimport { describe, it, expect } from 'vitest';\nimport { shippingAddressSchema, createOrderSchema } from '@api/routes/public.routes';\n\n// A realistic Kuwait checkout payload as the storefront actually sends it.\nconst kwAddress = {\n  firstName: 'Ahmad',\n  lastName: 'Sharaf',\n  address1: 'Block 4, Street 1, House 10',\n  city: '', // KW model: city is always blank\n  state: 'Hawally', // legacy: area/district used to live here\n  country: 'KW',\n  phone: '+96512345678',\n};\n\n// Extended payload with the new governorate + sub-area fields.\nconst kwAddressWithGovernorates = {\n  ...kwAddress,\n  governorate: 'Hawally',\n  governorateAr: 'حولي',\n  area: 'Salmiya',\n  areaAr: 'السالمية',\n};\n\ndescribe('public checkout order schema (KW contract regression)', () => {\n  describe('shippingAddressSchema', () => {\n    it('accepts an empty city (KW addresses have none)', () => {\n      const r = shippingAddressSchema.safeParse(kwAddress);\n      expect(r.success).toBe(true);\n      if (r.success) expect(r.data.city).toBe('');\n    });\n\n    it('accepts a completely omitted email', () => {\n      const r = shippingAddressSchema.safeParse(kwAddress);\n      expect(r.success).toBe(true);\n      if (r.success) expect(r.data.email).toBeUndefined();\n    });\n\n    it(\"treats an empty-string email as 'not given' (not an invalid email)\", () => {\n      const r = shippingAddressSchema.safeParse({ ...kwAddress, email: '' });\n      expect(r.success).toBe(true);\n      if (r.success) expect(r.data.email).toBeUndefined();\n    });\n\n    it('treats a whitespace-only email as not given', () => {\n      const r = shippingAddressSchema.safeParse({ ...kwAddress, email: '   ' });\n      expect(r.success).toBe(true);\n    });\n\n    it('still accepts and keeps a valid email when provided', () => {\n      const r = shippingAddressSchema.safeParse({ ...kwAddress, email: 'buyer@example.com' });\n      expect(r.success).toBe(true);\n      if (r.success) expect(r.data.email).toBe('buyer@example.com');\n    });\n\n    it('still rejects a malformed email (validation not disabled, just optional)', () => {\n      const r = shippingAddressSchema.safeParse({ ...kwAddress, email: 'not-an-email' });\n      expect(r.success).toBe(false);\n    });\n\n    it('still requires the genuinely-required fields (firstName/address1/country)', () => {\n      expect(shippingAddressSchema.safeParse({ ...kwAddress, firstName: '' }).success).toBe(false);\n      expect(shippingAddressSchema.safeParse({ ...kwAddress, address1: '' }).success).toBe(false);\n      const { country: _omit, ...noCountry } = kwAddress;\n      expect(shippingAddressSchema.safeParse(noCountry).success).toBe(false);\n    });\n\n    it('passes through governorate+governorateAr+area+areaAr (not stripped)', () => {\n      const r = shippingAddressSchema.safeParse(kwAddressWithGovernorates);\n      expect(r.success).toBe(true);\n      if (r.success) {\n        expect(r.data.governorate).toBe('Hawally');\n        expect(r.data.governorateAr).toBe('حولي');\n        expect(r.data.area).toBe('Salmiya');\n        expect(r.data.areaAr).toBe('السالمية');\n      }\n    });\n  });\n\n  describe('createOrderSchema', () => {\n    it('accepts a full KW order (blank city + no email) with a payment method', () => {\n      const r = createOrderSchema.safeParse({\n        shippingAddress: kwAddress,\n        paymentMethod: 'myfatoorah',\n      });\n      expect(r.success).toBe(true);\n    });\n\n    it('accepts an optional ar/en locale and rejects an unknown locale', () => {\n      expect(\n        createOrderSchema.safeParse({\n          shippingAddress: kwAddress,\n          paymentMethod: 'knet',\n          locale: 'ar',\n        }).success\n      ).toBe(true);\n      expect(\n        createOrderSchema.safeParse({\n          shippingAddress: kwAddress,\n          paymentMethod: 'knet',\n          locale: 'fr',\n        }).success\n      ).toBe(false);\n    });\n\n    it('requires a non-empty payment method', () => {\n      expect(\n        createOrderSchema.safeParse({ shippingAddress: kwAddress, paymentMethod: '' }).success\n      ).toBe(false);\n    });\n  });\n});\n"},"tests/unit/order-auto-cancel-reconcile.test.ts":{"tests":[{"id":"179","name":"decideAutoCancelAction the bug this fix exists for RESCUES an order the provider reports as paid instead of cancelling it"},{"id":"180","name":"decideAutoCancelAction fail-closed: unknown is not the same as unpaid SKIPS rather than cancels when the provider call threw"},{"id":"181","name":"decideAutoCancelAction fail-closed: unknown is not the same as unpaid skips even when a stale status is still in scope — unreachable wins"},{"id":"182","name":"decideAutoCancelAction fail-closed: unknown is not the same as unpaid does not mistake an unreachable provider for a completed payment"},{"id":"183","name":"decideAutoCancelAction cancelling is still correct for a definite not-paid answer cancels when the provider reports failed"},{"id":"184","name":"decideAutoCancelAction cancelling is still correct for a definite not-paid answer cancels when the provider reports expired"},{"id":"185","name":"decideAutoCancelAction cancelling is still correct for a definite not-paid answer cancels when the provider reports cancelled"},{"id":"186","name":"decideAutoCancelAction cancelling is still correct for a definite not-paid answer cancels when the provider reports pending"},{"id":"187","name":"decideAutoCancelAction cancelling is still correct for a definite not-paid answer cancels an unrecognised provider status rather than rescuing it"},{"id":"188","name":"decideAutoCancelAction orders with no gateway payment keep the original behaviour cancels a COD / never-issued-a-link order without asking any provider"},{"id":"189","name":"decideAutoCancelAction orders with no gateway payment keep the original behaviour cancels a payment-less order even if the provider is unreachable"}],"source":"import { describe, it, expect } from 'vitest';\nimport { decideAutoCancelAction } from '../../apps/api/src/lib/inngest/functions/order-auto-cancel-unpaid';\n\n// The auto-cancel sweep used to cancel any order still pending/unpaid past the\n// threshold WITHOUT ever asking the provider whether the money had actually\n// been captured. `paymentStatus='unpaid'` only means \"nothing ever told us it\n// was paid\" — and all three things that normally tell us can miss the same\n// order at once: the webhook is lost (or, for MyFatoorah, is account-level and\n// never fires per-invoice) AND the customer never returns to the success page\n// (closed the tab / dead battery / lost signal), so verify-on-return never\n// runs either.\n//\n// The result was a captured payment whose order got cancelled, its stock\n// released, and an \"order cancelled\" email sent to a customer who had paid.\n//\n// `decideAutoCancelAction` is the gating logic that now stands in front of the\n// cancel, extracted pure (matching the `bulk-import` /\n// `webhook-offload.guard.ts` pattern in this directory) so the money-critical\n// branch is testable without Inngest steps, RLS context, or a provider client.\ndescribe('decideAutoCancelAction', () => {\n  describe('the bug this fix exists for', () => {\n    it('RESCUES an order the provider reports as paid instead of cancelling it', () => {\n      expect(\n        decideAutoCancelAction({\n          hasGatewayPayment: true,\n          providerReachable: true,\n          providerStatus: 'completed',\n        })\n      ).toBe('reconcile_paid');\n    });\n  });\n\n  describe('fail-closed: unknown is not the same as unpaid', () => {\n    it('SKIPS rather than cancels when the provider call threw', () => {\n      expect(\n        decideAutoCancelAction({\n          hasGatewayPayment: true,\n          providerReachable: false,\n        })\n      ).toBe('skip');\n    });\n\n    it('skips even when a stale status is still in scope — unreachable wins', () => {\n      // Guards the ordering ins
